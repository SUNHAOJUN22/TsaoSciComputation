<title id="title">TsaoSciComputation — 代码与数学合同</title>
<desc id="desc">从计算合同、执行身份与收敛门到可重复多尺度交付 仓库是计算控制面与资格框架；第三方 DFT、MD、CFD、FEM 和流程求解器保持 EXTERNAL_HOLD。</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#070e1d"/><stop offset="1" stop-color="#172338"/></linearGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#cbd5e1" stroke-opacity=".055"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#67e8f9" stroke-width="1.4"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","Noto Sans",Arial,sans-serif}</style></defs>
<rect width="1600" height="900" fill="url(#background)"/><rect width="1600" height="900" fill="url(#grid)"/><circle cx="1444" cy="70" r="178" fill="#67e8f9" opacity=".07"/>
<path d="M1350 26L1480 75L1410 162L1539 203M1480 75L1570 20M1410 162L1310 175" fill="none" stroke="#67e8f9" stroke-opacity=".22" stroke-width="2"/>
<text x="48" y="82" font-size="49" font-weight="750" fill="#f8fafc" data-box="48,18.299999999999997,1400,78.5"><tspan x="48" dy="0">TsaoSciComputation</tspan></text>
<text x="49" y="130" font-size="22" font-weight="400" fill="#67e8f9" data-box="49,101.4,1465,71"><tspan x="49" dy="0">从计算合同、执行身份与收敛门到可重复多尺度交付</tspan></text>
<text x="49" y="214" font-size="15" font-weight="400" fill="#94a3b8" data-box="49,194.5,1470,30.5"><tspan x="49" dy="0">概念架构图 · 非测量数据 · 不代表外部求解已经执行</tspan></text>
<path d="M327 357h21" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><path d="M634 357h21" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><path d="M941 357h21" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><path d="M1248 357h21" fill="none" stroke="#67e8f9" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="46" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#67e8f9" stroke-opacity=".5"/><circle cx="77" cy="279" r="15" fill="#67e8f9" fill-opacity=".16"/><text x="77" y="284" text-anchor="middle" font-size="13" fill="#67e8f9">01</text><text x="66" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="66,296.1,237,67.5"><tspan x="66" dy="0">问题与合同</tspan></text><text x="66" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="66,376.9,237,58.5"><tspan x="66" dy="0">目标、方法、数据与容差</tspan></text></g><g><rect x="353" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#67e8f9" stroke-opacity=".5"/><circle cx="384" cy="279" r="15" fill="#67e8f9" fill-opacity=".16"/><text x="384" y="284" text-anchor="middle" font-size="13" fill="#67e8f9">02</text><text x="373" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="373,296.1,237,67.5"><tspan x="373" dy="0">执行身份</tspan></text><text x="373" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="373,376.9,237,58.5"><tspan x="373" dy="0">求解器、输入与环境哈希</tspan></text></g><g><rect x="660" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#67e8f9" stroke-opacity=".5"/><circle cx="691" cy="279" r="15" fill="#67e8f9" fill-opacity=".16"/><text x="691" y="284" text-anchor="middle" font-size="13" fill="#67e8f9">03</text><text x="680" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="680,296.1,237,67.5"><tspan x="680" dy="0">资源准入</tspan></text><text x="680" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="680,376.9,237,58.5"><tspan x="680" dy="0">CPU/GPU/许可证与工作目录</tspan></text></g><g><rect x="967" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#67e8f9" stroke-opacity=".5"/><circle cx="998" cy="279" r="15" fill="#67e8f9" fill-opacity=".16"/><text x="998" y="284" text-anchor="middle" font-size="13" fill="#67e8f9">04</text><text x="987" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="987,296.1,237,67.5"><tspan x="987" dy="0">数值验收</tspan></text><text x="987" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="987,376.9,237,58.5"><tspan x="987" dy="0">解析、收敛、守恒与等价</tspan></text></g><g><rect x="1274" y="246" width="278" height="220" rx="20" fill="#0f2038" stroke="#67e8f9" stroke-opacity=".5"/><circle cx="1305" cy="279" r="15" fill="#67e8f9" fill-opacity=".16"/><text x="1305" y="284" text-anchor="middle" font-size="13" fill="#67e8f9">05</text><text x="1294" y="326" font-size="23" font-weight="700" fill="#f8fafc" data-box="1294,296.1,237,67.5"><tspan x="1294" dy="0">证据交付</tspan></text><text x="1294" y="399" font-size="17" font-weight="400" fill="#dbeafe" data-box="1294,376.9,237,58.5"><tspan x="1294" dy="0">UQ、适用域与责任主体</tspan></text></g><g><rect x="46" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="68" y="544" font-size="17" font-weight="650" fill="#67e8f9" data-box="68,521.9,432,30.5"><tspan x="68" dy="0">01  独立标准不确定度</tspan></text><text x="68" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="68,563.3,432,35.5"><tspan x="68" dy="0">u_c² = u_stat² + u_model² + u_num²</tspan></text></g><g><rect x="552" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="574" y="544" font-size="17" font-weight="650" fill="#67e8f9" data-box="574,521.9,432,30.5"><tspan x="574" dy="0">02  末两点收敛检查</tspan></text><text x="574" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="574,563.3,432,35.5"><tspan x="574" dy="0">Δ = |x_n − x_(n−1)|</tspan></text><text x="574" y="617" font-size="19" font-weight="400" fill="#f8fafc" data-box="574,592.3,432,35.5"><tspan x="574" dy="0">τ = max(a, r · max(|x_n|,|x_(n−1)|,1))</tspan></text></g><g><rect x="1058" y="510" width="476" height="161" rx="20" fill="#101827" stroke="#64748b" stroke-opacity=".65"/><text x="1080" y="544" font-size="17" font-weight="650" fill="#67e8f9" data-box="1080,521.9,432,30.5"><tspan x="1080" dy="0">03  控制面验收合同</tspan></text><text x="1080" y="588" font-size="19" font-weight="400" fill="#f8fafc" data-box="1080,563.3,432,35.5"><tspan x="1080" dy="0">accept = identity ∧ inputs</tspan></text><text x="1080" y="617" font-size="19" font-weight="400" fill="#f8fafc" data-box="1080,592.3,432,35.5"><tspan x="1080" dy="0">∧ finite outputs ∧ declared policy</tspan></text></g>
<rect x="46" y="712" width="1488" height="111" rx="18" fill="#080f1b" stroke="#334155"/>
<text x="73" y="741" font-size="13" font-weight="650" fill="#67e8f9" data-box="73,724.1,1440,26.5"><tspan x="73" dy="0">资格与解释边界</tspan></text><text x="73" y="767" font-size="18" font-weight="400" fill="#dbeafe" data-box="73,743.6,1440,63"><tspan x="73" dy="0">仓库是计算控制面与资格框架；第三方 DFT、MD、CFD、FEM 和流程求解器保持 EXTERNAL_HOLD。</tspan></text>
<text x="49" y="871" font-size="14" font-weight="400" fill="#94a3b8" data-box="49,852.8,1470,27"><tspan x="49" dy="0">固定源码 · 有限数值 · 可复现证据 · 人工审阅</tspan></text>
