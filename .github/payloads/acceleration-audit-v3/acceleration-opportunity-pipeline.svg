<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" data-design-system="uiux-pro-max-scientific-console-v4" data-icon-system="uiux-pro-max-line-v1" data-density="balanced" data-family="acceleration-opportunity-audit" data-layout="workflow" shape-rendering="geometricPrecision" text-rendering="optimizeLegibility">
  <title id="title">Evidence-bound acceleration opportunity audit</title>
  <desc id="desc">A four-stage workflow that inventories source languages, extracts static AST evidence, ranks CPU and GPU migration candidates, and requires numerical, convergence, applicability, and performance verification before acceptance.</desc>
  <style>
    .canvas { fill: #07111F; }
    .surface { fill: #0F1B2D; stroke: #334865; stroke-width: 2; }
    .raised { fill: #162338; stroke: #334865; stroke-width: 2; }
    .title { fill: #F8FAFC; font-family: system-ui, sans-serif; font-weight: 700; font-size: 30px; }
    .section { fill: #F8FAFC; font-family: system-ui, sans-serif; font-weight: 700; font-size: 20px; }
    .body { fill: #D1D9E6; font-family: system-ui, sans-serif; font-weight: 500; font-size: 16px; }
    .muted { fill: #93A4BB; font-family: system-ui, sans-serif; font-weight: 500; font-size: 16px; }
    .label { fill: #07111F; font-family: system-ui, sans-serif; font-weight: 700; font-size: 16px; }
    .blue { stroke: #60A5FA; fill: none; stroke-width: 3; }
    .cyan { stroke: #22D3EE; fill: none; stroke-width: 3; }
    .teal { stroke: #2DD4BF; fill: none; stroke-width: 3; }
    .green { stroke: #4ADE80; fill: none; stroke-width: 3; }
    .amber { stroke: #FBBF24; fill: none; stroke-width: 3; }
    .risk { stroke: #F87171; fill: none; stroke-width: 3; }
  </style>
  <rect class="canvas" width="1200" height="680" rx="28"/>
  <rect class="surface" x="36" y="32" width="1128" height="100" rx="20"/>
  <text class="title" x="68" y="78">ACCELERATION OPPORTUNITY AUDIT</text>
  <text class="body" x="68" y="108">Source evidence → ranked candidates → measured qualification; no automatic speedup claims</text>
  <rect x="914" y="54" width="214" height="42" rx="21" fill="#22D3EE"/>
  <text class="label" x="946" y="81">EVIDENCE BOUND</text>

  <path class="blue" d="M286 318 H330"/>
  <path class="cyan" d="M566 318 H610"/>
  <path class="teal" d="M846 318 H890"/>
  <path d="M320 308 L334 318 L320 328" fill="#60A5FA"/>
  <path d="M600 308 L614 318 L600 328" fill="#22D3EE"/>
  <path d="M880 308 L894 318 L880 328" fill="#2DD4BF"/>

  <rect class="raised" x="48" y="170" width="238" height="296" rx="20"/>
  <circle cx="88" cy="210" r="20" fill="#60A5FA"/>
  <path d="M78 210 H98 M88 200 V220" stroke="#07111F" stroke-width="3"/>
  <text class="section" x="120" y="217">1 · INVENTORY</text>
  <text class="body" x="72" y="260">Count source files and lines</text>
  <text class="muted" x="72" y="290">Python · C · C++ · CUDA</text>
  <text class="muted" x="72" y="318">Fortran · Rust · Julia</text>
  <rect x="72" y="348" width="190" height="70" rx="14" fill="#0F1B2D" stroke="#334865" stroke-width="2"/>
  <text class="body" x="90" y="378">Exclude build caches</text>
  <text class="muted" x="90" y="404">No source execution</text>
  <text class="body" x="72" y="446">Output: language baseline</text>

  <rect class="raised" x="328" y="170" width="238" height="296" rx="20"/>
  <circle cx="368" cy="210" r="20" fill="#22D3EE"/>
  <path d="M358 203 H378 M358 211 H378 M358 219 H370" stroke="#07111F" stroke-width="3"/>
  <text class="section" x="400" y="217">2 · AST EVIDENCE</text>
  <text class="body" x="352" y="260">Detect explicit call patterns</text>
  <text class="muted" x="352" y="290">BLAS · sparse · FFT · tensor</text>
  <text class="muted" x="352" y="318">sampling · solver dispatch</text>
  <rect x="352" y="348" width="190" height="70" rx="14" fill="#0F1B2D" stroke="#334865" stroke-width="2"/>
  <text class="body" x="370" y="378">Find numeric loops</text>
  <text class="muted" x="370" y="404">Record file · line · symbol</text>
  <text class="body" x="352" y="446">Output: static candidates</text>

  <rect class="raised" x="608" y="170" width="238" height="296" rx="20"/>
  <circle cx="648" cy="210" r="20" fill="#2DD4BF"/>
  <path d="M638 218 L646 210 L653 214 L660 201" stroke="#07111F" stroke-width="3" fill="none"/>
  <text class="section" x="680" y="217">3 · RANK</text>
  <text class="body" x="632" y="260">Score evidence strength</text>
  <text class="muted" x="632" y="290">CPU / OpenMP / MPI first</text>
  <text class="muted" x="632" y="318">CUDA-X only when suitable</text>
  <rect x="632" y="348" width="190" height="70" rx="14" fill="#0F1B2D" stroke="#334865" stroke-width="2"/>
  <text class="body" x="650" y="378">Library candidates</text>
  <text class="muted" x="650" y="404">cuTENSOR · cuFFT · AmgX</text>
  <text class="body" x="632" y="446">Output: ordered actions</text>

  <rect class="raised" x="888" y="170" width="264" height="296" rx="20"/>
  <circle cx="928" cy="210" r="20" fill="#4ADE80"/>
  <path d="M918 210 L926 218 L940 201" stroke="#07111F" stroke-width="3" fill="none"/>
  <text class="section" x="960" y="217">4 · QUALIFY</text>
  <text class="body" x="912" y="260">Profile representative cases</text>
  <text class="muted" x="912" y="290">CPU reference and tolerances</text>
  <text class="muted" x="912" y="318">Memory · transfer · scaling</text>
  <rect x="912" y="348" width="216" height="70" rx="14" fill="#0F1B2D" stroke="#334865" stroke-width="2"/>
  <text class="body" x="930" y="378">Accept, HOLD, or reject</text>
  <text class="muted" x="930" y="404">No silent GPU promotion</text>
  <text class="body" x="912" y="446">Output: measured evidence</text>

  <rect class="surface" x="48" y="500" width="1104" height="134" rx="20"/>
  <text class="section" x="76" y="538">MANDATORY ACCEPTANCE GATES</text>
  <rect x="76" y="560" width="220" height="44" rx="12" fill="#60A5FA"/>
  <text class="label" x="126" y="588">NUMERICAL</text>
  <rect x="316" y="560" width="220" height="44" rx="12" fill="#22D3EE"/>
  <text class="label" x="354" y="588">CONVERGENCE</text>
  <rect x="556" y="560" width="220" height="44" rx="12" fill="#FBBF24"/>
  <text class="label" x="592" y="588">APPLICABILITY</text>
  <rect x="796" y="560" width="328" height="44" rx="12" fill="#F87171"/>
  <text class="label" x="846" y="588">PERFORMANCE · ENERGY · SAFETY</text>
</svg>
