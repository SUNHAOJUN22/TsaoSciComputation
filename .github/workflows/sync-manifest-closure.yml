name: Final closure manifest synchronization

on:
  push:
    branches: [closure/20260828-hashing-readme]

permissions:
  contents: write

concurrency:
  group: final-closure-manifest-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: closure/20260828-hashing-readme
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Rebuild exact-tree evidence and qualify
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[validation,quality,security]'
          rm .github/workflows/sync-manifest-closure.yml
          git add -A
          python scripts/build_acceleration_audits.py
          python scripts/build_acceleration_audits.py --check
          git add -A
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/verify_all.py --profile quality
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(evidence): synchronize formatted final manifest tree'
          git push origin HEAD:closure/20260828-hashing-readme
