name: One-time final branch qualification

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: tsao-computation-final-branch-qualification
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.number == 160 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/final-acceptance-20260807' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out acceptance branch with write access
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/final-acceptance-20260807
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Remove trigger and regenerate source-bound evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/final-qualification.trigger
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/build_manifest.py
          python scripts/final_acceptance_preflight.py --root . --json
      - name: Publish prepared exact source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m 'docs: prepare exact final computation qualification tree'
            git push origin HEAD:agent/final-acceptance-20260807
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  core-matrix:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out exact prepared source SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install and run complete core qualification
        run: |
          python -m pip install -e '.[validation,quality]'
          python scripts/verify_all.py --profile core

  quality-package:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact prepared source SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Run quality, security, drift and package qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[validation,quality,security]'
          python scripts/verify_all.py --profile quality
          git diff --exit-code
          python scripts/verify_all.py --profile package

  cleanup:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.core-matrix.result == 'success' &&
      needs.quality-package.result == 'success'
    needs: [prepare, core-matrix, quality-package]
    runs-on: ubuntu-24.04
    steps:
      - name: Remove trusted controller from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: true
      - name: Delete controller and post success
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-final-branch-qualification.yml
          git commit -m 'chore: remove one-time computation qualification controller'
          git push origin HEAD:main
          body="TSAO_COMPUTATION_FINAL_QUALIFICATION: PASS — exact source ${SOURCE_SHA}; Windows/Linux × Python 3.10/3.13 core matrix plus quality/security/drift/package gates completed."
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/160/comments" \
            -d @/tmp/comment.json
