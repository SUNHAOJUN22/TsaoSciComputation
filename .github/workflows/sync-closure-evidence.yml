name: Synchronize closure evidence

on:
  push:
    branches: [closure/20260828-hashing-readme]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-closure-evidence
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: closure/20260828-hashing-readme
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Regenerate exact-tree evidence and remove closure scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[validation,quality,security]'
          rm -rf .github/closure
          rm -f .github/workflows/closure-export.yml
          rm -f .github/workflows/finalize-tracked-manifest.yml
          rm -f .github/workflows/sync-closure-evidence.yml
          python scripts/build_acceleration_audits.py
          python scripts/build_acceleration_audits.py --check
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/verify_all.py --profile core
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(evidence): synchronize final hashing evidence tree'
          git push origin HEAD:closure/20260828-hashing-readme
