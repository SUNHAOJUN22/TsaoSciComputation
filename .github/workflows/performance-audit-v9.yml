name: Performance engineering V9 current-main refresh

on:
  push:
    branches: [main]
    paths: [.v9-performance-trigger]

permissions:
  contents: write

concurrency:
  group: performance-audit-v9-main
  cancel-in-progress: true

jobs:
  baseline:
    if: contains(github.event.head_commit.message, '[run-v9-baseline-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BASELINE_SHA: 04ce646e51a603faf8cfad72ec15e218e09a0ebd
      STATUS_FILE: .v9-performance-status.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Profile frozen current-main baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          stage=initialization
          record_status() {
            local outcome="$1"
            local current_stage="$2"
            python - "$outcome" "$current_stage" <<'PY'
          import json,sys
          from pathlib import Path
          Path('.v9-performance-status.json').write_text(
              json.dumps({'schema_version':'1.0','outcome':sys.argv[1],'stage':sys.argv[2]},indent=2,sort_keys=True)+'\n',
              encoding='utf-8',newline='\n'
          )
          PY
            git add "$STATUS_FILE"
            git commit -m "Record V9 baseline profile: $outcome at $current_stage" || true
            git push origin HEAD:refs/heads/main || true
          }
          trap 'record_status failure "$stage"' ERR
          record_status started initialization

          stage=install
          python -m pip install -e '.[validation,quality,security]'

          stage=normalize-profiler
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/profile_performance_v9_refresh.py')
          text=path.read_text(encoding='utf-8')
          old='''            subprocess.run(  # nosec B603
                [sys.executable, "-m", "cProfile", "-o", str(profile_path), "-c", code],
                cwd=root,
                env=env,
                check=True,
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
            )'''
          new='''            workload_path = temporary_root / f"{name}.py"
            workload_path.write_text(code + "\\n", encoding="utf-8", newline="\\n")
            subprocess.run(  # nosec B603
                [sys.executable, "-m", "cProfile", "-o", str(profile_path), str(workload_path)],
                cwd=root,
                env=env,
                check=True,
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
            )'''
          if old in text:
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8',newline='\n')
          PY
          rm -f .v9-performance-trigger .v9-performance-refresh-trigger
          python -m ruff check --fix scripts/profile_performance_v9_refresh.py
          python -m ruff format scripts/profile_performance_v9_refresh.py
          git add scripts/profile_performance_v9_refresh.py .v9-performance-trigger .v9-performance-refresh-trigger
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize current-main V9 performance profiler'
            git push origin HEAD:refs/heads/main
          fi

          stage=create-baseline-worktree
          rm -rf /tmp/tsao-v9-current-baseline
          git worktree add --detach /tmp/tsao-v9-current-baseline "$BASELINE_SHA"

          stage=profile-baseline
          python scripts/profile_performance_v9_refresh.py \
            --root /tmp/tsao-v9-current-baseline \
            --baseline-sha "$BASELINE_SHA" \
            --include-end-to-end \
            --repeats 3 \
            --output /tmp/PERFORMANCE_BASELINE_V9.json

          stage=publish-baseline
          cp /tmp/PERFORMANCE_BASELINE_V9.json reports/PERFORMANCE_BASELINE_V9.json
          cp /tmp/PERFORMANCE_BASELINE_V9.json reports/PERFORMANCE_PROFILE_V9.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('reports/PERFORMANCE_BASELINE_V9.json').read_text(encoding='utf-8'))
          summary={
              'schema_version':'2.0','status':'PROFILED','baseline_sha':data['baseline_sha'],
              'claim_boundary':data['claim_boundary'],'tree':data['repository']['tree'],
              'end_to_end':{name:payload['summary'] for name,payload in data['end_to_end'].items()},
              'hot_profile_totals':{name:payload['total_seconds'] for name,payload in data['profiles'].items()},
          }
          Path('reports/PERFORMANCE_PROFILE_SUMMARY_V9.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n'
          )
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git add reports/PERFORMANCE_BASELINE_V9.json reports/PERFORMANCE_PROFILE_V9.json \
            reports/PERFORMANCE_PROFILE_SUMMARY_V9.json manifest.json
          git commit -m 'Profile current V12 baseline before V9 optimization'
          git push origin HEAD:refs/heads/main
          record_status success baseline-profiled

      - name: Remove baseline worktree
        if: always()
        run: git worktree remove --force /tmp/tsao-v9-current-baseline 2>/dev/null || true
