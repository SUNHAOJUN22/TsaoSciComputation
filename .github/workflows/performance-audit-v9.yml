name: Performance engineering V9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.v9-performance-trigger'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: performance-audit-v9-main
  cancel-in-progress: false

jobs:
  performance:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-v9-performance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '29'
      BASELINE_SHA: c2c0eca0fd6bf81cc3cbb1ff29489eefbcba58fd
      TSAO_COVERAGE_JSON: /tmp/tsao-v9-coverage.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete verification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Normalize and commit the V9 candidate tree
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .v9-performance-trigger
          python -m ruff check --fix \
            scripts/verify_all.py \
            scripts/measure_command_v9.py \
            scripts/compare_performance_v9.py \
            tsao_computation/routing/router.py \
            tsao_computation/provenance/manifest.py \
            tests/test_performance_v9.py
          python -m ruff format \
            scripts/verify_all.py \
            scripts/measure_command_v9.py \
            scripts/compare_performance_v9.py \
            tsao_computation/routing/router.py \
            tsao_computation/provenance/manifest.py \
            tests/test_performance_v9.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize V9 performance candidate and Manifest'
            git push origin HEAD:refs/heads/main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build same-host V8 and V9 worktrees
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/tsao-v8-baseline /tmp/tsao-v9-candidate
          git worktree add --detach /tmp/tsao-v8-baseline "$BASELINE_SHA"
          git worktree add --detach /tmp/tsao-v9-candidate '${{ steps.candidate.outputs.sha }}'

      - name: Measure microbenchmarks on the same runner
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd /tmp/tsao-v8-baseline
            python scripts/benchmark.py --output /tmp/v8-micro.json
          )
          (
            cd /tmp/tsao-v9-candidate
            python scripts/benchmark.py --output /tmp/v9-micro.json
          )

      - name: Measure end-to-end verification on the same runner
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/measure_command_v9.py \
            --cwd /tmp/tsao-v8-baseline \
            --warmups 1 \
            --repeats 3 \
            --output /tmp/v8-end-to-end.json \
            -- python scripts/verify_all.py --profile all
          python scripts/measure_command_v9.py \
            --cwd /tmp/tsao-v9-candidate \
            --warmups 1 \
            --repeats 3 \
            --output /tmp/v9-end-to-end.json \
            -- python scripts/verify_all.py --profile all

      - name: Enforce the V9 same-host performance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/v9-preflight
          mkdir -p /tmp/v9-preflight
          cp README.md README.zh-CN.md /tmp/v9-preflight/
          python scripts/compare_performance_v9.py \
            --baseline-micro /tmp/v8-micro.json \
            --candidate-micro /tmp/v9-micro.json \
            --baseline-end-to-end /tmp/v8-end-to-end.json \
            --candidate-end-to-end /tmp/v9-end-to-end.json \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha '${{ steps.candidate.outputs.sha }}' \
            --audit-run "$GITHUB_RUN_ID" \
            --root /tmp/v9-preflight

      - name: Remove measurement worktrees
        if: ${{ always() }}
        shell: bash
        run: |
          git worktree remove --force /tmp/tsao-v8-baseline 2>/dev/null || true
          git worktree remove --force /tmp/tsao-v9-candidate 2>/dev/null || true

      - name: Run deterministic release gates pass 1
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/verify_all.py --profile all \
            --timing-json /tmp/v9-pass1-profile.json | tee /tmp/v9-all-pass1.log
          python scripts/verify_all.py --profile benchmark | tee /tmp/v9-benchmark.log
          python -m pytest -q | tee /tmp/v9-pytest.log

      - name: Collect security dependency and branch evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/v9-dependency.json
          python scripts/security_scan.py > /tmp/v9-security.json
          git ls-remote --heads origin > /tmp/v9-remote-heads.txt

      - name: Refresh V9 current-main verification evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/update_main_audit_evidence.py \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$ISSUE_NUMBER" \
            --test-log /tmp/v9-pytest.log \
            --coverage-json "$TSAO_COVERAGE_JSON" \
            --dependency-json /tmp/v9-dependency.json \
            --security-json /tmp/v9-security.json \
            --remote-heads /tmp/v9-remote-heads.txt \
            --parent-commit '${{ steps.candidate.outputs.sha }}' \
            --audit-generation ultimate-main-audit-v9 \
            --audit-label V9 \
            --visual-count 42 \
            --visual-atlas-version 7 \
            --report-path reports/ULTIMATE_MAIN_AUDIT_V9.md \
            --visual-families 'End-to-end verification performance engineering; no visual-atlas expansion.'

      - name: Write V9 performance reports and bilingual README
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/compare_performance_v9.py \
            --baseline-micro /tmp/v8-micro.json \
            --candidate-micro /tmp/v9-micro.json \
            --baseline-end-to-end /tmp/v8-end-to-end.json \
            --candidate-end-to-end /tmp/v9-end-to-end.json \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha '${{ steps.candidate.outputs.sha }}' \
            --audit-run "$GITHUB_RUN_ID" \
            --root . \
            --issue "$ISSUE_NUMBER" \
            --update-readme
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          bullet = '- Added V9 end-to-end verification performance engineering with bounded deterministic subprocess parallelism, concurrent isolated reproducibility builds, bounded route-result caching, large-file streaming hashes and same-host wall-time/memory acceptance.'
          if bullet not in text:
              text = text.replace('## Unreleased\n', f'## Unreleased\n\n{bullet}\n', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git diff --check

      - name: Run deterministic release gates pass 2 on the documented tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all \
            --timing-json /tmp/PERFORMANCE_PROFILE_V9.json | tee /tmp/v9-all-pass2.log
          cp /tmp/PERFORMANCE_PROFILE_V9.json reports/PERFORMANCE_PROFILE_V9.json
          python scripts/compare_performance_v9.py \
            --verify-report reports/PERFORMANCE_COMPARISON_V9.json
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check

      - name: Commit every verified V9 artifact
        id: final_commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize end-to-end performance engineering V9'
            git push origin HEAD:refs/heads/main
          fi
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for canonical cross-platform CI
        id: canonical_ci
        shell: bash
        run: |
          set -Eeuo pipefail
          final_sha='${{ steps.final_commit.outputs.final_sha }}'
          gh workflow run ci.yml --ref main
          run_id=''
          for _ in $(seq 1 40); do
            run_id="$(
              gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 50 \
                --json databaseId,headSha \
              | python -c 'import json,sys; rows=json.load(sys.stdin); sha=sys.argv[1]; print(next((str(row["databaseId"]) for row in rows if row["headSha"]==sha), ""))' \
                  "$final_sha"
            )"
            test -n "$run_id" && break
            sleep 4
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical CI dispatched for V9 final commit \`$final_sha\`. Run ID: \`$run_id\`."
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Report V9 success and close issue
        shell: bash
        run: |
          final_sha='${{ steps.final_commit.outputs.final_sha }}'
          run_id='${{ steps.canonical_ci.outputs.run_id }}'
          summary="$(python -c 'import json; data=json.load(open("reports/PERFORMANCE_COMPARISON_V9.json", encoding="utf-8")); s=data["speedups"]; print(f"verify_all={s[\"verify_all_wall\"]:.2f}x, route={s[\"route_decision\"]:.2f}x, parser={s[\"parser_throughput\"]:.2f}x, memory={data[\"memory_ratio\"]:.2f}x")')"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Performance engineering V9 passed. Final commit: \`$final_sha\`. Canonical CI Run ID: \`$run_id\`. Same-host evidence: $summary. Full deterministic release gates and Ubuntu/Windows/macOS x Python 3.10/3.13 CI succeeded. No branch or PR was created."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report V9 failure with evidence
        if: ${{ failure() }}
        shell: bash
        run: |
          details="$(
            python - <<'PY'
          import json
          from pathlib import Path

          payload = {}
          for name, path in (
              ('baseline_micro', Path('/tmp/v8-micro.json')),
              ('candidate_micro', Path('/tmp/v9-micro.json')),
              ('baseline_end_to_end', Path('/tmp/v8-end-to-end.json')),
              ('candidate_end_to_end', Path('/tmp/v9-end-to-end.json')),
              ('comparison', Path('reports/PERFORMANCE_COMPARISON_V9.json')),
          ):
              if path.is_file():
                  try:
                      payload[name] = json.loads(path.read_text(encoding='utf-8'))
                  except (OSError, json.JSONDecodeError) as error:
                      payload[name] = {'error': str(error)}
          print(json.dumps(payload, indent=2, sort_keys=True)[:12000])
          PY
          )"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Performance engineering V9 failed in workflow run \`$GITHUB_RUN_ID\`. No completion claim is made.

          \`\`\`json
          $details
          \`\`\`"
