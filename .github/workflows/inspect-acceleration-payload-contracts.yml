name: Inspect acceleration payload contracts

on:
  push:
    branches: [main]
    paths: [.inspect-acceleration-payload-contracts-trigger]

permissions:
  contents: write

concurrency:
  group: inspect-acceleration-payload-contracts-main
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Extract selected complete text members
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/inspect-acceleration-payload-contracts.yml \
            .inspect-acceleration-payload-contracts-trigger
          python - <<'PY'
          from __future__ import annotations

          import base64
          import io
          import json
          import tarfile
          import zlib
          from datetime import datetime, timezone
          from pathlib import Path

          wanted = {
              'registry/accelerators.json',
              'schemas/accelerator-profile.schema.json',
              'scripts/benchmark.py',
              'scripts/build_adapter_docs.py',
              'scripts/build_workflow_docs.py',
              'scripts/validate_accelerator_metadata.py',
              'scripts/validate_adapter_metadata.py',
              'scripts/validate_schemas.py',
          }
          encoded = ''.join(
              path.read_text(encoding='ascii').strip()
              for path in sorted(Path('tools').glob('acceleration-foundation-v1.part-*.b85'))
          )
          payload = base64.b85decode(encoded.encode('ascii'))
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          raw = decoder.decompress(payload)
          try:
              raw += decoder.flush()
          except zlib.error:
              pass
          contents: dict[str, str] = {}
          archive = tarfile.open(fileobj=io.BytesIO(raw), mode='r|')
          try:
              for member in archive:
                  if member.name not in wanted or not member.isfile():
                      continue
                  handle = archive.extractfile(member)
                  if handle is None:
                      continue
                  data = handle.read()
                  if len(data) == member.size:
                      contents[member.name] = data.decode('utf-8')
          except (EOFError, OSError, tarfile.TarError):
              pass
          finally:
              archive.close()
          missing = sorted(wanted - contents.keys())
          if missing:
              raise SystemExit(f'missing complete contract members: {missing}')
          report = {
              'schema_version': '1.0',
              'status': 'RECOVERED',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'contents': contents,
          }
          path = Path('reports/ACCELERATION_PAYLOAD_CONTRACTS.json')
          path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python scripts/build_manifest.py
          git add -A
          git commit -m 'Record recovered acceleration payload contracts'
          git push origin HEAD:refs/heads/main
