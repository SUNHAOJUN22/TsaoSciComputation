name: V11 legacy visual block cleanup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-legacy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: true
      - name: Remove legacy V10 README block and retry V11
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/regenerate_readme_visuals_v11.py')
          text = path.read_text(encoding='utf-8')
          old_marker = '''VISUAL_MARKER = re.compile(
              r"<!-- V1[01]_VISUAL_SYSTEM:START -->.*?<!-- V1[01]_VISUAL_SYSTEM:END -->",
              re.DOTALL,
          )
          '''
          new_marker = old_marker + '''LEGACY_V10_MARKER = re.compile(
              r"<!-- VISUAL_SYSTEM_V10:START -->.*?<!-- VISUAL_SYSTEM_V10:END -->",
              re.DOTALL,
          )
          '''
          old_update = '''def update_marker(text: str, block: str) -> str:
              if VISUAL_MARKER.search(text):
                  return VISUAL_MARKER.sub(block, text, count=1)
              anchor = "</div>\n"
              if anchor not in text:
                  raise ValueError("README center block closing tag not found")
              return text.replace(anchor, anchor + "\n" + block + "\n", 1)
          '''
          new_update = '''def update_marker(text: str, block: str) -> str:
              text = LEGACY_V10_MARKER.sub("", text)
              text = re.sub(r"\n{3,}", "\n\n", text)
              if VISUAL_MARKER.search(text):
                  return VISUAL_MARKER.sub(block, text, count=1)
              anchor = "</div>\n"
              if anchor not in text:
                  raise ValueError("README center block closing tag not found")
              return text.replace(anchor, anchor + "\n" + block + "\n", 1)
          '''
          if text.count(old_marker) != 1:
              raise SystemExit(f'expected one marker block, found {text.count(old_marker)}')
          if text.count(old_update) != 1:
              raise SystemExit(f'expected one update function, found {text.count(old_update)}')
          path.write_text(
              text.replace(old_marker, new_marker, 1).replace(old_update, new_update, 1),
              encoding='utf-8',
              newline='\n',
          )

          test_path = Path('tests/test_readme_visuals.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_assert = '    assert all("V11" in readme for readme in readmes)\n'
          new_assert = old_assert + '    assert all("VISUAL_SYSTEM_V10" not in readme for readme in readmes)\n'
          if test_text.count(old_assert) != 1:
              raise SystemExit('V11 README assertion not found')
          test_path.write_text(
              test_text.replace(old_assert, new_assert, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY
          python -m pip install ruff
          python -m ruff check --fix scripts/regenerate_readme_visuals_v11.py tests/test_readme_visuals.py
          python -m ruff format scripts/regenerate_readme_visuals_v11.py tests/test_readme_visuals.py
          python scripts/regenerate_readme_visuals_v11.py
          python scripts/regenerate_readme_visuals_v11.py --check
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          rm -f .github/workflows/v11-legacy-cleanup.yml
          printf 'issue=31\nlayouts=hero,bento,workflow,loop,risk\nretry=5\n' > .v11-readme-visual-trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[run-v11-visuals] Remove legacy V10 README visual block'
          git push origin HEAD:refs/heads/main
# indexed retry
