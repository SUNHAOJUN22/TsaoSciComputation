name: Qualify solver-bound plan V6 repair once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_SOLVER_BOUND_PLAN_V6_REPAIR_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and apply verified V6 archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path('.github/payloads/solver-bound-plan-v6-repair')
          repair_specs = (
              ('g2-00.b64', 4096, 'fddeadc44a1fe4e8c60c514955d529ae59d929e3b32b40c3f46d8fc3b9109235'),
              ('g2-01.b64', 4096, 'ae8867604d3e5ed705452c0f8d3f8057c83bd26a8602a126f57e1ca9c54112a8'),
              ('g3-00.b64', 4096, 'c58f98bdec3e5139b68ba95fb044e330d9846bcb66202bd3ee81c5b03d969ca3'),
              ('g3-01.b64', 4096, 'd2830ed46f40011bef22cba1121c4b3dde877f59cd114b08bfa859a1ba66ccc2'),
              ('g4-00.b64', 4096, 'd34944c53ed86f36cc5461789b31f93757d31557d522b6b23c4e52762434463b'),
              ('g4-01.b64', 949, '6329a8eb71f151ead55e2c974122ab1c829821b9dc2b00f61b1bf2295c4e6f66'),
          )
          if sorted(path.name for path in root.glob('*.b64')) != sorted(item[0] for item in repair_specs):
              raise SystemExit('repair payload file set mismatch')
          repaired: dict[str, bytes] = {}
          for name, size, expected in repair_specs:
              encoded = (root / name).read_bytes().replace(b'\n', b'').replace(b'\r', b'')
              data = base64.b64decode(encoded, validate=True)
              if len(data) != size or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit(f'repair chunk identity mismatch: {name}')
              repaired[name] = data

          def historical(commit: str, name: str) -> bytes:
              path = f'.github/payloads/solver-bound-plan-v6-staging/{name}'
              encoded = subprocess.check_output(('git', 'show', f'{commit}:{path}')).replace(b'\n', b'').replace(b'\r', b'')
              return base64.b64decode(encoded, validate=True)

          part00 = historical('ca588cfddff721bba46ca245bfbb649df7dea369', 'part-00.b64')
          part01 = historical('5c9ed6d0d4ae28f864d6a8f1b09996fef4e1fa1c', 'part-01.b64')
          groups = (
              (part00, 4096, '83e4be6bf31c2331fbeb5f5d1122eaa1ec3228cc4715d2d4585624506b9717ab'),
              (part01, 4096, '6366fddac254f50d631cc2e384f97041854d3af9f9817255f691054e9d8e4154'),
              (repaired['g2-00.b64'] + repaired['g2-01.b64'], 8192, 'ca03a84a9a01bf89a3b5096aac9fcc509fe60512ac6ff2b75e24e80239c53d1b'),
              (repaired['g3-00.b64'] + repaired['g3-01.b64'], 8192, '0d1a370fa61933b4d169497bb52970df10a0312c3ee0648a7f31069b4ee717f1'),
              (repaired['g4-00.b64'] + repaired['g4-01.b64'], 5045, 'b856ac346bf09a3dd425363071387c7173bab380c8709556cf4ae50e2d346954'),
          )
          chunks: list[bytes] = []
          for index, (data, size, expected) in enumerate(groups):
              if len(data) != size or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit(f'reconstructed group {index} identity mismatch')
              chunks.append(data)
          archive = b''.join(chunks)
          if len(archive) != 29621 or hashlib.sha256(archive).hexdigest() != '2a77313de59d58c5b57cfbb7a24958c02f94de4ddd9902f56475d7308f41fcd5':
              raise SystemExit('complete archive identity mismatch')

          file_hashes = {
              'CHANGELOG.md': '61f655a268a8a42dbfbc067da19243478a1380c8ed98cd8157f892ba4f13170b',
              'README.md': 'fcadee5d11dcdaa772a7362bbe554e3b5257281f8fcc99cef5d735b2b255ace7',
              'README.zh-CN.md': 'f389db6eebe780df9fbe401d84cb87fd690ca4c0034ea814f9fe28d0bcd3b6df',
              'docs/accelerated-native-backend.md': '64814d886d45b4287d3b50f57116753998bee6ca8d63ec75178fe4c10f28ee37',
              'schemas/acceleration-plan.schema.json': '48f5f409fa7eb30154aea95c8471a95421fc3cca6c549ea7ac39611c1c640f61',
              'tests/test_solver_bound_plan_v6.py': 'a318fd725e2e353df3fad280ab3274dedc820370075b4c4c62f5e55f056ebc6c',
              'tsao_computation/accelerators/planner.py': '4f526998b590b37906063df511dca857bd883ddb7fa8375a580847c8cdf3f8fc',
              'tsao_computation/accelerators/solver.py': 'f86141b26dad8e81783925dfc3f91893a714b82ed4fd48aa2e023b23b0aef9fd',
              'tsao_computation/cli.py': '6d315252ad75d6efabbfdac23ffccf5d68b97ddc990bf85573abf8c35c71a610',
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != set(file_hashes):
                  raise SystemExit(f'archive member set mismatch: {names}')
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  stream = handle.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'unreadable archive member: {member.name}')
                  data = stream.read()
                  if hashlib.sha256(data).hexdigest() != file_hashes[member.name]:
                      raise SystemExit(f'file digest mismatch: {member.name}')
                  target = Path(*pure.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          PY
          rm -rf .github/payloads/solver-bound-plan-v6-repair
          rm .github/workflows/qualify-solver-bound-plan-v6-repair-once.yml

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonicalize and qualify
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python -m pytest -q tests/test_solver_bound_plan_v6.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
          git diff --check
          test ! -e .github/payloads/solver-bound-plan-v6-repair
          test ! -e .github/workflows/qualify-solver-bound-plan-v6-repair-once.yml
          git diff -- .github/workflows/ci.yml --exit-code

      - name: Publish directly to main
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add solver-bound acceleration plans V6'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close issue
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Solver-Bound Acceleration Plans V6 were published directly to main as ${{ steps.publish.outputs.sha }} after six repair-chunk hashes, five reconstructed-group hashes, archive identity, fixed-path file hashes, lint, typing, quality, security, tests, coverage, package, native, schema and evidence gates passed. Bound solver evidence remains scientifically unqualified until live numerical and performance qualification. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Clean temporary repair after failure
        if: failure()
        shell: bash
        run: |
          set +e
          git fetch origin main
          git checkout -B cleanup origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .github/payloads/solver-bound-plan-v6-repair
          git rm -f --ignore-unmatch .github/workflows/qualify-solver-bound-plan-v6-repair-once.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove failed solver-bound plan V6 repair transport [skip ci]'
            git push origin HEAD:refs/heads/main
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Solver-Bound Acceleration Plans V6 repair qualification failed; product files were not published. Temporary repair transport was removed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
