name: Validate solver capability V5 candidate once

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    if: >-
      github.event.issue.title == 'VALIDATE_SOLVER_CAPABILITY_V5_CANDIDATE_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Read candidate SHA
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          body=$(gh issue view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          candidate=$(printf '%s\n' "$body" | sed -n 's/^CANDIDATE_SHA=\([0-9a-f]\{40\}\)$/\1/p')
          expected_parent=$(printf '%s\n' "$body" | sed -n 's/^EXPECTED_PARENT=\([0-9a-f]\{40\}\)$/\1/p')
          test -n "$candidate"
          test -n "$expected_parent"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "parent=$expected_parent" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate ancestry and clean transport
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "${{ steps.candidate.outputs.parent }}"
          test ! -e .github/payloads/solver-capability-v5
          test ! -e .github/workflows/validate-solver-capability-v5-candidate-once.yml
          git diff "${{ steps.candidate.outputs.parent }}" HEAD -- .github/workflows/ci.yml --exit-code
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - name: Run complete qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python -m pytest -q tests/test_solver_capability_v5.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
          git diff --check
      - name: Report validation result
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Candidate ${{ steps.candidate.outputs.sha }} passed complete solver capability V5 validation. It remains unreferenced and main has not moved. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
