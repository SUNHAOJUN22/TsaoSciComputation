name: Apply acceleration recommendation cache V10 once

on:
  push:
    branches: [main]
    paths: [.apply-acceleration-cache-v10]

permissions:
  contents: write

concurrency:
  group: apply-acceleration-cache-v10-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Apply and validate cache
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-acceleration-cache-v10-once.yml
          rm -f .apply-acceleration-cache-v10
          rm -f reports/MATH_PERFORMANCE_AUDIT_V10_FAILURE.json
          python - <<'PY'
          from pathlib import Path

          path = Path('tsao_computation/accelerators/catalog.py')
          text = path.read_text(encoding='utf-8')
          if 'from functools import lru_cache\n' not in text:
              text = text.replace(
                  'from dataclasses import asdict, dataclass\n',
                  'from dataclasses import asdict, dataclass\nfrom functools import lru_cache\n',
                  1,
              )
          start = text.index('def recommend_acceleration_libraries(')
          end = text.index('\n\n\nlibrary_catalog =', start)
          replacement = '''@lru_cache(maxsize=256)
          def _recommend_acceleration_libraries_cached(
              backend: AcceleratorBackend | None,
              workload: str | None,
          ) -> tuple[AccelerationLibrary, ...]:
              matches = tuple(
                  item
                  for item in _LIBRARIES
                  if (backend is None or backend in item.backends)
                  and (
                      workload is None
                      or any(workload in candidate.casefold() for candidate in item.workloads)
                  )
              )
              if backend is None:
                  return matches
              return tuple(sorted(matches, key=lambda item: len(item.backends)))


          def recommend_acceleration_libraries(
              *,
              backend: AcceleratorBackend | str | None = None,
              workload: str | None = None,
          ) -> tuple[AccelerationLibrary, ...]:
              normalized_backend = (
                  None
                  if backend is None
                  else backend
                  if isinstance(backend, AcceleratorBackend)
                  else AcceleratorBackend(backend)
              )
              normalized_workload = workload.casefold() if workload else None
              return _recommend_acceleration_libraries_cached(
                  normalized_backend,
                  normalized_workload,
              )
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8', newline='\n')
          PY
          python -m pip install -e '.[validation,quality]'
          python -m ruff check --fix tsao_computation/accelerators/catalog.py tests/test_math_performance_v10.py
          python -m ruff format tsao_computation/accelerators/catalog.py tests/test_math_performance_v10.py
          python -m pytest -q tests/test_math_performance_v10.py tests/test_acceleration_foundation.py tests/test_acceleration_v11.py tests/test_acceleration_coverage.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git add -A
          git commit -m 'Cache acceleration library recommendations'
          git push origin HEAD:refs/heads/main
