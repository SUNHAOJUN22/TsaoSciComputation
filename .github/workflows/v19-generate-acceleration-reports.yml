name: V19 generate acceleration audit reports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v19-generate-acceleration-reports.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Generate exact-tree reports
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_acceleration_audits.py
          python scripts/build_acceleration_audits.py --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scicomputation-v19-acceleration-reports-${{ github.run_id }}
          path: |
            reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json
            reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json
            reports/ACCELERATION_OPPORTUNITIES_V2.json
          if-no-files-found: error
          retention-days: 2
      - name: Create detached report blobs and publish locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          create_blob() {
            local path="$1"
            local encoded
            encoded="$(base64 -w0 "$path")"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/blobs" \
              -f encoding=base64 \
              -f content="$encoded" \
              --jq .sha
          }
          production_sha="$(create_blob reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json)"
          full_sha="$(create_blob reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json)"
          compatibility_sha="$(create_blob reports/ACCELERATION_OPPORTUNITIES_V2.json)"
          gh issue create \
            --title 'Temporary SciComputation V19 report blobs ${{ github.run_id }}' \
            --body "run=${{ github.run_id }} commit=${{ github.sha }} production_blob=${production_sha} full_tree_blob=${full_sha} compatibility_blob=${compatibility_sha}"
