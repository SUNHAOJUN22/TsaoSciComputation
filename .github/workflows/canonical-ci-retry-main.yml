name: Canonical CI retry for final main

on:
  issues:
    types: [edited]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: canonical-ci-retry-main
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_CANONICAL_CI_RETRY_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Prepare and verify the clean final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo prepare > /tmp/tsao-ci-retry-stage
          rm -f .github/workflows/canonical-ci-retry-main.yml
          python -m pip install -e '.[validation,quality]'
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest tests/test_readme_visuals.py -q
          python scripts/verify_all.py --profile all | tee /tmp/clean-tree-verify.log
          git diff --check

      - name: Commit the self-cleaned final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/tsao-ci-retry-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo 'Expected the one-shot workflow deletion to be staged.' >&2
            exit 1
          }
          git commit -m 'Remove completed canonical CI retry workflow'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > /tmp/final-sha

      - name: Dispatch canonical CI and publish its run ID
        shell: bash
        run: |
          set -Eeuo pipefail
          echo dispatch > /tmp/tsao-ci-retry-stage
          FINAL_SHA="$(cat /tmp/final-sha)"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main 2>&1 | tee /tmp/dispatch.log
          CI_RUN_ID=''
          for _ in $(seq 1 90); do
            CI_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --event workflow_dispatch --branch main --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq --arg sha "$FINAL_SHA" \
              '[.[] | select(.headSha == $sha)] | sort_by(.createdAt) | last | .databaseId // empty')"
            test -n "$CI_RUN_ID" && break
            sleep 5
          done
          test -n "$CI_RUN_ID"
          echo "$CI_RUN_ID" > /tmp/ci-run-id
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical cross-platform CI retry dispatched for final commit $FINAL_SHA. CI Run ID: $CI_RUN_ID. Waiting for completion before claiming success."

      - name: Wait for the canonical matrix and capture failures
        shell: bash
        run: |
          set -Eeuo pipefail
          echo ci-watch > /tmp/tsao-ci-retry-stage
          CI_RUN_ID="$(cat /tmp/ci-run-id)"
          if ! gh run watch "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status; then
            gh run view "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
              > /tmp/ci-failed.log 2>&1 || true
            exit 1
          fi

      - name: Report success and close the task
        shell: bash
        run: |
          set -Eeuo pipefail
          echo success > /tmp/tsao-ci-retry-stage
          FINAL_SHA="$(cat /tmp/final-sha)"
          CI_RUN_ID="$(cat /tmp/ci-run-id)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical CI passed for final clean commit $FINAL_SHA. CI Run ID: $CI_RUN_ID. The matrix validated Python 3.10 and 3.13 on Ubuntu, Windows and macOS, plus quality, package and benchmark jobs. The retry workflow removed itself; no branch or PR was created. Second-pass finalization is complete."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          STAGE="$(cat /tmp/tsao-ci-retry-stage 2>/dev/null || echo unknown)"
          CI_RUN_ID="$(cat /tmp/ci-run-id 2>/dev/null || echo unavailable)"
          {
            echo "Canonical CI retry failed at stage: $STAGE."
            echo
            echo "Retry workflow run: $GITHUB_RUN_ID. Canonical CI run: $CI_RUN_ID."
            echo
            echo '```text'
            if test -s /tmp/ci-failed.log; then
              tail -n 140 /tmp/ci-failed.log | tr -d '\r' | tail -c 18000
            elif test -s /tmp/dispatch.log; then
              cat /tmp/dispatch.log | tr -d '\r' | tail -c 18000
            elif test -s /tmp/clean-tree-verify.log; then
              tail -n 120 /tmp/clean-tree-verify.log | tr -d '\r' | tail -c 18000
            else
              git status --short || true
            fi
            echo '```'
          } > /tmp/tsao-ci-retry-failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/tsao-ci-retry-failure.md || true
