name: Bootstrap ultimate main audit V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-ultimate-main-audit-v3.yml'
      - '.github/audit-v3/**'
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-ultimate-main-audit-v3
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event_name == 'push' ||
      (github.event.issue.number == 23 &&
       contains(github.event.issue.body, '<!-- TSAO_ULTIMATE_MAIN_AUDIT_V3 -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '23'
    steps:
      - name: Publish bootstrap start
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          --body "Ultimate main audit V3 bootstrap started. Workflow run: $GITHUB_RUN_ID."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Assemble the self-deleting audit workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/audit-v3/part00.ymlfrag \
              .github/audit-v3/part01.ymlfrag \
              .github/audit-v3/part02.ymlfrag \
              .github/audit-v3/part03.ymlfrag \
              > .github/workflows/ultimate-main-audit-v3.yml
          rm -rf .github/audit-v3
          rm -f .github/workflows/bootstrap-ultimate-main-audit-v3.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ultimate-main-audit-v3.yml')
          text = path.read_text(encoding='utf-8')
          if '<!-- TSAO_ULTIMATE_MAIN_AUDIT_V3 -->' not in text:
              raise SystemExit('assembled workflow marker missing')
          if 'name: Ultimate main audit V3' not in text:
              raise SystemExit('assembled workflow header missing')
          if text.count("python - <<'PY'") < 4:
              raise SystemExit('assembled workflow appears incomplete')
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check

      - name: Commit assembled audit workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble ultimate main audit V3 workflow'
          git push origin HEAD:refs/heads/main

      - name: Report bootstrap failure
        if: ${{ failure() }}
        run: >-
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          --body "Ultimate main audit V3 bootstrap failed. Workflow run: $GITHUB_RUN_ID. No completion is claimed."
