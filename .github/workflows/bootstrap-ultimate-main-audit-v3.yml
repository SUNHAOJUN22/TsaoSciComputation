name: Ultimate main audit V3 coordinator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-ultimate-main-audit-v3.yml'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ultimate-main-audit-v3-coordinator
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TSAO_COVERAGE_JSON: /tmp/ultimate-v3-coverage.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete verification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Execute ultimate main audit V3
        shell: bash
        run: bash scripts/ultimate_audit_v3_coordinator.sh

      - name: Report coordinator infrastructure failure
        if: ${{ failure() }}
        run: >-
          gh issue comment 23 --repo "$GITHUB_REPOSITORY"
          --body "Ultimate main audit V3 workflow failed before or outside the coordinator script. Run: \`$GITHUB_RUN_ID\`. No completion is claimed."
