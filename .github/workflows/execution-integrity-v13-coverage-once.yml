name: Execution integrity V13 coverage diagnosis

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.issue.title == 'EXECUTION_INTEGRITY_V13_COVERAGE_DIAGNOSE' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Measure candidate coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          git read-tree --reset -u 27af704e6f6c28dae400cdd28d943936312fd802
          git checkout "$ORIGINAL_SHA" -- scripts/prepare_execution_integrity_v13e.py
          git clean -fd
          python scripts/prepare_execution_integrity_v13e.py
          python -m pip install -e '.[validation,quality,security]'
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage json -o /tmp/v13-coverage-diagnosis.json
          python - <<'PY' > /tmp/v13-coverage-summary.txt
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/v13-coverage-diagnosis.json').read_text())
          rows = []
          for name, info in data['files'].items():
              if not name.startswith('tsao_computation/'):
                  continue
              summary = info['summary']
              missing = info.get('missing_lines', [])
              excluded = info.get('excluded_lines', [])
              rows.append((summary['percent_covered'], name, missing, excluded, summary))
          rows.sort()
          print(f"TOTAL {data['totals']['percent_covered']:.4f}%")
          for percent, name, missing, excluded, summary in rows[:25]:
              print(f"{percent:.2f}% {name} statements={summary['num_statements']} missing={missing} excluded={excluded}")
          PY
          cat /tmp/v13-coverage-summary.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/v13-coverage-summary.txt
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Coverage diagnosis completed without modifying main."
