name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[validation,quality]'
      - run: python scripts/verify_all.py --profile core

  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: python scripts/verify_native_core.py

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - run: python scripts/verify_all.py --profile quality
      - name: Reject generated or evidence drift
        run: git diff --exit-code

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[validation,quality]'
      - run: python scripts/verify_all.py --profile package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TsaoSciComputation-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality]'
      - run: python scripts/verify_all.py --profile benchmark

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality]'
      - run: python -m pytest -q tests/test_performance_v9.py tests/test_performance_optimizations.py
      - run: python scripts/run_large_parser_regression.py
      - name: Verify accepted V9 performance evidence when present
        shell: bash
        run: |
          if test -f reports/PERFORMANCE_COMPARISON_V9.json; then
            python scripts/compare_performance_v9.py \
              --verify-report reports/PERFORMANCE_COMPARISON_V9.json
          else
            echo 'V9 performance evidence has not been finalized yet.'
          fi

  finalize-readme-manifest:
    if: >-
      github.event_name == 'push' &&
      github.event.head_commit.message == 'Trigger final Manifest completion'
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - name: Restore permanent CI and build final Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          product_base=5ee6888a18f9a76fe55dcc3d807e1605e0e6b075
          git show "$product_base:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm .github/workflows/finalize-readme-manifest-once.yml
          python scripts/build_manifest.py
          python -m pytest tests/test_readme_visuals.py -q
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile benchmark
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only "$product_base")" = "manifest.json"
          python scripts/build_manifest.py --check
      - name: Publish final delivery tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refresh manifest for bilingual README delivery"
          git push origin HEAD:main
          product_commit=$(git rev-parse HEAD)
          gh issue comment 158 --repo "$GITHUB_REPOSITORY" --body "Bilingual README delivery and final Manifest qualification passed at $product_commit. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close 158 --repo "$GITHUB_REPOSITORY" --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."
