name: V9 CI channel probe

on:
  push:
    branches: [main]
    paths: [.v9-ci-trigger]

permissions:
  contents: write

concurrency:
  group: v9-ci-probe-main
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: true
      - name: Record execution channel
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '{\n  "outcome": "started",\n  "schema_version": "1.0",\n  "workflow": "registered-ci-v9"\n}\n' > .v9-ci-status.json
          git add .v9-ci-status.json
          git commit -m 'Record V9 registered CI channel'
          git push origin HEAD:refs/heads/main
