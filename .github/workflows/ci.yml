name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  issues:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  core:
    if: github.event_name != 'issues'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[validation,quality]'
      - run: python scripts/verify_all.py --profile core

  native-core:
    if: github.event_name != 'issues'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: python scripts/verify_native_core.py

  quality:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - run: python scripts/verify_all.py --profile quality
      - name: Reject generated or evidence drift
        run: git diff --exit-code

  package:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[validation,quality]'
      - run: python scripts/verify_all.py --profile package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TsaoSciComputation-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  benchmark:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality]'
      - run: python scripts/verify_all.py --profile benchmark

  performance:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality]'
      - run: python -m pytest -q tests/test_performance_v9.py tests/test_performance_optimizations.py
      - run: python scripts/run_large_parser_regression.py
      - name: Verify accepted V9 performance evidence when present
        shell: bash
        run: |
          if test -f reports/PERFORMANCE_COMPARISON_V9.json; then
            python scripts/compare_performance_v9.py \
              --verify-report reports/PERFORMANCE_COMPARISON_V9.json
          else
            echo 'V9 performance evidence has not been finalized yet.'
          fi

  finalize-cross-platform-manifest:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.number == 159 &&
      contains(github.event.issue.body, 'RUN_CI_FINAL_MANIFEST_20260807')
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify staging scope
        shell: bash
        run: |
          set -Eeuo pipefail
          base=a399f36ed7f5ab5298720e0803bc86aeb5cf150a
          test "$(git diff --name-only "$base" HEAD)" = ".github/workflows/ci.yml"
          test "$(gh issue view 159 --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - name: Restore permanent CI, rebuild Manifest and qualify
        shell: bash
        run: |
          set -Eeuo pipefail
          base=a399f36ed7f5ab5298720e0803bc86aeb5cf150a
          git show "$base:.github/workflows/ci.yml" > .github/workflows/ci.yml
          python scripts/build_manifest.py
          python -m pytest tests/test_execution_evidence_hardening.py -q
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile benchmark
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only "$base")" = "manifest.json"
          python scripts/build_manifest.py --check
      - name: Publish final delivery tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refresh manifest for cross-platform path hardening"
          git push origin HEAD:main
          product_commit=$(git rev-parse HEAD)
          gh issue comment 159 --repo "$GITHUB_REPOSITORY" --body "Cross-platform path hardening and final Manifest qualification passed at $product_commit. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close 159 --repo "$GITHUB_REPOSITORY" --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."
