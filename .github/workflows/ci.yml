name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: scicomputation-p1-finalize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize-p1-contracts:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'remediation/ci-evidence-convergence'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact Draft branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: remediation/ci-evidence-convergence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install repository qualification stack
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Materialize reviewed P1 source and remove generators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/remediation-execution-boundary-v3.yml')
          workflow = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          program = textwrap.dedent(workflow[start:end])
          exec(compile(program, str(source), 'exec'), {'__name__': '__main__'})
          PY
          find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -delete
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/main:.github/workflows/codeql.yml > .github/workflows/codeql.yml
          python - <<'PY'
          from pathlib import Path

          init_path = Path('tsao_computation/__init__.py')
          text = init_path.read_text(encoding='utf-8')
          exports = (
              'BoundedOutputAccumulator',
              'ConcurrentProvenanceLedger',
              'ExecutionBudget',
              'ExternalExecutionCapability',
              'SignedExecutionReceipt',
              'AcceptanceEnvelope',
              'ScientificQuantity',
              'acceptance_is_verified',
              'require_verified_acceptance',
          )
          for name in exports:
              text = text.replace(f'    {name},', f'    {name} as {name},')
          init_path.write_text(text, encoding='utf-8')

          boundary = Path('tsao_computation/execution_boundary.py')
          text = boundary.read_text(encoding='utf-8')
          old = '''            except FileExistsError:
                if time.monotonic() >= deadline:
                    raise TimeoutError("provenance ledger lock timed out")
'''
          new = '''            except FileExistsError as exc:
                if time.monotonic() >= deadline:
                    raise TimeoutError("provenance ledger lock timed out") from exc
'''
          if old not in text:
              raise SystemExit('expected lock timeout block not found')
          boundary.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Canonicalize source and rebuild deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check

      - name: Run complete qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -print -quit)"
          rg -n 'class ScientificQuantity' --glob 'scientific_quantity.py'
          rg -n 'class ExternalExecutionCapability' --glob 'execution_boundary.py'
          rg -n 'class ConcurrentProvenanceLedger' --glob 'execution_boundary.py'
          git diff --check

      - name: Commit clean production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(execution): require signed bounded replayable runs'
          git push origin HEAD:remediation/ci-evidence-convergence
