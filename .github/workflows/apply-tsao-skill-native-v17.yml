name: Apply comprehensive skill-native V17
on:
  push:
    branches: [main]
    paths:
      - .tsao-skill-native-v17/payload.tar.gz
      - scripts/apply_tsao_skill_native_v17.py
      - .github/workflows/apply-tsao-skill-native-v17.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: scicomputation-skill-native-v17
  cancel-in-progress: false
jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified comprehensive payload
        run: python scripts/apply_tsao_skill_native_v17.py
      - name: Remove temporary and non-authoritative workflow surfaces
        shell: bash
        run: rm -f .github/workflows/agent-skill-portability.yml .github/workflows/apply-tsao-skill-native-v17.yml
      - name: Install declared validation and quality environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,quality]'
      - name: Validate canonical Skill and bilingual assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('.agents/skills/tsao-scicomputation/SKILL.md'),
              Path('.agents/skills/tsao-scicomputation/references/definition-of-done.md'),
              Path('assets/diagrams/vision-en.svg'),
              Path('assets/diagrams/vision-zh.svg'),
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing materialized Skill assets: {missing}')
          skill = required[0].read_text(encoding='utf-8')
          if not skill.startswith('---\n') or 'name: tsao-scicomputation' not in skill[:1200]:
              raise SystemExit('invalid canonical TsaoSciComputation SKILL.md frontmatter')
          for path in required:
              text = path.read_text(encoding='utf-8')
              if '\ufffd' in text or '\x00' in text:
                  raise SystemExit(f'Unicode/source corruption in {path}')
          PY
      - name: Run full repository tests
        run: python -m pytest -q
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: Strict mypy
        run: mypy tsao_computation
      - name: Compile Python sources
        run: python -m compileall -q tsao_computation scripts
      - name: Coverage gate
        run: python -m pytest -q --cov=tsao_computation --cov-branch --cov-report=term-missing
      - name: Build distributions
        run: python -m build
      - name: Dependency consistency
        run: python -m pip check
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified source and remove one-shot payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tsao-skill-native-v17 scripts/apply_tsao_skill_native_v17.py
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected verified source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete TsaoSciComputation skill-native V17 remediation'
          git push origin HEAD:main
      - name: Open diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf 'Workflow run: %s/actions/runs/%s\nCommit: %s\n' '${{ github.server_url }}/${{ github.repository }}' '${{ github.run_id }}' '${{ github.sha }}' > /tmp/v17-failure.txt
          gh issue create --title 'V17 remediation workflow failed (run ${{ github.run_id }})' --body-file /tmp/v17-failure.txt
