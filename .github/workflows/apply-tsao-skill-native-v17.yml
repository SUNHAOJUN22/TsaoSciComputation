name: Apply comprehensive skill-native V17

on:
  push:
    branches: [main]
    paths:
      - .tsao-skill-native-v17/payload.tar.gz
      - scripts/apply_tsao_skill_native_v17.py
      - .github/workflows/apply-tsao-skill-native-v17.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scicomputation-skill-native-v17
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified comprehensive payload
        run: python scripts/apply_tsao_skill_native_v17.py
      - name: Remove one-shot and non-authoritative surfaces before validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tsao-skill-native-v17
          rm -f scripts/apply_tsao_skill_native_v17.py
          rm -f .github/workflows/agent-skill-portability.yml
          rm -f .github/workflows/apply-tsao-skill-native-v17.yml
      - name: Install declared validation and quality environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[validation,quality]'
      - name: Normalize materialized Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          ruff check . --fix --exit-zero 2>&1 | tee /tmp/v17-normalize-ruff-1.log
          ruff format . 2>&1 | tee /tmp/v17-normalize-format-1.log
          ruff check . --fix --exit-zero 2>&1 | tee /tmp/v17-normalize-ruff-2.log
          ruff format . 2>&1 | tee /tmp/v17-normalize-format-2.log
          git diff --check
      - name: Regenerate exact-tree acceleration reports
        run: python scripts/build_acceleration_audits.py --root .
      - name: Regenerate exact-tree repository manifest
        run: python scripts/build_manifest.py
      - name: Validate canonical Skill and bilingual assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('.agents/skills/tsao-scicomputation/SKILL.md'),
              Path('.agents/skills/tsao-scicomputation/references/definition-of-done.md'),
              Path('assets/diagrams/vision-en.svg'),
              Path('assets/diagrams/vision-zh.svg'),
          ]
          missing = [path.as_posix() for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing materialized Skill assets: {missing}')
          skill = required[0].read_text(encoding='utf-8')
          if not skill.startswith('---\n') or 'name: tsao-scicomputation' not in skill[:1200]:
              raise SystemExit('invalid canonical TsaoSciComputation SKILL.md frontmatter')
          for path in required:
              text = path.read_text(encoding='utf-8')
              if '\ufffd' in text or '\x00' in text:
                  raise SystemExit(f'Unicode/source corruption in {path}')
          PY
      - name: Native core qualification
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_all.py --profile core 2>&1 | tee /tmp/v17-core.log
      - name: Native runtime qualification
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_native_core.py 2>&1 | tee /tmp/v17-native.log
      - name: Native quality qualification
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_all.py --profile quality 2>&1 | tee /tmp/v17-quality.log
      - name: Native package qualification
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_all.py --profile package 2>&1 | tee /tmp/v17-package.log
      - name: Native benchmark qualification
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_all.py --profile benchmark 2>&1 | tee /tmp/v17-benchmark.log
      - name: Large parser regression
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_large_parser_regression.py 2>&1 | tee /tmp/v17-large-parser.log
      - name: Dependency consistency
        run: python -m pip check
      - name: Verify generated reports remain current
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_acceleration_audits.py --root . --check
          python scripts/build_manifest.py --check
      - name: Clean ignored runtime outputs
        shell: bash
        run: git clean -fdX
      - name: Commit verified final source to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Expected verified source changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete TsaoSciComputation skill-native V17 remediation'
          git push origin HEAD:main
      - name: Open diagnostic issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf 'Workflow run: %s/actions/runs/%s\nCommit: %s\n' '${{ github.server_url }}/${{ github.repository }}' '${{ github.run_id }}' '${{ github.sha }}' > /tmp/v17-failure.txt
          for log in /tmp/v17-*.log; do
            if [[ -f "$log" ]]; then
              printf '\n===== %s =====\n' "$(basename "$log")" >> /tmp/v17-failure.txt
              tail -n 220 "$log" >> /tmp/v17-failure.txt
            fi
          done
          gh issue create --title 'V17 remediation workflow failed (run ${{ github.run_id }})' --body-file /tmp/v17-failure.txt
