name: One-time SciComputation exact-tree finalization v5

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: github.event.issue.number == 162 && github.event.comment.body == '/finalize-scicomputation-source-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: pip

      - name: Install qualification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Remove all temporary workflows before manifest generation
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'one-time-*.yml' -print -delete
          test -f .github/workflows/ci.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name 'one-time-*.yml' | wc -l | tr -d ' ')" -eq 0

      - name: Regenerate exact governed evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_acceleration_audits.py
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run complete clean-tree qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_all.py --profile core
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
          python -m pytest -q tests/test_performance_v9.py tests/test_performance_optimizations.py
          python scripts/run_large_parser_regression.py
          python scripts/build_manifest.py --check
          git diff --check

      - name: Publish exact self-consistent source
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize self-consistent SciComputation source manifest"
          git push origin HEAD:main
          echo "clean_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record finalization result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.publish.outputs.clean_sha }}
        run: |
          set -euo pipefail
          gh issue comment 162 --repo "$GITHUB_REPOSITORY" --body "SCICOMPUTATION_SOURCE_V5 status=${{ job.status }} run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID clean_sha=${CLEAN_SHA:-UNPUBLISHED} previous_active_ns=0"
