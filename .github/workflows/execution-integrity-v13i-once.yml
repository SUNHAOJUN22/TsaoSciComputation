name: Execution integrity V13I final certification

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: execution-integrity-v13i-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/v13i-coverage.json
  AUDIT_ISSUE: '85'
  CANDIDATE_SHA: '27af704e6f6c28dae400cdd28d943936312fd802'
  CLEAN_BASELINE_SHA: 'e6d6f294cea1671fb7e9ef7936692569be4f49ab'
  V13E_PREPARER_SHA: 'f152ad0c56bb9889ef8dae2e3a4085515e6c26e3'
  V13G_PREPARER_SHA: '3efbb9e80122e98d4db6ed7983ee0c8348a7fb51'
  V13H_PREPARER_SHA: '903b7b653088906675c9d424e7438b96aba20e51'

jobs:
  certify:
    if: ${{ github.event.issue.title == 'EXECUTION_INTEGRITY_V13I_FINALIZE' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Materialize candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          echo "ORIGINAL_SHA=$ORIGINAL_SHA" >> "$GITHUB_ENV"
          echo materialize > /tmp/v13i-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git read-tree --reset -u "$CANDIDATE_SHA"
          git checkout "$V13E_PREPARER_SHA" -- scripts/prepare_execution_integrity_v13e.py
          git checkout "$V13G_PREPARER_SHA" -- scripts/prepare_execution_integrity_v13g.py
          git checkout "$V13H_PREPARER_SHA" -- scripts/prepare_execution_integrity_v13h.py
          git clean -fd
          python scripts/prepare_execution_integrity_v13h.py
          rm -f scripts/apply_execution_integrity_v13.py scripts/prepare_execution_integrity_v13e.py scripts/prepare_execution_integrity_v13g.py scripts/prepare_execution_integrity_v13h.py
          rm -f docs/.execution-integrity-v13-plan.md .github/workflows/execution-integrity-v13i-once.yml
          python scripts/sync_version_metadata.py --release-date 2026-08-03
      - name: Focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo focused > /tmp/v13i-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m pytest -q tests/test_execution_integrity_v13.py tests/test_execution_integrity_v13_coverage.py tests/test_core.py tests/test_extended.py tests/test_fail_closed_coverage_regressions.py tests/test_adversarial_super_skill_phase_a.py tests/test_acceleration_foundation.py tests/test_acceleration_hardening.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
      - name: Complete validation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete > /tmp/v13i-stage
          python scripts/run_tests.py --coverage | tee /tmp/v13i-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/v13i-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/v13i-benchmark.json
          python scripts/verify_native_core.py > /tmp/v13i-native.json
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/v13i-dependencies.json
          rm -rf /tmp/v13i-build /tmp/v13i-venv
          python -m build --outdir /tmp/v13i-build
          python -m venv /tmp/v13i-venv
          /tmp/v13i-venv/bin/python -m pip install --no-deps /tmp/v13i-build/*.whl
          /tmp/v13i-venv/bin/python -c 'import tsao_computation; assert tsao_computation.__version__ == "3.0.4"'
          python -m pytest -q | tee /tmp/v13i-pytest.log
          git ls-remote --heads origin | sort > /tmp/v13i-heads.txt
          test "$(awk '{print $2}' /tmp/v13i-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main
      - name: Refresh evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/v13i-stage
          python scripts/build_super_skill_audit.py --test-log /tmp/v13i-pytest.log --coverage-json /tmp/v13i-coverage.json --dependency-json /tmp/v13i-dependencies.json --security-json evidence/security-scan.json --verification-json /tmp/v13i-all.json
          python scripts/update_main_audit_evidence.py --root . --run-id "$GITHUB_RUN_ID" --issue "$AUDIT_ISSUE" --test-log /tmp/v13i-pytest.log --coverage-json /tmp/v13i-coverage.json --dependency-json /tmp/v13i-dependencies.json --security-json evidence/security-scan.json --remote-heads /tmp/v13i-heads.txt --parent-commit "$ORIGINAL_SHA" --audit-generation execution-integrity-v13 --audit-label execution-integrity --visual-count 42 --visual-atlas-version 13 --report-path reports/EXECUTION_INTEGRITY_V13.md --visual-families 'Electronic structure and molecular simulation; materials and interfaces; continuum and process engineering; evidence governance and HPC.'
          python scripts/sync_version_metadata.py --release-date 2026-08-03
          python scripts/security_scan.py
          python scripts/build_manifest.py
      - name: Exact-tree gate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo exact-tree > /tmp/v13i-stage
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python -m pytest -q
          python scripts/sync_version_metadata.py --check
          python scripts/build_manifest.py --check
          python -c "import json,pathlib; a=json.loads(pathlib.Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text()); p=a['execution_policy']; assert a['status']=='VALIDATED' and a['version']=='3.0.4' and not a['validation_missing_evidence'] and not a['validation_failures']; assert a['quality']['tests_failed']==0 and a['quality']['statement_coverage_percent']>=95 and a['quality']['dependency_vulnerabilities']==0 and a['quality']['repository_security_findings']==0 and a['quality']['source_and_wheel_reproducible'] is True; assert all(p[k] is True for k in ('direct_low_level_process_execution_disabled','read_only_probe_commands_allowlisted','authorization_binds_executable_sha256','authorization_binds_input_sha256','python_module_probes_use_sanitized_environment'))"
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflows[*]}" = "${expected[*]}"
          test "$(awk '{print $2}' /tmp/v13i-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main
      - name: Commit final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/v13i-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Harden execution integrity and probe safety'
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
      - name: Production workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production > /tmp/v13i-stage
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
          : > /tmp/v13i-runs.txt
          wait_for() {
            local workflow="$1" line status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json headSha,status,conclusion,url --jq ".[] | select(.headSha == \"$FINAL_SHA\") | [.status,.conclusion,.url] | @tsv" | head -n 1)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  [[ "$conclusion" == success ]]
                  printf '%s: %s\n' "$workflow" "$url" >> /tmp/v13i-runs.txt
                  return
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for ci.yml
          wait_for codeql.yml
          wait_for scorecard.yml
      - name: Close audit
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(cat /tmp/v13i-runs.txt)"
          metrics="$(python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text())
          q=audit['quality']
          print(f"version={audit['version']}; tests={q['tests_passed']}; statement-coverage={q['statement_coverage_percent']:.2f}%; branch-coverage={q['branch_coverage_percent']:.2f}%")
          PY
          )"
          gh issue close "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Execution integrity V13 passed on commit \`$FINAL_SHA\`. $metrics. Direct low-level execution is disabled; read-only probes are allowlisted; module probes use a sanitized environment; executable, input and normalized environment state are rebound before launch. All deterministic, benchmark, security, dependency, reproducible build, Manifest and main-only gates passed. Production workflows:\n$runs\nNo branch or pull request was created."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Final V13I certification completed at \`$FINAL_SHA\`."
      - name: Fail closed
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/v13i-stage 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          git read-tree --reset -u "$CLEAN_BASELINE_SHA"
          git clean -fd
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Restore certified baseline after V13I $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Execution integrity V13I failed closed at stage: $stage. Actions run: $GITHUB_RUN_ID. The tree was restored to certified baseline $CLEAN_BASELINE_SHA. No branch or PR was created." || true
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment "Fail-closed at stage: $stage." || true
          exit 1
