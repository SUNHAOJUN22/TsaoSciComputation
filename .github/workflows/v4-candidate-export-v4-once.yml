name: V4 exact candidate export V4 once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: v4-candidate-export-v4-once
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/export-v4-fail-closed-candidate-v4')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[validation,quality,security]'
          python -m pip check
      - name: Apply fail-closed benchmark policy and rebuild derived evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/ci.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          directive = '    continue-on-error: true\n'
          if workflow_text.count(directive) != 1:
              raise SystemExit(
                  'expected exactly one benchmark continue-on-error line, '
                  f'found {workflow_text.count(directive)}'
              )
          workflow_text = workflow_text.replace(directive, '', 1)
          if 'continue-on-error:' in workflow_text:
              raise SystemExit('continue-on-error remains in CI workflow')
          workflow.write_text(workflow_text, encoding='utf-8', newline='\n')

          policy = Path('tests/test_ci_policy.py')
          policy_text = policy.read_text(encoding='utf-8')
          pattern = (
              r'def test_benchmark_is_observational_not_a_release_gate\(\) -> None:\n'
              r'.*?(?=\ndef test_uploaded_artifact_names_are_unique_per_attempt\(\) -> None:)'
          )
          replacement = (
              'def test_benchmark_is_blocking_but_separate_from_quality() -> None:\n'
              '    text = (ROOT / ".github" / "workflows" / "ci.yml").read_text(encoding="utf-8")\n'
              '    quality = text.split("\\n  quality:\\n", 1)[1].split("\\n  package:\\n", 1)[0]\n'
              '    benchmark = text.split("\\n  benchmark:\\n", 1)[1].split("\\n  performance:\\n", 1)[0]\n'
              '    assert "--profile benchmark" not in quality\n'
              '    assert "--profile benchmark" in benchmark\n'
              '    assert "continue-on-error:" not in benchmark\n'
          )
          policy_text, count = re.subn(
              pattern,
              lambda _match: replacement,
              policy_text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'legacy benchmark policy function match count: {count}')
          policy.write_text(policy_text, encoding='utf-8', newline='\n')
          PY
          python -m ruff format tests/test_ci_policy.py
          find .github/workflows -maxdepth 1 -type f -name 'v4-*-once.yml' -delete
          python scripts/build_acceleration_audits.py
          node scripts/refresh-current-main-readme.mjs --check
          git diff --check
      - name: Run all verification profiles on the pre-commit tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile benchmark
          python scripts/verify_all.py --profile package
          python - <<'PY'
          from pathlib import Path
          ci = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          forbidden = ('continue-on-error:', '|| true', 'pytest ... || exit 0')
          found = [token for token in forbidden if token in ci]
          if found:
              raise SystemExit(f'forbidden fail-open workflow constructs remain: {found}')
          PY
          git diff --check
      - name: Commit exact controller-free candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: make benchmark qualification fail closed'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Requalify immutable candidate without drift
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile benchmark
          python scripts/verify_all.py --profile package
          python scripts/build_acceleration_audits.py --check
          git ls-remote --heads origin > /tmp/scicomputation-v4-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [line.split()[1] for line in Path('/tmp/scicomputation-v4-branches.txt').read_text().splitlines() if line.strip()]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          workflows = [path.name for path in Path('.github/workflows').glob('v4-*-once.yml')]
          if workflows:
              raise SystemExit(f'temporary V4 workflows remain: {workflows}')
          PY
          git diff --exit-code
          git diff --check
      - name: Package every exact changed path
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/scicomputation-v4-candidate"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          : > "$bundle/DELETE_PATHS.txt"
          while IFS=$'\t' read -r status path; do
            case "$status" in
              A|M)
                mkdir -p "$bundle/$(dirname "$path")"
                cp "$path" "$bundle/$path"
                ;;
              D)
                printf '%s\n' "$path" >> "$bundle/DELETE_PATHS.txt"
                ;;
              *)
                echo "unsupported diff-tree status: $status $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff-tree --no-commit-id --name-status -r HEAD)
          git rev-parse HEAD^ > "$bundle/PARENT_SHA.txt"
          git rev-parse HEAD > "$bundle/CANDIDATE_SHA.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$bundle/CHANGES.tsv"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scicomputation-v4-exact-candidate-${{ steps.candidate.outputs.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_SCICOMPUTATION_EXACT_EXPORT_V4 outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} bundle=uploaded benchmark=blocking policy_test=blocking acceleration_evidence=rebuilt manifest=exact-tree controllers=removed"
