name: Collect terminal Windows errors

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  collect:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_TERMINAL_WINDOWS_ERRORS_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      JOB_310: '89711275370'
      JOB_313: '89711275403'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Self-clean and synchronize Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/collect-terminal-windows-errors.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed terminal Windows error collector'
          git push origin HEAD:refs/heads/main

      - name: Publish terminal lines only
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run view --repo "$GITHUB_REPOSITORY" --job "$JOB_310" --log \
            > /tmp/windows-310.log 2>&1
          gh run view --repo "$GITHUB_REPOSITORY" --job "$JOB_313" --log \
            > /tmp/windows-313.log 2>&1
          {
            echo 'Terminal Windows errors:'
            echo
            echo '### Python 3.10'
            echo '```text'
            tail -n 24 /tmp/windows-310.log | tr -d '\r'
            echo '```'
            echo
            echo '### Python 3.13'
            echo '```text'
            tail -n 24 /tmp/windows-313.log | tr -d '\r'
            echo '```'
          } > /tmp/terminal-windows-errors.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/terminal-windows-errors.md
