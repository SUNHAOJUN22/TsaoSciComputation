name: Validate coverage regressions once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: validate-coverage-regressions-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/coverage-regression-validation.json

jobs:
  validate:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == 'Validate coverage regression tests'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Validate tests and coverage with guaranteed cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/validate-coverage-regressions-once.yml
          LOG=/tmp/coverage-regression-validation.log
          exec > >(tee -a "$LOG") 2>&1

          cleanup_failure() {
            code=$?
            set +e
            tail -n 120 "$LOG" > /tmp/coverage-regression-failure.txt
            {
              echo 'Coverage regression validation failed.'
              echo
              echo '```text'
              cat /tmp/coverage-regression-failure.txt
              echo '```'
            } > /tmp/coverage-regression-failure.md
            gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/coverage-regression-failure.md || true
            python scripts/build_manifest.py || true
            git add -A
            git commit -m 'Remove failed coverage regression validator' || true
            git push origin HEAD:refs/heads/main || true
            exit "$code"
          }
          trap cleanup_failure ERR

          python -m pip install -e '.[validation,quality]'
          python -m ruff check tests/test_fail_closed_coverage_regressions.py
          python -m ruff format --check tests/test_fail_closed_coverage_regressions.py
          python -m pytest -q tests/test_fail_closed_coverage_regressions.py
          python scripts/run_tests.py --coverage
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/coverage-regression-validation.json').read_text(encoding='utf-8'))
          totals=payload['totals']
          body=(
              '# Coverage regression validation passed\n\n'
              f"- Statement coverage: **{totals['percent_statements_covered']:.4f}%**\n"
              f"- Branch coverage: **{totals['percent_branches_covered']:.4f}%**\n"
              f"- Missing statements: **{totals['missing_lines']}**\n"
              f"- Missing branches: **{totals['missing_branches']}**\n"
          )
          Path('/tmp/coverage-regression-success.md').write_text(body,encoding='utf-8')
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/coverage-regression-success.md
          trap - ERR
          python scripts/build_manifest.py
          git add -A
          git commit -m 'Remove completed coverage regression validator' || true
          git push origin HEAD:refs/heads/main
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
