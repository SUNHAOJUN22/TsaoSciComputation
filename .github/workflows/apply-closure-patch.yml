name: Apply closure hashing patch

on:
  push:
    branches: [closure/20260828-hashing-readme]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-closure-hashing
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOSURE_PATCH_B64: >-
        
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: closure/20260828-hashing-readme
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Apply tested patch and regenerate deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOSURE_PATCH_B64" | base64 --decode | gzip --decompress > /tmp/closure.patch
          printf '%s  %s\n' '037a55a76b86097b3ded1563108e037b1a1e9edfc20024615fd80f33f5e3fa47' /tmp/closure.patch | sha256sum --check
          git apply --index --whitespace=error /tmp/closure.patch
          python scripts/build_acceleration_audits.py
          python scripts/build_resource_broker_evidence.py
          rm .github/workflows/apply-closure-patch.yml
          git add -A
          git diff --cached --check
          python -m compileall -q tsao_computation tests
          git config user.name 'SUNHAOJUN22'
          git config user.email '116634523+SUNHAOJUN22@users.noreply.github.com'
          git commit -m 'refactor(hashing): unify evidence digest implementation'
          git push origin HEAD:closure/20260828-hashing-readme
