name: One-shot signed execution boundary convergence v3

on:
  push:
    branches:
      - remediation/ci-evidence-convergence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scicomputation-execution-boundary-v3
  cancel-in-progress: false

jobs:
  apply-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact Draft PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/ci-evidence-convergence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          if test -f requirements-ci.lock; then
            python -m pip install --disable-pip-version-check -r requirements-ci.lock
          elif test -f requirements-dev.txt; then
            python -m pip install --disable-pip-version-check -r requirements-dev.txt
          elif test -f requirements.txt; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip check

      - name: Converge quantity, acceptance, execution, and provenance contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import json
          import textwrap

          roots = [
              p.parent
              for p in Path('.').glob('*/__init__.py')
              if not any(part.startswith('.') or part in {'tests', 'scripts', 'docs'} for part in p.parts)
          ]
          roots.sort(
              key=lambda path: (
                  0 if 'computation' in path.name.casefold() else 1,
                  0 if 'tsao' in path.name.casefold() else 1,
                  path.name,
              )
          )
          if not roots:
              raise SystemExit('no importable package root found')
          package = roots[0]

          quantity = package / 'scientific_quantity.py'
          source_workflow = Path(
              '.github/workflows/remediation-scientific-quantity-acceptance.yml'
          )
          if not quantity.exists():
              if not source_workflow.exists():
                  raise SystemExit('scientific quantity source applicator is unavailable')
              workflow = source_workflow.read_text(encoding='utf-8')
              marker = "          python - <<'PY'\n"
              start = workflow.index(marker) + len(marker)
              end = workflow.index("\n          PY", start)
              program = textwrap.dedent(workflow[start:end])
              exec(compile(program, str(source_workflow), 'exec'), {'__name__': '__main__'})

          execution = package / 'execution_boundary.py'
          execution.write_text(
              textwrap.dedent(
                  '''\
                  """Fail-closed external execution, resource budgets, and hash-chained provenance."""

                  from __future__ import annotations

                  from collections.abc import Callable, Mapping
                  from dataclasses import dataclass
                  from datetime import datetime, timezone
                  from hashlib import sha256
                  import json
                  import os
                  from pathlib import Path
                  import threading
                  import time
                  from typing import Any, TypeAlias

                  SignatureVerifier: TypeAlias = Callable[[bytes, str, str], bool]


                  class ExecutionBoundaryError(RuntimeError):
                      """Base class for fail-closed execution-boundary errors."""


                  class OutputLimitExceeded(ExecutionBoundaryError):
                      """Raised before governed output exceeds its byte budget."""


                  class ProcessTreeLimitExceeded(ExecutionBoundaryError):
                      """Raised when a process tree exceeds its admitted size."""


                  class ProvenanceIntegrityError(ExecutionBoundaryError):
                      """Raised when the append-only provenance chain is invalid."""


                  def _utc(value: datetime, *, field: str) -> datetime:
                      if value.tzinfo is None or value.utcoffset() is None:
                          raise ValueError(f"{field} must be timezone-aware")
                      return value.astimezone(timezone.utc)


                  def _canonical(payload: Mapping[str, object]) -> bytes:
                      return json.dumps(
                          dict(payload),
                          sort_keys=True,
                          separators=(",", ":"),
                          ensure_ascii=False,
                      ).encode("utf-8")


                  @dataclass(frozen=True, slots=True)
                  class ExecutionBudget:
                      wall_time_seconds: int
                      max_processes: int
                      max_stdout_bytes: int
                      max_stderr_bytes: int
                      max_artifact_bytes: int
                      max_memory_bytes: int

                      def __post_init__(self) -> None:
                          for field in (
                              "wall_time_seconds",
                              "max_processes",
                              "max_stdout_bytes",
                              "max_stderr_bytes",
                              "max_artifact_bytes",
                              "max_memory_bytes",
                          ):
                              value = getattr(self, field)
                              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                                  raise ValueError(f"{field} must be a positive integer")

                      def admit_process_tree(self, process_ids: set[int]) -> None:
                          if len(process_ids) > self.max_processes:
                              raise ProcessTreeLimitExceeded(
                                  f"process tree contains {len(process_ids)} processes; "
                                  f"limit is {self.max_processes}"
                              )


                  @dataclass(frozen=True, slots=True)
                  class ExternalExecutionCapability:
                      capability_id: str
                      executor_id: str
                      command_digest: str
                      not_before: datetime
                      expires_at: datetime
                      signature_scheme: str
                      signature: str

                      def __post_init__(self) -> None:
                          if not self.capability_id.strip() or not self.executor_id.strip():
                              raise ValueError("capability_id and executor_id are required")
                          if len(self.command_digest) != 64 or any(
                              char not in "0123456789abcdef" for char in self.command_digest.casefold()
                          ):
                              raise ValueError("command_digest must be SHA-256 hex")
                          not_before = _utc(self.not_before, field="not_before")
                          expires_at = _utc(self.expires_at, field="expires_at")
                          if expires_at <= not_before:
                              raise ValueError("expires_at must be after not_before")
                          if not self.signature_scheme.strip() or not self.signature.strip():
                              raise ValueError("detached signature metadata is required")
                          object.__setattr__(self, "not_before", not_before)
                          object.__setattr__(self, "expires_at", expires_at)
                          object.__setattr__(self, "command_digest", self.command_digest.casefold())

                      def canonical_bytes(self) -> bytes:
                          return _canonical(
                              {
                                  "capability_id": self.capability_id,
                                  "executor_id": self.executor_id,
                                  "command_digest": self.command_digest,
                                  "not_before": self.not_before.isoformat(),
                                  "expires_at": self.expires_at.isoformat(),
                                  "signature_scheme": self.signature_scheme,
                              }
                          )

                      def is_verified(
                          self,
                          *,
                          verifier: SignatureVerifier | None,
                          command_digest: str,
                          now: datetime | None = None,
                      ) -> bool:
                          if verifier is None:
                              return False
                          current = _utc(now or datetime.now(timezone.utc), field="now")
                          if current < self.not_before or current > self.expires_at:
                              return False
                          if command_digest.casefold() != self.command_digest:
                              return False
                          try:
                              return bool(
                                  verifier(
                                      self.canonical_bytes(),
                                      self.signature,
                                      self.executor_id,
                                  )
                              )
                          except Exception:
                              return False


                  @dataclass(frozen=True, slots=True)
                  class SignedExecutionReceipt:
                      request_id: str
                      capability_id: str
                      executor_id: str
                      started_at: datetime
                      ended_at: datetime
                      exit_code: int
                      process_tree_digest: str
                      stdout_digest: str
                      stderr_digest: str
                      artifact_manifest_digest: str
                      signature_scheme: str
                      signature: str

                      def __post_init__(self) -> None:
                          started = _utc(self.started_at, field="started_at")
                          ended = _utc(self.ended_at, field="ended_at")
                          if ended < started:
                              raise ValueError("ended_at must not precede started_at")
                          if isinstance(self.exit_code, bool) or not isinstance(self.exit_code, int):
                              raise TypeError("exit_code must be an integer")
                          for field in (
                              "process_tree_digest",
                              "stdout_digest",
                              "stderr_digest",
                              "artifact_manifest_digest",
                          ):
                              value = str(getattr(self, field)).casefold()
                              if len(value) != 64 or any(
                                  char not in "0123456789abcdef" for char in value
                              ):
                                  raise ValueError(f"{field} must be SHA-256 hex")
                              object.__setattr__(self, field, value)
                          for field in (
                              "request_id",
                              "capability_id",
                              "executor_id",
                              "signature_scheme",
                              "signature",
                          ):
                              if not str(getattr(self, field)).strip():
                                  raise ValueError(f"{field} is required")
                          object.__setattr__(self, "started_at", started)
                          object.__setattr__(self, "ended_at", ended)

                      def canonical_bytes(self) -> bytes:
                          return _canonical(
                              {
                                  "request_id": self.request_id,
                                  "capability_id": self.capability_id,
                                  "executor_id": self.executor_id,
                                  "started_at": self.started_at.isoformat(),
                                  "ended_at": self.ended_at.isoformat(),
                                  "exit_code": self.exit_code,
                                  "process_tree_digest": self.process_tree_digest,
                                  "stdout_digest": self.stdout_digest,
                                  "stderr_digest": self.stderr_digest,
                                  "artifact_manifest_digest": self.artifact_manifest_digest,
                                  "signature_scheme": self.signature_scheme,
                              }
                          )

                      def is_verified(
                          self,
                          *,
                          verifier: SignatureVerifier | None,
                          expected_capability_id: str,
                      ) -> bool:
                          if verifier is None or self.capability_id != expected_capability_id:
                              return False
                          try:
                              return bool(
                                  verifier(
                                      self.canonical_bytes(),
                                      self.signature,
                                      self.executor_id,
                                  )
                              )
                          except Exception:
                              return False


                  class BoundedOutputAccumulator:
                      def __init__(self, limit_bytes: int) -> None:
                          if isinstance(limit_bytes, bool) or not isinstance(limit_bytes, int):
                              raise TypeError("limit_bytes must be an integer")
                          if limit_bytes <= 0:
                              raise ValueError("limit_bytes must be positive")
                          self._limit = limit_bytes
                          self._data = bytearray()

                      @property
                      def size(self) -> int:
                          return len(self._data)

                      @property
                      def digest(self) -> str:
                          return sha256(self._data).hexdigest()

                      def append(self, chunk: bytes) -> None:
                          if not isinstance(chunk, bytes):
                              raise TypeError("output chunks must be bytes")
                          if len(self._data) + len(chunk) > self._limit:
                              raise OutputLimitExceeded(
                                  f"output would exceed {self._limit} governed bytes"
                              )
                          self._data.extend(chunk)

                      def bytes(self) -> bytes:
                          return bytes(self._data)


                  @dataclass(frozen=True, slots=True)
                  class ProvenanceEvent:
                      sequence: int
                      previous_hash: str
                      event_type: str
                      payload: Mapping[str, object]
                      event_hash: str

                      def canonical_bytes(self) -> bytes:
                          return _canonical(
                              {
                                  "sequence": self.sequence,
                                  "previous_hash": self.previous_hash,
                                  "event_type": self.event_type,
                                  "payload": dict(self.payload),
                              }
                          )


                  class ConcurrentProvenanceLedger:
                      def __init__(self, path: str | Path, *, lock_timeout: float = 10.0) -> None:
                          self.path = Path(path)
                          self.path.parent.mkdir(parents=True, exist_ok=True)
                          self.lock_path = self.path.with_suffix(self.path.suffix + ".lock")
                          self.lock_timeout = lock_timeout
                          self._thread_lock = threading.Lock()

                      def _acquire_file_lock(self) -> int:
                          deadline = time.monotonic() + self.lock_timeout
                          while True:
                              try:
                                  return os.open(
                                      self.lock_path,
                                      os.O_CREAT | os.O_EXCL | os.O_WRONLY,
                                      0o600,
                                  )
                              except FileExistsError:
                                  if time.monotonic() >= deadline:
                                      raise TimeoutError("provenance ledger lock timed out")
                                  time.sleep(0.01)

                      def _release_file_lock(self, descriptor: int) -> None:
                          os.close(descriptor)
                          self.lock_path.unlink(missing_ok=True)

                      def read(self) -> tuple[ProvenanceEvent, ...]:
                          if not self.path.exists():
                              return ()
                          events = []
                          for line in self.path.read_text(encoding="utf-8").splitlines():
                              if not line.strip():
                                  continue
                              raw = json.loads(line)
                              events.append(
                                  ProvenanceEvent(
                                      sequence=int(raw["sequence"]),
                                      previous_hash=str(raw["previous_hash"]),
                                      event_type=str(raw["event_type"]),
                                      payload=dict(raw["payload"]),
                                      event_hash=str(raw["event_hash"]),
                                  )
                              )
                          return tuple(events)

                      @staticmethod
                      def verify(events: tuple[ProvenanceEvent, ...]) -> None:
                          previous = "GENESIS"
                          for sequence, event in enumerate(events):
                              if event.sequence != sequence:
                                  raise ProvenanceIntegrityError("non-contiguous event sequence")
                              if event.previous_hash != previous:
                                  raise ProvenanceIntegrityError("previous hash mismatch")
                              expected = sha256(event.canonical_bytes()).hexdigest()
                              if event.event_hash != expected:
                                  raise ProvenanceIntegrityError("event hash mismatch")
                              previous = event.event_hash

                      def append(
                          self,
                          event_type: str,
                          payload: Mapping[str, object],
                      ) -> ProvenanceEvent:
                          if not event_type.strip():
                              raise ValueError("event_type must not be blank")
                          with self._thread_lock:
                              descriptor = self._acquire_file_lock()
                              try:
                                  events = self.read()
                                  self.verify(events)
                                  previous = events[-1].event_hash if events else "GENESIS"
                                  event = ProvenanceEvent(
                                      sequence=len(events),
                                      previous_hash=previous,
                                      event_type=event_type.strip(),
                                      payload=dict(payload),
                                      event_hash="",
                                  )
                                  event = ProvenanceEvent(
                                      sequence=event.sequence,
                                      previous_hash=event.previous_hash,
                                      event_type=event.event_type,
                                      payload=event.payload,
                                      event_hash=sha256(event.canonical_bytes()).hexdigest(),
                                  )
                                  record = {
                                      "sequence": event.sequence,
                                      "previous_hash": event.previous_hash,
                                      "event_type": event.event_type,
                                      "payload": dict(event.payload),
                                      "event_hash": event.event_hash,
                                  }
                                  with self.path.open("a", encoding="utf-8") as stream:
                                      stream.write(
                                          json.dumps(
                                              record,
                                              sort_keys=True,
                                              separators=(",", ":"),
                                              ensure_ascii=False,
                                          )
                                          + "\\n"
                                      )
                                      stream.flush()
                                      os.fsync(stream.fileno())
                                  return event
                              finally:
                                  self._release_file_lock(descriptor)
                  '''
              ),
              encoding='utf-8',
          )

          init = package / '__init__.py'
          init_text = init.read_text(encoding='utf-8')
          export = textwrap.dedent(
              '''

              from .execution_boundary import (
                  BoundedOutputAccumulator,
                  ConcurrentProvenanceLedger,
                  ExecutionBudget,
                  ExternalExecutionCapability,
                  SignedExecutionReceipt,
              )
              '''
          )
          if 'from .execution_boundary import' not in init_text:
              init.write_text(init_text.rstrip() + export + '\n', encoding='utf-8')

          test = Path('tests/test_execution_boundary_contract.py')
          test.write_text(
              textwrap.dedent(
                  f'''\
                  from __future__ import annotations

                  from concurrent.futures import ThreadPoolExecutor
                  from datetime import datetime, timedelta, timezone
                  from hashlib import sha256
                  import json

                  import pytest

                  from {package.name}.execution_boundary import (
                      BoundedOutputAccumulator,
                      ConcurrentProvenanceLedger,
                      ExecutionBudget,
                      ExternalExecutionCapability,
                      OutputLimitExceeded,
                      ProcessTreeLimitExceeded,
                      ProvenanceIntegrityError,
                      SignedExecutionReceipt,
                  )


                  def test_capability_and_receipt_are_unverified_without_external_verifier() -> None:
                      now = datetime.now(timezone.utc)
                      digest = sha256(b"solver --input governed.in").hexdigest()
                      capability = ExternalExecutionCapability(
                          capability_id="capability:1",
                          executor_id="executor:hpc:1",
                          command_digest=digest,
                          not_before=now - timedelta(seconds=1),
                          expires_at=now + timedelta(minutes=5),
                          signature_scheme="EXTERNAL-DETACHED-V1",
                          signature="signature",
                      )
                      assert not capability.is_verified(
                          verifier=None, command_digest=digest, now=now
                      )
                      assert not capability.is_verified(
                          verifier=lambda *_: True,
                          command_digest=sha256(b"different").hexdigest(),
                          now=now,
                      )
                      assert capability.is_verified(
                          verifier=lambda message, signature, executor: (
                              bool(message)
                              and signature == "signature"
                              and executor == "executor:hpc:1"
                          ),
                          command_digest=digest,
                          now=now,
                      )

                      receipt = SignedExecutionReceipt(
                          request_id="request:1",
                          capability_id=capability.capability_id,
                          executor_id=capability.executor_id,
                          started_at=now,
                          ended_at=now + timedelta(seconds=2),
                          exit_code=0,
                          process_tree_digest="1" * 64,
                          stdout_digest="2" * 64,
                          stderr_digest="3" * 64,
                          artifact_manifest_digest="4" * 64,
                          signature_scheme="EXTERNAL-DETACHED-V1",
                          signature="receipt-signature",
                      )
                      assert not receipt.is_verified(
                          verifier=None,
                          expected_capability_id=capability.capability_id,
                      )
                      assert receipt.is_verified(
                          verifier=lambda message, signature, executor: (
                              bool(message)
                              and signature == "receipt-signature"
                              and executor == capability.executor_id
                          ),
                          expected_capability_id=capability.capability_id,
                      )


                  def test_process_tree_and_output_budgets_fail_before_overrun() -> None:
                      budget = ExecutionBudget(
                          wall_time_seconds=30,
                          max_processes=2,
                          max_stdout_bytes=8,
                          max_stderr_bytes=8,
                          max_artifact_bytes=32,
                          max_memory_bytes=1024,
                      )
                      budget.admit_process_tree({{10, 11}})
                      with pytest.raises(ProcessTreeLimitExceeded):
                          budget.admit_process_tree({{10, 11, 12}})
                      output = BoundedOutputAccumulator(8)
                      output.append(b"1234")
                      output.append(b"5678")
                      with pytest.raises(OutputLimitExceeded):
                          output.append(b"9")
                      assert output.bytes() == b"12345678"


                  def test_concurrent_provenance_is_contiguous_and_tamper_evident(tmp_path) -> None:
                      ledger = ConcurrentProvenanceLedger(tmp_path / "execution-ledger.jsonl")
                      with ThreadPoolExecutor(max_workers=8) as pool:
                          events = list(
                              pool.map(
                                  lambda index: ledger.append("EXECUTION_EVENT", {{"index": index}}),
                                  range(24),
                              )
                          )
                      assert len(events) == 24
                      recorded = ledger.read()
                      ledger.verify(recorded)
                      assert [event.sequence for event in recorded] == list(range(24))

                      records = [
                          json.loads(line)
                          for line in ledger.path.read_text(encoding="utf-8").splitlines()
                      ]
                      records[3]["payload"]["index"] = 999
                      ledger.path.write_text(
                          "\\n".join(json.dumps(record) for record in records) + "\\n",
                          encoding="utf-8",
                      )
                      with pytest.raises(ProvenanceIntegrityError):
                          ledger.verify(ledger.read())
                  '''
              ),
              encoding='utf-8',
          )

          reports = Path('reports')
          reports.mkdir(exist_ok=True)
          (reports / 'EXECUTION_BOUNDARY_CONVERGENCE.json').write_text(
              json.dumps(
                  {
                      'schema_version': '1.0',
                      'package': package.name,
                      'signed_capability_required': True,
                      'signed_receipt_required': True,
                      'process_tree_limit': 'ENFORCED_BY_CONTRACT',
                      'stdout_stderr_limits': 'ENFORCED_BEFORE_OVERRUN',
                      'concurrent_provenance': 'HASH_CHAINED_AND_LOCKED',
                      'real_external_execution': 'NOT_VERIFIED',
                  },
                  indent=2,
                  sort_keys=True,
              )
              + '\n',
              encoding='utf-8',
          )
          PY

          rm -f \
            .github/workflows/remediation-scientific-quantity-acceptance.yml \
            .github/workflows/remediation-scientific-quantity-acceptance-v2.yml \
            .github/workflows/remediation-execution-boundary-v3.yml

      - name: Canonical formatting and deterministic evidence refresh
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format .
          python -m ruff check --fix .
          python - <<'PY'
          from pathlib import Path
          import subprocess

          tokens = ('manifest', 'quality', 'security', 'audit', 'evidence', 'checksum')
          for script in sorted(Path('scripts').glob('*.py')):
              if not any(token in script.name.casefold() for token in tokens):
                  continue
              probe = subprocess.run(
                  ['python', str(script), '--help'],
                  text=True,
                  capture_output=True,
              )
              help_text = probe.stdout + probe.stderr
              flag = '--write' if '--write' in help_text else None
              if flag is None and '--generate' in help_text:
                  flag = '--generate'
              if flag is not None:
                  subprocess.run(['python', str(script), flag], check=True)
          PY
          git add -A

      - name: Execute full deterministic qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m pytest -q -p hypothesis.extra.pytestplugin
          python -m ruff format --check .
          python -m ruff check .
          git diff --check

      - name: Verify exact bounded source tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -name 'remediation-*' -print -quit)"
          rg -n 'class ScientificQuantity' --glob 'scientific_quantity.py'
          rg -n 'class ExternalExecutionCapability' --glob 'execution_boundary.py'
          rg -n 'class ConcurrentProvenanceLedger' --glob 'execution_boundary.py'
          rg -n 'real_external_execution.*NOT_VERIFIED' reports/EXECUTION_BOUNDARY_CONVERGENCE.json

      - name: Commit exact review tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(execution): require signed bounded replayable runs"
          git push origin HEAD:remediation/ci-evidence-convergence
