name: Synchronize closure manifest

on:
  push:
    branches: [closure/20260828-hashing-readme]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-closure-manifest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: closure/20260828-hashing-readme
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Regenerate and commit deterministic manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sync-closure-manifest.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git add -A
          git diff --cached --check
          git config user.name 'SUNHAOJUN22'
          git config user.email '116634523+SUNHAOJUN22@users.noreply.github.com'
          git commit -m 'chore(evidence): refresh repository manifest'
          git push origin HEAD:closure/20260828-hashing-readme
