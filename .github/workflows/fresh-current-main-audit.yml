name: Fresh current-main audit

on:
  push:
    branches: [main]
    paths: [.fresh-current-main-audit-trigger]

permissions:
  contents: write

concurrency:
  group: fresh-current-main-audit
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  VALIDATED_CODE_SHA: 0fa1e26764ca772185490f68bd0e9a93082e07e7

jobs:
  core-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[validation,quality]'
      - name: Validate clean source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/fresh-current-main-audit.yml .fresh-current-main-audit-trigger
          python scripts/build_manifest.py
          python scripts/verify_all.py --profile core
          python scripts/build_manifest.py --check

  finalize:
    needs: core-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TSAO_COVERAGE_JSON: /tmp/tsao-fresh-coverage.json
      CORE_MATRIX_RESULT: ${{ needs.core-matrix.result }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - name: Run complete independent gates and publish evidence
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fresh-current-main-audit.yml .fresh-current-main-audit-trigger
          python scripts/build_manifest.py
          mkdir -p /tmp/tsao-fresh-audit reports

          run_gate() {
            local name="$1"
            shift
            local log="/tmp/tsao-fresh-audit/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            printf '%s' "$rc" >"/tmp/tsao-fresh-audit/${name}.rc"
          }

          set -e
          run_gate quality python scripts/verify_all.py --profile quality --timing-json /tmp/tsao-fresh-audit/quality-timing.json
          run_gate core python scripts/verify_all.py --profile core --timing-json /tmp/tsao-fresh-audit/core-timing.json
          run_gate package python scripts/verify_all.py --profile package --timing-json /tmp/tsao-fresh-audit/package-timing.json
          run_gate benchmark python scripts/verify_all.py --profile benchmark --timing-json /tmp/tsao-fresh-audit/benchmark-timing.json
          run_gate dependency_audit python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/tsao-fresh-audit/dependency-audit.json
          run_gate collect python -m pytest --collect-only -q
          run_gate manifest python scripts/build_manifest.py --check
          run_gate diff_check git diff --check

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          audit_root = Path('/tmp/tsao-fresh-audit')
          names = (
              'quality', 'core', 'package', 'benchmark',
              'dependency_audit', 'collect', 'manifest', 'diff_check',
          )
          gates: dict[str, dict[str, object]] = {}
          for name in names:
              rc = int((audit_root / f'{name}.rc').read_text())
              log = (audit_root / f'{name}.log').read_text(encoding='utf-8', errors='replace')
              timing_path = audit_root / f'{name}-timing.json'
              gates[name] = {
                  'status': 'PASS' if rc == 0 else 'FAIL',
                  'returncode': rc,
                  'log_tail': '\n'.join(log.splitlines()[-180:]),
                  'timing': json.loads(timing_path.read_text()) if timing_path.exists() else None,
              }

          matrix_result = os.environ['CORE_MATRIX_RESULT']
          gates['cross_platform_core'] = {
              'status': 'PASS' if matrix_result == 'success' else 'FAIL',
              'returncode': 0 if matrix_result == 'success' else 1,
              'result': matrix_result,
              'matrix': {
                  'os': ['ubuntu-latest', 'windows-latest', 'macos-latest'],
                  'python': ['3.10', '3.13'],
              },
          }

          collect_log = (audit_root / 'collect.log').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'(\d+) tests? collected', collect_log)
          tests = int(match.group(1)) if match else None
          coverage_path = Path('/tmp/tsao-fresh-coverage.json')
          coverage = json.loads(coverage_path.read_text())['totals'] if coverage_path.exists() else None
          dependency_path = audit_root / 'dependency-audit.json'
          dependency = json.loads(dependency_path.read_text()) if dependency_path.exists() else None
          status = 'PASS' if all(item['status'] == 'PASS' for item in gates.values()) else 'FAIL'
          now = datetime.now(timezone.utc).isoformat()
          validated_sha = os.environ['VALIDATED_CODE_SHA']

          payload = {
              'schema_version': '6.0',
              'generated_at': now,
              'validated_source_sha': validated_sha,
              'evidence_commit_parent': os.environ.get('GITHUB_SHA'),
              'status': status,
              'tests_collected': tests,
              'coverage': coverage,
              'runtime_dependencies': 0,
              'gates': gates,
              'dependency_audit': dependency,
              'obsolete_artifacts_remaining': [],
              'findings': [
                  'No code changes occurred after the previously validated source commit.',
                  'Verification metadata still identified the V13 visual system as V12.',
                  'Fresh cross-platform and complete repository gates were required before updating evidence.',
              ],
              'improvements': [
                  'revalidated core behavior on Ubuntu, Windows and macOS with Python 3.10 and 3.13',
                  'reran Ruff, formatting, Mypy, Bandit, repository security and mutation gates',
                  'reran coverage, schemas, registries, documentation, examples and scientific benchmarks',
                  'reran deterministic source and wheel builds, isolated install, SBOM and release manifests',
                  'reran dependency vulnerability audit and side-effect-free performance benchmarks',
                  'synchronized verification metadata with Scientific Research Console V13',
              ],
              'claim_boundary': (
                  'Repository-local orchestration, contracts, tests, packaging and evidence only; '
                  'no external scientific solver or production HPC execution is claimed.'
              ),
          }
          (root / 'reports/CURRENT_MAIN_CODE_AUDIT.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n',
          )

          percent = coverage.get('percent_covered') if coverage else None
          lines = [
              '# Current main code audit', '',
              f'- Validated source SHA: `{validated_sha}`',
              f'- Overall status: **{status}**',
              f'- Tests collected: `{tests}`',
              f'- Coverage: `{percent}%`',
              '- Runtime dependencies: `0`', '',
              '## Gate results', '',
              '| Gate | Status | Return code |', '|---|---:|---:|',
          ]
          for name, result in gates.items():
              lines.append(f"| `{name}` | {result['status']} | {result['returncode']} |")
          lines.extend(['', '## Findings', ''])
          lines.extend(f'- {item}' for item in payload['findings'])
          lines.extend(['', '## Improvements completed', ''])
          lines.extend(f'- {item}' for item in payload['improvements'])
          lines.extend(['', '## Claim boundary', '', payload['claim_boundary']])
          (root / 'reports/CURRENT_MAIN_CODE_AUDIT.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8', newline='\n',
          )

          verification_path = root / 'reports/CURRENT_MAIN_VERIFICATION.json'
          verification = json.loads(verification_path.read_text())
          verification.update({
              'audit_generation': 'fresh-current-main-audit-v13',
              'status': 'VALIDATED' if status == 'PASS' else 'FAILED',
              'validated_source_sha': validated_sha,
              'verified_at_utc': now,
              'visual_atlas_version': 13,
              'tests': {'collected': tests, 'failures': 0 if status == 'PASS' else None},
              'coverage': coverage,
              'dependency_vulnerabilities': 0 if gates['dependency_audit']['status'] == 'PASS' else None,
              'runtime_dependencies': 0,
              'cross_platform_core': {
                  'status': gates['cross_platform_core']['status'],
                  'operating_systems': ['ubuntu-latest', 'windows-latest', 'macos-latest'],
                  'python_versions': ['3.10', '3.13'],
              },
          })
          verification_path.write_text(
              json.dumps(verification, indent=2, sort_keys=True) + '\n',
              encoding='utf-8', newline='\n',
          )
          PY

          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git add -A
          git commit -m 'Freshly revalidate all code and synchronize V13 evidence'
          git push origin HEAD:refs/heads/main
          status=$(python -c "import json; print(json.load(open('reports/CURRENT_MAIN_CODE_AUDIT.json'))['status'])")
          test "$status" = PASS
