name: Certify mathematical performance V11 retry once

on:
  push:
    branches: [main]
    paths: [.certify-math-performance-v11-retry]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: certify-math-performance-v11-retry-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/math-v11-coverage.json
  ISSUE_NUMBER: '52'
  BASELINE_SHA: '4fe936e9446bebd81c0e7b1c1d5c3bd0e403f385'

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Initialize baseline and reapply measured candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=false" >> "$GITHUB_ENV"
          echo reapply > /tmp/math-v11-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/math-v11-baseline
          git worktree add --detach /tmp/math-v11-baseline "$BASELINE_SHA"
          git cherry-pick \
            9daf8564160be828224e7b76731828c6d878a6e6 \
            1eb2364b4e6af087b8e4b3721797d0aac8f8b569 \
            2d4be1274c8928c4c8e7cf3a61c935f49b22cbfb \
            0cc2d396ddb2d52da2a47a9a9bc8ff90bb412a26 \
            a9f8858ff1d67ed1a5e84c7c58741af65e09242f \
            c89d6317cfd8c33dc44acba06833a76b2789cdc9 \
            3902e1d3e0c3ed522e30ec735bfd9795daa74fb2
          rm -f .github/workflows/certify-math-performance-v11-retry-once.yml
          rm -f .certify-math-performance-v11-retry
          rm -f reports/MATH_PERFORMANCE_AUDIT_V11_FAILURE.json

      - name: Install and normalize candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo normalize > /tmp/math-v11-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix \
            tsao_computation/accelerators/planner.py \
            tsao_computation/registries/loader.py \
            tsao_computation/routing/router.py \
            tsao_computation/validation/scientific_benchmarks.py \
            scripts/run_math_performance_v11.py \
            tests/test_math_performance_v11.py
          python -m ruff format \
            tsao_computation/accelerators/planner.py \
            tsao_computation/registries/loader.py \
            tsao_computation/routing/router.py \
            tsao_computation/validation/scientific_benchmarks.py \
            scripts/run_math_performance_v11.py \
            tests/test_math_performance_v11.py
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Measure and require V11 acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          echo benchmark > /tmp/math-v11-stage
          python scripts/run_math_performance_v11.py --source-root /tmp/math-v11-baseline --output /tmp/v11-base.json >/dev/null
          python scripts/run_math_performance_v11.py --source-root . --output /tmp/v11-candidate.json >/dev/null
          python scripts/run_math_performance_v10.py --source-root /tmp/math-v11-baseline --output /tmp/v10-base.json >/dev/null
          python scripts/run_math_performance_v10.py --source-root . --output /tmp/v10-candidate.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('/tmp/v11-base.json').read_text())
          cand = json.loads(Path('/tmp/v11-candidate.json').read_text())
          v10b = json.loads(Path('/tmp/v10-base.json').read_text())
          v10c = json.loads(Path('/tmp/v10-candidate.json').read_text())
          speedups = {
              'preparsed_acceleration_plan': base['preparsed_acceleration_plan_seconds'] / cand['preparsed_acceleration_plan_seconds'],
              'mapping_acceleration_plan': base['mapping_acceleration_plan_seconds'] / cand['mapping_acceleration_plan_seconds'],
              'semantic_route_variants': base['semantic_route_variants_seconds'] / cand['semantic_route_variants_seconds'],
              'scientific_benchmarks': base['scientific_benchmarks_seconds'] / cand['scientific_benchmarks_seconds'],
              'v10_parser': v10c['parser_20mib_throughput_mib_s'] / v10b['parser_20mib_throughput_mib_s'],
              'v10_convergence': v10b['convergence_250k_seconds'] / v10c['convergence_250k_seconds'],
              'v10_uncertainty': v10b['uncertainty_seconds'] / v10c['uncertainty_seconds'],
          }
          semantics = all(
              left['benchmark_id'] == right['benchmark_id']
              and left['passed'] == right['passed']
              and left['expected'] == right['expected']
              and abs(left['observed'] - right['observed']) <= max(left['tolerance'], right['tolerance'], 1e-15)
              for left, right in zip(base['scientific_benchmarks'], cand['scientific_benchmarks'], strict=True)
          )
          acceptance = {
              'plan_equal': base['acceleration_plan'] == cand['acceleration_plan'],
              'preparsed_plan_speedup': speedups['preparsed_acceleration_plan'] >= 1.03,
              'mapping_plan_no_regression': speedups['mapping_acceleration_plan'] >= 0.97,
              'route_equal': base['semantic_route_workflows'] == cand['semantic_route_workflows'],
              'route_speedup': speedups['semantic_route_variants'] >= 2.0,
              'route_cache_collapsed': cand['semantic_route_cache_entries'] <= 4 and base['semantic_route_cache_entries'] >= 100,
              'benchmark_semantics': semantics,
              'benchmark_speedup': speedups['scientific_benchmarks'] >= 1.03,
              'benchmarks_pass': cand['scientific_benchmarks_passed'] == 8,
              'parser_no_regression': speedups['v10_parser'] >= 0.90,
              'convergence_no_regression': speedups['v10_convergence'] >= 0.90,
              'uncertainty_no_regression': speedups['v10_uncertainty'] >= 0.90,
              'finite_extreme_uncertainty': v10c['extreme_uncertainty_finite'] is True,
              'exact_compensated_balance': v10c['compensated_balance_residual'] == -1.0,
          }
          report = {
              'schema_version': '1.0',
              'audit_generation': 'math-performance-audit-v11',
              'baseline_sha': '4fe936e9446bebd81c0e7b1c1d5c3bd0e403f385',
              'baseline': base,
              'candidate': cand,
              'v10_baseline': v10b,
              'v10_candidate': v10c,
              'speedups': speedups,
              'acceptance': acceptance,
              'status': 'PASS' if all(acceptance.values()) else 'FAIL',
              'claim_boundary': 'Repository-local Python planning, routing and deterministic benchmark kernels only; no external solver, GPU kernel or production-HPC speedup is claimed.',
          }
          Path('/tmp/math-v11.json').write_text(json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + '\n')
          print(json.dumps(report, indent=2, sort_keys=True))
          if report['status'] != 'PASS':
              raise SystemExit([key for key, value in acceptance.items() if not value])
          PY

      - name: Run corrected targeted and full gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/math-v11-stage
          python -m pytest -q \
            tests/test_math_performance_v11.py \
            tests/test_math_performance_v10.py \
            tests/test_core.py \
            tests/test_extended.py \
            tests/test_performance_optimizations.py \
            tests/test_performance_v9.py \
            tests/test_scientific_benchmarks.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/run_tests.py --coverage | tee /tmp/math-v11-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/math-v11-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/math-v11-benchmark.json
          python scripts/verify_native_core.py > /tmp/math-v11-native.json
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/math-v11-dependencies.json
          rm -rf /tmp/math-v11-build /tmp/math-v11-venv
          python -m build --outdir /tmp/math-v11-build
          python -m venv /tmp/math-v11-venv
          /tmp/math-v11-venv/bin/python -m pip install --no-deps /tmp/math-v11-build/*.whl
          /tmp/math-v11-venv/bin/python -c 'import tsao_computation; print(tsao_computation.__version__)'
          python -m pytest -q | tee /tmp/math-v11-final-pytest.log
          git ls-remote --heads origin | sort > /tmp/math-v11-heads.txt
          test "$(awk '{print $2}' /tmp/math-v11-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Write evidence and validate exact tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/math-v11-stage
          python scripts/update_main_audit_evidence.py \
            --root . --run-id "$GITHUB_RUN_ID" --issue "$ISSUE_NUMBER" \
            --test-log /tmp/math-v11-final-pytest.log \
            --coverage-json /tmp/math-v11-coverage.json \
            --dependency-json /tmp/math-v11-dependencies.json \
            --security-json evidence/security-scan.json \
            --remote-heads /tmp/math-v11-heads.txt \
            --parent-commit "$ORIGINAL_SHA" \
            --audit-generation math-performance-audit-v11 \
            --audit-label V11-math-performance \
            --visual-count 42 --visual-atlas-version 13 \
            --report-path reports/ULTIMATE_CODE_QUALITY_FINALIZATION.md \
            --visual-families 'Electronic structure and molecular simulation; materials and interfaces; continuum and process engineering; evidence governance and HPC.'
          cp /tmp/math-v11.json reports/MATH_PERFORMANCE_AUDIT_V11.json
          python - <<'PY'
          import json, re, textwrap
          from pathlib import Path
          report = json.loads(Path('/tmp/math-v11.json').read_text())
          s = report['speedups']
          before = report['baseline']['semantic_route_cache_entries']
          after = report['candidate']['semantic_route_cache_entries']
          blocks = {
              'README.md': textwrap.dedent(f'''\
              <!-- MATH_PERFORMANCE_V11:START -->
              ### Mathematical correctness and performance V11

              A second-pass audit cached static acceleration-profile parsing, normalized semantically equivalent routing cache keys, and hoisted invariant arithmetic from the deterministic Poiseuille, RK4 and velocity-Verlet benchmark loops. Numerical methods, tolerances and scientific acceptance remain unchanged.

              Isolated same-host results versus V10: pre-parsed acceleration planning **{s['preparsed_acceleration_plan']:.2f}×**, semantic route variants **{s['semantic_route_variants']:.2f}×**, and the eight-benchmark suite **{s['scientific_benchmarks']:.2f}×**. Equivalent route inputs use **{after}** cached decision instead of **{before}** entries. Mapping planning, parser, convergence and uncertainty kernels remained within no-material-regression limits. These figures cover repository-local Python kernels only.

              Machine evidence: [`reports/MATH_PERFORMANCE_AUDIT_V11.json`](reports/MATH_PERFORMANCE_AUDIT_V11.json).
              <!-- MATH_PERFORMANCE_V11:END -->''').strip(),
              'README.zh-CN.md': textwrap.dedent(f'''\
              <!-- MATH_PERFORMANCE_V11:START -->
              ### 数理正确性与性能 V11

              第二轮审计缓存了静态加速配置解析，统一了语义等价问题的路由缓存键，并将 Poiseuille、RK4 与 velocity-Verlet 确定性基准循环中的不变量移出热点循环。数值方法、容差和科学验收标准均未改变。

              相对于 V10 的隔离同机结果：预解析请求的加速规划 **{s['preparsed_acceleration_plan']:.2f}×**、语义等价路由输入 **{s['semantic_route_variants']:.2f}×**、8 项科学基准套件 **{s['scientific_benchmarks']:.2f}×**。等价路由输入由 **{before}** 个缓存条目收敛为 **{after}** 个。映射式规划、解析器、收敛判定与不确定度内核均满足无实质回退门槛。上述结果仅针对仓库内 Python 内核。

              机器证据：[`reports/MATH_PERFORMANCE_AUDIT_V11.json`](reports/MATH_PERFORMANCE_AUDIT_V11.json)。
              <!-- MATH_PERFORMANCE_V11:END -->''').strip(),
          }
          pattern = re.compile(r'<!-- MATH_PERFORMANCE_V11:START -->.*?<!-- MATH_PERFORMANCE_V11:END -->', re.DOTALL)
          for filename, block in blocks.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = pattern.sub(block, text, count=1) if pattern.search(text) else text.rstrip() + '\n\n' + block + '\n'
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/sync_version_metadata.py --check
          python scripts/regenerate_readme_visuals_v13.py --check
          python scripts/validate_schemas.py
          python scripts/validate_adapter_metadata.py
          python scripts/validate_repository.py
          python scripts/verify_all.py --profile all --timing-json /tmp/math-v11-final-all.json
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python -m pytest -q
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflows[*]}" = "${expected[*]}"

      - name: Commit and require production workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production > /tmp/math-v11-stage
          git add -A
          git commit -m 'Improve mathematical performance V11'
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=true" >> "$GITHUB_ENV"
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
          : > /tmp/math-v11-production.txt
          wait_for_workflow() {
            local workflow="$1" line status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json headSha,status,conclusion,url --jq ".[] | select(.headSha == \"$FINAL_SHA\") | [.status,.conclusion,.url] | @tsv" | head -n1)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  [[ "$conclusion" == success ]]
                  printf '%s: %s\n' "$workflow" "$url" >> /tmp/math-v11-production.txt
                  return
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for_workflow ci.yml
          wait_for_workflow codeql.yml
          wait_for_workflow scorecard.yml

      - name: Close successful audit
        shell: bash
        run: |
          summary="$(python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/MATH_PERFORMANCE_AUDIT_V11.json').read_text())
          s=r['speedups']; b=r['baseline']['semantic_route_cache_entries']; c=r['candidate']['semantic_route_cache_entries']
          print(f"planning {s['preparsed_acceleration_plan']:.2f}x; routing {s['semantic_route_variants']:.2f}x and cache {b}->{c}; benchmarks {s['scientific_benchmarks']:.2f}x")
          PY
          )"
          runs="$(cat /tmp/math-v11-production.txt)"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment "V11 passed on commit \`$FINAL_SHA\`: $summary. Complete correctness, coverage, security, dependency, package/Wheel, Manifest and production workflow gates passed. Production runs:\n$runs\nNo branch or PR was created."

      - name: Fail closed and restore V10
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/math-v11-stage 2>/dev/null || echo unknown)"
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/certify-math-performance-v11-retry-once.yml .certify-math-performance-v11-retry
          git checkout "$BASELINE_SHA" -- tsao_computation/accelerators/planner.py tsao_computation/registries/loader.py tsao_computation/routing/router.py tsao_computation/validation/scientific_benchmarks.py README.md README.zh-CN.md reports/CURRENT_MAIN_VERIFICATION.json reports/ULTIMATE_CODE_QUALITY_FINALIZATION.md evidence/security-scan.json
          rm -f scripts/run_math_performance_v11.py tests/test_math_performance_v11.py reports/MATH_PERFORMANCE_AUDIT_V11.json
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Revert V11 retry at $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "V11 retry failed at stage: $stage. Actions run: $GITHUB_RUN_ID. Candidate restored to V10; no branch or PR was created." || true
          exit 1
