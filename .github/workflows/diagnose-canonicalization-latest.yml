name: Diagnose latest canonicalization failure

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  diagnose:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_DIAGNOSE_CANONICALIZATION_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Remove diagnostic workflow and synchronize Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/diagnose-canonicalization-latest.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed canonicalization diagnostic workflow'
          git push origin HEAD:refs/heads/main

      - name: Find latest failed canonicalization run
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow canonicalize-generated-text.yml --limit 10 \
            --json databaseId,conclusion,createdAt \
            --jq '[.[] | select(.conclusion == "failure")] | sort_by(.createdAt) | last | .databaseId // empty')"
          test -n "$RUN_ID"
          echo "$RUN_ID" > /tmp/canonical-run-id
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > /tmp/canonical-failed.log 2>&1

      - name: Publish concise failure tail
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID="$(cat /tmp/canonical-run-id)"
          {
            echo "Latest canonicalization failure: \`$RUN_ID\`"
            echo
            echo '```text'
            tail -n 90 /tmp/canonical-failed.log | tr -d '\r' | tail -c 18000
            echo '```'
          } > /tmp/canonical-diagnostic.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/canonical-diagnostic.md
