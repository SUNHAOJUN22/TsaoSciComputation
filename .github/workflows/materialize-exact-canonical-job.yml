name: Materialize exact canonical job failure

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_EXACT_CANONICAL_JOB_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: '89713170543'
      SOURCE_RUN_ID: '30171445114'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Capture exact failed job tail
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run view --repo "$GITHUB_REPOSITORY" --job "$JOB_ID" --log \
            > /tmp/exact-canonical-job.log 2>&1
          {
            echo "canonicalization_run_id=$SOURCE_RUN_ID"
            echo "job_id=$JOB_ID"
            echo "captured_by_run_id=$GITHUB_RUN_ID"
            echo
            tail -n 160 /tmp/exact-canonical-job.log | tr -d '\r' | tail -c 28000
          } > reports/CANONICALIZATION_FAILURE_DIAGNOSIS.txt

      - name: Self-clean and commit exact diagnosis
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/materialize-exact-canonical-job.yml
          rm -f .github/workflows/materialize-real-canonical-failure.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize exact canonicalization job diagnosis'
          git push origin HEAD:refs/heads/main
