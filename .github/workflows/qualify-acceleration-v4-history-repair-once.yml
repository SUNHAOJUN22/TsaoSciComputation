name: Qualify acceleration V4 from verified history once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: qualify-acceleration-v4-history-repair-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_ACCELERATION_V4_HISTORY_REPAIR_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out complete current-main history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, repair, and verify the authorized archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import subprocess
          from pathlib import Path

          ALPHABET = b"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="

          def historical(message: str, path: str) -> bytes:
              commit = subprocess.check_output(
                  [
                      "git",
                      "log",
                      "--all",
                      "--format=%H",
                      "--fixed-strings",
                      f"--grep={message}",
                      "-1",
                  ],
                  text=True,
              ).strip()
              if not commit:
                  raise SystemExit(f"historical transport commit not found: {message}")
              data = subprocess.check_output(["git", "show", f"{commit}:{path}"])
              return data.replace(b"\n", b"").replace(b"\r", b"")

          def digest(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def repair_single_edit(data: bytes, expected: str, label: str) -> bytes:
              if digest(data) == expected:
                  return data
              for index, original in enumerate(data):
                  prefix = data[:index]
                  suffix = data[index + 1 :]
                  for candidate in ALPHABET:
                      if candidate == original:
                          continue
                      attempt = prefix + bytes((candidate,)) + suffix
                      if digest(attempt) == expected:
                          print(f"repaired {label}: substitution at {index}")
                          return attempt
              for index in range(len(data) + 1):
                  prefix = data[:index]
                  suffix = data[index:]
                  for candidate in ALPHABET:
                      attempt = prefix + bytes((candidate,)) + suffix
                      if digest(attempt) == expected:
                          print(f"repaired {label}: insertion at {index}")
                          return attempt
              for index in range(len(data)):
                  attempt = data[:index] + data[index + 1 :]
                  if digest(attempt) == expected:
                      print(f"repaired {label}: deletion at {index}")
                      return attempt
              raise SystemExit(
                  f"{label} cannot be repaired as one Base64-character edit; "
                  f"observed={digest(data)} expected={expected} bytes={len(data)}"
              )

          part_hashes = [
              "b71204a99c44ed24885d4cdf44409f9d8d621e74aeb1874dc762a8501167a7f3",
              "9685eaac71ead7a3d7dc8b5c8f3d0482fc443f20dce3de369d79f85718c20103",
              "a6312eab34672add88e93662635e7929860d5a7bd9fc82d891efa07e7ffe20a9",
              "5b9b6362fd5a616c893032c9b7256be38a722ffd68e9ac4d5742fcef5239797f",
              "3cc63ead38ce476d9e0c592a4b3e404018ad21cdad0e5797df755dfa44c9cee9",
              "339f27e69689d0c116a1d66ee895bcc8690ee1ca4086c3b5244f67d597055723",
              "60e42e5f04a4188547bab91bab0009a6ea5f28383c874ece666a96b3ac0de266",
              "ec322aaba6b19007541e3fe54dbac32b443c30b866dafd9b6788a6ff97d277b6",
          ]
          repair_parts: list[bytes] = []
          for index, expected in enumerate(part_hashes):
              data = historical(
                  f"Add V4 retry2 repair part {index:02d} [skip ci]",
                  f".github/payloads/acceleration-v4-retry2/part-{index:02d}",
              )
              repair_parts.append(
                  repair_single_edit(data, expected, f"big-01-05 part-{index:02d}")
              )
          big_01_05 = b"".join(repair_parts)
          expected_01_05 = "c00eb7679dbccb2963fe53bfe10a0423b0a8d0d25a5abfe01e3c19ed866d0137"
          if digest(big_01_05) != expected_01_05:
              raise SystemExit(f"repaired big-01-05 digest mismatch: {digest(big_01_05)}")

          subchunk_hashes = [
              "f5c73721a4434dc02792a144a91c135f4cdfec665598c54660e429e89edc53ec",
              "72961a7624a3986d99da8f112058953002d77453158c387d086436a188b79de5",
              "fc6e4c0dc9731ffa08c7b0e2e378a3a7dc2b0448dc6fc533193ac8a19ece7a05",
              "3fffb8576e7e14946f0fb8bcf0b202752527e09350a3f572727e155b7e395062",
              "539cef12869f325a75e91b1c2721565713fbabab2e5e6dabebd98a2fa91af77f",
              expected_01_05,
              "439d29a838a250308798305b7a22541208bf6c2a5afe9cb3e3a98c17191b749e",
              "7ffbb03d3bcaa5643393e9479d471db579a7488f0bcb61dd0ff099e1c0fb3277",
          ]
          big_01_parts: list[bytes] = []
          for index, expected in enumerate(subchunk_hashes):
              if index == 5:
                  data = big_01_05
              else:
                  data = historical(
                      f"Add corrected acceleration V4 chunk 01-{index:02d} [skip ci]",
                      f".github/payloads/acceleration-v4-retry/big-01-{index:02d}",
                  )
                  data = repair_single_edit(data, expected, f"big-01-{index:02d}")
              big_01_parts.append(data)
          big_01 = b"".join(big_01_parts)
          expected_big_01 = "7d586deac7d6398404acc2bfeb216ff64dabd87b6e47f068cee01146f40bdafd"
          if digest(big_01) != expected_big_01:
              raise SystemExit(f"big-01 digest mismatch: {digest(big_01)}")

          big_hashes = [
              "1ad93a15587d197c1b12e6eba02a6d5c73189eff77d19cc9338a6b540342b9c6",
              expected_big_01,
              "f5f0d024f37950a1b1047db0ba60ce062eab21faa7bfdf31c418f96f84e7b277",
              "01a45d294049b225d03f2a5ac70d096a1ad04d61ba47fc9e6f47668953c9a855",
              "162604a01fbbd501ca6d0635806e0b3f742d9605dbfdf3ae5bc00758df1b3417",
              "f6dd42793702b551c9095620d6ef8316619598250006e8c9e8ac136624f02cd9",
              "99c29d2390efa107aa6f931b45eba651c30d77b017e999982f1d219f1694e282",
              "ce311e20d02a7a7d3adcc8edad28e1a90a95ef88b5ee15720821ee238d886999",
          ]
          big_parts: list[bytes] = []
          for index, expected in enumerate(big_hashes):
              if index == 1:
                  data = big_01
              else:
                  data = historical(
                      f"Add acceleration V4 payload big part {index:02d} [skip ci]",
                      f".github/payloads/acceleration-v4/big-{index:02d}",
                  )
                  data = repair_single_edit(data, expected, f"big-{index:02d}")
              big_parts.append(data)

          encoded = b"".join(big_parts)
          expected_encoded = "5cb37164c7b932d8dc149d5bd0f36f22fe87e794995946b60411e416f08dd043"
          if digest(encoded) != expected_encoded:
              raise SystemExit(f"encoded payload digest mismatch: {digest(encoded)}")
          archive = base64.b64decode(encoded, validate=True)
          expected_archive = "d7e3fd0c054ed99ff6bb6b0d3ffeb04007044ac81b6cf4a81034b86467f5a84f"
          if digest(archive) != expected_archive:
              raise SystemExit(f"archive digest mismatch: {digest(archive)}")
          Path("/tmp/acceleration-v4.tar.gz").write_bytes(archive)
          print(
              f"validated V4 archive: encoded_bytes={len(encoded)} "
              f"archive_bytes={len(archive)}"
          )
          PY

      - name: Apply delta and remove all temporary transport
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -xzf /tmp/acceleration-v4.tar.gz -C .
          rm -rf .github/payloads/acceleration-v4-retry2
          rm -f .github/workflows/qualify-acceleration-v4-history-repair-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete validation toolchain
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonicalize generated evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run complete deterministic release qualification
        run: python scripts/verify_all.py --profile all

      - name: Verify native C ABI and Python bridge
        run: python scripts/verify_native_core.py

      - name: Smoke-test runtime workload profiling
        run: python scripts/profile_workloads.py --quick --output "$RUNNER_TEMP/acceleration-v4-profile.json"

      - name: Prepare exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
          python -m pytest -q tests/test_acceleration_qualification_v4.py tests/test_acceleration_batch.py
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          git diff --check

      - name: Publish directly to main
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add acceleration qualification V4 and resource-aware execution'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close qualification issue
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Acceleration Qualification V4 was published directly to main as ${{ steps.publish.outputs.sha }} after complete history repair, integrity, quality, security, tests, coverage, package, native and profiling gates passed. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove workflow after failure
        if: failure()
        shell: bash
        run: |
          set +e
          git fetch origin main
          git checkout -B cleanup origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/qualify-acceleration-v4-history-repair-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove failed acceleration V4 history qualification [skip ci]'
            git push origin HEAD:refs/heads/main
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Acceleration Qualification V4 history reconstruction failed; no product commit was published. The one-time workflow was removed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
