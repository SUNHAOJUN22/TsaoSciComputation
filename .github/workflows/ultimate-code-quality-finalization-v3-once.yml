name: Ultimate code quality finalization v3 once

on:
  push:
    branches: [main]
    paths: [.run-ultimate-code-quality-finalization-v3]

permissions:
  actions: read
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/ultimate-v3-coverage.json
  ISSUE_NUMBER: '40'

concurrency:
  group: ultimate-code-quality-finalization-v3-main
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Initialize clean candidate tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=false" >> "$GITHUB_ENV"
          echo initialize > /tmp/ultimate-v3-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ultimate-code-quality-finalization-v3-once.yml
          rm -f .run-ultimate-code-quality-finalization-v3
          rm -f reports/ULTIMATE_FINALIZATION_FAILURE.json

      - name: Install full validation environment
        shell: bash
        run: |
          set -Eeuo pipefail
          echo install > /tmp/ultimate-v3-stage
          python -m pip install -e '.[validation,quality,security]'

      - name: Repair static quality and synchronize all generated content
        shell: bash
        run: |
          set -Eeuo pipefail
          echo static-and-generated > /tmp/ultimate-v3-stage
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/regenerate_readme_visuals_v13.py
          python scripts/sync_package_assets.py
          python scripts/build_adapter_docs.py
          python scripts/build_workflow_docs.py
          python scripts/build_examples.py
          python scripts/build_manifest.py
          python scripts/regenerate_readme_visuals_v13.py --check

      - name: Run tests coverage deterministic benchmark and native gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo deterministic-gates > /tmp/ultimate-v3-stage
          python scripts/run_tests.py --coverage | tee /tmp/ultimate-v3-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/ultimate-v3-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/ultimate-v3-benchmark.json
          python scripts/verify_native_core.py > /tmp/ultimate-v3-native.json

      - name: Run security dependency package Wheel and final pytest gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo independent-gates > /tmp/ultimate-v3-stage
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/ultimate-v3-dependencies.json
          rm -rf /tmp/ultimate-v3-build /tmp/ultimate-v3-venv
          python -m build --outdir /tmp/ultimate-v3-build
          python -m venv /tmp/ultimate-v3-venv
          /tmp/ultimate-v3-venv/bin/python -m pip install --no-deps /tmp/ultimate-v3-build/*.whl
          /tmp/ultimate-v3-venv/bin/python -c 'import tsao_computation; print(tsao_computation.__version__)'
          python -m pytest -q | tee /tmp/ultimate-v3-final-pytest.log
          git ls-remote --heads origin | sort > /tmp/ultimate-v3-remote-heads.txt
          test "$(awk '{print $2}' /tmp/ultimate-v3-remote-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Update README and machine-readable evidence from measured results
        shell: bash
        run: |
          set -Eeuo pipefail
          echo readme-and-evidence > /tmp/ultimate-v3-stage
          python scripts/update_main_audit_evidence.py \
            --root . \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$ISSUE_NUMBER" \
            --test-log /tmp/ultimate-v3-final-pytest.log \
            --coverage-json /tmp/ultimate-v3-coverage.json \
            --dependency-json /tmp/ultimate-v3-dependencies.json \
            --security-json evidence/security-scan.json \
            --remote-heads /tmp/ultimate-v3-remote-heads.txt \
            --parent-commit "$ORIGINAL_SHA" \
            --audit-generation ultimate-code-quality-finalization-v3 \
            --audit-label V13-final \
            --visual-count 42 \
            --visual-atlas-version 13 \
            --report-path reports/ULTIMATE_CODE_QUALITY_FINALIZATION.md \
            --visual-families 'Electronic structure and molecular simulation; materials and interfaces; continuum and process engineering; evidence governance and HPC.'
          python scripts/build_manifest.py

      - name: Validate exact final candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo final-candidate > /tmp/ultimate-v3-stage
          python scripts/sync_version_metadata.py --check
          python scripts/regenerate_readme_visuals_v13.py --check
          python scripts/validate_schemas.py
          python scripts/validate_adapter_metadata.py
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python scripts/verify_all.py --profile all --timing-json /tmp/ultimate-v3-final-all.json
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python -m pytest -q
          test "$(find assets/visuals -maxdepth 1 -type f -name '*.svg' | wc -l)" -eq 42
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflows[*]}" = "${expected[*]}"

      - name: Commit verified final state to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/ultimate-v3-stage
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m 'Ultimate code quality finalization'
          else
            git commit -m 'Ultimate code quality finalization'
          fi
          git push origin HEAD:refs/heads/main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=true" >> "$GITHUB_ENV"

      - name: Require production CI CodeQL and Scorecard
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production-ci > /tmp/ultimate-v3-stage
          wait_for_workflow() {
            local workflow="$1"
            local line run_id status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$FINAL_SHA" \
                --workflow "$workflow" --limit 1 \
                --json databaseId,status,conclusion,url \
                --jq '.[0] | [.databaseId,.status,.conclusion,.url] | @tsv' 2>/dev/null || true)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r run_id status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  echo "$workflow: $conclusion ($url)"
                  [[ "$conclusion" == success ]]
                  return
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for_workflow ci.yml
          wait_for_workflow codeql.yml
          wait_for_workflow scorecard.yml

      - name: Close final audit issue
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "All code, test, coverage, security, dependency, package, Wheel, Manifest, README, 42-SVG, main-only branch, production CI, CodeQL and OpenSSF Scorecard checks passed on $FINAL_SHA. No branch or pull request was created."

      - name: Record exact failure and remove temporary automation
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/ultimate-v3-stage 2>/dev/null || echo unknown)"
          if [[ "$FINAL_PUSHED" != true ]]; then
            git reset --hard "$ORIGINAL_SHA"
            rm -f .github/workflows/ultimate-code-quality-finalization-v3-once.yml
            rm -f .run-ultimate-code-quality-finalization-v3
            mkdir -p reports
            python - "$stage" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          from pathlib import Path
          stage,run_id=sys.argv[1],int(sys.argv[2])
          Path('reports/ULTIMATE_FINALIZATION_FAILURE.json').write_text(
              json.dumps({
                  'schema_version':'1.0','status':'FAILED','stage':stage,'run_id':run_id,
                  'branch':'main','temporary_branch_created':False,
                  'created_at_utc':datetime.now(timezone.utc).isoformat(),
              },indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          PY
            python scripts/build_manifest.py || true
            git add -A
            git commit -m "Record ultimate finalization failure at $stage" || true
            git push origin HEAD:refs/heads/main || true
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Finalization failed at stage $stage in Actions run $GITHUB_RUN_ID. No branch or PR was created. Temporary automation was removed." || true
          exit 1
