name: Temporary PR196 coverage diagnostics

on:
  push:
    branches:
      - closure/final-debug-readme-20260901

permissions:
  contents: read

concurrency:
  group: scicomputation-pr196-coverage-debug
  cancel-in-progress: true

jobs:
  coverage-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: closure/final-debug-readme-20260901
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: pip

      - name: Remove diagnostic workflow from the tested index
        run: git rm .github/workflows/temporary-pr196-coverage-debug.yml

      - name: Install validation stack
        run: python -m pip install -e '.[validation,quality]'

      - name: Produce branch-level coverage diagnostics
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage report -m
          python -m coverage json -o /tmp/coverage.json

      - name: Print approval-boundary coverage details
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/coverage.json').read_text(encoding='utf-8'))
          for path, details in sorted(report['files'].items()):
              if path.endswith(('approval_attestation.py', 'acceptance.py')):
                  print(path)
                  print('missing_lines=', details['missing_lines'])
                  print('missing_branches=', details.get('missing_branches', []))
                  print('summary=', details['summary'])
