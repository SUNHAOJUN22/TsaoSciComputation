name: One-time source-bound evidence finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tsao-computation-acceptance-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/final-acceptance-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/final-acceptance-20260807
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Restore permanent workflow, repair lint, and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/acceptance-evidence-regenerate.trigger
          rm -f .github/workflows/one-time-regenerate-acceptance-evidence.yml
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/final_acceptance_preflight.py')
          text = path.read_text(encoding='utf-8')
          if 'from contextlib import suppress' not in text:
              text = text.replace('import xml.etree.ElementTree as ET\n', 'import xml.etree.ElementTree as ET\nfrom contextlib import suppress\n', 1)
          old = '''    finally:\n        try:\n            sys.path.remove(str(root))\n        except ValueError:\n            pass\n'''
          new = '''    finally:\n        with suppress(ValueError):\n            sys.path.remove(str(root))\n'''
          if old not in text:
              raise SystemExit('expected Ruff SIM105 block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate and qualify exact source-bound evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[validation,quality,security]'
          python scripts/build_acceleration_audits.py
          python scripts/build_manifest.py
          python scripts/final_acceptance_preflight.py --root . --json
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
      - name: Publish exact final acceptance tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close lint and regenerate exact source-bound evidence'
          git push origin HEAD:agent/final-acceptance-20260807
