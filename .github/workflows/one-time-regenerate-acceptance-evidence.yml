name: Temporary source-bound evidence finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tsao-computation-acceptance-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/final-acceptance-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/final-acceptance-20260807
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Restore permanent workflow and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/acceptance-evidence-regenerate.trigger
          rm -f .github/workflows/one-time-regenerate-acceptance-evidence.yml
      - name: Regenerate and qualify exact source-bound evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[validation,quality,security]'
          python scripts/build_acceleration_audits.py
          python scripts/final_acceptance_preflight.py --root . --json
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
      - name: Publish exact final acceptance tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate exact source-bound acceleration evidence'
          git push origin HEAD:agent/final-acceptance-20260807
