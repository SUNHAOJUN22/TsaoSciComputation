name: Apply targeted Ruff formatting remediation

on:
  push:
    branches: [main]
    paths: [.apply-audit-format-remediation-trigger]

permissions:
  contents: write

concurrency:
  group: apply-audit-format-remediation-main
  cancel-in-progress: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - name: Format targeted files and rerun complete gates
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-audit-format-remediation.yml \
            .apply-audit-format-remediation-trigger
          python -m ruff format \
            scripts/install_skill.py scripts/validate_skill_spec.py scripts/quality_check.py \
            tests/test_install_skill.py tests/test_skill_spec_and_workflow_security.py
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          rm -f reports/CURRENT_RELEASE_GATE_DIAGNOSTIC.json \
            reports/ULTIMATE_SKILL_REPOSITORY_AUDIT_V1_BLOCKED.json
          python scripts/build_manifest.py
          python scripts/verify_all.py --profile all
          python scripts/verify_all.py --profile benchmark
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git diff --check
          git add -A
          git commit -m 'Apply targeted Ruff formatting remediation'
          git push origin HEAD:refs/heads/main
