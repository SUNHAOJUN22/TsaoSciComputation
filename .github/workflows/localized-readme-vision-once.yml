name: One-time localized README vision finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/localized-readme-vision.py

permissions:
  contents: write

concurrency:
  group: localized-readme-vision-scicomputation
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Generate localized diagrams, patch READMEs and refresh manifests
        run: |
          python .github/localized-readme-vision.py
          python scripts/build_acceleration_audits.py
          python scripts/build_manifest.py
          git diff --check
      - name: Remove one-time transport and publish
        run: |
          rm -f .github/localized-readme-vision.py
          rm -f .github/workflows/localized-readme-vision-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: add localized Chinese and English project vision'
          git push origin HEAD:main
