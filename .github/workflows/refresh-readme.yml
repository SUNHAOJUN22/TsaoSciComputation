name: Refresh README and verify main

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-readme-main
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == 'Refresh README and verify main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Rewrite README files
        shell: bash
        run: |
          set -Eeuo pipefail
          echo rewrite-readme > /tmp/readme-stage
          python - <<'PY'
          import base64
          from pathlib import Path

          Path('README.md').write_bytes(base64.b64decode('PGRpdiBhbGlnbj0iY2VudGVyIj4KCiMgVHNhb1NjaUNvbXB1dGF0aW9uCgoqKkV2aWRlbmNlLWJvdW5kIHNjaWVudGlmaWMtY29tcHV0YXRpb24gb3JjaGVzdHJhdGlvbiBmcm9tIGVsZWN0cm9ucyB0byBwcm9jZXNzZXMuKioKCiFb_'))
          Path('README.zh-CN.md').write_bytes(base64.b64decode(' '))
          PY
          rm -f .github/workflows/refresh-readme.yml
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check

      - name: Run complete deterministic gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo install > /tmp/readme-stage
          python -m pip install -e '.[validation,quality,security]'
          echo verify-all > /tmp/readme-stage
          python scripts/verify_all.py --profile all
          echo benchmark > /tmp/readme-stage
          python scripts/verify_all.py --profile benchmark
          echo final-tests > /tmp/readme-stage
          python -m pytest -q
          echo single-main > /tmp/readme-stage
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main

      - name: Commit verified README refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/readme-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md manifest.json
          git diff --cached --quiet && { echo 'README is already current'; exit 0; }
          git commit -m 'Simplify README and refresh verification guidance'
          git push origin HEAD:refs/heads/main
          echo success > /tmp/readme-stage
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "README refresh passed the complete deterministic gates, benchmark telemetry, final pytest run, Manifest checks, and single-main verification. Run ID: $GITHUB_RUN_ID. Commit: $(git rev-parse HEAD). No branch was created."

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          STAGE="$(cat /tmp/readme-stage 2>/dev/null || echo unknown)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "README refresh failed at stage: $STAGE. Run ID: $GITHUB_RUN_ID. No successful verification is being claimed." || true
