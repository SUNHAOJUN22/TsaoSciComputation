name: Filter final Windows CI failure

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  diagnose:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_FILTER_FINAL_WINDOWS_CI_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      SOURCE_RUN_ID: '30170721551'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Remove collector and synchronize final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/filter-final-windows-ci.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed final Windows CI filter'
          git push origin HEAD:refs/heads/main

      - name: Publish concise failure diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > /tmp/final-windows-ci.log 2>&1
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/final-windows-ci.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()
          keywords = (
              'failed', 'failure', 'error', 'not synchronized', 'is missing',
              'manifest', 'capability index', 'adapter documentation',
              'workflow documentation', 'scenario examples', 'repository audit',
              'traceback', 'assertion', 'exit code', 'problems', 'expected',
          )
          selected: list[str] = []
          for index, line in enumerate(source):
              lower = line.lower()
              if any(keyword in lower for keyword in keywords):
                  start = max(0, index - 2)
                  end = min(len(source), index + 4)
                  selected.extend(source[start:end])
          deduplicated: list[str] = []
          seen: set[str] = set()
          for line in selected:
              if line not in seen:
                  seen.add(line)
                  deduplicated.append(line)
          Path('/tmp/final-windows-ci-filtered.log').write_text(
              '\n'.join(deduplicated[-220:]) + '\n', encoding='utf-8'
          )
          PY
          {
            echo "Concise final Windows CI diagnostics from run \`$SOURCE_RUN_ID\`:"
            echo
            echo '```text'
            cat /tmp/final-windows-ci-filtered.log | tr -d '\r' | tail -c 26000
            echo '```'
          } > /tmp/final-windows-ci-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/final-windows-ci-comment.md
