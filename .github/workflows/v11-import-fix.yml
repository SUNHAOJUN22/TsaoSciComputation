name: V11 direct-execution import repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-import-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: true
      - name: Repair import and re-trigger V11
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/regenerate_readme_visuals_v11.py')
          text = path.read_text(encoding='utf-8')
          old = '''from scripts.regenerate_readme_visuals_v10 import (
              ROOT,
              TOKENS,
              VISUAL_ROOT,
              VisualSpec,
              parse_specs,
              stage_glyph,
              wrap_words,
          )
          '''
          new = '''try:
              from scripts.regenerate_readme_visuals_v10 import (
                  ROOT,
                  TOKENS,
                  VISUAL_ROOT,
                  VisualSpec,
                  parse_specs,
                  stage_glyph,
                  wrap_words,
              )
          except ModuleNotFoundError:
              from regenerate_readme_visuals_v10 import (
                  ROOT,
                  TOKENS,
                  VISUAL_ROOT,
                  VisualSpec,
                  parse_specs,
                  stage_glyph,
                  wrap_words,
              )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one import block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python -m pip install ruff
          python -m ruff format scripts/regenerate_readme_visuals_v11.py
          rm -f reports/V11_FAILURE_DIAGNOSIS.txt
          rm -f .github/workflows/v11-failure-diagnose.yml
          rm -f .github/workflows/v11-import-fix.yml
          printf 'issue=31\nlayouts=hero,bento,workflow,loop,risk\nretry=1\n' > .v11-readme-visual-trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair V11 generator direct execution and retry'
          git push origin HEAD:refs/heads/main
