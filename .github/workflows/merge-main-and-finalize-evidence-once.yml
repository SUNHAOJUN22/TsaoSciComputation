name: One-time merge-base evidence finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tsao-scicomputation-merge-base-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 161 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/parallel-6h-acceptance-20260808' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/parallel-6h-acceptance-20260808
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Merge latest main and remove temporary controllers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/merge-main-and-finalize-evidence-once.yml
          rm -f .github/workflows/one-time-issue-refresh-six-hour-evidence.yml
          rm -f .github/workflows/one-time-pr-target-evidence-refresh.yml
          rm -f .github/workflows/refresh-after-path-coverage-once.yml
          rm -f .github/workflows/refresh-generated-evidence-once.yml
          rm -f .github/path-coverage-evidence.trigger
          rm -f .github/refresh-after-windows-coverage.trigger
          rm -f .github/refresh-six-hour-acceptance-evidence.trigger
      - name: Install exact qualification dependencies
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Rebuild governed evidence on exact merge tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_acceleration_audits.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
      - name: Qualify exact merge tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
      - name: Publish exact merge-base-qualified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'test: qualify exact merge tree after Windows path coverage repair'
          git push origin HEAD:agent/parallel-6h-acceptance-20260808
