name: One-time refresh six-hour acceptance evidence

on:
  push:
    branches: [main]
    paths:
      - .github/refresh-six-hour-acceptance-evidence.trigger

permissions:
  contents: write

concurrency:
  group: tsao-scicomputation-six-hour-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact acceptance branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/parallel-6h-acceptance-20260808
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Install exact qualification dependencies
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Remove branch transport and regenerate governed evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-generated-evidence-once.yml
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
      - name: Re-run affected complete profiles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
      - name: Publish exact regenerated acceptance tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: bind parallel acceptance prompt to exact source evidence'
          git push origin HEAD:agent/parallel-6h-acceptance-20260808
      - name: Remove one-time controller from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create main origin/main
          git rm .github/workflows/one-time-refresh-six-hour-acceptance-evidence.yml .github/refresh-six-hour-acceptance-evidence.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-time source-evidence refresh controller'
          git push origin HEAD:main
