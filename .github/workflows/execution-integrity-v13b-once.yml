name: Execution integrity V13 corrected final certification

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: execution-integrity-v13b-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/execution-integrity-v13b-coverage.json
  AUDIT_ISSUE: '85'
  CANDIDATE_SHA: '27af704e6f6c28dae400cdd28d943936312fd802'
  CLEAN_BASELINE_SHA: 'aea8e8f28f91010a0ad09d48af8843452f90cb05'

jobs:
  certify:
    if: ${{ github.event.issue.title == 'EXECUTION_INTEGRITY_V13B_FINALIZE' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Materialize corrected execution-integrity candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          echo "ORIGINAL_SHA=$ORIGINAL_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=false" >> "$GITHUB_ENV"
          echo apply > /tmp/execution-integrity-v13b-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git read-tree --reset -u "$CANDIDATE_SHA"
          git clean -fd
          python scripts/apply_execution_integrity_v13.py
          rm -f scripts/apply_execution_integrity_v13.py docs/.execution-integrity-v13-plan.md .github/workflows/execution-integrity-v13b-once.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          anchor = '## Unreleased\n'
          release = '''## Unreleased

## 3.0.4 — 2026-08-03

- Disabled direct execution through the legacy low-level process API; external computation now requires a sealed, hash-bound authorization created for the exact command plan.
- Bound every authorized run to the current executable SHA-256, declared input-file SHA-256 and normalized subprocess environment immediately before launch.
- Separated fixed, allowlisted read-only hardware discovery from scientific computation execution and repaired default accelerator probing on real systems.
- Routed Python-module availability probes through the sanitized environment and made adapter command-plan environments immutable.
- Added execution-integrity fault injection, machine evidence and bilingual documentation for the strengthened boundary.
'''
          if text.count(anchor) != 1:
              raise SystemExit('CHANGELOG Unreleased anchor mismatch')
          path.write_text(text.replace(anchor, release, 1), encoding='utf-8', newline='\n')
          PY
          printf '3.0.4\n' > VERSION
          python scripts/sync_version_metadata.py --release-date 2026-08-03
          cat > reports/EXECUTION_INTEGRITY_V13.md <<'EOF'
          # Execution Integrity V13

          This audit closes the public low-level process bypass, separates fixed read-only probes from computation execution, binds authorization to the current executable and declared input contents, and hashes the normalized subprocess environment.

          External solver execution remains plan-only until a matching authorization is created through `authorize_plan`; scientific acceptance remains a separate gate.
          EOF
      - name: Normalize and run focused fault-injection gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo targeted > /tmp/execution-integrity-v13b-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m pytest -q tests/test_execution_integrity_v13.py tests/test_core.py tests/test_extended.py tests/test_adversarial_super_skill_phase_a.py tests/test_acceleration_foundation.py tests/test_acceleration_hardening.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python scripts/security_scan.py
          python scripts/build_manifest.py
      - name: Run complete deterministic security dependency and package gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/execution-integrity-v13b-stage
          python scripts/run_tests.py --coverage | tee /tmp/execution-integrity-v13b-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/execution-integrity-v13b-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/execution-integrity-v13b-benchmark.json
          python scripts/verify_native_core.py > /tmp/execution-integrity-v13b-native.json
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/execution-integrity-v13b-dependencies.json
          rm -rf /tmp/execution-integrity-v13b-build /tmp/execution-integrity-v13b-venv
          python -m build --outdir /tmp/execution-integrity-v13b-build
          python -m venv /tmp/execution-integrity-v13b-venv
          /tmp/execution-integrity-v13b-venv/bin/python -m pip install --no-deps /tmp/execution-integrity-v13b-build/*.whl
          /tmp/execution-integrity-v13b-venv/bin/python -c 'import tsao_computation; assert tsao_computation.__version__ == "3.0.4"'
          python -m pytest -q | tee /tmp/execution-integrity-v13b-pytest.log
          git ls-remote --heads origin | sort > /tmp/execution-integrity-v13b-heads.txt
          test "$(awk '{print $2}' /tmp/execution-integrity-v13b-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main
      - name: Refresh machine evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/execution-integrity-v13b-stage
          python scripts/build_super_skill_audit.py --test-log /tmp/execution-integrity-v13b-pytest.log --coverage-json /tmp/execution-integrity-v13b-coverage.json --dependency-json /tmp/execution-integrity-v13b-dependencies.json --security-json evidence/security-scan.json --verification-json /tmp/execution-integrity-v13b-all.json
          python scripts/update_main_audit_evidence.py --root . --run-id "$GITHUB_RUN_ID" --issue "$AUDIT_ISSUE" --test-log /tmp/execution-integrity-v13b-pytest.log --coverage-json /tmp/execution-integrity-v13b-coverage.json --dependency-json /tmp/execution-integrity-v13b-dependencies.json --security-json evidence/security-scan.json --remote-heads /tmp/execution-integrity-v13b-heads.txt --parent-commit "$ORIGINAL_SHA" --audit-generation execution-integrity-v13 --audit-label execution-integrity --visual-count 42 --visual-atlas-version 13 --report-path reports/EXECUTION_INTEGRITY_V13.md --visual-families 'Electronic structure and molecular simulation; materials and interfaces; continuum and process engineering; evidence governance and HPC.'
          python scripts/sync_version_metadata.py --release-date 2026-08-03
          python scripts/security_scan.py
          python scripts/build_manifest.py
      - name: Validate exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo exact-tree > /tmp/execution-integrity-v13b-stage
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python -m pytest -q
          python scripts/sync_version_metadata.py --check
          python scripts/build_manifest.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text())
          policy = audit['execution_policy']
          assert audit['status'] == 'VALIDATED' and audit['version'] == '3.0.4'
          assert audit['validation_missing_evidence'] == [] and audit['validation_failures'] == []
          assert audit['quality']['tests_failed'] == 0
          assert audit['quality']['dependency_vulnerabilities'] == 0
          assert audit['quality']['repository_security_findings'] == 0
          assert audit['quality']['source_and_wheel_reproducible'] is True
          for key in ('direct_low_level_process_execution_disabled','read_only_probe_commands_allowlisted','authorization_binds_executable_sha256','authorization_binds_input_sha256','python_module_probes_use_sanitized_environment'):
              assert policy[key] is True, key
          for temporary in ('scripts/apply_execution_integrity_v13.py','docs/.execution-integrity-v13-plan.md','.github/workflows/execution-integrity-v13b-once.yml'):
              assert not Path(temporary).exists(), temporary
          PY
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflow_files[*]}" = "${expected[*]}"
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main
      - name: Commit exact final tree directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/execution-integrity-v13b-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Harden execution integrity and probe safety'
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=true" >> "$GITHUB_ENV"
      - name: Require exact-final production workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production-ci > /tmp/execution-integrity-v13b-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$FINAL_SHA"
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
          : > /tmp/execution-integrity-v13b-production-runs.txt
          wait_for_workflow() {
            local workflow="$1" line status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json headSha,status,conclusion,url --jq ".[] | select(.headSha == \"$FINAL_SHA\") | [.status,.conclusion,.url] | @tsv" | head -n 1)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  [[ "$conclusion" == success ]]
                  printf '%s: %s\n' "$workflow" "$url" >> /tmp/execution-integrity-v13b-production-runs.txt
                  return
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for_workflow ci.yml
          wait_for_workflow codeql.yml
          wait_for_workflow scorecard.yml
      - name: Close successful audit
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(cat /tmp/execution-integrity-v13b-production-runs.txt)"
          metrics="$(python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text())
          quality = audit['quality']
          print(f"version={audit['version']}; tests={quality['tests_passed']}; statement-coverage={quality['statement_coverage_percent']:.2f}%; branch-coverage={quality['branch_coverage_percent']:.2f}%")
          PY
          )"
          gh issue close "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Execution integrity V13 passed on commit \`$FINAL_SHA\`. $metrics. Direct low-level execution is disabled; read-only hardware probes are allowlisted; Python-module probes use a sanitized environment; executable, input and normalized environment state are rebound before launch. All deterministic, benchmark, security, dependency, reproducible source/Wheel, Manifest and main-only gates passed. Production workflows:\n$runs\nNo branch or pull request was created."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Final V13 certification completed at \`$FINAL_SHA\`. Authoritative evidence is in Issue #$AUDIT_ISSUE."
      - name: Fail closed to certified baseline
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/execution-integrity-v13b-stage 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          git read-tree --reset -u "$CLEAN_BASELINE_SHA"
          git clean -fd
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Restore certified baseline after V13B $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Execution integrity V13B failed closed at stage: $stage. Actions run: $GITHUB_RUN_ID. The tree was restored to certified baseline $CLEAN_BASELINE_SHA. No branch or PR was created." || true
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason not_planned --comment "Fail-closed at stage: $stage. See audit Issue #$AUDIT_ISSUE." || true
          exit 1
