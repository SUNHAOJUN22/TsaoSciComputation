name: Performance engineering V8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.v8-performance-trigger'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: performance-audit-v8-main
  cancel-in-progress: false

jobs:
  performance:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-v8-performance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: '28'
      BASELINE_SHA: f3f533160cc64766fec862b96822db89b468e53c
      TSAO_COVERAGE_JSON: /tmp/tsao-performance-coverage.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete verification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Normalize V8 sources with repository tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix \
            tsao_computation/registries/loader.py \
            tsao_computation/adapters/base.py \
            tsao_computation/adapters/registry.py \
            tsao_computation/routing/router.py \
            tsao_computation/provenance/manifest.py \
            scripts/security_scan.py \
            scripts/benchmark.py \
            scripts/compare_performance.py \
            tests/test_performance_optimizations.py
          python -m ruff format \
            tsao_computation/registries/loader.py \
            tsao_computation/adapters/base.py \
            tsao_computation/adapters/registry.py \
            tsao_computation/routing/router.py \
            tsao_computation/provenance/manifest.py \
            scripts/security_scan.py \
            scripts/benchmark.py \
            scripts/compare_performance.py \
            tests/test_performance_optimizations.py

      - name: Measure accepted V7 baseline and V8 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/tsao-v7-baseline
          git worktree add --detach /tmp/tsao-v7-baseline "$BASELINE_SHA"
          (
            cd /tmp/tsao-v7-baseline
            python scripts/benchmark.py > /tmp/tsao-v7-benchmark.log
          )
          cp /tmp/tsao-v7-baseline/benchmarks/latest.json /tmp/tsao-v7.json
          git worktree remove --force /tmp/tsao-v7-baseline
          python scripts/benchmark.py --output /tmp/tsao-v8.json
          python scripts/compare_performance.py \
            --baseline /tmp/tsao-v7.json \
            --candidate /tmp/tsao-v8.json \
            --output /tmp/tsao-performance-preflight.json \
            --run-id "$GITHUB_RUN_ID"

      - name: Run deterministic release gates pass 1
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .v8-performance-trigger
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/verify_all.py --profile all | tee /tmp/performance-all-1.log
          python scripts/verify_all.py --profile benchmark | tee /tmp/performance-benchmark.log
          python -m pytest -q | tee /tmp/performance-pytest.log

      - name: Collect dependency security and branch evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/performance-dependency.json
          python scripts/security_scan.py > /tmp/performance-security.json
          git ls-remote --heads origin > /tmp/performance-remote-heads.txt

      - name: Refresh current-main verification evidence for V8
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/update_main_audit_evidence.py \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$ISSUE_NUMBER" \
            --test-log /tmp/performance-pytest.log \
            --coverage-json "$TSAO_COVERAGE_JSON" \
            --dependency-json /tmp/performance-dependency.json \
            --security-json /tmp/performance-security.json \
            --remote-heads /tmp/performance-remote-heads.txt \
            --parent-commit "$(git rev-parse HEAD)" \
            --audit-generation ultimate-main-audit-v8 \
            --audit-label V8 \
            --visual-count 42 \
            --visual-atlas-version 7 \
            --report-path reports/ULTIMATE_MAIN_AUDIT_V8.md \
            --visual-families 'Measured orchestration performance engineering with no visual-atlas expansion.'

      - name: Refresh measured performance evidence and bilingual README
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/compare_performance.py \
            --baseline /tmp/tsao-v7.json \
            --candidate benchmarks/latest.json \
            --output reports/PERFORMANCE_ENGINEERING_V8.json \
            --root . \
            --issue "$ISSUE_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --update-readme

      - name: Rebuild and verify repository Manifest after performance evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check

      - name: Check generated performance documentation whitespace
        shell: bash
        run: git diff --check

      - name: Run deterministic release gates pass 2 on exact documented tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all | tee /tmp/performance-all-2.log
          python -m pytest -q | tee /tmp/performance-pytest-2.log
          python scripts/compare_performance.py \
            --baseline /tmp/tsao-v7.json \
            --candidate benchmarks/latest.json \
            --output reports/PERFORMANCE_ENGINEERING_V8.json \
            --run-id "$GITHUB_RUN_ID"
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check

      - name: Commit every verified V8 artifact
        id: final_commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize measured performance engineering V8'
            git push origin HEAD:refs/heads/main
          fi
          test -z "$(git status --porcelain)"
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch and wait for canonical cross-platform CI
        id: canonical_ci
        shell: bash
        run: |
          set -Eeuo pipefail
          final_sha='${{ steps.final_commit.outputs.final_sha }}'
          gh workflow run ci.yml --ref main
          run_id=''
          for _ in $(seq 1 30); do
            run_id="$(
              gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 40 \
                --json databaseId,headSha \
              | python -c 'import json,sys; rows=json.load(sys.stdin); sha=sys.argv[1]; print(next((str(r["databaseId"]) for r in rows if r["headSha"]==sha), ""))' \
                  "$final_sha"
            )"
            test -n "$run_id" && break
            sleep 4
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical CI dispatched for V8 final commit \`$final_sha\`. Run ID: \`$run_id\`."
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Report V8 success and close issue
        shell: bash
        run: |
          final_sha='${{ steps.final_commit.outputs.final_sha }}'
          run_id='${{ steps.canonical_ci.outputs.run_id }}'
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Performance engineering V8 passed. Final commit: \`$final_sha\`. Canonical CI Run ID: \`$run_id\`. Same-host before/after performance gate, full deterministic release gates, and Ubuntu/Windows/macOS x Python 3.10/3.13 CI all succeeded. No branch or PR was created."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report V8 failure with measured diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          details="$(
            python - <<'PY'
          import json
          from pathlib import Path

          paths = (
              ('baseline', Path('/tmp/tsao-v7.json')),
              ('preflight', Path('/tmp/tsao-performance-preflight.json')),
              ('candidate', Path('benchmarks/latest.json')),
              ('final', Path('reports/PERFORMANCE_ENGINEERING_V8.json')),
          )
          payload = {}
          for name, path in paths:
              if path.is_file():
                  try:
                      payload[name] = json.loads(path.read_text(encoding='utf-8'))
                  except (OSError, json.JSONDecodeError) as exc:
                      payload[name] = {'error': str(exc)}
          print(json.dumps(payload, indent=2, sort_keys=True)[:12000])
          PY
          )"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Performance engineering V8 failed in workflow run \`$GITHUB_RUN_ID\`. No completion claim is made.

          \`\`\`json
          $details
          \`\`\`"
