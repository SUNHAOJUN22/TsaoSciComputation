name: Materialize real canonicalization failure

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_REAL_CANONICAL_FAILURE_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Select latest run whose prepare job actually failed
        shell: bash
        run: |
          set -Eeuo pipefail
          REAL_RUN_ID=''
          mapfile -t RUN_IDS < <(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow canonicalize-generated-text.yml --limit 30 \
            --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[].databaseId')
          for RUN_ID in "${RUN_IDS[@]}"; do
            PREPARE="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json jobs --jq '[.jobs[] | select(.name == "prepare")][0].conclusion // empty')"
            if test "$PREPARE" = failure; then
              REAL_RUN_ID="$RUN_ID"
              break
            fi
          done
          test -n "$REAL_RUN_ID"
          gh run view "$REAL_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > /tmp/real-canonicalization-failure.log 2>&1
          {
            echo "canonicalization_run_id=$REAL_RUN_ID"
            echo "captured_by_run_id=$GITHUB_RUN_ID"
            echo
            tail -n 180 /tmp/real-canonicalization-failure.log | tr -d '\r' | tail -c 30000
          } > reports/CANONICALIZATION_FAILURE_DIAGNOSIS.txt

      - name: Self-clean, synchronize Manifest and commit report
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/materialize-real-canonical-failure.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize real canonicalization failure diagnosis'
          git push origin HEAD:refs/heads/main
