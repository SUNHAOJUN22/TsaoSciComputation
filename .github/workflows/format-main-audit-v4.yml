name: Format main audit V4 files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-main-audit-v4.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[validation,quality]'
      - name: Apply repository format and lint fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix \
            scripts/update_main_audit_evidence.py \
            tests/test_update_main_audit_evidence.py
          python -m ruff format \
            scripts/update_main_audit_evidence.py \
            tests/test_update_main_audit_evidence.py
          python -m ruff check \
            scripts/update_main_audit_evidence.py \
            tests/test_update_main_audit_evidence.py
          python -m ruff format --check \
            scripts/update_main_audit_evidence.py \
            tests/test_update_main_audit_evidence.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
      - name: Commit formatted source and Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_main_audit_evidence.py \
            tests/test_update_main_audit_evidence.py manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Format and lint main audit V4 evidence updater'
            git push origin HEAD:refs/heads/main
          fi
