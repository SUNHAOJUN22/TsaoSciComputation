name: One-time path-coverage evidence finalizer

on:
  push:
    branches:
      - agent/parallel-6h-acceptance-20260808
    paths:
      - .github/path-coverage-evidence.trigger

permissions:
  contents: write

concurrency:
  group: tsao-scicomputation-path-coverage-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact acceptance branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/parallel-6h-acceptance-20260808
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Install exact qualification dependencies
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Remove transport and regenerate governed evidence
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-after-path-coverage-once.yml
          git rm .github/path-coverage-evidence.trigger
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
      - name: Re-run affected complete profiles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
      - name: Publish exact regenerated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: bind path-coverage repair to exact source evidence'
          git push origin HEAD:agent/parallel-6h-acceptance-20260808
