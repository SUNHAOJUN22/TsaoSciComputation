name: Qualify solver-bound plan V6 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: qualify-solver-bound-plan-v6-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_SOLVER_BOUND_PLAN_V6_DIRECT_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and apply fixed-path V6 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          payload_root = Path('.github/payloads/solver-bound-plan-v6-staging')
          specifications = (
              ('part-00.b64', 4096, '83e4be6bf31c2331fbeb5f5d1122eaa1ec3228cc4715d2d4585624506b9717ab'),
              ('part-01.b64', 4096, '6366fddac254f50d631cc2e384f97041854d3af9f9817255f691054e9d8e4154'),
              ('group-02.b64', 8192, 'ca03a84a9a01bf89a3b5096aac9fcc509fe60512ac6ff2b75e24e80239c53d1b'),
              ('group-03.b64', 8192, '0d1a370fa61933b4d169497bb52970df10a0312c3ee0648a7f31069b4ee717f1'),
              ('group-04.b64', 5045, 'b856ac346bf09a3dd425363071387c7173bab380c8709556cf4ae50e2d346954'),
          )
          actual = sorted(path.name for path in payload_root.glob('*.b64'))
          expected_names = sorted(item[0] for item in specifications)
          if actual != expected_names:
              raise SystemExit(f'payload file set mismatch: {actual}')
          chunks: list[bytes] = []
          for name, expected_size, expected_digest in specifications:
              encoded = (payload_root / name).read_bytes().replace(b'\n', b'').replace(b'\r', b'')
              data = base64.b64decode(encoded, validate=True)
              if len(data) != expected_size:
                  raise SystemExit(f'{name} decoded size mismatch: {len(data)}')
              if hashlib.sha256(data).hexdigest() != expected_digest:
                  raise SystemExit(f'{name} decoded SHA-256 mismatch')
              chunks.append(data)
          archive = b''.join(chunks)
          if len(archive) != 29621:
              raise SystemExit(f'archive byte count mismatch: {len(archive)}')
          if hashlib.sha256(archive).hexdigest() != '2a77313de59d58c5b57cfbb7a24958c02f94de4ddd9902f56475d7308f41fcd5':
              raise SystemExit('archive SHA-256 mismatch')

          file_hashes = {
              'CHANGELOG.md': '61f655a268a8a42dbfbc067da19243478a1380c8ed98cd8157f892ba4f13170b',
              'README.md': 'fcadee5d11dcdaa772a7362bbe554e3b5257281f8fcc99cef5d735b2b255ace7',
              'README.zh-CN.md': 'f389db6eebe780df9fbe401d84cb87fd690ca4c0034ea814f9fe28d0bcd3b6df',
              'docs/accelerated-native-backend.md': '64814d886d45b4287d3b50f57116753998bee6ca8d63ec75178fe4c10f28ee37',
              'schemas/acceleration-plan.schema.json': '48f5f409fa7eb30154aea95c8471a95421fc3cca6c549ea7ac39611c1c640f61',
              'tests/test_solver_bound_plan_v6.py': 'a318fd725e2e353df3fad280ab3274dedc820370075b4c4c62f5e55f056ebc6c',
              'tsao_computation/accelerators/planner.py': '4f526998b590b37906063df511dca857bd883ddb7fa8375a580847c8cdf3f8fc',
              'tsao_computation/accelerators/solver.py': 'f86141b26dad8e81783925dfc3f91893a714b82ed4fd48aa2e023b23b0aef9fd',
              'tsao_computation/cli.py': '6d315252ad75d6efabbfdac23ffccf5d68b97ddc990bf85573abf8c35c71a610',
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != set(file_hashes):
                  raise SystemExit(f'archive member set mismatch: {names}')
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  stream = handle.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'unreadable archive member: {member.name}')
                  data = stream.read()
                  if hashlib.sha256(data).hexdigest() != file_hashes[member.name]:
                      raise SystemExit(f'file digest mismatch: {member.name}')
                  target = Path(*pure.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          for name, expected in file_hashes.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'post-write digest mismatch: {name}')
          PY
          rm -rf .github/payloads/solver-bound-plan-v6-staging
          rm -f .github/payloads/solver-capability-v5/files/accelerators-init.b64
          rmdir .github/payloads/solver-capability-v5/files 2>/dev/null || true
          rmdir .github/payloads/solver-capability-v5 2>/dev/null || true
          rmdir .github/payloads 2>/dev/null || true
          rm .github/workflows/qualify-solver-bound-plan-v6-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete validation toolchain
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonicalize candidate and generated evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run complete deterministic release qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py

      - name: Verify V6 contracts and exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_solver_bound_plan_v6.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
          git diff --check
          test ! -e .github/payloads/solver-bound-plan-v6-staging
          test ! -e .github/workflows/qualify-solver-bound-plan-v6-once.yml
          git diff -- .github/workflows/ci.yml --exit-code

      - name: Publish qualified V6 directly to main
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add solver-bound acceleration plans V6'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close qualification issue
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Solver-Bound Acceleration Plans V6 were published directly to main as ${{ steps.publish.outputs.sha }} after five-part Base64 decoding, archive identity, fixed-path file hashes, lint, typing, quality, security, 815-test-level coverage, package, native, schema and evidence gates passed. A bound fingerprint remains evidence-bound-unqualified until live solver numerical and performance qualification. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove temporary V6 transport after failure
        if: failure()
        shell: bash
        run: |
          set +e
          git fetch origin main
          git checkout -B cleanup origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .github/payloads/solver-bound-plan-v6-staging
          git rm -f --ignore-unmatch .github/payloads/solver-capability-v5/files/accelerators-init.b64
          git rm -f --ignore-unmatch .github/workflows/qualify-solver-bound-plan-v6-once.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove failed solver-bound plan V6 transport [skip ci]'
            git push origin HEAD:refs/heads/main
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Solver-Bound Acceleration Plans V6 qualification failed; product files were not published. Temporary transport was removed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
