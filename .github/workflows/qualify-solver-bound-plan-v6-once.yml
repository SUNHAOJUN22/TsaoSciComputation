name: Qualify solver-bound plan V6 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: qualify-solver-bound-plan-v6-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_SOLVER_BOUND_PLAN_V6_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Resolve candidate identity
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          body=$(gh issue view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          candidate=$(printf '%s\n' "$body" | sed -n 's/^CANDIDATE_SHA=\([0-9a-f]\{40\}\)$/\1/p')
          expected_parent=$(printf '%s\n' "$body" | sed -n 's/^EXPECTED_PARENT=\([0-9a-f]\{40\}\)$/\1/p')
          test -n "$candidate"
          test -n "$expected_parent"
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "parent=$expected_parent" >> "$GITHUB_OUTPUT"

      - name: Check out fixed candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify ancestry and candidate boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "${{ steps.candidate.outputs.parent }}"
          test "$(git rev-parse origin/main)" = "${{ steps.candidate.outputs.parent }}"
          test -f .github/payloads/solver-bound-plan-v6.tar.gz
          git diff "${{ steps.candidate.outputs.parent }}" HEAD -- .github/workflows/ci.yml --exit-code

      - name: Apply fixed-path, digest-bound V6 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import io
          import tarfile
          from pathlib import Path, PurePosixPath

          archive_path = Path('.github/payloads/solver-bound-plan-v6.tar.gz')
          archive = archive_path.read_bytes()
          if len(archive) != 29621:
              raise SystemExit(f'archive byte count mismatch: {len(archive)}')
          if hashlib.sha256(archive).hexdigest() != '2a77313de59d58c5b57cfbb7a24958c02f94de4ddd9902f56475d7308f41fcd5':
              raise SystemExit('archive SHA-256 mismatch')

          file_hashes = {
              'CHANGELOG.md': '61f655a268a8a42dbfbc067da19243478a1380c8ed98cd8157f892ba4f13170b',
              'README.md': 'fcadee5d11dcdaa772a7362bbe554e3b5257281f8fcc99cef5d735b2b255ace7',
              'README.zh-CN.md': 'f389db6eebe780df9fbe401d84cb87fd690ca4c0034ea814f9fe28d0bcd3b6df',
              'docs/accelerated-native-backend.md': '64814d886d45b4287d3b50f57116753998bee6ca8d63ec75178fe4c10f28ee37',
              'schemas/acceleration-plan.schema.json': '48f5f409fa7eb30154aea95c8471a95421fc3cca6c549ea7ac39611c1c640f61',
              'tests/test_solver_bound_plan_v6.py': 'a318fd725e2e353df3fad280ab3274dedc820370075b4c4c62f5e55f056ebc6c',
              'tsao_computation/accelerators/planner.py': '4f526998b590b37906063df511dca857bd883ddb7fa8375a580847c8cdf3f8fc',
              'tsao_computation/accelerators/solver.py': 'f86141b26dad8e81783925dfc3f91893a714b82ed4fd48aa2e023b23b0aef9fd',
              'tsao_computation/cli.py': '6d315252ad75d6efabbfdac23ffccf5d68b97ddc990bf85573abf8c35c71a610',
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != set(file_hashes):
                  raise SystemExit(f'archive member set mismatch: {names}')
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  stream = handle.extractfile(member)
                  if stream is None:
                      raise SystemExit(f'unreadable archive member: {member.name}')
                  data = stream.read()
                  if hashlib.sha256(data).hexdigest() != file_hashes[member.name]:
                      raise SystemExit(f'file digest mismatch: {member.name}')
                  target = Path(*pure.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          for name, expected in file_hashes.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'post-write digest mismatch: {name}')
          PY
          rm .github/payloads/solver-bound-plan-v6.tar.gz
          rmdir .github/payloads 2>/dev/null || true
          rm .github/workflows/qualify-solver-bound-plan-v6-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete validation toolchain
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonicalize candidate and generated evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run complete deterministic release qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py

      - name: Verify V6 contracts and exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_solver_bound_plan_v6.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
          git diff --check
          test ! -e .github/payloads/solver-bound-plan-v6.tar.gz
          test ! -e .github/workflows/qualify-solver-bound-plan-v6-once.yml
          git diff "${{ steps.candidate.outputs.parent }}" HEAD -- .github/workflows/ci.yml --exit-code

      - name: Publish qualified V6 directly to main
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            final_sha=$(git rev-parse HEAD)
          else
            git commit -m 'Canonicalize solver-bound acceleration plan V6'
            final_sha=$(git rev-parse HEAD)
          fi
          git push origin HEAD:refs/heads/main
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Close qualification issue
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Solver-Bound Acceleration Plans V6 were published directly to main as ${{ steps.publish.outputs.sha }} after archive identity, fixed-path file hashes, candidate ancestry, lint, typing, quality, security, 815-test-level coverage, package, native, schema and evidence gates passed. A bound fingerprint remains evidence-bound-unqualified until live solver numerical and performance qualification. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove one-time workflow after failure
        if: failure()
        shell: bash
        run: |
          set +e
          git fetch origin main
          git checkout -B cleanup origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/qualify-solver-bound-plan-v6-once.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove failed solver-bound plan V6 workflow [skip ci]'
            git push origin HEAD:refs/heads/main
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Solver-Bound Acceleration Plans V6 qualification failed; the candidate was not published. The one-time workflow was removed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
