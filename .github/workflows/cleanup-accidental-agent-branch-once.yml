name: Cleanup accidental agent branch once

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: cleanup-accidental-agent-branch-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.actor == 'SUNHAOJUN22' &&
      github.event.issue.title == '[CLEANUP] remove accidental agent branch' &&
      contains(github.event.issue.body, 'status=ready')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Delete accidental branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/agent/canonical-routing-cache"

      - name: Remove this workflow from main
        run: |
          set -euo pipefail
          rm .github/workflows/cleanup-accidental-agent-branch-once.yml
          git config user.name 'SUNHAOJUN22 cleanup automation'
          git config user.email 'SUNHAOJUN22@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove accidental branch cleanup workflow [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Report completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=complete\nbranch=agent/canonical-routing-cache\npr=50-closed-not-planned\n' > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf 'status=failed\nbranch=agent/canonical-routing-cache\nworkflow-run=%s\n' "$GITHUB_RUN_ID" > /tmp/body.txt
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.txt
