name: Final exact-tree certification V3

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write
  security-events: read

concurrency:
  group: final-exact-tree-certification-v3
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/final-v3-coverage.json
  CLEAN_BASELINE_SHA: eaa3d927a27743796556b642075d5d8a17fc8176
  AUDIT_ISSUE: '49'

jobs:
  certify:
    if: ${{ github.event.issue.title == 'FINAL_EXACT_TREE_CERTIFICATION_V3' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Prepare exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo prepare > /tmp/final-v3-stage
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          CERT_ISSUE="${{ github.event.issue.number }}"
          echo "ORIGINAL_SHA=$ORIGINAL_SHA" >> "$GITHUB_ENV"
          echo "CERT_ISSUE=$CERT_ISSUE" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/final-certification-v3-once.yml

      - name: Complete validation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo validate > /tmp/final-v3-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python scripts/run_tests.py --coverage | tee /tmp/final-v3-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/final-v3-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/final-v3-benchmark.json
          python scripts/verify_native_core.py > /tmp/final-v3-native.json
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/final-v3-dependencies.json
          python -m pytest -q | tee /tmp/final-v3-pytest.log
          rm -rf /tmp/final-v3-build
          python -m build --outdir /tmp/final-v3-build 2>&1 | tee /tmp/final-v3-build.log
          if grep -F 'warning: no files found matching' /tmp/final-v3-build.log; then
            echo 'stale package-manifest warning remains' >&2
            exit 1
          fi
          git ls-remote --heads origin | sort > /tmp/final-v3-heads.txt
          test "$(awk '{print $2}' /tmp/final-v3-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Refresh exact-tree evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/final-v3-stage
          python scripts/build_super_skill_audit.py \
            --test-log /tmp/final-v3-pytest.log \
            --coverage-json /tmp/final-v3-coverage.json \
            --dependency-json /tmp/final-v3-dependencies.json \
            --security-json evidence/security-scan.json \
            --verification-json /tmp/final-v3-all.json
          python scripts/update_main_audit_evidence.py \
            --root . \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$AUDIT_ISSUE" \
            --test-log /tmp/final-v3-pytest.log \
            --coverage-json /tmp/final-v3-coverage.json \
            --dependency-json /tmp/final-v3-dependencies.json \
            --security-json evidence/security-scan.json \
            --remote-heads /tmp/final-v3-heads.txt \
            --parent-commit "$ORIGINAL_SHA" \
            --audit-generation final-exact-tree-v3 \
            --audit-label final-exact-tree-v3 \
            --visual-count 42 \
            --visual-atlas-version 13 \
            --report-path reports/ROUTING_README_V14.md \
            --visual-families 'Three root overview diagrams; complete 42-asset atlas remains validated in assets/visuals.'
          python scripts/sync_version_metadata.py --release-date 2026-08-03
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Exact final-tree gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo exact-tree > /tmp/final-v3-stage
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python -m pytest -q
          python scripts/verify_all.py --profile core
          python scripts/sync_version_metadata.py --check
          python scripts/build_manifest.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text())
          assert audit['status'] == 'VALIDATED'
          assert audit['quality']['tests_failed'] == 0
          assert audit['quality']['statement_coverage_percent'] >= 95
          assert audit['quality']['dependency_vulnerabilities'] == 0
          assert audit['quality']['repository_security_findings'] == 0
          assert audit['quality']['source_and_wheel_reproducible'] is True
          assert not audit['validation_missing_evidence']
          assert not audit['validation_failures']
          PY
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflows[*]}" = "${expected[*]}"

      - name: Commit directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/final-v3-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Certify final simplified main tree'
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"

      - name: Dispatch and require exact-final workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production > /tmp/final-v3-stage
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
          : > /tmp/final-v3-runs.txt
          wait_for() {
            local workflow="$1" line status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 50 --json headSha,status,conclusion,url --jq ".[] | select(.headSha == \"$FINAL_SHA\") | [.status,.conclusion,.url] | @tsv" | head -n 1)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  [[ "$conclusion" == success ]]
                  printf '%s: %s\n' "$workflow" "$url" >> /tmp/final-v3-runs.txt
                  return 0
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for ci.yml
          wait_for codeql.yml
          wait_for scorecard.yml

      - name: Record completion
        shell: bash
        run: |
          set -Eeuo pipefail
          echo record > /tmp/final-v3-stage
          metrics="$(python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text())
          quality = audit['quality']
          print(f"tests={quality['tests_passed']}; statement-coverage={quality['statement_coverage_percent']:.2f}%; branch-coverage={quality['branch_coverage_percent']:.2f}%; dependency-vulnerabilities={quality['dependency_vulnerabilities']}; security-findings={quality['repository_security_findings']}")
          PY
          )"
          runs="$(cat /tmp/final-v3-runs.txt)"
          message="Exact final-tree certification passed on commit \`$FINAL_SHA\`. $metrics. The bilingual README simplification, routing cache correction, 42-asset validation, removal of eight obsolete migration files, clean package manifest, reproducible builds and scientific/security gates are certified. CI, CodeQL and OpenSSF Scorecard were explicitly dispatched for this same commit and passed. Remote branches remain main only; no branch or pull request was created.\n\n$runs"
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$message"
          gh issue close "$CERT_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed --comment "$message"

      - name: Fail closed before commit
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/final-v3-stage 2>/dev/null || echo unknown)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "$stage" != production && "$stage" != record && -n "${ORIGINAL_SHA:-}" && "$remote" == "$ORIGINAL_SHA" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git fetch origin main
            git reset --hard origin/main
            git read-tree --reset -u "$CLEAN_BASELINE_SHA"
            git clean -fd
            git add -A
            git commit -m "Restore certified simplified baseline after V3 $stage" || true
            git push origin HEAD:refs/heads/main || true
          fi
          gh issue close "${CERT_ISSUE:-${{ github.event.issue.number }}}" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment "Final exact-tree certification V3 failed closed at stage: $stage. Actions run: $GITHUB_RUN_ID. No branch or pull request was created." || true
          exit 1
