name: Status main audit V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/status-main-audit-v4.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report recent main audit runs
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run list --workflow main-audit.yml --limit 8 \
            --json databaseId,headSha,status,conclusion,event,createdAt,url \
            > "$RUNNER_TEMP/main-audit-runs.json"
          {
            echo 'Recent main-audit V4 runs:'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/main-audit-runs.json"
            echo '```'
          } > "$RUNNER_TEMP/main-audit-status.md"
          gh issue comment 24 --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/main-audit-status.md"
