name: Corrected adversarial acceleration contract once

on:
  push:
    branches: [main]
    paths:
      - .trigger-adversarial-phase-b1-v2

permissions:
  contents: write
  issues: write

concurrency:
  group: corrected-adversarial-acceleration-contract-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/adversarial-phase-b1-v2-coverage.json
  AUDIT_ISSUE: '61'
  CLEAN_BASELINE_SHA: 'd1146b9c942ade7b5f7a1a624bba1dfd0b67cd76'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply corrected acceleration contract candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PUBLISHED=false" >> "$GITHUB_ENV"
          echo apply > /tmp/adversarial-phase-b1-v2-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick 150873ab56d00b4e8d930b820f4c34804a5f1f43
          python scripts/apply_adversarial_super_skill_phase_b1.py
          python scripts/fix_adversarial_phase_b1_compatibility.py
          rm -f scripts/apply_adversarial_super_skill_phase_b1.py
          rm -f scripts/fix_adversarial_phase_b1_compatibility.py
          rm -f .github/workflows/adversarial-phase-b1-v2-once.yml
          rm -f .trigger-adversarial-phase-b1-v2

      - name: Normalize and run acceleration gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo targeted > /tmp/adversarial-phase-b1-v2-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m pytest -q tests/test_adversarial_acceleration_contract.py tests/test_acceleration_foundation.py tests/test_acceleration_hardening.py tests/test_acceleration_coverage.py tests/test_acceleration_batch.py tests/test_performance_optimizations.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run complete deterministic and benchmark gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/adversarial-phase-b1-v2-stage
          python scripts/run_tests.py --coverage | tee /tmp/adversarial-phase-b1-v2-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/adversarial-phase-b1-v2-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/adversarial-phase-b1-v2-benchmark.json
          python -m pytest -q
          python scripts/build_manifest.py --check
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Publish validated acceleration contract
        shell: bash
        run: |
          set -Eeuo pipefail
          echo publish > /tmp/adversarial-phase-b1-v2-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Bind acceleration plans to complete resource contracts'
          git push origin HEAD:refs/heads/main
          echo "PUBLISHED=true" >> "$GITHUB_ENV"
          FINAL_SHA="$(git rev-parse HEAD)"
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Adversarial Phase B1 passed at \`$FINAL_SHA\`: direct and JSON resource requests share fail-closed validation; device and inventory records are validated; acceleration plans preserve precision, determinism, resource constraints and request hashes; local memory requirements and disabled fallback are never silently weakened. Complete gates passed. No branch or PR was created."

      - name: Fail closed
        if: ${{ failure() && env.PUBLISHED != 'true' }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/adversarial-phase-b1-v2-stage 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          git read-tree --reset -u "$CLEAN_BASELINE_SHA"
          git clean -fd
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Restore Phase A computation skill at $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Adversarial Phase B1 V2 failed closed at stage: $stage. Actions run: $GITHUB_RUN_ID. The tree was restored to $CLEAN_BASELINE_SHA. No branch or PR was created." || true
          exit 1
