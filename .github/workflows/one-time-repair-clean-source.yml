name: One-time repair SciComputation clean source identity

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: >-
      github.event.issue.number == 162 &&
      github.event.comment.body == '/repair-clean-source-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: pip
      - name: Install qualification environment
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Remove harness files and regenerate exact evidence
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/one-time-six-hour-active.yml /tmp/sci-six-hour-active-template.yml
          rm -f \
            .github/workflows/one-time-six-hour-active.yml \
            .github/workflows/one-time-six-hour-controller.yml \
            .github/workflows/one-time-repair-clean-source.yml
          python scripts/build_acceleration_audits.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git diff --check
      - name: Run clean-source qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_all.py --profile core
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
          python -m pytest -q \
            tests/test_performance_v9.py \
            tests/test_performance_optimizations.py
          python scripts/run_large_parser_regression.py
          python scripts/build_manifest.py --check
          git diff --check
      - name: Publish exact clean source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refresh exact qualification evidence after merge"
          clean_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "clean_sha=$clean_sha" >> "$GITHUB_OUTPUT"
      - name: Generate isolated six-hour harness bound to clean source
        id: harness
        shell: bash
        env:
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          clean_sha = os.environ['CLEAN_SHA']
          template = Path('/tmp/sci-six-hour-active-template.yml').read_text(
              encoding='utf-8'
          )
          old_sha = '1a2cf71b43a0614121439284681a570b23d5d251'
          if template.count(old_sha) < 2:
              raise SystemExit('old SciComputation target was not found')
          template = template.replace(old_sha, clean_sha)

          if template.count('/run-six-hour-active-v3') != 3:
              raise SystemExit('SciComputation command count drifted')
          template = template.replace(
              '/run-six-hour-active-v3',
              '/run-six-hour-active-v4',
          )

          replacements = (
              (
                  'mkdir -p six-hour-evidence',
                  'mkdir -p "$RUNNER_TEMP/six-hour-evidence"',
                  2,
              ),
              (
                  'evidence_dir = Path("six-hour-evidence")',
                  'evidence_dir = Path(os.environ["RUNNER_TEMP"]) / "six-hour-evidence"',
                  2,
              ),
          )
          for old, new, expected in replacements:
              observed = template.count(old)
              if observed != expected:
                  raise SystemExit(
                      f'SciComputation harness drift for {old!r}: {observed}'
                  )
              template = template.replace(old, new)

          if template.count('path: six-hour-evidence/') != 2:
              raise SystemExit('SciComputation upload path count drifted')
          expression = '$' + '{{ runner.temp }}'
          template = template.replace(
              'path: six-hour-evidence/',
              f'path: {expression}/six-hour-evidence/',
          )
          Path('.github/workflows/one-time-six-hour-active.yml').write_text(
              template,
              encoding='utf-8',
          )
          PY
          git add .github/workflows/one-time-six-hour-active.yml
          git diff --cached --check
          git commit -m "ci: bind SciComputation six-hour soak to clean source"
          harness_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "harness_sha=$harness_sha" >> "$GITHUB_OUTPUT"
      - name: Record repair and harness publication
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
          HARNESS_SHA: ${{ steps.harness.outputs.harness_sha }}
        run: |
          set -euo pipefail
          gh issue comment 162 --repo "$GITHUB_REPOSITORY" --body "SciComputation exact-source repair: **${{ job.status }}**.

- clean qualified source: \`${CLEAN_SHA:-UNPUBLISHED}\`
- isolated soak-harness commit: \`${HARNESS_SHA:-UNPUBLISHED}\`
- next exact command: \`/run-six-hour-active-v4\`
- failed merge-SHA run contributes \`0 ns\`

The source manifest, security scan and acceleration audit were regenerated before core, native, quality, package and performance qualification. No Gate was lowered."
