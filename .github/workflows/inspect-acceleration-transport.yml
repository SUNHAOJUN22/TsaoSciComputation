name: Inspect acceleration foundation transport

on:
  push:
    branches: [main]
    paths: [.inspect-acceleration-transport-trigger]

permissions:
  contents: write

concurrency:
  group: inspect-acceleration-transport-main
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Decode, inspect, report and self-clean
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/inspect-acceleration-transport.yml \
            .inspect-acceleration-transport-trigger
          python - <<'PY'
          from __future__ import annotations
          import base64,hashlib,json,tarfile,zipfile
          from datetime import datetime,timezone
          from pathlib import Path,PurePosixPath

          parts=sorted(Path('tools').glob('acceleration-foundation-v1.part-*.b85'))
          if not parts:
              raise SystemExit('no acceleration transport parts found')
          encoded=''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          decoded=base64.b85decode(encoded.encode('ascii'))
          payload=Path('/tmp/acceleration-foundation-v1.payload')
          payload.write_bytes(decoded)
          members=[]
          archive_type='unknown'
          unsafe=[]
          binaries=[]
          total_uncompressed=0
          def inspect_name(name: str, size: int, kind: str) -> None:
              global total_uncompressed
              normalized=PurePosixPath(name)
              if normalized.is_absolute() or '..' in normalized.parts or '\\' in name:
                  unsafe.append(name)
              suffix=normalized.suffix.lower()
              if suffix in {'.so','.dll','.dylib','.exe','.bin','.o','.a','.lib','.whl','.zip','.gz','.xz','.bz2'}:
                  binaries.append(name)
              total_uncompressed += size
              members.append({'path':name,'bytes':size,'kind':kind})
          if zipfile.is_zipfile(payload):
              archive_type='zip'
              with zipfile.ZipFile(payload) as archive:
                  for info in archive.infolist():
                      inspect_name(info.filename, info.file_size, 'directory' if info.is_dir() else 'file')
          else:
              try:
                  with tarfile.open(payload, mode='r:*') as archive:
                      archive_type='tar'
                      for info in archive.getmembers():
                          kind='file' if info.isfile() else 'directory' if info.isdir() else 'other'
                          inspect_name(info.name, info.size, kind)
              except tarfile.TarError:
                  pass
          report={
              'schema_version':'1.0',
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'transport_parts':[{'path':p.as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in parts],
              'encoded_characters':len(encoded),
              'decoded_bytes':len(decoded),
              'decoded_sha256':hashlib.sha256(decoded).hexdigest(),
              'magic_hex':decoded[:16].hex(),
              'archive_type':archive_type,
              'member_count':len(members),
              'total_uncompressed_bytes':total_uncompressed,
              'unsafe_paths':unsafe,
              'binary_members':binaries,
              'members':members,
              'status':'PASS' if archive_type!='unknown' and not unsafe and not binaries else 'BLOCKED',
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/ACCELERATION_FOUNDATION_TRANSPORT_INSPECTION.json').write_text(
              json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          if report['status']!='PASS':
              raise SystemExit('transport inspection blocked')
          PY
          python scripts/build_manifest.py
          git add -A
          git commit -m 'Inspect acceleration foundation transport'
          git push origin HEAD:refs/heads/main
