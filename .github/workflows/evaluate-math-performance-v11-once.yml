name: Evaluate mathematical performance V11 once

on:
  push:
    branches: [main]
    paths: [.evaluate-math-performance-v11]

permissions:
  contents: write
  issues: write

concurrency:
  group: evaluate-math-performance-v11-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  ISSUE_NUMBER: '52'
  BASELINE_SHA: '4fe936e9446bebd81c0e7b1c1d5c3bd0e403f385'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Initialize isolated baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/math-v11-baseline
          git worktree add --detach /tmp/math-v11-baseline "$BASELINE_SHA"

      - name: Install validation environment
        run: python -m pip install -e '.[validation,quality]'

      - name: Apply candidate changes only in the evaluation workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected one patch anchor in {path}, found {text.count(old)}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'tsao_computation/accelerators/planner.py',
              'from dataclasses import asdict, dataclass\nfrom typing import Any\n',
              'from dataclasses import asdict, dataclass\nfrom functools import cache\nfrom typing import Any\n',
          )
          replace_once(
              'tsao_computation/accelerators/planner.py',
              '''def _profile(slug: str) -> dict[str, Any]:
    for record in accelerator_records():
        if str(record.get("slug")) == slug:
            return dict(record)
    raise KeyError(f"unknown accelerator profile: {slug}")
''',
              '''@cache
def _profile(slug: str) -> dict[str, Any]:
    for record in accelerator_records():
        if str(record.get("slug")) == slug:
            return dict(record)
    raise KeyError(f"unknown accelerator profile: {slug}")
''',
          )
          replace_once(
              'tsao_computation/accelerators/planner.py',
              '\n\nacceleration_plan = plan_acceleration\n',
              '''

def clear_acceleration_caches() -> None:
    _profile.cache_clear()


acceleration_plan = plan_acceleration
''',
          )
          replace_once(
              'tsao_computation/registries/loader.py',
              '''    from ..adapters.registry import clear_adapter_caches
    from ..routing.router import clear_routing_caches

    clear_adapter_caches()
    clear_routing_caches()
    _load.cache_clear()
''',
              '''    from ..accelerators.planner import clear_acceleration_caches
    from ..adapters.registry import clear_adapter_caches
    from ..routing.router import clear_routing_caches

    clear_acceleration_caches()
    clear_adapter_caches()
    clear_routing_caches()
    _load.cache_clear()
''',
          )

          replace_once(
              'tsao_computation/routing/router.py',
              '''@lru_cache(maxsize=_ROUTE_CACHE_SIZE)
def _route_cached(question: str) -> RouteDecision:
    text = question.casefold()
    tokens = _tokens_from_folded(text)
''',
              '''@lru_cache(maxsize=_ROUTE_CACHE_SIZE)
def _route_cached(text: str) -> RouteDecision:
    tokens = _tokens_from_folded(text)
''',
          )
          replace_once(
              'tsao_computation/routing/router.py',
              '''def route_question(question: str) -> RouteDecision:
    if not question.strip():
        raise ValueError("question must be non-empty")
    return _route_cached(question)
''',
              '''def route_question(question: str) -> RouteDecision:
    normalized = question.strip().casefold()
    if not normalized:
        raise ValueError("question must be non-empty")
    return _route_cached(normalized)
''',
          )

          replace_once(
              'tsao_computation/validation/scientific_benchmarks.py',
              '''    dr = radius / intervals

    def velocity(radial_position: float) -> float:
        return pressure_drop * (radius**2 - radial_position**2) / (4.0 * viscosity * length)

    integral = 0.0
    for index in range(intervals + 1):
        radial_position = index * dr
        weight = 0.5 if index in (0, intervals) else 1.0
        integral += weight * velocity(radial_position) * radial_position
''',
              '''    dr = radius / intervals
    velocity_scale = pressure_drop / (4.0 * viscosity * length)
    radius_squared = radius * radius

    integral = 0.0
    for index in range(intervals + 1):
        radial_position = index * dr
        weight = 0.5 if index in (0, intervals) else 1.0
        velocity = velocity_scale * (radius_squared - radial_position * radial_position)
        integral += weight * velocity * radial_position
''',
          )
          replace_once(
              'tsao_computation/validation/scientific_benchmarks.py',
              '''    concentration = 1.0

    def derivative(value: float) -> float:
        return -rate_constant * value

    for _ in range(steps):
        k1 = derivative(concentration)
        k2 = derivative(concentration + 0.5 * step * k1)
        k3 = derivative(concentration + 0.5 * step * k2)
        k4 = derivative(concentration + step * k3)
        concentration += step * (k1 + 2.0 * k2 + 2.0 * k3 + k4) / 6.0
''',
              '''    concentration = 1.0
    half_step = 0.5 * step
    sixth_step = step / 6.0

    for _ in range(steps):
        k1 = -rate_constant * concentration
        k2 = -rate_constant * (concentration + half_step * k1)
        k3 = -rate_constant * (concentration + half_step * k2)
        k4 = -rate_constant * (concentration + step * k3)
        concentration += sixth_step * (k1 + 2.0 * k2 + 2.0 * k3 + k4)
''',
          )
          replace_once(
              'tsao_computation/validation/scientific_benchmarks.py',
              '''    time_step, steps = 0.002, 5000
    position, velocity, acceleration = 1.0, 0.0, -1.0
    initial_energy, maximum_drift = 0.5, 0.0
    for _ in range(steps):
        position += velocity * time_step + 0.5 * acceleration * time_step**2
        next_acceleration = -position
        velocity += 0.5 * (acceleration + next_acceleration) * time_step
''',
              '''    time_step, steps = 0.002, 5000
    position, velocity, acceleration = 1.0, 0.0, -1.0
    initial_energy, maximum_drift = 0.5, 0.0
    half_time_step = 0.5 * time_step
    half_time_step_squared = half_time_step * time_step
    for _ in range(steps):
        position += velocity * time_step + acceleration * half_time_step_squared
        next_acceleration = -position
        velocity += (acceleration + next_acceleration) * half_time_step
''',
          )
          PY
          python -m ruff check --fix tsao_computation/accelerators/planner.py tsao_computation/registries/loader.py tsao_computation/routing/router.py tsao_computation/validation/scientific_benchmarks.py
          python -m ruff format tsao_computation/accelerators/planner.py tsao_computation/registries/loader.py tsao_computation/routing/router.py tsao_computation/validation/scientific_benchmarks.py

      - name: Measure isolated baseline and candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/measure_math_v11.py <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import statistics
          import sys
          import time
          from pathlib import Path

          def median(operation, repeats: int, loops: int = 1, warmups: int = 2) -> float:
              for _ in range(warmups):
                  operation()
              samples = []
              for _ in range(repeats):
                  started = time.perf_counter()
                  for _ in range(loops):
                      operation()
                  samples.append((time.perf_counter() - started) / loops)
              return statistics.median(samples)

          parser = argparse.ArgumentParser()
          parser.add_argument('--root', type=Path, required=True)
          parser.add_argument('--output', type=Path, required=True)
          args = parser.parse_args()
          root = args.root.resolve()
          sys.path.insert(0, str(root))

          from tsao_computation.accelerators import AcceleratorBackend, AcceleratorInventory, PlacementTarget, plan_acceleration
          from tsao_computation.routing import router
          from tsao_computation.routing.router import route_question
          from tsao_computation.validation.scientific_benchmarks import run_all

          inventory = AcceleratorInventory(
              logical_cpu_count=16,
              architecture='benchmark',
              operating_system='benchmark',
              memory_gib=64.0,
              backends=(AcceleratorBackend.CPU, AcceleratorBackend.OPENMP, AcceleratorBackend.TASK_PARALLEL),
              placements=(PlacementTarget.LOCAL,),
          )
          resources = {'preferred_backends': ['cuda', 'openmp', 'cpu'], 'accelerator_policy': 'preferred', 'cpu_cores': 8}
          plan = lambda: plan_acceleration('gromacs', resources, inventory=inventory)
          plan_seconds = median(plan, repeats=11, loops=2000, warmups=3)
          plan_payload = plan().to_dict()

          variants = []
          for index in range(900):
              phrase = 'MOLECULAR DYNAMICS SIMULATION' if index % 2 else 'molecular dynamics simulation'
              variants.append((' ' * (index % 300)) + phrase + ('\t' * (1 + index // 300)))

          def route_variants():
              for item in variants:
                  route_question(item)

          router.clear_routing_caches()
          route_seconds = median(route_variants, repeats=7, warmups=1)
          route_payload = [route_question(item).workflow for item in variants[:12]]
          route_cache_size = router._route_cached.cache_info().currsize

          benchmark_seconds = median(run_all, repeats=11, loops=20, warmups=3)
          benchmark_payload = [item.to_dict() for item in run_all()]

          payload = {
              'source_root': str(root),
              'plan_seconds': plan_seconds,
              'plan_payload': plan_payload,
              'route_variant_seconds': route_seconds,
              'route_payload': route_payload,
              'route_cache_size': route_cache_size,
              'benchmark_seconds': benchmark_seconds,
              'benchmark_payload': benchmark_payload,
          }
          args.output.write_text(json.dumps(payload, indent=2, sort_keys=True, allow_nan=False) + '\n', encoding='utf-8')
          PY
          python /tmp/measure_math_v11.py --root /tmp/math-v11-baseline --output /tmp/math-v11-baseline.json
          python /tmp/measure_math_v11.py --root "$GITHUB_WORKSPACE" --output /tmp/math-v11-candidate.json

          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path('/tmp/math-v11-baseline.json').read_text(encoding='utf-8'))
          candidate = json.loads(Path('/tmp/math-v11-candidate.json').read_text(encoding='utf-8'))
          speedups = {
              'acceleration_plan': baseline['plan_seconds'] / candidate['plan_seconds'],
              'semantic_route_variants': baseline['route_variant_seconds'] / candidate['route_variant_seconds'],
              'scientific_benchmarks': baseline['benchmark_seconds'] / candidate['benchmark_seconds'],
          }
          benchmark_semantics = all(
              left['benchmark_id'] == right['benchmark_id']
              and left['passed'] == right['passed']
              and abs(left['observed'] - right['observed']) <= max(left['tolerance'], right['tolerance'], 1e-15)
              for left, right in zip(baseline['benchmark_payload'], candidate['benchmark_payload'], strict=True)
          )
          decisions = {
              'cached_acceleration_profile': (
                  'ACCEPT' if baseline['plan_payload'] == candidate['plan_payload'] and speedups['acceleration_plan'] >= 1.03 else 'REJECT'
              ),
              'normalized_route_cache_key': (
                  'ACCEPT' if baseline['route_payload'] == candidate['route_payload'] and speedups['semantic_route_variants'] >= 2.0 and candidate['route_cache_size'] <= 4 else 'REJECT'
              ),
              'scientific_benchmark_hot_loops': (
                  'ACCEPT' if benchmark_semantics and speedups['scientific_benchmarks'] >= 1.03 else 'REJECT'
              ),
          }
          report = {
              'schema_version': '1.0',
              'baseline_sha': '4fe936e9446bebd81c0e7b1c1d5c3bd0e403f385',
              'baseline': baseline,
              'candidate': candidate,
              'speedups': speedups,
              'benchmark_semantics_preserved': benchmark_semantics,
              'decisions': decisions,
              'claim_boundary': 'Repository-local Python planning, routing and deterministic benchmark kernels only; no external solver or hardware speedup is claimed.',
          }
          Path('/tmp/math-v11-report.json').write_text(json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Run candidate correctness checks
        run: |
          python -m pytest -q tests/test_acceleration_foundation.py tests/test_acceleration_v11.py tests/test_routing_cache.py tests/test_scientific_benchmarks.py tests/test_math_performance_v10.py
          python -m mypy --python-version 3.13 tsao_computation/accelerators tsao_computation/registries tsao_computation/routing tsao_computation/validation

      - name: Report measurements
        shell: bash
        run: |
          python - <<'PY' > /tmp/math-v11-comment.md
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/math-v11-report.json').read_text(encoding='utf-8'))
          s = report['speedups']
          d = report['decisions']
          b = report['baseline']
          c = report['candidate']
          print('# Mathematical performance V11 candidate evaluation')
          print()
          print(f"- Cached acceleration-profile lookup: **{s['acceleration_plan']:.3f}×** — `{d['cached_acceleration_profile']}`")
          print(f"- Normalized semantic routing cache: **{s['semantic_route_variants']:.3f}×** — `{d['normalized_route_cache_key']}`")
          print(f"- Scientific benchmark hot loops: **{s['scientific_benchmarks']:.3f}×** — `{d['scientific_benchmark_hot_loops']}`")
          print(f"- Routing cache entries: baseline **{b['route_cache_size']}**, candidate **{c['route_cache_size']}**")
          print(f"- Benchmark semantics preserved: **{report['benchmark_semantics_preserved']}**")
          print()
          print('No candidate has been committed by this evaluation. Only ACCEPT decisions are eligible for the final patch.')
          PY
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/math-v11-comment.md

      - name: Remove temporary evaluation automation
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          git reset --hard "$ORIGINAL_SHA"
          rm -f .github/workflows/evaluate-math-performance-v11-once.yml
          rm -f .evaluate-math-performance-v11
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m 'Remove completed V11 candidate evaluation' || true
          git push origin HEAD:refs/heads/main || true
