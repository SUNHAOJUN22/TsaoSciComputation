name: Ultimate code quality finalization once

on:
  push:
    branches: [main]
    paths: [.run-ultimate-code-quality-finalization]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: ultimate-code-quality-finalization-main
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/ultimate-code-quality-coverage.json
  ISSUE_NUMBER: '40'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Initialize finalization state
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=false" >> "$GITHUB_ENV"
          echo initialization > /tmp/ultimate-final-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Remove temporary automation and enforce main only
        shell: bash
        run: |
          set -Eeuo pipefail
          echo cleanup-and-branch-policy > /tmp/ultimate-final-stage

          find .github/workflows -maxdepth 1 -type f -name '*.yml' \
            ! -name ci.yml \
            ! -name codeql.yml \
            ! -name dependency-audit.yml \
            ! -name release.yml \
            -delete
          find . -maxdepth 1 -type f \( \
            -name '.run-*' -o \
            -name '.apply-*' -o \
            -name '.finalize-*' -o \
            -name '.trigger-*' \
          \) -delete
          rm -f docs/ULTIMATE_FINALIZATION_AUDIT.md
          rm -f docs/assets/.gitkeep
          rmdir docs/assets 2>/dev/null || true
          rm -f reports/ACCELERATION_FOUNDATION_V1_1_BLOCKED.json
          rm -f reports/ACCELERATION_FOUNDATION_V1_1_CANDIDATE.json

          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          for branch in "${branches[@]}"; do
            [[ "$branch" == main ]] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
          mapfile -t remaining < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = main

      - name: Install complete validation environment
        run: |
          echo install > /tmp/ultimate-final-stage
          python -m pip install -e '.[validation,quality,security]'

      - name: Repair formatting and synchronize generated content
        shell: bash
        run: |
          set -Eeuo pipefail
          echo format-and-generate > /tmp/ultimate-final-stage
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/regenerate_readme_visuals_v13.py
          python scripts/sync_package_assets.py
          python scripts/build_adapter_docs.py
          python scripts/build_workflow_docs.py
          python scripts/build_examples.py
          python scripts/build_manifest.py
          python scripts/regenerate_readme_visuals_v13.py --check

      - name: Run complete deterministic and benchmark gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo deterministic-gates > /tmp/ultimate-final-stage
          python scripts/run_tests.py --coverage | tee /tmp/ultimate-run-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/ultimate-all-timing.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/ultimate-benchmark-timing.json
          python scripts/verify_native_core.py > /tmp/ultimate-native-core.json

      - name: Run independent security dependency package and final test checks
        shell: bash
        run: |
          set -Eeuo pipefail
          echo independent-gates > /tmp/ultimate-final-stage
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/ultimate-dependency-audit.json
          rm -rf /tmp/ultimate-build /tmp/ultimate-wheel-venv
          python -m build --outdir /tmp/ultimate-build
          python -m venv /tmp/ultimate-wheel-venv
          /tmp/ultimate-wheel-venv/bin/python -m pip install --no-deps /tmp/ultimate-build/*.whl
          /tmp/ultimate-wheel-venv/bin/python -c 'import tsao_computation; print(tsao_computation.__version__)'
          python -m pytest -q | tee /tmp/ultimate-final-pytest.log
          git ls-remote --heads origin | sort > /tmp/ultimate-remote-heads.txt

      - name: Synchronize README and current-main evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence-and-readme > /tmp/ultimate-final-stage
          python scripts/update_main_audit_evidence.py \
            --root . \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$ISSUE_NUMBER" \
            --test-log /tmp/ultimate-final-pytest.log \
            --coverage-json /tmp/ultimate-code-quality-coverage.json \
            --dependency-json /tmp/ultimate-dependency-audit.json \
            --security-json evidence/security-scan.json \
            --remote-heads /tmp/ultimate-remote-heads.txt \
            --parent-commit "$ORIGINAL_SHA" \
            --audit-generation ultimate-code-quality-finalization-v1 \
            --audit-label V13-final \
            --visual-count 42 \
            --visual-atlas-version 13 \
            --report-path reports/ULTIMATE_CODE_QUALITY_FINALIZATION.md \
            --visual-families 'Electronic structure and molecular simulation; materials and interfaces; continuum and process engineering; evidence governance and HPC.'
          python scripts/build_manifest.py

      - name: Verify the exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo exact-final-tree > /tmp/ultimate-final-stage
          python scripts/sync_version_metadata.py --check
          python scripts/regenerate_readme_visuals_v13.py --check
          python scripts/validate_schemas.py
          python scripts/validate_adapter_metadata.py
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python scripts/verify_all.py --profile all --timing-json /tmp/ultimate-final-tree-timing.json
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python -m pytest -q
          test "$(find assets/visuals -maxdepth 1 -type f -name '*.svg' | wc -l)" -eq 42
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml)
          test "${workflows[*]}" = "${expected[*]}"
          mapfile -t remaining < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = main

      - name: Commit final verified state directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo final-commit > /tmp/ultimate-final-stage
          git add -A
          if git diff --cached --quiet; then
            git commit --allow-empty -m 'Ultimate code quality finalization'
          else
            git commit -m 'Ultimate code quality finalization'
          fi
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=true" >> "$GITHUB_ENV"

      - name: Require production CI and CodeQL on final commit
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production-ci > /tmp/ultimate-final-stage
          wait_for_workflow() {
            local workflow="$1"
            local line run_id status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$FINAL_SHA" \
                --workflow "$workflow" --limit 1 \
                --json databaseId,status,conclusion,url \
                --jq '.[0] | [.databaseId,.status,.conclusion,.url] | @tsv' 2>/dev/null || true)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r run_id status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  echo "$workflow: $conclusion ($url)"
                  [[ "$conclusion" == success ]]
                  return
                fi
              fi
              sleep 10
            done
            echo "Timed out waiting for $workflow on $FINAL_SHA" >&2
            return 1
          }
          wait_for_workflow ci.yml
          wait_for_workflow codeql.yml

      - name: Report successful completion
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Ultimate code quality finalization passed every deterministic gate, benchmark, coverage, final pytest, security scan, dependency audit, package/Wheel check, 42-SVG validation, Manifest check, production CI and CodeQL on commit $FINAL_SHA. The remote contains only main; no branch or pull request was created."

      - name: Clean up safely and report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/ultimate-final-stage 2>/dev/null || echo unknown)"
          if [[ "$FINAL_PUSHED" != true ]]; then
            git reset --hard "$ORIGINAL_SHA"
            find .github/workflows -maxdepth 1 -type f -name '*.yml' \
              ! -name ci.yml \
              ! -name codeql.yml \
              ! -name dependency-audit.yml \
              ! -name release.yml \
              -delete
            find . -maxdepth 1 -type f \( -name '.run-*' -o -name '.apply-*' -o -name '.finalize-*' -o -name '.trigger-*' \) -delete
            python scripts/build_manifest.py || true
            git add -A
            git commit -m 'Remove failed ultimate finalization automation' || true
            git push origin HEAD:refs/heads/main || true
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Ultimate code quality finalization did not complete at stage: $stage. Run: $GITHUB_RUN_ID. No branch or PR was created; temporary automation was removed when possible. No successful completion is claimed." || true
          exit 1
