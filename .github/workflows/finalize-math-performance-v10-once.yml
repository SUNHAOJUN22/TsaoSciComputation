name: Final mathematical performance certification V10 once

on:
  push:
    branches: [main]
    paths: [.run-final-math-performance-v10]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: final-math-performance-v10-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/math-v10-final-coverage.json
  ISSUE_NUMBER: '48'
  BASELINE_SHA: f405ed6ea9e1aa964ddc8aee24c955cd7526bb44

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Initialize exact candidate and baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=false" >> "$GITHUB_ENV"
          echo initialize > /tmp/math-v10-final-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/finalize-math-performance-v10-once.yml
          rm -f .run-final-math-performance-v10
          rm -f reports/MATH_PERFORMANCE_AUDIT_V10_FAILURE.json
          rm -rf /tmp/math-v10-final-baseline
          git worktree add --detach /tmp/math-v10-final-baseline "$BASELINE_SHA"

      - name: Install complete validation environment
        run: |
          echo install > /tmp/math-v10-final-stage
          python -m pip install -e '.[validation,quality,security]'

      - name: Normalize formatting and generated content
        shell: bash
        run: |
          set -Eeuo pipefail
          echo normalize > /tmp/math-v10-final-stage
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/regenerate_readme_visuals_v13.py
          python scripts/sync_package_assets.py
          python scripts/build_adapter_docs.py
          python scripts/build_workflow_docs.py
          python scripts/build_examples.py
          python scripts/build_manifest.py

      - name: Create same-host mathematical benchmark harness
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/math_v10_final_bench.py <<'PY'
          from __future__ import annotations

          import json
          import math
          import statistics
          import time
          import tracemalloc

          from tsao_computation.accelerators import (
              AcceleratorBackend,
              AcceleratorInventory,
              PlacementTarget,
              plan_acceleration,
          )
          from tsao_computation.adapters import get_adapter
          from tsao_computation.uncertainty.model import combine_independent
          from tsao_computation.validation.numerical import convergence_check
          from tsao_computation.validation.physical import balance_check
          from tsao_computation.validation.scientific_benchmarks import run_all


          def median(operation, *, repeats=7, loops=1, warmups=2):
              for _ in range(warmups):
                  operation()
              samples = []
              for _ in range(repeats):
                  started = time.perf_counter()
                  for _ in range(loops):
                      operation()
                  samples.append((time.perf_counter() - started) / loops)
              return statistics.median(samples)


          payload = ("iteration converged completed\n" * 800_000)[: 20 * 1024 * 1024]
          adapter = get_adapter("orca")
          parser_seconds = median(lambda: adapter.parse(payload), repeats=7, warmups=2)
          parser_mib_s = (len(payload.encode("utf-8")) / (1024 * 1024)) / parser_seconds

          inventory = AcceleratorInventory(
              logical_cpu_count=16,
              architecture="benchmark",
              operating_system="benchmark",
              memory_gib=64.0,
              backends=(
                  AcceleratorBackend.CPU,
                  AcceleratorBackend.OPENMP,
                  AcceleratorBackend.TASK_PARALLEL,
              ),
              placements=(PlacementTarget.LOCAL,),
          )
          resources = {
              "preferred_backends": ["cuda", "openmp", "cpu"],
              "accelerator_policy": "preferred",
              "cpu_cores": 8,
          }
          plan_seconds = median(
              lambda: plan_acceleration("gromacs", resources, inventory=inventory),
              repeats=11,
              loops=1_000,
              warmups=3,
          )

          def convergence_operation():
              return convergence_check(
                  (1.0 + 1.0 / (index + 2) for index in range(250_000)),
                  absolute_tolerance=1.0e-8,
                  relative_tolerance=1.0e-8,
              )

          convergence_seconds = median(convergence_operation, repeats=7, warmups=2)
          tracemalloc.start()
          convergence_result = convergence_operation()
          _, convergence_peak = tracemalloc.get_traced_memory()
          tracemalloc.stop()

          uncertainty_seconds = median(
              lambda: combine_independent(0.12, 0.08, 0.04),
              repeats=11,
              loops=20_000,
              warmups=3,
          )
          extreme_uncertainty = combine_independent(1.0e308, 1.0e308)
          balance = balance_check(1.0e16, 1.0, 1.0e16, tolerance=0.0)
          benchmark_seconds = median(run_all, repeats=9, warmups=2)
          benchmark_results = run_all()

          result = {
              "schema_version": "1.0",
              "parser_20mib_throughput_mib_s": parser_mib_s,
              "acceleration_plan_seconds": plan_seconds,
              "convergence_250k_seconds": convergence_seconds,
              "convergence_250k_peak_bytes": convergence_peak,
              "convergence_result": convergence_result,
              "uncertainty_seconds": uncertainty_seconds,
              "extreme_uncertainty_finite": math.isfinite(extreme_uncertainty),
              "extreme_uncertainty": extreme_uncertainty if math.isfinite(extreme_uncertainty) else None,
              "compensated_balance_residual": balance["residual"],
              "scientific_benchmarks_seconds": benchmark_seconds,
              "scientific_benchmarks_passed": sum(item.passed for item in benchmark_results),
          }
          print(json.dumps(result, indent=2, sort_keys=True, allow_nan=False))
          PY

      - name: Measure baseline and candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo benchmark > /tmp/math-v10-final-stage
          (
            cd /tmp/math-v10-final-baseline
            PYTHONPATH=/tmp/math-v10-final-baseline python /tmp/math_v10_final_bench.py \
              > /tmp/math-v10-final-baseline.json
          )
          PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/math_v10_final_bench.py \
            > /tmp/math-v10-final-candidate.json
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path('/tmp/math-v10-final-baseline.json').read_text(encoding='utf-8'))
          candidate = json.loads(Path('/tmp/math-v10-final-candidate.json').read_text(encoding='utf-8'))
          speedups = {
              'parser': candidate['parser_20mib_throughput_mib_s'] / baseline['parser_20mib_throughput_mib_s'],
              'acceleration_plan': baseline['acceleration_plan_seconds'] / candidate['acceleration_plan_seconds'],
              'convergence_time': baseline['convergence_250k_seconds'] / candidate['convergence_250k_seconds'],
              'uncertainty': baseline['uncertainty_seconds'] / candidate['uncertainty_seconds'],
              'scientific_benchmarks': baseline['scientific_benchmarks_seconds'] / candidate['scientific_benchmarks_seconds'],
          }
          memory_ratio = candidate['convergence_250k_peak_bytes'] / baseline['convergence_250k_peak_bytes']
          acceptance = {
              'parser_no_material_regression': speedups['parser'] >= 0.95,
              'acceleration_plan_meaningful_speedup': speedups['acceleration_plan'] >= 1.10,
              'convergence_time_no_material_regression': speedups['convergence_time'] >= 0.75,
              'convergence_peak_memory_reduced_at_least_75_percent': memory_ratio <= 0.25,
              'scientific_benchmark_no_material_regression': speedups['scientific_benchmarks'] >= 0.85,
              'all_scientific_benchmarks_pass': candidate['scientific_benchmarks_passed'] == 8,
              'extreme_uncertainty_is_finite': candidate['extreme_uncertainty_finite'] is True,
              'compensated_balance_preserves_small_residual': candidate['compensated_balance_residual'] == -1.0,
          }
          report = {
              'schema_version': '1.0',
              'baseline_sha': 'f405ed6ea9e1aa964ddc8aee24c955cd7526bb44',
              'candidate_source_sha': None,
              'baseline': baseline,
              'candidate': candidate,
              'speedups': speedups,
              'convergence_peak_memory_ratio': memory_ratio,
              'acceptance': acceptance,
              'status': 'PASS' if all(acceptance.values()) else 'FAIL',
              'claim_boundary': (
                  'Same-host repository-local Python mathematical kernels, parser and acceleration '
                  'planning only; no external solver, GPU kernel or production-HPC speedup is claimed.'
              ),
          }
          Path('/tmp/math-v10-final-comparison.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps(report, sort_keys=True))
          if report['status'] != 'PASS':
              raise SystemExit('mathematical performance acceptance failed')
          PY

      - name: Run targeted and complete validation gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo full-gates > /tmp/math-v10-final-stage
          python -m pytest -q \
            tests/test_math_performance_v10.py \
            tests/test_performance_optimizations.py \
            tests/test_validation_fail_closed.py \
            tests/test_scientific_benchmarks.py \
            tests/test_acceleration_foundation.py \
            tests/test_acceleration_v11.py \
            tests/test_acceleration_coverage.py
          python scripts/run_tests.py --coverage | tee /tmp/math-v10-final-pytest.log
          python scripts/verify_all.py --profile all --timing-json /tmp/math-v10-final-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/math-v10-final-benchmark.json
          python scripts/verify_native_core.py > /tmp/math-v10-final-native.json
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/math-v10-final-dependencies.json
          rm -rf /tmp/math-v10-final-build
          python -m build --outdir /tmp/math-v10-final-build
          python -m pytest -q
          git ls-remote --heads origin | sort > /tmp/math-v10-final-heads.txt
          test "$(awk '{print $2}' /tmp/math-v10-final-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Update README, performance evidence and current-main evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/math-v10-final-stage
          python scripts/update_main_audit_evidence.py \
            --root . \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$ISSUE_NUMBER" \
            --test-log /tmp/math-v10-final-pytest.log \
            --coverage-json /tmp/math-v10-final-coverage.json \
            --dependency-json /tmp/math-v10-final-dependencies.json \
            --security-json evidence/security-scan.json \
            --remote-heads /tmp/math-v10-final-heads.txt \
            --parent-commit "$ORIGINAL_SHA" \
            --audit-generation math-performance-audit-v10 \
            --audit-label V10-math-performance \
            --visual-count 42 \
            --visual-atlas-version 13 \
            --report-path reports/ULTIMATE_CODE_QUALITY_FINALIZATION.md \
            --visual-families 'Electronic structure and molecular simulation; materials and interfaces; continuum and process engineering; evidence governance and HPC.'
          python - <<'PY'
          import json
          import re
          import subprocess
          import textwrap
          from pathlib import Path

          path = Path('/tmp/math-v10-final-comparison.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          report['candidate_source_sha'] = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          report['audit_generation'] = 'math-performance-audit-v10'
          report['issue'] = 48
          report['changes'] = [
              'Stable independent-uncertainty propagation with math.hypot.',
              'O(1)-memory streaming convergence evaluation with overflow-safe thresholds.',
              'Compensated conservation residuals with math.fsum.',
              'Fail-closed finite scientific benchmark error arithmetic.',
              'Bounded acceleration-library recommendation cache.',
              'Single-pass compiled parser failure-cue prefilter.',
          ]
          destination = Path('reports/MATH_PERFORMANCE_AUDIT_V10.json')
          destination.write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          speedups = report['speedups']
          memory = report['convergence_peak_memory_ratio']
          english = textwrap.dedent(f'''\
          <!-- MATH_PERFORMANCE_V10:START -->
          ### Mathematical correctness and performance V10

          The current main line uses stable uncertainty propagation, streaming convergence checks, compensated conservation residuals, finite benchmark-error arithmetic, cached acceleration-library recommendations and a single-pass parser failure prefilter.

          Same-host measurements versus the previously certified main: parser ratio **{speedups['parser']:.2f}×**, repeated acceleration planning **{speedups['acceleration_plan']:.2f}×**, convergence-time ratio **{speedups['convergence_time']:.2f}×**, and convergence peak traced memory **{memory:.1%}** of baseline. All eight scientific reference benchmarks and the complete deterministic gate passed. These figures cover repository-local Python kernels and orchestration only; they do not claim external-solver, GPU-kernel or production-HPC speedup.

          Machine evidence: [`reports/MATH_PERFORMANCE_AUDIT_V10.json`](reports/MATH_PERFORMANCE_AUDIT_V10.json).
          <!-- MATH_PERFORMANCE_V10:END -->''').strip()
          chinese = textwrap.dedent(f'''\
          <!-- MATH_PERFORMANCE_V10:START -->
          ### 数理正确性与性能 V10

          当前主线采用稳定不确定度合成、流式收敛判定、补偿式守恒残差、有限数基准误差计算、加速库推荐缓存，以及单次扫描的解析失败提示预筛选。

          相对于此前已认证主线的同机实测：解析比值 **{speedups['parser']:.2f}×**、重复加速规划 **{speedups['acceleration_plan']:.2f}×**、收敛计算时间比值 **{speedups['convergence_time']:.2f}×**，收敛判定峰值跟踪内存为基线的 **{memory:.1%}**。8 项科学参考基准和完整确定性门禁全部通过。上述数据仅针对仓库内 Python 数理内核与编排逻辑，不代表外部求解器、GPU 内核或生产 HPC 加速。

          机器证据：[`reports/MATH_PERFORMANCE_AUDIT_V10.json`](reports/MATH_PERFORMANCE_AUDIT_V10.json)。
          <!-- MATH_PERFORMANCE_V10:END -->''').strip()

          def update(filename: str, block: str) -> None:
              target = Path(filename)
              text = target.read_text(encoding='utf-8')
              pattern = re.compile(
                  r'<!-- MATH_PERFORMANCE_V10:START -->.*?<!-- MATH_PERFORMANCE_V10:END -->',
                  re.DOTALL,
              )
              text = pattern.sub(block, text, count=1) if pattern.search(text) else text.rstrip() + '\n\n' + block + '\n'
              target.write_text(text, encoding='utf-8', newline='\n')

          update('README.md', english)
          update('README.zh-CN.md', chinese)
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check

      - name: Validate exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo final-tree > /tmp/math-v10-final-stage
          python scripts/sync_version_metadata.py --check
          python scripts/regenerate_readme_visuals_v13.py --check
          python scripts/validate_schemas.py
          python scripts/validate_adapter_metadata.py
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest -q
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflows[*]}" = "${expected[*]}"
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Commit certified result directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/math-v10-final-stage
          git add -A
          git commit -m 'Improve mathematical stability and performance'
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=true" >> "$GITHUB_ENV"

      - name: Dispatch and require production workflows on exact commit
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production-ci > /tmp/math-v10-final-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$FINAL_SHA"
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
          wait_for_workflow() {
            local workflow="$1"
            local line status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch main --event workflow_dispatch --limit 10 \
                --json headSha,status,conclusion,url \
                --jq ".[] | select(.headSha == \"$FINAL_SHA\") | [.status,.conclusion,.url] | @tsv" \
                | head -n 1)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  echo "$workflow: $conclusion ($url)"
                  [[ "$conclusion" == success ]]
                  return
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for_workflow ci.yml
          wait_for_workflow codeql.yml
          wait_for_workflow scorecard.yml

      - name: Close successful audit
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Mathematical and performance audit V10 passed on commit $FINAL_SHA. Numerical stability, same-host A/B performance, complete tests, coverage, security, dependencies, package, Manifest, CI, CodeQL and OpenSSF Scorecard all passed. No branch or pull request was created."

      - name: Fail closed and remove temporary automation
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/math-v10-final-stage 2>/dev/null || echo unknown)"
          if [[ "$FINAL_PUSHED" != true ]]; then
            git reset --hard "$ORIGINAL_SHA"
            rm -f .github/workflows/finalize-math-performance-v10-once.yml
            rm -f .run-final-math-performance-v10
            mkdir -p reports
            python - "$stage" "$GITHUB_RUN_ID" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          stage, run_id = sys.argv[1], int(sys.argv[2])
          Path('reports/MATH_PERFORMANCE_AUDIT_V10_FAILURE.json').write_text(
              json.dumps(
                  {
                      'schema_version': '1.0',
                      'status': 'FAILED',
                      'stage': stage,
                      'run_id': run_id,
                      'branch': 'main',
                      'temporary_branch_created': False,
                      'created_at_utc': datetime.now(timezone.utc).isoformat(),
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
            python scripts/build_manifest.py || true
            git add -A
            git commit -m "Record final math performance failure at $stage" || true
            git push origin HEAD:refs/heads/main || true
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Final math/performance certification did not complete at stage: $stage. Actions run: $GITHUB_RUN_ID. No branch or PR was created; temporary automation was removed when possible." || true
          exit 1
