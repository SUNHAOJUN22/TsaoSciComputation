name: Final second-pass acceptance

on:
  issues:
    types: [edited]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: final-second-pass-acceptance
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_FINAL_SECOND_PASS_ACCEPTANCE_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete verification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Prepare intended final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo prepare > /tmp/tsao-final-stage
          rm -f .github/workflows/final-second-pass-acceptance.yml
          rm -f reports/CANONICALIZATION_FAILURE_DIAGNOSIS.txt
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest \
            tests/test_readme_visuals.py \
            tests/test_release_governance.py \
            tests/test_canonical_text_writes.py -q
          git diff --check

      - name: Run deterministic release gates pass 1
        shell: bash
        run: |
          set -Eeuo pipefail
          echo deterministic-pass-1 > /tmp/tsao-final-stage
          python scripts/verify_all.py --profile all | tee /tmp/pass1-all.log
          python scripts/verify_all.py --profile benchmark | tee /tmp/pass1-benchmark.log
          python -m pytest -q | tee /tmp/pass1-pytest.log
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check

      - name: Run dependency, security and repository boundary audits
        shell: bash
        run: |
          set -Eeuo pipefail
          echo audits > /tmp/tsao-final-stage
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/dependency-audit.json
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/dependency-audit.json').read_text(encoding='utf-8'))
          print(sum(len(item.get('vulns', [])) for item in payload.get('dependencies', [])))
          PY
          )" -eq 0
          python scripts/security_scan.py
          mapfile -t branches < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main
          git diff --check

      - name: Refresh current-main evidence, README and Changelog
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/tsao-final-stage
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          pytest_text = Path('/tmp/pass1-pytest.log').read_text(encoding='utf-8')
          match = re.search(r'(\d+) passed(?:, (\d+) skipped)? in ', pytest_text)
          if match is None:
              raise SystemExit('unable to parse final pytest summary')
          tests_passed = int(match.group(1))
          coverage = json.loads(
              Path('/tmp/tsao-current-coverage.json').read_text(encoding='utf-8')
          )['totals']
          statement_percent = float(coverage['percent_statements_covered'])
          branch_percent = float(coverage['percent_branches_covered'])
          verified_at = datetime.now(timezone.utc).isoformat()
          finalization_run_id = int(os.environ['GITHUB_RUN_ID'])
          version = (root / 'VERSION').read_text(encoding='utf-8').strip()
          canonical_parent_sha = os.popen('git rev-parse HEAD').read().strip()

          report = {
              'schema_version': '1.2',
              'status': 'VALIDATED',
              'version': version,
              'branch': 'main',
              'verified_at_utc': verified_at,
              'deterministic_finalization_run_id': finalization_run_id,
              'canonical_text_parent_commit': canonical_parent_sha,
              'tests': {'passed': tests_passed, 'failed': 0},
              'coverage': {
                  'statement_percent': statement_percent,
                  'branch_percent': branch_percent,
              },
              'counts': {
                  'capabilities': 164,
                  'adapters': 27,
                  'workflows': 20,
                  'visual_assets': 12,
              },
              'scientific_reference_benchmarks': '8/8',
              'controlled_mutants': '64/64',
              'dependency_vulnerabilities': 0,
              'repository_security_findings': 0,
              'remote_branches': ['main'],
              'source_archives_reproducible': True,
              'wheel_reproducible_and_isolated_install': True,
              'windows_python_310_core': 'PASS',
              'windows_python_313_core': 'PASS',
              'cross_platform_manifest_stability': 'PASS',
              'canonical_generated_text_lf': True,
              'canonical_checkout_lf': True,
              'temporary_branch_created': False,
              'canonical_ci_evidence': (
                  'The final commit CI run is recorded in the closing comment of GitHub Issue #22.'
              ),
              'claim_boundary': (
                  'Validated for repository orchestration, contracts, routing, deterministic '
                  'fixtures, packaging, documentation and cross-platform CI. No live '
                  'third-party solver or production HPC execution is claimed.'
              ),
          }
          (root / 'reports' / 'CURRENT_MAIN_VERIFICATION.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          en = f'''Validated on `{verified_at}` by deterministic finalization run `{finalization_run_id}`.

          | Current-main item | Result |
          |---|---:|
          | Version | {version} |
          | Capabilities / adapters / workflows | 164 / 27 / 20 |
          | Tests | {tests_passed} passed, 0 failed |
          | Statement / branch coverage | {statement_percent:.2f}% / {branch_percent:.2f}% |
          | Windows core | Python 3.10 and 3.13 passed |
          | Controlled mutation probes | 64/64 killed |
          | Scientific reference benchmarks | 8/8 passed |
          | Repository / dependency findings | 0 / 0 |
          | Source archives / Wheel | reproducible / reproducible + isolated install |
          | Generated text / Manifest | canonical LF / cross-platform stable |
          | Scientific visual assets | 12 self-contained SVGs |
          | Remote branches | `main` only |

          The final commit is accepted only after the canonical Ubuntu/Windows/macOS × Python 3.10/3.13 CI result is recorded in [Issue #22](../../issues/22). Machine-readable evidence: [`reports/CURRENT_MAIN_VERIFICATION.json`](reports/CURRENT_MAIN_VERIFICATION.json).'''
          zh = f'''已于 `{verified_at}` 由确定性终验运行 `{finalization_run_id}` 完成验证。

          | 当前主线项目 | 结果 |
          |---|---:|
          | 版本 | {version} |
          | 能力 / 适配器 / 工作流 | 164 / 27 / 20 |
          | 自动测试 | {tests_passed} 通过，0 失败 |
          | 语句 / 分支覆盖率 | {statement_percent:.2f}% / {branch_percent:.2f}% |
          | Windows core | Python 3.10 与 3.13 通过 |
          | 受控变异探针 | 64/64 被识别 |
          | 科学参考基准 | 8/8 通过 |
          | 仓库 / 依赖安全发现 | 0 / 0 |
          | 源码包 / Wheel | 可重复 / 可重复并通过隔离安装 |
          | 生成文本 / Manifest | 统一 LF / 跨平台稳定 |
          | 科研视觉资产 | 12 幅自包含 SVG |
          | 远程分支 | 仅 `main` |

          最终提交只有在 [Issue #22](../../issues/22) 记录 Ubuntu/Windows/macOS × Python 3.10/3.13 正式 CI 成功后才被接受。机器可读证据：[`reports/CURRENT_MAIN_VERIFICATION.json`](reports/CURRENT_MAIN_VERIFICATION.json)。'''

          def replace_block(path: Path, body: str) -> None:
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(
                  r'<!-- CURRENT_MAIN_VERIFICATION:START -->.*?'
                  r'<!-- CURRENT_MAIN_VERIFICATION:END -->',
                  re.DOTALL,
              )
              replacement = (
                  '<!-- CURRENT_MAIN_VERIFICATION:START -->\n'
                  + '\n'.join(line.strip() for line in body.splitlines())
                  + '\n<!-- CURRENT_MAIN_VERIFICATION:END -->'
              )
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'current-main block missing in {path}')
              path.write_text(updated, encoding='utf-8', newline='\n')

          replace_block(root / 'README.md', en)
          replace_block(root / 'README.zh-CN.md', zh)

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          replacement = '''## Unreleased

          - Expanded the bilingual project homepage to twelve repository-local scientific SVG diagrams covering multiscale architecture, AI orchestration, DFT, molecular dynamics, polymers, continuum multiphysics, process optimization, evidence, confidence and reproducibility.
          - Preserved the minimum secure Windows subprocess bootstrap environment while continuing to block arbitrary host-variable and secret leakage.
          - Normalized coverage paths across operating systems so critical-file policies remain fail-closed on Windows and POSIX runners.
          - Enforced LF checkout and runtime text generation, added AST governance for every production `Path.write_text`, and made the byte-level Manifest stable across Ubuntu, Windows and macOS.
          - Separated immutable v3.0.2 release evidence from current-main verification and added a machine-readable second-pass audit record.
          '''
          updated, count = re.subn(
              r'## Unreleased\n\n.*?(?=\n## 3\.0\.2)',
              '\n'.join(line.strip() for line in replacement.splitlines()).rstrip() + '\n',
              changelog,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('unable to update Changelog Unreleased section')
          changelog_path.write_text(updated, encoding='utf-8', newline='\n')

          audit = f'''# Second-pass final audit

          - Repository: `SUNHAOJUN22/TsaoSciComputation`
          - Branch policy: `main` only; no branch or pull request created
          - Version: `{version}`
          - Tests: `{tests_passed} passed, 0 failed`
          - Coverage: `{statement_percent:.2f}%` statement / `{branch_percent:.2f}%` branch
          - Scientific benchmarks: `8/8`
          - Controlled mutation probes: `64/64`
          - Capabilities / adapters / workflows: `164 / 27 / 20`
          - Scientific visuals: `12` self-contained SVGs
          - Dependency vulnerabilities: `0`
          - Repository security findings: `0`
          - Source archives and Wheel: reproducible; Wheel isolated install passed
          - Windows core: Python 3.10 and 3.13 passed
          - Text determinism: checkout and generated text use canonical LF
          - Manifest: stable before and after generated commands on Windows

          ## Corrected defects

          1. Windows child-Python startup failure caused by stripping required bootstrap environment variables.
          2. Windows backslash paths being misread by the critical-coverage policy.
          3. Platform-dependent checkout and generated-text line endings invalidating byte-level Manifests.
          4. README visual coverage and current-main evidence being less explicit than the implemented scientific scope.

          ## Scientific boundary

          The repository validates orchestration, contracts, deterministic fixtures, packaging and evidence. It does not claim live execution of external commercial or open-source solvers, licensed databases, production HPC systems, or automatic authorization of high-risk engineering decisions.
          '''
          (root / 'reports' / 'SECOND_PASS_FINAL_AUDIT.md').write_text(
              '\n'.join(line.strip() for line in audit.splitlines()).rstrip() + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest \
            tests/test_readme_visuals.py \
            tests/test_release_governance.py \
            tests/test_canonical_text_writes.py -q
          git diff --check

      - name: Run deterministic release gates pass 2 on exact documented tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo deterministic-pass-2 > /tmp/tsao-final-stage
          python scripts/verify_all.py --profile all | tee /tmp/pass2-all.log
          python scripts/verify_all.py --profile benchmark | tee /tmp/pass2-benchmark.log
          python -m pytest -q | tee /tmp/pass2-pytest.log
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/final-dependency-audit.json
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/final-dependency-audit.json').read_text(encoding='utf-8'))
          print(sum(len(item.get('vulns', [])) for item in payload.get('dependencies', [])))
          PY
          )" -eq 0
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          python -m pytest \
            tests/test_readme_visuals.py \
            tests/test_release_governance.py \
            tests/test_canonical_text_writes.py -q
          git diff --check

      - name: Commit exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/tsao-final-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo 'Expected evidence, documentation and workflow cleanup changes.' >&2
            exit 1
          }
          git commit -m 'Finalize second-pass audit and cross-platform evidence'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > /tmp/final-sha

      - name: Dispatch canonical cross-platform CI
        shell: bash
        run: |
          set -Eeuo pipefail
          echo dispatch > /tmp/tsao-final-stage
          FINAL_SHA="$(cat /tmp/final-sha)"
          DISPATCH_OUTPUT="$(gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main 2>&1)"
          printf '%s\n' "$DISPATCH_OUTPUT" | tee /tmp/dispatch-output.log
          CI_RUN_ID="$(printf '%s\n' "$DISPATCH_OUTPUT" | sed -n \
            's#^.*/actions/runs/\([0-9][0-9]*\).*$#\1#p' | tail -1)"
          if test -z "$CI_RUN_ID"; then
            for _ in $(seq 1 90); do
              RUNS_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                --event workflow_dispatch --branch main --limit 30 \
                --json databaseId,headSha,createdAt)"
              CI_RUN_ID="$(RUNS_JSON="$RUNS_JSON" FINAL_SHA="$FINAL_SHA" python - <<'PY'
          import json
          import os
          runs = json.loads(os.environ['RUNS_JSON'])
          matches = [run for run in runs if run.get('headSha') == os.environ['FINAL_SHA']]
          matches.sort(key=lambda run: run.get('createdAt', ''))
          print(matches[-1]['databaseId'] if matches else '')
          PY
              )"
              test -n "$CI_RUN_ID" && break
              sleep 5
            done
          fi
          test -n "$CI_RUN_ID"
          echo "$CI_RUN_ID" > /tmp/ci-run-id
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical CI dispatched for final commit $FINAL_SHA. CI Run ID: $CI_RUN_ID. Completion is not claimed until every matrix job succeeds."

      - name: Wait for canonical CI
        shell: bash
        run: |
          set -Eeuo pipefail
          echo ci-watch > /tmp/tsao-final-stage
          CI_RUN_ID="$(cat /tmp/ci-run-id)"
          if ! gh run watch "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status; then
            gh run view "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
              > /tmp/final-ci-failed.log 2>&1 || true
            exit 1
          fi

      - name: Report success and close Issue 22
        shell: bash
        run: |
          set -Eeuo pipefail
          echo success > /tmp/tsao-final-stage
          FINAL_SHA="$(cat /tmp/final-sha)"
          CI_RUN_ID="$(cat /tmp/ci-run-id)"
          SUMMARY="$(tail -n 1 /tmp/pass2-pytest.log | tr -d '\r')"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Second-pass final acceptance passed. Deterministic release gates were executed twice around the final evidence and documentation; $SUMMARY; dependency and security audits, 64/64 mutation probes, 8/8 scientific benchmarks, reproducible source and Wheel builds, isolated installation, 12-asset visual integrity, canonical LF generation, cross-platform Manifest stability, single-main verification, and Ubuntu/Windows/macOS × Python 3.10/3.13 canonical CI all succeeded. Final commit: $FINAL_SHA. Finalization run: $GITHUB_RUN_ID. Canonical CI run: $CI_RUN_ID. The one-shot workflow removed itself; no branch or PR was created."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          STAGE="$(cat /tmp/tsao-final-stage 2>/dev/null || echo unknown)"
          CI_RUN_ID="$(cat /tmp/ci-run-id 2>/dev/null || echo unavailable)"
          LOG_FILE=/tmp/pass1-all.log
          case "$STAGE" in
            deterministic-pass-2) LOG_FILE=/tmp/pass2-all.log ;;
            dispatch) LOG_FILE=/tmp/dispatch-output.log ;;
            ci-watch) LOG_FILE=/tmp/final-ci-failed.log ;;
          esac
          {
            echo "Final second-pass acceptance failed at stage: $STAGE."
            echo
            echo "Finalization run: $GITHUB_RUN_ID. Canonical CI run: $CI_RUN_ID."
            echo
            echo '```text'
            if test -s "$LOG_FILE"; then
              tail -n 160 "$LOG_FILE" | tr -d '\r' | tail -c 24000
            else
              git status --short || true
            fi
            echo '```'
          } > /tmp/final-second-pass-failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/final-second-pass-failure.md || true
