name: Execution integrity V13F coverage diagnosis

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.issue.title == 'EXECUTION_INTEGRITY_V13F_COVERAGE' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Diagnose exact candidate coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          git read-tree --reset -u 27af704e6f6c28dae400cdd28d943936312fd802
          git checkout "$ORIGINAL_SHA" -- scripts/prepare_execution_integrity_v13e.py
          git clean -fd
          python scripts/prepare_execution_integrity_v13e.py
          python -m pip install -e '.[validation,quality,security]'
          python -m coverage erase
          python -m coverage run --branch -m pytest -q
          python -m coverage json -o /tmp/v13f.json
          python - <<'PY' > /tmp/v13f.txt
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/v13f.json').read_text())
          print(f"TOTAL {data['totals']['percent_covered']:.4f}%")
          rows=[]
          for name, info in data['files'].items():
              if name.startswith('tsao_computation/'):
                  rows.append((info['summary']['percent_covered'], name, info.get('missing_lines', []), info['summary']))
          for percent, name, missing, summary in sorted(rows)[:30]:
              print(f"{percent:.2f}% {name} statements={summary['num_statements']} branches={summary.get('num_branches', 0)} missing={missing}")
          PY
          cat /tmp/v13f.txt
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/v13f.txt
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Coverage diagnosis completed without a product commit."
