name: Validate ultimate V3 coordinator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-ultimate-v3-coordinator.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.x'
      - name: Run actionlint and report coordinator diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          ACTIONLINT="$(go env GOPATH)/bin/actionlint"
          set +e
          "$ACTIONLINT" -color .github/workflows/bootstrap-ultimate-main-audit-v3.yml \
            > "$RUNNER_TEMP/actionlint.txt" 2>&1
          STATUS=$?
          set -e
          gh run list --workflow bootstrap-ultimate-main-audit-v3.yml --limit 5 \
            --json databaseId,headSha,status,conclusion,event,createdAt,url \
            > "$RUNNER_TEMP/coordinator-runs.json"
          {
            echo "Ultimate V3 coordinator actionlint exit: \`$STATUS\`."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/actionlint.txt"
            echo '```'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/coordinator-runs.json"
            echo '```'
            echo "Validator run: \`$GITHUB_RUN_ID\`."
          } > "$RUNNER_TEMP/coordinator-diagnostics.md"
          gh issue comment 23 --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/coordinator-diagnostics.md"
          exit "$STATUS"
      - name: Report validator infrastructure failure
        if: ${{ failure() }}
        run: >-
          gh issue comment 23 --repo "$GITHUB_REPOSITORY"
          --body "Ultimate V3 actionlint validator reported failure. Run: \`$GITHUB_RUN_ID\`."
