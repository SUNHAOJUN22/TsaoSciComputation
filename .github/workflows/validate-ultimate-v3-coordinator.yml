name: Validate ultimate V3 coordinator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-ultimate-v3-coordinator.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - run: python -m pip install pyyaml
      - name: Parse coordinator YAML and report recent runs
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/bootstrap-ultimate-main-audit-v3.yml')
          payload = yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(payload, dict):
              raise SystemExit('coordinator YAML is not a mapping')
          PY
          gh run list --workflow bootstrap-ultimate-main-audit-v3.yml --limit 10 \
            --json databaseId,headSha,status,conclusion,event,createdAt,url \
            > "$RUNNER_TEMP/coordinator-runs.json"
          {
            echo 'Ultimate V3 coordinator YAML is valid.'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/coordinator-runs.json"
            echo '```'
            echo "Validator run: \`$GITHUB_RUN_ID\`."
          } > "$RUNNER_TEMP/coordinator-status.md"
          gh issue comment 23 --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/coordinator-status.md"
      - name: Report validator failure
        if: ${{ failure() }}
        run: >-
          gh issue comment 23 --repo "$GITHUB_REPOSITORY"
          --body "Ultimate V3 coordinator validator failed. Run: \`$GITHUB_RUN_ID\`."
