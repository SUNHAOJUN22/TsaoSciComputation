name: One-time source-bound computation finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: tsao-computation-source-evidence-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/final-acceptance-20260807'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/final-acceptance-20260807
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Install qualification dependencies
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Remove transport, regenerate evidence and qualify exact tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-source-evidence-once.yml
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/build_manifest.py
          python scripts/final_acceptance_preflight.py --root . --json
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
      - name: Publish exact clean acceptance tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: regenerate exact source-bound computation evidence'
          git push origin HEAD:agent/final-acceptance-20260807
