name: Collect Windows CI failure log

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  collect:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_COLLECT_WINDOWS_LOG_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CI_RUN_ID: '30169912094'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Remove this collector from the final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/collect-windows-ci-log.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed Windows CI log collector'
          git push origin HEAD:refs/heads/main

      - name: Publish failed Windows job logs
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run view "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > /tmp/windows-ci-failed.log 2>&1
          {
            echo "Windows CI failure details from canonical CI run \`$CI_RUN_ID\`:"
            echo
            echo '```text'
            tail -n 180 /tmp/windows-ci-failed.log | tr -d '\r' | tail -c 24000
            echo '```'
          } > /tmp/windows-ci-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/windows-ci-comment.md
