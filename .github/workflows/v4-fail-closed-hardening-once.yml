name: V4 fail-closed hardening once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: v4-fail-closed-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/v4-fail-closed-hardening-v3')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install exact validation environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e '.[validation,quality,security]'
          python -m pip check
      - name: Create controller-free fail-closed policy worktree
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          directive = '    continue-on-error: true\n'
          if workflow_text.count(directive) != 1:
              raise SystemExit(
                  f'expected exactly one benchmark continue-on-error line, '
                  f'found {workflow_text.count(directive)}'
              )
          workflow_text = workflow_text.replace(directive, '', 1)
          if 'continue-on-error:' in workflow_text:
              raise SystemExit('continue-on-error remains in CI workflow')
          workflow.write_text(workflow_text, encoding='utf-8', newline='\n')

          policy = Path('tests/test_ci_policy.py')
          policy_text = policy.read_text(encoding='utf-8')
          old = '''def test_benchmark_is_observational_not_a_release_gate() -> None:
    text = (ROOT / ".github" / "workflows" / "ci.yml").read_text(encoding="utf-8")
    quality = text.split("\\n  quality:\\n", 1)[1].split("\\n  package:\\n", 1)[0]
    benchmark = text.split("\\n  benchmark:\\n", 1)[1]
    assert "--profile benchmark" not in quality
    assert "continue-on-error: true" in benchmark
    assert "--profile benchmark" in benchmark
'''
          new = '''def test_benchmark_is_blocking_but_separate_from_quality() -> None:
    text = (ROOT / ".github" / "workflows" / "ci.yml").read_text(encoding="utf-8")
    quality = text.split("\\n  quality:\\n", 1)[1].split("\\n  package:\\n", 1)[0]
    benchmark = text.split("\\n  benchmark:\\n", 1)[1]
    assert "--profile benchmark" not in quality
    assert "--profile benchmark" in benchmark
    assert "continue-on-error:" not in benchmark
'''
          if policy_text.count(old) != 1:
              raise SystemExit(
                  'legacy observational benchmark policy test was not found exactly once'
              )
          policy.write_text(
              policy_text.replace(old, new, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY
          rm .github/workflows/v4-fail-closed-hardening-once.yml
          git diff --check
      - name: Regenerate exact-tree identity before core checks
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile benchmark
          python scripts/verify_all.py --profile package
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          forbidden = ('continue-on-error:', '|| true', 'pytest ... || exit 0')
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'forbidden fail-open workflow constructs remain: {found}')
          PY
          git ls-remote --heads origin > /tmp/scicomputation-v4-branches.txt
          python - <<'PY'
          from pathlib import Path
          refs = [
              line.split()[1]
              for line in Path('/tmp/scicomputation-v4-branches.txt').read_text().splitlines()
              if line.strip()
          ]
          if refs != ['refs/heads/main']:
              raise SystemExit(f'unexpected remote branches: {refs}')
          PY
          git diff --check
      - name: Commit exact generated candidate
        id: candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            .github/workflows/ci.yml \
            .github/workflows/v4-fail-closed-hardening-once.yml \
            tests/test_ci_policy.py \
            manifest.json \
            evidence/security-scan.json
          git commit -m 'ci: make benchmark qualification fail closed'
          echo 'sha='"$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Requalify immutable candidate without drift
        run: |
          set -euo pipefail
          node scripts/refresh-current-main-readme.mjs --check
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile benchmark
          python scripts/verify_all.py --profile package
          git diff --exit-code
          git diff --check
      - name: Publish exact qualified candidate
        run: |
          set -euo pipefail
          git fetch origin main
          expected_parent="$(git rev-parse HEAD^)"
          remote_main="$(git rev-parse origin/main)"
          if [[ "$expected_parent" != "$remote_main" ]]; then
            echo "STALE_MAIN expected_parent=$expected_parent remote_main=$remote_main" >&2
            exit 3
          fi
          git push origin HEAD:main
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CANDIDATE: ${{ steps.candidate.outputs.sha }}
        run: |
          gh issue comment "$ISSUE" --body "V4_FAIL_CLOSED_HARDENING_V3 outcome=${OUTCOME} candidate=${CANDIDATE:-UNPUBLISHED} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} controller=self_removed benchmark=blocking policy_test=blocking manifest=exact-tree"
