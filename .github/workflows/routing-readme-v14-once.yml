name: Routing and README V14 certification

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: routing-readme-v14-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/v14-coverage.json
  AUDIT_ISSUE: '49'

jobs:
  certify:
    if: ${{ github.event.issue.title == 'ROUTING_README_V14_FINALIZE' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Focused validation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo focused > /tmp/v14-stage
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          echo "ORIGINAL_SHA=$ORIGINAL_SHA" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m pytest -q tests/test_math_performance_v11.py tests/test_readme_visuals.py tests/test_performance_v9.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
      - name: Complete validation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete > /tmp/v14-stage
          python scripts/run_tests.py --coverage | tee /tmp/v14-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/v14-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/v14-benchmark.json
          python scripts/verify_native_core.py > /tmp/v14-native.json
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/v14-dependencies.json
          rm -rf /tmp/v14-build /tmp/v14-venv
          python -m build --outdir /tmp/v14-build
          python -m venv /tmp/v14-venv
          /tmp/v14-venv/bin/python -m pip install --no-deps /tmp/v14-build/*.whl
          /tmp/v14-venv/bin/python -c 'import tsao_computation; assert tsao_computation.__version__ == "3.0.4"'
          python -m pytest -q | tee /tmp/v14-pytest.log
          git ls-remote --heads origin | sort > /tmp/v14-heads.txt
          test "$(awk '{print $2}' /tmp/v14-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main
      - name: Refresh evidence and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/v14-stage
          python - <<'PY'
          from pathlib import Path
          Path('reports/ROUTING_README_V14.md').write_text(
              '# Routing and README V14\n\n'
              'Routing cache keys now normalize case and Unicode whitespace before lookup. '
              'The bilingual root READMEs retain only three overview diagrams and link the complete 42-asset atlas.\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python scripts/build_super_skill_audit.py --test-log /tmp/v14-pytest.log --coverage-json /tmp/v14-coverage.json --dependency-json /tmp/v14-dependencies.json --security-json evidence/security-scan.json --verification-json /tmp/v14-all.json
          python scripts/update_main_audit_evidence.py --root . --run-id "$GITHUB_RUN_ID" --issue "$AUDIT_ISSUE" --test-log /tmp/v14-pytest.log --coverage-json /tmp/v14-coverage.json --dependency-json /tmp/v14-dependencies.json --security-json evidence/security-scan.json --remote-heads /tmp/v14-heads.txt --parent-commit "$ORIGINAL_SHA" --audit-generation routing-readme-v14 --audit-label routing-readme --visual-count 42 --visual-atlas-version 13 --report-path reports/ROUTING_README_V14.md --visual-families 'Three root overview diagrams; complete 42-asset atlas in assets/visuals/README.md.'
          python scripts/sync_version_metadata.py --release-date 2026-08-03
          python scripts/security_scan.py
          rm -f .github/workflows/routing-readme-v14-once.yml
          python scripts/build_manifest.py
      - name: Exact-tree gate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo exact-tree > /tmp/v14-stage
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python -m pytest -q
          python scripts/sync_version_metadata.py --check
          python scripts/build_manifest.py --check
          python -c "import json,pathlib; a=json.loads(pathlib.Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text()); assert a['status']=='VALIDATED' and a['version']=='3.0.4' and not a['validation_missing_evidence'] and not a['validation_failures']; assert a['quality']['tests_failed']==0 and a['quality']['statement_coverage_percent']>=95 and a['quality']['dependency_vulnerabilities']==0 and a['quality']['repository_security_findings']==0 and a['quality']['source_and_wheel_reproducible'] is True"
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflows[*]}" = "${expected[*]}"
          test "$(awk '{print $2}' /tmp/v14-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main
      - name: Commit final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/v14-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Finalize canonical routing and concise README'
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
      - name: Production workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production > /tmp/v14-stage
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
          : > /tmp/v14-runs.txt
          wait_for() {
            local workflow="$1" line status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json headSha,status,conclusion,url --jq ".[] | select(.headSha == \"$FINAL_SHA\") | [.status,.conclusion,.url] | @tsv" | head -n 1)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  [[ "$conclusion" == success ]]
                  printf '%s: %s\n' "$workflow" "$url" >> /tmp/v14-runs.txt
                  return
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for ci.yml
          wait_for codeql.yml
          wait_for scorecard.yml
      - name: Close audits
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(cat /tmp/v14-runs.txt)"
          metrics="$(python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text())
          q=audit['quality']
          print(f"tests={q['tests_passed']}; statement-coverage={q['statement_coverage_percent']:.2f}%; branch-coverage={q['branch_coverage_percent']:.2f}%")
          PY
          )"
          gh issue close "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Canonical routing-cache keys and compact bilingual README passed on commit \`$FINAL_SHA\`. $metrics. Full deterministic, performance, security, dependency, reproducible-build, Manifest, CI, CodeQL and Scorecard gates passed.\n$runs\nNo branch or pull request was created."
          gh issue close '34' --repo "$GITHUB_REPOSITORY" --reason completed --comment "The accepted V9 evidence is retained and the remaining semantic routing-key follow-up is now closed by V14 at \`$FINAL_SHA\`."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "V14 certification completed at \`$FINAL_SHA\`."
      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          stage="$(cat /tmp/v14-stage 2>/dev/null || echo unknown)"
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "V14 failed at stage: $stage. Actions run: $GITHUB_RUN_ID. No branch or pull request was created." || true
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment "Fail-closed at stage: $stage." || true
          exit 1
