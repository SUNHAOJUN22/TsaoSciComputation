name: Current-main README and visual refresh

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: current-main-readme-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, '/refresh-current-main-readme-v2'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Generate bilingual README sections and code-bound visuals
        run: node scripts/refresh-current-main-readme.mjs --write
      - name: Verify deterministic UTF-8 and SVG contracts
        run: node scripts/refresh-current-main-readme.mjs --check
      - name: Install quality dependencies
        run: python -m pip install -e '.[validation,quality]'
      - name: Refresh exact-tree manifest
        run: python scripts/build_manifest.py
      - name: Run current-main software gates
        run: |
          set -euo pipefail
          python scripts/verify_all.py --profile core
          node scripts/refresh-current-main-readme.mjs --check
          git diff --check
      - name: Commit generated README, visuals and manifest
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add \
            README.md \
            README.zh-CN.md \
            docs/CURRENT_MAIN_ACCEPTANCE.md \
            docs/current-main \
            manifest.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh current-main bilingual acceptance design'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish refresh result to issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          gh issue comment "$ISSUE" --body "CURRENT_MAIN_README_REFRESH_V2 outcome=${OUTCOME} changed=${CHANGED:-unknown} run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
