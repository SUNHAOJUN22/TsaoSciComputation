name: V4 publication branch cleanup once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: v4-publication-branch-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/cleanup-v4-publication-branch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Delete publication branch after exact fast-forward
        env:
          BRANCH: v4-publish-qualified
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            branch_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
            if [[ -n "$branch_sha" && "$branch_sha" == "$main_sha" ]]; then
              git push origin --delete "$BRANCH"
              exit 0
            fi
            sleep 5
          done
          echo "publication branch never converged with main" >&2
          exit 1
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
        run: |
          gh issue comment "$ISSUE" --body "V4_PUBLICATION_BRANCH_CLEANUP outcome=${OUTCOME} branch=v4-publish-qualified run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
