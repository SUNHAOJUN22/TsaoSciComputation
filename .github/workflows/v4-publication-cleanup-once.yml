name: V4 publication branch controller once

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: v4-publication-branch-controller-once
  cancel-in-progress: false

jobs:
  publish-nonworkflow:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/publish-v4-nonworkflow-artifact')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v4-publish-qualified
          fetch-depth: 0
          persist-credentials: true
      - name: Download exact qualified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/scicomputation-v4-candidate"
          mkdir -p "$bundle"
          gh run download 31327785243 \
            --repo "$GITHUB_REPOSITORY" \
            --name scicomputation-v4-exact-candidate-99070c2b3c7ce60e3382390f75d1483e894bce91 \
            --dir "$bundle"
          test "$(cat "$bundle/PARENT_SHA.txt")" = 0409426b6f2c9f5dac8ceca7793d9166436620d7
          test "$(cat "$bundle/CANDIDATE_SHA.txt")" = 99070c2b3c7ce60e3382390f75d1483e894bce91
      - name: Stage only tested non-workflow files
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/scicomputation-v4-candidate"
          while IFS= read -r source; do
            relative="${source#${bundle}/}"
            case "$relative" in
              .github/workflows/*|CANDIDATE_SHA.txt|PARENT_SHA.txt|CHANGES.tsv|DELETE_PATHS.txt)
                continue
                ;;
            esac
            mkdir -p "$(dirname "$relative")"
            cp "$source" "$relative"
          done < <(find "$bundle" -type f -print | sort)
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            artifacts/current-main/readme-visual-audit.json \
            evidence/security-scan.json \
            manifest.json \
            reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json \
            reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json \
            reports/ACCELERATION_OPPORTUNITIES_V2.json \
            tests/test_ci_policy.py
          git commit -m 'ci: stage qualified fail-closed evidence and policy'
          git push origin HEAD:v4-publish-qualified
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
        run: |
          gh issue comment "$ISSUE" --body "V4_NONWORKFLOW_STAGE outcome=${OUTCOME} branch=v4-publish-qualified source_run=31327785243 run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  cleanup:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '/cleanup-v4-publication-branch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - name: Delete publication branch after exact fast-forward
        env:
          BRANCH: v4-publish-qualified
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            branch_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
            if [[ -n "$branch_sha" && "$branch_sha" == "$main_sha" ]]; then
              git push origin --delete "$BRANCH"
              exit 0
            fi
            sleep 5
          done
          echo "publication branch never converged with main" >&2
          exit 1
      - name: Publish machine result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ job.status }}
        run: |
          gh issue comment "$ISSUE" --body "V4_PUBLICATION_BRANCH_CLEANUP outcome=${OUTCOME} branch=v4-publish-qualified run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
