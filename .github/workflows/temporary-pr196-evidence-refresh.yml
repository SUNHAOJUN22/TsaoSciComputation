name: Temporary PR196 deterministic evidence refresh

on:
  push:
    branches:
      - closure/final-debug-readme-20260901

permissions:
  contents: write

concurrency:
  group: scicomputation-pr196-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh-qualify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: closure/final-debug-readme-20260901
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: pip

      - name: Install declared validation, quality, and security stack
        run: |
          python -m pip install --disable-pip-version-check -e '.[validation,quality,security]'
          python -m pip check

      - name: Remove temporary workflow from the tested Git index
        shell: python
        run: |
          import subprocess

          subprocess.run(
              ["git", "rm", ".github/workflows/temporary-pr196-evidence-refresh.yml"],
              check=True,
          )
          temporary = subprocess.check_output(
              ["git", "ls-files", ".github/workflows/temporary-*.yml"],
              text=True,
          ).splitlines()
          if temporary:
              raise SystemExit(f"temporary workflows remain in tested index: {temporary}")

      - name: Canonicalize code and tests
        run: |
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py

      - name: Rebuild all deterministic evidence for the clean source tree
        run: |
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check

      - name: Run complete native qualification
        run: |
          python -m pytest -q
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
          python scripts/verify_all.py --profile benchmark
          python scripts/run_large_parser_regression.py
          python -m pytest -q tests/test_performance_v9.py tests/test_performance_optimizations.py
          git diff --check

      - name: Verify deterministic fixed point after qualification
        run: |
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
          python - <<'PY'
          from pathlib import Path
          import json

          for path in (
              Path('evidence/quality-check.json'),
              Path('evidence/security-scan.json'),
              Path('manifest.json'),
          ):
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict):
                  raise SystemExit(f'{path} is not a JSON object')
          PY

      - name: Commit only the tested non-workflow fixed point
        shell: python
        run: |
          from __future__ import annotations

          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          workflow = Path('.github/workflows/temporary-pr196-evidence-refresh.yml')
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          payload_paths = [Path(path) for path in changed if Path(path) != workflow]
          if not payload_paths:
              raise SystemExit('deterministic refresh produced no non-workflow changes')

          with tempfile.TemporaryDirectory() as directory:
              snapshot = Path(directory)
              present: list[Path] = []
              deleted: list[Path] = []
              for path in payload_paths:
                  if path.exists():
                      target = snapshot / path
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(path, target)
                      present.append(path)
                  else:
                      deleted.append(path)

              subprocess.run(['git', 'reset', '--hard', 'HEAD'], check=True)
              for path in present:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(snapshot / path, path)
              for path in deleted:
                  path.unlink(missing_ok=True)

          actual = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          expected = {path.as_posix() for path in payload_paths}
          if actual != expected:
              raise SystemExit(
                  f'unexpected restored diff: expected={sorted(expected)!r} actual={sorted(actual)!r}'
              )
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(
              [
                  'git',
                  'config',
                  'user.email',
                  '41898282+github-actions[bot]@users.noreply.github.com',
              ],
              check=True,
          )
          subprocess.run(['git', 'add', '-A', *sorted(expected)], check=True)
          subprocess.run(
              ['git', 'commit', '-m', 'chore(evidence): refresh PR196 deterministic fixed point'],
              check=True,
          )
          subprocess.run(
              ['git', 'push', 'origin', 'HEAD:closure/final-debug-readme-20260901'],
              check=True,
          )
