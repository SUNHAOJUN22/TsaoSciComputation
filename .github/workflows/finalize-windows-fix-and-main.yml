name: Finalize Windows fixes and current main

on:
  issues:
    types: [edited]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: finalize-windows-fixes-main
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_FINAL_WINDOWS_FIX_ACCEPTANCE_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      WINDOWS_REGRESSION_RUN_ID: '30170463327'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete verification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Prepare the intended final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo prepare > /tmp/tsao-final-stage
          rm -f .github/workflows/finalize-windows-fix-and-main.yml
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest tests/test_readme_visuals.py -q
          git diff --check

      - name: Run complete deterministic release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo verify-all > /tmp/tsao-final-stage
          python scripts/verify_all.py --profile all | tee /tmp/verify-all.log

      - name: Run benchmark and final pytest
        shell: bash
        run: |
          set -Eeuo pipefail
          echo benchmark > /tmp/tsao-final-stage
          python scripts/verify_all.py --profile benchmark | tee /tmp/benchmark.log
          echo pytest > /tmp/tsao-final-stage
          python -m pytest -q | tee /tmp/pytest.log

      - name: Run dependency, security and single-main audits
        shell: bash
        run: |
          set -Eeuo pipefail
          echo audits > /tmp/tsao-final-stage
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/dependency-audit.json
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/dependency-audit.json').read_text(encoding='utf-8'))
          print(sum(len(item.get('vulns', [])) for item in payload.get('dependencies', [])))
          PY
          )" -eq 0
          python scripts/security_scan.py
          mapfile -t branches < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main
          git diff --check

      - name: Refresh current-main evidence and bilingual README
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/tsao-final-stage
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          pytest_text = Path('/tmp/pytest.log').read_text(encoding='utf-8')
          match = re.search(r'(\d+) passed(?:, (\d+) skipped)? in ', pytest_text)
          if match is None:
              raise SystemExit('unable to parse final pytest summary')
          tests_passed = int(match.group(1))
          coverage = json.loads(
              Path('/tmp/tsao-current-coverage.json').read_text(encoding='utf-8')
          )['totals']
          statement_percent = float(coverage['percent_statements_covered'])
          branch_percent = float(coverage['percent_branches_covered'])
          verified_at = datetime.now(timezone.utc).isoformat()
          run_id = int(os.environ['GITHUB_RUN_ID'])
          windows_run_id = int(os.environ['WINDOWS_REGRESSION_RUN_ID'])
          version = (root / 'VERSION').read_text(encoding='utf-8').strip()

          report = {
              'schema_version': '1.1',
              'status': 'VALIDATED',
              'version': version,
              'branch': 'main',
              'verified_at_utc': verified_at,
              'verification_run_id': run_id,
              'windows_core_regression_run_id': windows_run_id,
              'tests': {'passed': tests_passed, 'failed': 0},
              'coverage': {
                  'statement_percent': statement_percent,
                  'branch_percent': branch_percent,
              },
              'counts': {
                  'capabilities': 164,
                  'adapters': 27,
                  'workflows': 20,
                  'visual_assets': 12,
              },
              'scientific_reference_benchmarks': '8/8',
              'controlled_mutants': '64/64',
              'dependency_vulnerabilities': 0,
              'repository_security_findings': 0,
              'remote_branches': ['main'],
              'source_archives_reproducible': True,
              'wheel_reproducible_and_isolated_install': True,
              'windows_python_310_core': 'PASS',
              'windows_python_313_core': 'PASS',
              'temporary_branch_created': False,
              'claim_boundary': (
                  'Validated for repository orchestration, contracts, routing, '
                  'deterministic fixtures, packaging and documentation. No live '
                  'third-party solver or production HPC execution is claimed.'
              ),
          }
          (root / 'reports' / 'CURRENT_MAIN_VERIFICATION.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          en = f'''Validated on `{verified_at}` by deterministic finalization run `{run_id}` and Windows core regression run `{windows_run_id}`.

          | Current-main item | Result |
          |---|---:|
          | Version | {version} |
          | Capabilities / adapters / workflows | 164 / 27 / 20 |
          | Tests | {tests_passed} passed, 0 failed |
          | Statement / branch coverage | {statement_percent:.2f}% / {branch_percent:.2f}% |
          | Windows core | Python 3.10 and 3.13 passed |
          | Controlled mutation probes | 64/64 killed |
          | Scientific reference benchmarks | 8/8 passed |
          | Repository / dependency findings | 0 / 0 |
          | Source archives / Wheel | reproducible / reproducible + isolated install |
          | Scientific visual assets | 12 self-contained SVGs |
          | Remote branches | `main` only |

          Machine-readable evidence: [`reports/CURRENT_MAIN_VERIFICATION.json`](reports/CURRENT_MAIN_VERIFICATION.json).'''
          zh = f'''已于 `{verified_at}` 由确定性终验运行 `{run_id}` 和 Windows core 回归运行 `{windows_run_id}` 完成验证。

          | 当前主线项目 | 结果 |
          |---|---:|
          | 版本 | {version} |
          | 能力 / 适配器 / 工作流 | 164 / 27 / 20 |
          | 自动测试 | {tests_passed} 通过，0 失败 |
          | 语句 / 分支覆盖率 | {statement_percent:.2f}% / {branch_percent:.2f}% |
          | Windows core | Python 3.10 与 3.13 通过 |
          | 受控变异探针 | 64/64 被识别 |
          | 科学参考基准 | 8/8 通过 |
          | 仓库 / 依赖安全发现 | 0 / 0 |
          | 源码包 / Wheel | 可重复 / 可重复并通过隔离安装 |
          | 科研视觉资产 | 12 幅自包含 SVG |
          | 远程分支 | 仅 `main` |

          机器可读证据：[`reports/CURRENT_MAIN_VERIFICATION.json`](reports/CURRENT_MAIN_VERIFICATION.json)。'''

          def replace_block(path: Path, body: str) -> None:
              text = path.read_text(encoding='utf-8')
              pattern = re.compile(
                  r'<!-- CURRENT_MAIN_VERIFICATION:START -->.*?'
                  r'<!-- CURRENT_MAIN_VERIFICATION:END -->',
                  re.DOTALL,
              )
              replacement = (
                  '<!-- CURRENT_MAIN_VERIFICATION:START -->\n'
                  + '\n'.join(line.strip() for line in body.splitlines())
                  + '\n<!-- CURRENT_MAIN_VERIFICATION:END -->'
              )
              updated, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'current-main block missing in {path}')
              path.write_text(updated, encoding='utf-8')

          replace_block(root / 'README.md', en)
          replace_block(root / 'README.zh-CN.md', zh)
          PY
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest tests/test_readme_visuals.py -q
          git diff --check

      - name: Verify the exact final documented tree again
        shell: bash
        run: |
          set -Eeuo pipefail
          echo final-verify > /tmp/tsao-final-stage
          python scripts/verify_all.py --profile all | tee /tmp/final-verify.log
          echo final-pytest > /tmp/tsao-final-stage
          python -m pytest -q | tee /tmp/final-pytest.log
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check

      - name: Commit the verified final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/tsao-final-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo 'Expected final evidence and workflow cleanup changes.' >&2
            exit 1
          }
          git commit -m 'Finalize Windows compatibility and current main evidence'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > /tmp/final-sha

      - name: Dispatch canonical cross-platform CI
        shell: bash
        run: |
          set -Eeuo pipefail
          echo dispatch > /tmp/tsao-final-stage
          FINAL_SHA="$(cat /tmp/final-sha)"
          DISPATCH_OUTPUT="$(gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main 2>&1)"
          printf '%s\n' "$DISPATCH_OUTPUT" | tee /tmp/dispatch-output.log
          CI_RUN_ID="$(printf '%s\n' "$DISPATCH_OUTPUT" | sed -n \
            's#^.*/actions/runs/\([0-9][0-9]*\).*$#\1#p' | tail -1)"
          test -n "$CI_RUN_ID"
          echo "$CI_RUN_ID" > /tmp/ci-run-id
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical cross-platform CI dispatched for final commit $FINAL_SHA. CI Run ID: $CI_RUN_ID. Waiting for all matrix jobs before claiming completion."

      - name: Wait for canonical CI and capture any failure
        shell: bash
        run: |
          set -Eeuo pipefail
          echo ci-watch > /tmp/tsao-final-stage
          CI_RUN_ID="$(cat /tmp/ci-run-id)"
          if ! gh run watch "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status; then
            gh run view "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
              > /tmp/canonical-ci-failed.log 2>&1 || true
            exit 1
          fi

      - name: Report success and close Issue 22
        shell: bash
        run: |
          set -Eeuo pipefail
          echo success > /tmp/tsao-final-stage
          FINAL_SHA="$(cat /tmp/final-sha)"
          CI_RUN_ID="$(cat /tmp/ci-run-id)"
          SUMMARY="$(tail -n 1 /tmp/final-pytest.log | tr -d '\r')"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Final second-pass acceptance passed. Deterministic release gates were executed twice around refreshed current-main evidence; $SUMMARY; Windows Python 3.10/3.13 core regression, dependency and security audits, controlled mutation probes, 8/8 scientific benchmarks, reproducible source and Wheel builds, isolated installation, 12-asset visual integrity, single-main verification, and canonical Ubuntu/Windows/macOS × Python 3.10/3.13 CI all succeeded. Final commit: $FINAL_SHA. Finalization run: $GITHUB_RUN_ID. Canonical CI run: $CI_RUN_ID. The one-shot workflow removed itself; no branch or PR was created."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          STAGE="$(cat /tmp/tsao-final-stage 2>/dev/null || echo unknown)"
          CI_RUN_ID="$(cat /tmp/ci-run-id 2>/dev/null || echo unavailable)"
          LOG_FILE=/tmp/verify-all.log
          case "$STAGE" in
            benchmark) LOG_FILE=/tmp/benchmark.log ;;
            pytest) LOG_FILE=/tmp/pytest.log ;;
            final-verify) LOG_FILE=/tmp/final-verify.log ;;
            final-pytest) LOG_FILE=/tmp/final-pytest.log ;;
            ci-watch) LOG_FILE=/tmp/canonical-ci-failed.log ;;
            dispatch) LOG_FILE=/tmp/dispatch-output.log ;;
          esac
          {
            echo "Final second-pass acceptance failed at stage: $STAGE."
            echo
            echo "Finalization run: $GITHUB_RUN_ID. Canonical CI run: $CI_RUN_ID."
            echo
            echo '```text'
            if test -s "$LOG_FILE"; then
              tail -n 140 "$LOG_FILE" | tr -d '\r' | tail -c 22000
            else
              git status --short || true
            fi
            echo '```'
          } > /tmp/tsao-final-failure.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/tsao-final-failure.md || true
