name: Verify refreshed README on main

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-readme-main
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == 'Verify refreshed README on main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Rebuild final Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          echo install > /tmp/readme-verify-stage
          python -m pip install -e '.[validation,quality,security]'
          echo manifest > /tmp/readme-verify-stage
          rm -f .github/workflows/verify-readme-manifest.yml
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check

      - name: Run complete verification
        shell: bash
        run: |
          set -Eeuo pipefail
          echo verify-all > /tmp/readme-verify-stage
          python scripts/verify_all.py --profile all
          echo benchmark > /tmp/readme-verify-stage
          python scripts/verify_all.py --profile benchmark
          echo final-pytest > /tmp/readme-verify-stage
          python -m pytest -q
          echo single-main > /tmp/readme-verify-stage
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main

      - name: Commit verified Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/readme-verify-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git diff --cached --quiet && { echo 'Manifest is already current'; exit 0; }
          git commit -m 'Refresh Manifest after README simplification'
          git push origin HEAD:refs/heads/main
          echo success > /tmp/readme-verify-stage
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "README and Manifest verification passed. Complete deterministic gates, benchmark telemetry, final pytest, and single-main verification succeeded. Run ID: $GITHUB_RUN_ID. Commit: $(git rev-parse HEAD). No branch was created."

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          STAGE="$(cat /tmp/readme-verify-stage 2>/dev/null || echo unknown)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "README verification failed at stage: $STAGE. Run ID: $GITHUB_RUN_ID. No successful verification is being claimed." || true
