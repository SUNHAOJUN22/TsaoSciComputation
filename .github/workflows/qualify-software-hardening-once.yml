name: Qualify software hardening once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_SOFTWARE_HARDENING_20260806' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_SOFTWARE_HARDENING_20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out staged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable staging tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base=38a0c9a62d86ef1614aa08ac1821606696d68ca4
          workflow=.github/workflows/qualify-software-hardening-once.yml
          test "$(git diff --name-only "$base" HEAD)" = "$workflow"

      - name: Reassemble and verify owner payload
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import tarfile
          from pathlib import Path, PurePosixPath

          temp = Path(os.environ["RUNNER_TEMP"])
          issue = json.loads((temp / "issue.json").read_text(encoding="utf-8"))
          raw_comments = (temp / "comments.json").read_text(encoding="utf-8")
          try:
              comments = json.loads(raw_comments)
          except json.JSONDecodeError:
              decoder = json.JSONDecoder()
              comments = []
              offset = 0
              while offset < len(raw_comments):
                  page, offset = decoder.raw_decode(raw_comments, offset)
                  comments.extend(page)
                  while offset < len(raw_comments) and raw_comments[offset].isspace():
                      offset += 1
          texts = [issue.get("body") or "", *(item.get("body") or "" for item in comments)]
          pattern = re.compile(
              r"PAYLOAD_PART_(\d{2})\n([A-Za-z0-9+/=\n]+?)\nEND_PAYLOAD_PART_\1",
              re.MULTILINE,
          )
          parts: dict[int, str] = {}
          for text in texts:
              for raw_index, payload in pattern.findall(text):
                  index = int(raw_index)
                  if index in parts:
                      raise SystemExit(f"duplicate payload part: {index:02d}")
                  parts[index] = "".join(payload.split())
          expected_indices = list(range(12))
          if sorted(parts) != expected_indices:
              raise SystemExit(f"payload part set mismatch: {sorted(parts)}")
          expected_hashes = {
              0: "e4d6297363528d41940afe92544745a5fd1bf8bf66389294e9a79cd58bd9f749",
              1: "31f94fa8c9e9c4dfdf0a77cc3cfd5f1ea3faffc945f3f6c11b80f4770122ac4e",
              2: "1d4c3fd31eb4b8562f6a4418f98f7322860b03f0b2405803959b95a1af555b9b",
              3: "b268dea2580ea4dc6b185f844445299715cee0758dd9fd7c3a7af16d6f8879c6",
              4: "f77bf613000b25ef433a15ca425225d0b4290d8c5c4ab8c0229946053026efc2",
              5: "079cbeb44d5e8f45f84d5aa9b1f0e6c10959e06abc12ad23ae6e0c62d029e45d",
              6: "821da326cba9a478139235841387e25311a2701175609d9d86c2e6727d93a1e7",
              7: "ef97abfdda37a7b8c6510e6d2a349517fa67fc0d7e188618a51762cc1d53c313",
              8: "feceb0064a17e97237426c42ed7233a31d047d8a899e73fd5429e36bda9a9146",
              9: "a4531925921239f29c9a6d9fa6a52bc118160f9ae216d4a56d4051c9fe40fe55",
              10: "198ef7b9c7dead8c05b4c4fd0c169d9f37dfffa1e368f30c01cdc0ad9143be2c",
              11: "55e029ac510f334f5161adced39b976e2c00fd645aa64f3028fde7eb2123042c",
          }
          for index, part in parts.items():
              observed = hashlib.sha256(part.encode("ascii")).hexdigest()
              if observed != expected_hashes[index]:
                  raise SystemExit(f"payload part SHA-256 mismatch: {index:02d}")
          encoded = "".join(parts[index] for index in expected_indices)
          if hashlib.sha256(encoded.encode("ascii")).hexdigest() != (
              "97639c40a9ae2b360360725111ee1b0874393b01d4f6619f8f99115a85437207"
          ):
              raise SystemExit("encoded payload SHA-256 mismatch")
          archive_bytes = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(archive_bytes).hexdigest() != (
              "e6f9a651b665b5f4db5c388bd55cb0534061bf1fe46307b1bbc3da273f84e775"
          ):
              raise SystemExit("archive payload SHA-256 mismatch")
          archive_path = temp / "software-hardening.tar.gz"
          archive_path.write_bytes(archive_bytes)
          expected = {
              "CHANGELOG.md",
              "README.md",
              "README.zh-CN.md",
              "docs/autonomous-software-hardening-prompt.md",
              "evidence/critical-coverage-policy.json",
              "evidence/quality-check.json",
              "evidence/security-scan.json",
              "manifest.json",
              "pytest.ini",
              "reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json",
              "reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json",
              "reports/ACCELERATION_OPPORTUNITIES_V2.json",
              "schemas/solver-capability-evidence.schema.json",
              "tests/test_adversarial_phase_a_coverage.py",
              "tests/test_core.py",
              "tests/test_execution_evidence_hardening.py",
              "tests/test_execution_integrity_v13_coverage.py",
              "tests/test_extended.py",
              "tests/test_solver_bound_plan_v6.py",
              "tsao_computation/accelerators/solver.py",
              "tsao_computation/execution/runner.py",
          }
          with tarfile.open(archive_path, "r:gz") as archive:
              members = archive.getmembers()
              observed = {member.name for member in members if member.isfile()}
              if observed != expected:
                  raise SystemExit(
                      f"archive file set mismatch: missing={sorted(expected-observed)} "
                      f"extra={sorted(observed-expected)}"
                  )
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              archive.extractall(Path.cwd(), filter="data")
          PY
          rm .github/workflows/qualify-software-hardening-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install governed validation tools
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Run deterministic release gates
        run: python scripts/verify_all.py --profile all

      - name: Verify native boundary
        run: python scripts/verify_native_core.py

      - name: Run bounded benchmark telemetry
        run: python scripts/verify_all.py --profile benchmark

      - name: Verify exact final tree and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          base=38a0c9a62d86ef1614aa08ac1821606696d68ca4
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          CHANGELOG.md
          README.md
          README.zh-CN.md
          docs/autonomous-software-hardening-prompt.md
          evidence/critical-coverage-policy.json
          evidence/quality-check.json
          evidence/security-scan.json
          manifest.json
          pytest.ini
          reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json
          reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json
          reports/ACCELERATION_OPPORTUNITIES_V2.json
          schemas/solver-capability-evidence.schema.json
          tests/test_adversarial_phase_a_coverage.py
          tests/test_core.py
          tests/test_execution_evidence_hardening.py
          tests/test_execution_integrity_v13_coverage.py
          tests/test_extended.py
          tests/test_solver_bound_plan_v6.py
          tsao_computation/accelerators/solver.py
          tsao_computation/execution/runner.py
          EOF
          git diff --check
          git diff --name-only "$base" | sort > "$RUNNER_TEMP/observed-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/observed-files.txt"
          git add -A
          git diff --cached --name-only "$base" | sort > "$RUNNER_TEMP/staged-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/staged-files.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden execution evidence and deterministic tests"
          git push origin HEAD:main
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record success
        if: success()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "Software hardening qualification passed and published to main at $PRODUCT_COMMIT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "Software hardening qualification failed; no product commit was published. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
