name: Qualify software hardening once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_SOFTWARE_HARDENING_20260806' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_SOFTWARE_HARDENING_V5_20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out staged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable staging tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base=38a0c9a62d86ef1614aa08ac1821606696d68ca4
          workflow=.github/workflows/qualify-software-hardening-once.yml
          test "$(git diff --name-only "$base" HEAD)" = "$workflow"

      - name: Reassemble and apply SHA-locked V5 patch
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --slurp > "$RUNNER_TEMP/comment-pages.json"
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          issue = json.loads((temp / "issue.json").read_text(encoding="utf-8"))
          pages = json.loads((temp / "comment-pages.json").read_text(encoding="utf-8"))
          comments = [item for page in pages for item in page]
          texts = [issue.get("body") or "", *(item.get("body") or "" for item in comments)]
          pattern = re.compile(
              r"PATCH_V5_PART_(\d{2})\n([A-Za-z0-9+/=\n]+?)\nEND_PATCH_V5_PART_\1",
              re.MULTILINE,
          )
          parts: dict[int, str] = {}
          for text in texts:
              for raw_index, payload in pattern.findall(text):
                  index = int(raw_index)
                  if index in parts:
                      raise SystemExit(f"duplicate V5 patch part: {index:02d}")
                  parts[index] = "".join(payload.split())
          expected_indices = list(range(7))
          if sorted(parts) != expected_indices:
              raise SystemExit(f"V5 patch part set mismatch: {sorted(parts)}")
          expected = {
              0: "aaf9122e292577f39cee115554f241b70f25084af1767bde12cd0bc571047a55",
              1: "44bd4768e4afee4ebf014955119ed45743ca8d9c5a20f0b4d9f78cd4dead7072",
              2: "8a83b466a0047650c92b12052d617c6685cc4db3108cd905adc1eb4a224d3f42",
              3: "002988a6060a267b1a744c618bcf4175b67ceac45f4753f0d91844345cc854c9",
              4: "83897a53229450139bca1eb5d1caacfc4f3795e86a3cf2355cb83dea17266a40",
              5: "1c580fade852a769b48b7f66b49c073589979558efae3ec228a5f5130419fe80",
              6: "1874a84c05ea57e57e5297482618f00d0695c81a870ca8bdd38afd3e517c2bfa",
          }
          for index, part in parts.items():
              observed = hashlib.sha256(part.encode("ascii")).hexdigest()
              if observed != expected[index]:
                  raise SystemExit(f"V5 patch part SHA-256 mismatch: {index:02d}")
          encoded = "".join(parts[index] for index in expected_indices)
          if hashlib.sha256(encoded.encode("ascii")).hexdigest() != (
              "37dbcedb94f58d36fd081cbbe9abe719162544f0b68be04fdb164899ed730d8a"
          ):
              raise SystemExit("encoded V5 patch SHA-256 mismatch")
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != (
              "08d0555ed3d1f483c345809e190327188448044ed083abf6121a1614c99c3df9"
          ):
              raise SystemExit("compressed V5 patch SHA-256 mismatch")
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != (
              "d6d5a2f301ccd24eb35576a24d5a16320badde99c8b4f2eb62c1c3de911aa2c8"
          ):
              raise SystemExit("uncompressed V5 patch SHA-256 mismatch")
          (temp / "software-hardening-v5.patch").write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/software-hardening-v5.patch"
          git apply "$RUNNER_TEMP/software-hardening-v5.patch"
          rm .github/workflows/qualify-software-hardening-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install governed validation tools
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Run complete software qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile benchmark

      - name: Verify exact final tree and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          base=38a0c9a62d86ef1614aa08ac1821606696d68ca4
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          CHANGELOG.md
          README.md
          README.zh-CN.md
          docs/autonomous-software-hardening-prompt.md
          evidence/critical-coverage-policy.json
          evidence/quality-check.json
          evidence/security-scan.json
          manifest.json
          pytest.ini
          reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json
          reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json
          reports/ACCELERATION_OPPORTUNITIES_V2.json
          schemas/solver-capability-evidence.schema.json
          tests/test_execution_evidence_hardening.py
          tests/test_solver_bound_plan_v6.py
          tsao_computation/accelerators/solver.py
          tsao_computation/execution/runner.py
          EOF
          git add -A
          git diff --cached --check
          git diff --cached --name-only "$base" | sort > "$RUNNER_TEMP/observed-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/observed-files.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden execution evidence and deterministic qualification"
          git push origin HEAD:main
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record success
        if: success()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Software hardening V5 qualification passed and published to main at $PRODUCT_COMMIT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Software hardening V5 qualification failed; no product commit was published. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
