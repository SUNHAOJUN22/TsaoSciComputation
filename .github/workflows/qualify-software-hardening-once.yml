name: Qualify software hardening once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_SOFTWARE_HARDENING_20260806' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_SOFTWARE_HARDENING_20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out staged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable staging tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base=38a0c9a62d86ef1614aa08ac1821606696d68ca4
          workflow=.github/workflows/qualify-software-hardening-once.yml
          test "$(git diff --name-only "$base" HEAD)" = "$workflow"

      - name: Reassemble and apply SHA-locked patch V3
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          issue = json.loads((temp / "issue.json").read_text(encoding="utf-8"))
          comments = json.loads((temp / "comments.json").read_text(encoding="utf-8"))
          texts = [issue.get("body") or "", *(item.get("body") or "" for item in comments)]
          pattern = re.compile(
              r"PATCH_V3_PART_(\d{2})\n([A-Za-z0-9+/=\n]+?)\nEND_PATCH_V3_PART_\1",
              re.MULTILINE,
          )
          parts: dict[int, str] = {}
          for text in texts:
              for raw_index, payload in pattern.findall(text):
                  index = int(raw_index)
                  if index in parts:
                      raise SystemExit(f"duplicate V3 patch part: {index:02d}")
                  parts[index] = "".join(payload.split())
          if sorted(parts) != [0, 1, 2]:
              raise SystemExit(f"V3 patch part set mismatch: {sorted(parts)}")
          expected = {
              0: "256518921774c7a73a21126e90e4e202ec8210224e216ad63af32b3b86d5dfe9",
              1: "be838b1d5e0fb789059bbae6bc64b8dc7cb13995e1e343ffc490f37fb5e022d5",
              2: "947ce974a5987e1d59769705d1a6442232e3ef8dd8e45868bbe3f9b67487e48b",
          }
          for index, part in parts.items():
              observed = hashlib.sha256(part.encode("ascii")).hexdigest()
              if observed != expected[index]:
                  raise SystemExit(f"V3 patch part SHA-256 mismatch: {index:02d}")
          encoded = "".join(parts[index] for index in (0, 1, 2))
          if hashlib.sha256(encoded.encode("ascii")).hexdigest() != (
              "81c271ab7fdc399e924e0c7d6eafde0be944b55c269e5fcc934696adf6acbdb1"
          ):
              raise SystemExit("encoded V3 patch SHA-256 mismatch")
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != (
              "084a3355c1046f70fac014876937a23a5f80b009f4967497688cc30b52904c1f"
          ):
              raise SystemExit("compressed V3 patch SHA-256 mismatch")
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != (
              "398f58ec732e6e4b193b796c38ea2d8a4aef1d6d7c8e5ef26c2233da67deffbf"
          ):
              raise SystemExit("uncompressed V3 patch SHA-256 mismatch")
          (temp / "software-hardening-v3.patch").write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/software-hardening-v3.patch"
          git apply "$RUNNER_TEMP/software-hardening-v3.patch"
          rm .github/workflows/qualify-software-hardening-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install governed validation tools
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Run complete software qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile benchmark

      - name: Verify exact final tree and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          base=38a0c9a62d86ef1614aa08ac1821606696d68ca4
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          CHANGELOG.md
          README.md
          README.zh-CN.md
          docs/autonomous-software-hardening-prompt.md
          evidence/critical-coverage-policy.json
          evidence/quality-check.json
          evidence/security-scan.json
          manifest.json
          pytest.ini
          reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json
          reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json
          reports/ACCELERATION_OPPORTUNITIES_V2.json
          schemas/solver-capability-evidence.schema.json
          tests/test_adversarial_phase_a_coverage.py
          tests/test_core.py
          tests/test_execution_evidence_hardening.py
          tests/test_execution_integrity_v13_coverage.py
          tests/test_extended.py
          tests/test_solver_bound_plan_v6.py
          tsao_computation/accelerators/solver.py
          tsao_computation/execution/runner.py
          EOF
          git add -A
          git diff --cached --check
          git diff --cached --name-only "$base" | sort > "$RUNNER_TEMP/observed-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/observed-files.txt"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden execution evidence and deterministic tests"
          git push origin HEAD:main
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record success
        if: success()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Software hardening qualification passed and published to main at $PRODUCT_COMMIT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Software hardening qualification failed; no product commit was published. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
