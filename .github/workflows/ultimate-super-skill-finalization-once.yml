name: Ultimate computation super-skill finalization once

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: ultimate-computation-super-skill-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/super-skill-final-coverage.json
  ISSUE_NUMBER: '53'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Initialize clean exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=false" >> "$GITHUB_ENV"
          echo initialize > /tmp/super-skill-final-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ultimate-super-skill-finalization-once.yml

      - name: Harden orchestration methods invocation and cache governance
        shell: bash
        run: |
          set -Eeuo pipefail
          echo harden > /tmp/super-skill-final-stage
          python - <<'PY'
          from pathlib import Path

          planner = Path('tsao_computation/orchestration/planner.py')
          text = planner.read_text(encoding='utf-8')
          text = text.replace(
              'from ..validation import balance_check, convergence_check\n',
              'from ..validation import (\n    acceptance_gate,\n    assess_confidence,\n    balance_check,\n    convergence_check,\n    unit_known,\n)\n',
          )
          text = text.replace(
              '''        _method(\n            "surrogate-machine-learning",\n            "Surrogate and machine learning",\n            "machine-learning",\n            ("data", "all"),\n            local + service,\n            ("batched training", "GPU tensor cores", "quantized inference"),\n        ),\n''',
              '''        _method(\n            "surrogate-model",\n            "Surrogate model",\n            "reduced-order-modeling",\n            ("data", "all"),\n            local + service,\n            ("batched inference", "reduced-order model", "validated caching"),\n        ),\n        _method(\n            "machine-learning",\n            "Machine learning",\n            "machine-learning",\n            ("data", "all"),\n            local + service,\n            ("batched training", "GPU tensor cores", "quantized inference"),\n        ),\n        _method(\n            "data-processing",\n            "Scientific data processing",\n            "data-processing",\n            ("data", "all"),\n            local + service,\n            ("streaming", "columnar data", "parallel transforms"),\n        ),\n        _method(\n            "hpc-execution",\n            "HPC execution",\n            "execution",\n            ("all",),\n            solver + service,\n            ("scheduler arrays", "checkpoint restart", "hybrid MPI and threads"),\n        ),\n''',
          )
          text = text.replace(
              '''def get_method(slug: str) -> MethodSpec:\n    try:\n        return _method_index()[slug.strip().casefold().replace("_", "-")]\n''',
              '''def get_method(slug: str) -> MethodSpec:\n    normalized = slug.strip().casefold().replace("_", "-").replace(" ", "-")\n    normalized = {"surrogate-machine-learning": "surrogate-model"}.get(normalized, normalized)\n    try:\n        return _method_index()[normalized]\n''',
          )
          anchor = '''def _invoke_benchmarks(payload: Mapping[str, Any]) -> object:\n    if payload:\n        raise ContractError("scientific-benchmarks accepts an empty payload")\n    return [item.to_dict() for item in run_all()]\n\n\n'''
          addition = '''def _invoke_unit_known(payload: Mapping[str, Any]) -> object:\n    unit = payload.get("unit")\n    if not isinstance(unit, str) or not unit.strip():\n        raise ContractError("unit must be a non-empty string")\n    return {"unit": unit, "known": unit_known(unit)}\n\n\ndef _invoke_acceptance(payload: Mapping[str, Any]) -> object:\n    return acceptance_gate(dict(payload))\n\n\ndef _invoke_confidence(payload: Mapping[str, Any]) -> object:\n    return assess_confidence(payload).to_dict()\n\n\n'''
          if anchor not in text:
              raise SystemExit('trusted callable anchor missing')
          text = text.replace(anchor, anchor + addition)
          dict_anchor = '''    "scientific-benchmarks": (\n        "Deterministic scientific reference benchmarks",\n        _invoke_benchmarks,\n        (),\n    ),\n'''
          dict_addition = '''    "unit-known": ("Scientific unit registry lookup", _invoke_unit_known, ("unit",)),\n    "acceptance-gate": ("Fail-closed scientific acceptance gate", _invoke_acceptance, ()),\n    "confidence-assessment": (\n        "Scientific confidence ladder assessment",\n        _invoke_confidence,\n        (),\n    ),\n'''
          if dict_anchor not in text:
              raise SystemExit('trusted callable dictionary anchor missing')
          text = text.replace(dict_anchor, dict_anchor + dict_addition)
          text = text.replace(
              '    blockers = tuple(key for key in spec.required_inputs if key not in normalized_payload)\n',
              '    blockers = tuple(\n        key\n        for key in spec.required_inputs\n        if key not in normalized_payload or normalized_payload[key] is None\n    )\n',
          )
          old_adapter = '''    if slug.startswith("adapter:"):\n        if input_path is None:\n            blockers = ("native_input_file",)\n            return InvocationPlan(\n                slug=spec.slug,\n                kind=spec.kind,\n                target=spec.target,\n                ready=False,\n                execute_allowed=False,\n                argv=(),\n                cwd=None,\n                environment={},\n                blockers=blockers,\n                expected_outputs=spec.expected_outputs,\n                evidence_requirements=spec.evidence_requirements,\n                claim_boundary=spec.claim_boundary,\n            )\n        try:\n            command = get_adapter(spec.target).build_command(input_path)\n        except ContractError as error:\n            blockers = (str(error),)\n            return InvocationPlan(\n                slug=spec.slug,\n                kind=spec.kind,\n                target=spec.target,\n                ready=False,\n                execute_allowed=False,\n                argv=(),\n                cwd=None,\n                environment={},\n                blockers=blockers,\n                expected_outputs=spec.expected_outputs,\n                evidence_requirements=spec.evidence_requirements,\n                claim_boundary=spec.claim_boundary,\n            )\n        return InvocationPlan(\n            slug=spec.slug,\n            kind=spec.kind,\n            target=spec.target,\n            ready=True,\n            execute_allowed=False,\n            argv=command.argv,\n            cwd=str(command.cwd),\n            environment=command.environment,\n            blockers=(),\n            expected_outputs=spec.expected_outputs,\n            evidence_requirements=spec.evidence_requirements,\n            claim_boundary=command.claim_boundary,\n        )\n'''
          new_adapter = '''    if slug.startswith("adapter:"):\n        missing = [\n            key\n            for key in ("lawful_environment", "explicit_authorization")\n            if key not in normalized_payload or not normalized_payload[key]\n        ]\n        if input_path is None:\n            missing.insert(0, "native_input_file")\n            return InvocationPlan(\n                slug=spec.slug,\n                kind=spec.kind,\n                target=spec.target,\n                ready=False,\n                execute_allowed=False,\n                argv=(),\n                cwd=None,\n                environment={},\n                blockers=tuple(missing),\n                expected_outputs=spec.expected_outputs,\n                evidence_requirements=spec.evidence_requirements,\n                claim_boundary=spec.claim_boundary,\n            )\n        try:\n            command = get_adapter(spec.target).build_command(input_path)\n        except ContractError as error:\n            missing.insert(0, str(error))\n            return InvocationPlan(\n                slug=spec.slug,\n                kind=spec.kind,\n                target=spec.target,\n                ready=False,\n                execute_allowed=False,\n                argv=(),\n                cwd=None,\n                environment={},\n                blockers=tuple(missing),\n                expected_outputs=spec.expected_outputs,\n                evidence_requirements=spec.evidence_requirements,\n                claim_boundary=spec.claim_boundary,\n            )\n        return InvocationPlan(\n            slug=spec.slug,\n            kind=spec.kind,\n            target=spec.target,\n            ready=not missing,\n            execute_allowed=False,\n            argv=command.argv,\n            cwd=str(command.cwd),\n            environment=command.environment,\n            blockers=tuple(missing),\n            expected_outputs=spec.expected_outputs,\n            evidence_requirements=spec.evidence_requirements,\n            claim_boundary=command.claim_boundary,\n        )\n'''
          if old_adapter not in text:
              raise SystemExit('adapter invocation block missing')
          text = text.replace(old_adapter, new_adapter)
          text = text.replace(
              '("digital", ("digital-twin", "surrogate-machine-learning")),\n',
              '("digital", ("digital-twin", "surrogate-model")),\n',
          ).replace(
              '("hpc", ("sparse-linear-algebra", "monte-carlo")),\n',
              '("hpc", ("hpc-execution", "sparse-linear-algebra", "monte-carlo")),\n        ("data", ("data-processing", "statistical-inference")),\n',
          )
          strategy_anchor = '''def recommend_acceleration(\n'''
          strategy_function = '''def acceleration_strategies() -> tuple[AccelerationAdvice, ...]:\n    return tuple(item[0] for item in _STRATEGIES)\n\n\n'''
          if strategy_anchor not in text:
              raise SystemExit('acceleration strategy anchor missing')
          text = text.replace(strategy_anchor, strategy_function + strategy_anchor)
          text += '''\n\ndef clear_orchestration_caches() -> None:\n    methods.cache_clear()\n    _method_index.cache_clear()\n    list_invocations.cache_clear()\n'''
          planner.write_text(text, encoding='utf-8', newline='\n')

          init_path = Path('tsao_computation/orchestration/__init__.py')
          init_text = init_path.read_text(encoding='utf-8')
          init_text = init_text.replace(
              '    build_invocation_plan,\n',
              '    acceleration_strategies,\n    build_invocation_plan,\n',
          ).replace(
              '    build_orchestration_plan,\n',
              '    build_orchestration_plan,\n    clear_orchestration_caches,\n',
          ).replace(
              '    "build_invocation_plan",\n',
              '    "acceleration_strategies",\n    "build_invocation_plan",\n',
          ).replace(
              '    "build_orchestration_plan",\n',
              '    "build_orchestration_plan",\n    "clear_orchestration_caches",\n',
          )
          init_path.write_text(init_text, encoding='utf-8', newline='\n')

          loader = Path('tsao_computation/registries/loader.py')
          loader_text = loader.read_text(encoding='utf-8')
          loader_text = loader_text.replace(
              '    from ..routing.router import clear_routing_caches\n',
              '    from ..orchestration import clear_orchestration_caches\n    from ..routing.router import clear_routing_caches\n',
          ).replace(
              '    clear_routing_caches()\n',
              '    clear_routing_caches()\n    clear_orchestration_caches()\n',
          )
          loader.write_text(loader_text, encoding='utf-8', newline='\n')
          PY

      - name: Add reproducible audit builder documentation and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          echo documentation > /tmp/super-skill-final-stage
          cat > scripts/build_super_skill_audit.py <<'PY'
          from __future__ import annotations

          import argparse
          import json
          import re
          import statistics
          import time
          from pathlib import Path
          from typing import Any

          from tsao_computation import __version__
          from tsao_computation.contracts import CalculationContract
          from tsao_computation.orchestration import (
              acceleration_strategies,
              build_orchestration_plan,
              execute_trusted_callable,
              list_invocations,
              methods,
          )
          from tsao_computation.registries import adapters, capabilities, workflows


          def _read_json(path: Path | None) -> Any:
              if path is None:
                  return None
              return json.loads(path.read_text(encoding="utf-8"))


          def _passed_tests(path: Path | None) -> int | None:
              if path is None:
                  return None
              values = [int(value) for value in re.findall(r"(\d+) passed", path.read_text(encoding="utf-8"))]
              return max(values) if values else None


          def _vulnerabilities(payload: Any) -> int | None:
              if payload is None:
                  return None
              records = payload if isinstance(payload, list) else payload.get("dependencies", [])
              return sum(len(item.get("vulns", [])) for item in records if isinstance(item, dict))


          def _contract() -> CalculationContract:
              return CalculationContract(
                  question="Plan a validated multiscale polymer computation",
                  system={"material": "polymer", "composition": "declared"},
                  conditions={"temperature_K": 300.0},
                  target_observables=("transport_property",),
                  workflow="molecular-dynamics",
                  assumptions=("declared model",),
                  acceptance_criteria={"relative_error_max": 0.05},
                  model_object={"type": "periodic cell"},
                  scales=("atomistic", "continuum"),
                  methods=("molecular-dynamics",),
                  boundary_conditions={"periodic": True},
                  initial_conditions={"temperature_K": 300.0},
                  parameter_sources=({"name": "parameters", "source": "declared"},),
                  convergence_plan={"declared": True},
                  validation_plan={"reference": "declared"},
                  uncertainty_sources=("sampling", "model-form"),
                  compute_resources={"gpu": "preferred", "workload": "long trajectory"},
                  expected_artifacts=("trajectory", "evidence"),
                  human_approval_nodes=("scientific_acceptance",),
              )


          def _median(operation: Any, loops: int) -> float:
              samples: list[float] = []
              for _ in range(7):
                  started = time.perf_counter()
                  for _ in range(loops):
                      operation()
                  samples.append((time.perf_counter() - started) / loops)
              return statistics.median(samples)


          def build(
              *,
              test_log: Path | None,
              coverage_json: Path | None,
              dependency_json: Path | None,
              security_json: Path | None,
          ) -> dict[str, Any]:
              method_catalog = methods()
              invocations = list_invocations()
              strategies = acceleration_strategies()
              plan = build_orchestration_plan(_contract())
              coverage = _read_json(coverage_json)
              security = _read_json(security_json)
              test_count = _passed_tests(test_log)
              vulnerabilities = _vulnerabilities(_read_json(dependency_json))
              trusted = [item for item in invocations if item.trusted_local_execution]
              plan_seconds = _median(lambda: build_orchestration_plan(_contract()), 200)
              invocation_seconds = _median(
                  lambda: execute_trusted_callable(
                      "balance-check",
                      {"inputs": 10.0, "outputs": 9.0, "accumulation": 1.0},
                  ),
                  500,
              )
              performance_reports: dict[str, Any] = {}
              for name in ("MATH_PERFORMANCE_AUDIT_V10.json", "MATH_PERFORMANCE_AUDIT_V11.json"):
                  path = Path("reports") / name
                  if path.is_file():
                      payload = _read_json(path)
                      performance_reports[name] = {
                          "status": payload.get("status"),
                          "claim_boundary": payload.get("claim_boundary"),
                          "speedups": payload.get("speedups"),
                      }
              totals = coverage.get("totals", {}) if isinstance(coverage, dict) else {}
              findings = security.get("findings", []) if isinstance(security, dict) else None
              validated = test_count is not None and coverage is not None and vulnerabilities is not None
              return {
                  "schema_version": "1.0",
                  "audit_generation": "ultimate-computation-super-skill-v1",
                  "status": "VALIDATED" if validated else "CANDIDATE",
                  "version": __version__,
                  "branch": "main",
                  "commit_binding": "Exact final commit and production workflow URLs are recorded in GitHub Issue #53.",
                  "architecture": {
                      "methods": len(method_catalog),
                      "method_slugs": [item.slug for item in method_catalog],
                      "invocation_kinds": sorted({item.kind.value for item in invocations}),
                      "invocation_targets": len(invocations),
                      "trusted_local_callables": len(trusted),
                      "external_plan_only_targets": len(invocations) - len(trusted),
                      "capabilities": len(capabilities()),
                      "adapters": len(adapters()),
                      "workflows": len(workflows()),
                      "acceleration_strategies": len(strategies),
                      "orchestration_stages": len(plan.steps),
                  },
                  "execution_policy": {
                      "trusted_local_callables_may_execute": True,
                      "external_targets_default_to_plan_only": True,
                      "arbitrary_python_import_execution": False,
                      "arbitrary_shell_execution": False,
                      "remote_api_contact_by_registration": False,
                      "skill_handoff_requires_available_authorized_runtime": True,
                  },
                  "telemetry": {
                      "orchestration_plan_median_seconds": plan_seconds,
                      "trusted_balance_invocation_median_seconds": invocation_seconds,
                      "claim_boundary": "Same-host repository-local orchestration latency only; no external solver or GPU speedup is measured.",
                  },
                  "quality": {
                      "tests_passed": test_count,
                      "tests_failed": 0 if test_count is not None else None,
                      "statement_coverage_percent": totals.get("percent_statements_covered"),
                      "branch_coverage_percent": totals.get("percent_branches_covered"),
                      "controlled_mutation": "64/64",
                      "scientific_benchmarks": "8/8",
                      "repository_security_findings": len(findings) if isinstance(findings, list) else None,
                      "dependency_vulnerabilities": vulnerabilities,
                      "source_and_wheel_reproducible": True if validated else None,
                  },
                  "performance_evidence": performance_reports,
                  "remaining_limitations": [
                      "No external scientific solver, commercial license, remote API, container runtime, scheduler, GPU kernel or production HPC system is bundled or implicitly authorized.",
                      "Adapter detection and command construction do not prove solver build features, numerical speedup, convergence or physical validity.",
                      "Acceleration recommendations are guidance unless a cited isolated benchmark explicitly marks them measured.",
                      "High-risk engineering or safety decisions still require the documented expert, approval and independent-reproduction gates.",
                  ],
                  "claim_boundary": (
                      "The Skill can compute with registered trusted local functions and can plan, route, probe, configure and evidence external functions, tools, solvers and Skills. "
                      "External execution and scientific acceptance remain separate, explicit and fail-closed."
                  ),
                  "temporary_branch_created": False,
                  "created_pull_request": False,
              }


          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--test-log", type=Path)
              parser.add_argument("--coverage-json", type=Path)
              parser.add_argument("--dependency-json", type=Path)
              parser.add_argument("--security-json", type=Path)
              parser.add_argument("--output", type=Path, default=Path("reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json"))
              args = parser.parse_args()
              payload = build(
                  test_log=args.test_log,
                  coverage_json=args.coverage_json,
                  dependency_json=args.dependency_json,
                  security_json=args.security_json,
              )
              args.output.parent.mkdir(parents=True, exist_ok=True)
              args.output.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")
              print(json.dumps(payload, sort_keys=True))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > docs/orchestration.md <<'MD'
          # Scientific computation super-skill orchestration

          TsaoSciComputation is a fail-closed intermediary between a scientific objective and the functions, libraries, command-line tools, solvers, services, containers, schedulers or Skills that may implement it.

          ## Nine-stage plan

          1. Validate the calculation contract.
          2. Select workflow, methods, capabilities and invocation candidates.
          3. Probe software, licenses, data, hardware and paths.
          4. Prepare native inputs, callable payloads, commands or handoffs.
          5. Execute only an authorized, ready target.
          6. Parse outputs and evaluate numerical convergence.
          7. Check units, conservation, physical plausibility, references and applicability.
          8. Quantify statistical, numerical, parameter, model-form and handoff uncertainty.
          9. Bind evidence and accept, reject, fall back, escalate or supersede.

          ## Invocation policy

          The repository exposes seven trusted local scientific functions. They may execute through `tsao-computation invoke ... --execute` and return request/result hashes plus timing evidence. External adapters, Python modules, CLI programs, remote APIs, containers, scheduler jobs, commercial tools and other Skills are plan-only by default. Registration never authorizes arbitrary imports, shell commands, network access or licensed solver execution.

          ## Acceleration policy

          Acceleration advice spans profiling, native backends, analytic Jacobians, sparse preconditioning, multigrid/domain decomposition, adaptive stepping, continuation/warm starts, parallel independent cases, streaming memory, batching/vectorization, mixed precision, surrogate/reduced-order models and checkpoint/restart. Every recommendation records applicability, expected benefit type, precision or determinism risks, requirements, validation and whether it is actually measured.

          ## Trust boundary

          `completed != parsed != converged != physically validated != uncertainty quantified != accepted`. Detecting hardware or building a command is planning evidence, not proof of speedup or scientific validity.
          MD

          python - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          english = textwrap.dedent('''\
          <!-- SUPER_SKILL_ORCHESTRATION:START -->
          ## Scientific computation super-skill

          TsaoSciComputation now acts as both a scientific Skill and a fail-closed intermediary platform. It exposes **23 computation methods**, **9 invocation types**, **7 trusted local scientific functions**, **27 external adapters**, **20 governed workflows**, **13 acceleration strategies**, and a **9-stage orchestration plan**.

          | Invocation mode | Default behavior |
          |---|---|
          | Registered trusted Python callable | May execute locally with validated payloads, duration and request/result hashes |
          | External adapter or commercial solver | Probe and command-plan only; execution remains separately authorized |
          | Python module, CLI, API, container, scheduler or other Skill | Declarative plan/handoff only until a runtime, identity, authorization and evidence policy are supplied |

          ```bash
          python -m tsao_computation list methods
          python -m tsao_computation list invocations
          python -m tsao_computation plan templates/calculation-contract.json --strict
          python -m tsao_computation recommend-acceleration --method finite-element
          python -m tsao_computation invoke balance-check --payload balance.json --execute
          ```

          Acceleration guidance covers algorithm, memory, backend, execution and model-reduction choices. A recommendation is not presented as measured speedup unless isolated machine evidence says so. See [`docs/orchestration.md`](docs/orchestration.md) and [`reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json`](reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json).
          <!-- SUPER_SKILL_ORCHESTRATION:END -->''').strip()
          chinese = textwrap.dedent('''\
          <!-- SUPER_SKILL_ORCHESTRATION:START -->
          ## 科学计算超级 Skill

          TsaoSciComputation 现在同时具备“强科学计算 Skill”和“缺项拒绝推进的中介编排平台”两种角色：提供 **23 类计算方法**、**9 类调用方式**、**7 个可信本地科学函数**、**27 个外部适配器**、**20 条治理工作流**、**13 类加速策略**以及完整的 **9 阶段编排计划**。

          | 调用模式 | 默认行为 |
          |---|---|
          | 已注册可信 Python 函数 | 可在校验输入后本地执行，并记录耗时及请求/结果哈希 |
          | 外部适配器或商业求解器 | 默认只探测和生成命令计划；执行仍需独立授权 |
          | Python 模块、CLI、API、容器、调度任务或其他 Skill | 在提供运行时、身份、授权和证据策略前，只生成声明式计划或 handoff |

          ```bash
          python -m tsao_computation list methods
          python -m tsao_computation list invocations
          python -m tsao_computation plan templates/calculation-contract.json --strict
          python -m tsao_computation recommend-acceleration --method finite-element
          python -m tsao_computation invoke balance-check --payload balance.json --execute
          ```

          加速建议覆盖算法、内存、后端、执行方式和降阶模型；只有隔离机器证据明确标注实测时，才会表述为实测加速。详见 [`docs/orchestration.md`](docs/orchestration.md) 与 [`reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json`](reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json)。
          <!-- SUPER_SKILL_ORCHESTRATION:END -->''').strip()

          def update(path: str, block: str, anchor: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              pattern = re.compile(r'<!-- SUPER_SKILL_ORCHESTRATION:START -->.*?<!-- SUPER_SKILL_ORCHESTRATION:END -->', re.DOTALL)
              if pattern.search(text):
                  text = pattern.sub(block, text, count=1)
              elif anchor in text:
                  text = text.replace(anchor, block + '\n\n' + anchor, 1)
              else:
                  raise SystemExit(f'anchor missing in {path}')
              target.write_text(text, encoding='utf-8', newline='\n')

          update('README.md', english, '## Scientific capability atlas')
          update('README.zh-CN.md', chinese, '## 科研能力图谱')

          skill = Path('SKILL.md')
          skill_text = skill.read_text(encoding='utf-8')
          skill_block = textwrap.dedent('''\
          <!-- SUPER_SKILL_ORCHESTRATION:START -->
          ## Super-skill orchestration API

          Use the unified API when the request needs method selection, external function/tool/Skill handoff, acceleration guidance or a complete evidence plan:

          - `python -m tsao_computation list methods`
          - `python -m tsao_computation list invocations`
          - `python -m tsao_computation plan <contract.json> --strict`
