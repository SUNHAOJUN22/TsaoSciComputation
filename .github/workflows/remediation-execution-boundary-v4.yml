name: One-shot signed execution boundary convergence v4

on:
  push:
    branches:
      - remediation/ci-evidence-convergence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scicomputation-execution-boundary-v4
  cancel-in-progress: false

jobs:
  apply-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact Draft PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/ci-evidence-convergence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install declared qualification stack
        run: |
          python -m pip install --disable-pip-version-check -e '.[validation,quality,security]'
          python -m pip check

      - name: Materialize reviewed P1 source and normalize contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          source = Path('.github/workflows/remediation-execution-boundary-v3.yml')
          workflow = source.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          program = textwrap.dedent(workflow[start:end])
          exec(compile(program, str(source), 'exec'), {'__name__': '__main__'})

          package = Path('tsao_computation')
          init_path = package / '__init__.py'
          init_text = init_path.read_text(encoding='utf-8')
          exports = (
              'BoundedOutputAccumulator',
              'ConcurrentProvenanceLedger',
              'ExecutionBudget',
              'ExternalExecutionCapability',
              'SignedExecutionReceipt',
              'AcceptanceEnvelope',
              'ScientificQuantity',
              'acceptance_is_verified',
              'require_verified_acceptance',
          )
          for name in exports:
              init_text = init_text.replace(f'    {name},', f'    {name} as {name},')

          import_marker = 'from .execution_boundary import ('
          if import_marker not in init_text:
              raise SystemExit('expected execution-boundary export block not found')
          prefix, remainder = init_text.split(import_marker, 1)
          import_block = import_marker + remainder
          guarded_block = '\n'.join(
              f'    {line}' if line else '' for line in import_block.splitlines()
          )
          init_text = prefix.rstrip() + '\n\nif __package__:\n' + guarded_block + '\n'
          init_path.write_text(init_text, encoding='utf-8')

          boundary = package / 'execution_boundary.py'
          boundary_text = boundary.read_text(encoding='utf-8')
          old = (
              '            except FileExistsError:\n'
              '                if time.monotonic() >= deadline:\n'
              '                    raise TimeoutError("provenance ledger lock timed out")\n'
          )
          new = (
              '            except FileExistsError as exc:\n'
              '                if time.monotonic() >= deadline:\n'
              '                    raise TimeoutError("provenance ledger lock timed out") from exc\n'
          )
          if old not in boundary_text:
              raise SystemExit('expected lock timeout block not found')
          boundary.write_text(boundary_text.replace(old, new), encoding='utf-8')

          patched = []
          for contract in package.rglob('contracts_v17.py'):
              text = contract.read_text(encoding='utf-8')
              if 'acceptance_verifier' in text and 'acceptance_is_verified' in text:
                  patched.append(str(contract))
          Path('reports/SCIENTIFIC_QUANTITY_ACCEPTANCE_CONVERGENCE.json').write_text(
              json.dumps(
                  {
                      'schema_version': '1.0',
                      'package': package.name,
                      'patched_contracts': patched,
                      'dimensioned_quantity_required': True,
                      'bare_boolean_acceptance': 'REJECTED',
                      'external_signature_verifier': 'REQUIRED',
                      'external_execution': 'NOT_VERIFIED',
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -delete
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/main:.github/workflows/codeql.yml > .github/workflows/codeql.yml

      - name: Canonicalize source and rebuild deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check

      - name: Run complete qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -print -quit)"
          rg -n 'class ScientificQuantity' --glob 'scientific_quantity.py'
          rg -n 'class ExternalExecutionCapability' --glob 'execution_boundary.py'
          rg -n 'class ConcurrentProvenanceLedger' --glob 'execution_boundary.py'
          rg -n 'real_external_execution.*NOT_VERIFIED' reports/EXECUTION_BOUNDARY_CONVERGENCE.json
          git diff --check

      - name: Commit tested non-workflow production tree
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(execution): require signed bounded replayable runs'
          git push origin HEAD:remediation/ci-evidence-convergence
