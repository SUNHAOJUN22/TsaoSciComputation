name: One-shot signed execution boundary convergence v4

on:
  push:
    branches:
      - remediation/ci-evidence-convergence

permissions:
  contents: write

concurrency:
  group: scicomputation-execution-boundary-v4
  cancel-in-progress: false

jobs:
  reseal-helper-free-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Check out exact Draft branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: remediation/ci-evidence-convergence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install qualification stack
        run: |
          python -m pip install --disable-pip-version-check -e '.[validation,quality,security]'
          python -m pip check

      - name: Remove temporary compatibility and materialize clean workflow view
        shell: bash
        run: |
          set -euo pipefail
          rm -f tsao_computation/_rg_compat.py
          python - <<'PY'
          from pathlib import Path

          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          line = 'rg = "tsao_computation._rg_compat:main"\n'
          if text.count(line) != 1:
              raise SystemExit('temporary rg entrypoint was not found exactly once')
          path.write_text(text.replace(line, ''), encoding='utf-8')
          PY
          find .github/workflows -maxdepth 1 -type f -name 'remediation-*.yml' -delete
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/main:.github/workflows/codeql.yml > .github/workflows/codeql.yml

      - name: Rebuild deterministic evidence against final source view
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check

      - name: Requalify final production source
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m bandit -q -r tsao_computation scripts -x tests
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
          python - <<'PY'
          import json
          from pathlib import Path

          assert 'class ScientificQuantity' in Path('tsao_computation/scientific_quantity.py').read_text(encoding='utf-8')
          boundary = Path('tsao_computation/execution_boundary.py').read_text(encoding='utf-8')
          assert 'class ExternalExecutionCapability' in boundary
          assert 'class ConcurrentProvenanceLedger' in boundary
          report = json.loads(Path('reports/EXECUTION_BOUNDARY_CONVERGENCE.json').read_text(encoding='utf-8'))
          assert report['real_external_execution'] == 'NOT_VERIFIED'
          PY
          git diff --check

      - name: Commit helper-free non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(evidence): reseal helper-free execution contracts'
          git push origin HEAD:remediation/ci-evidence-convergence
