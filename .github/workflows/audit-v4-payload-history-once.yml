name: Audit V4 payload history once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: audit-v4-payload-history-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    if: >-
      github.event.issue.title == 'AUDIT_V4_CHUNKS_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Hash historical chunks
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          chunks = [
              (0, 'c4554b4bef87f22e8d32f0f85cb6132812891d0f', '1ad93a15587d197c1b12e6eba02a6d5c73189eff77d19cc9338a6b540342b9c6'),
              (1, 'de3f92cb762a00b0616ec3eaa563fa8a55184cc6', '7d586deac7d6398404acc2bfeb216ff64dabd87b6e47f068cee01146f40bdafd'),
              (2, 'da0ee6fb4841be4623d87fa8bcb95db6fca764e8', 'f5f0d024f37950a1b1047db0ba60ce062eab21faa7bfdf31c418f96f84e7b277'),
              (3, '304c88244584e7a5311d1e7530f42e9f2a02bd72', '01a45d294049b225d03f2a5ac70d096a1ad04d61ba47fc9e6f47668953c9a855'),
              (4, '3f5e6317e7513c505744354adcf95978963c0e94', '162604a01fbbd501ca6d0635806e0b3f742d9605dbfdf3ae5bc00758df1b3417'),
              (5, '6113290e4dd3753ed593c91d7c8a21d2d7df95b4', 'f6dd42793702b551c9095620d6ef8316619598250006e8c9e8ac136624f02cd9'),
              (6, '43bf6465a49a10a1dc4b130dab748eac22bc59e9', '99c29d2390efa107aa6f931b45eba651c30d77b017e999982f1d219f1694e282'),
              (7, '5eefb0df20d42548274605a9a624b07f70d60748', 'ce311e20d02a7a7d3adcc8edad28e1a90a95ef88b5ee15720821ee238d886999'),
          ]
          results = []
          combined = bytearray()
          for index, commit, expected in chunks:
              path = f'.github/payloads/acceleration-v4/big-{index:02d}'
              data = subprocess.check_output(['git', 'show', f'{commit}:{path}']).replace(b'\n', b'').replace(b'\r', b'')
              observed = hashlib.sha256(data).hexdigest()
              combined.extend(data)
              results.append({
                  'index': index,
                  'bytes': len(data),
                  'expected': expected,
                  'observed': observed,
                  'match': observed == expected,
              })
          payload = {
              'chunks': results,
              'combined_bytes': len(combined),
              'combined_sha256': hashlib.sha256(combined).hexdigest(),
          }
          Path('/tmp/v4-chunk-audit.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/v4-chunk-audit.json

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-v4-payload-history-once.yml
          git commit -m 'Remove one-time V4 payload audit workflow [skip ci]'
          git push origin HEAD:refs/heads/main
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Historical payload chunk audit completed without creating a branch or pull request.'
