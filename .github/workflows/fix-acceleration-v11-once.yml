name: Fix acceleration V1.1 catalog once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: fix-acceleration-v11-catalog
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      github.event.issue.title == 'Fix acceleration V1.1 catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply missing catalog and documentation entries
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-acceleration-v11-once.yml

          python - <<'PY'
          from pathlib import Path

          path = Path('tsao_computation/accelerators/catalog.py')
          text = path.read_text(encoding='utf-8')
          if '"cudss"' not in text:
              anchor = '''    AccelerationLibrary(\n        "kokkos",'''
              addition = '''    AccelerationLibrary(
        "cudss",
        "NVIDIA cuDSS (Preview)",
        "NVIDIA",
        "sparse-direct",
        (AcceleratorBackend.CUDA,),
        ("sparse-direct-solve", "factorization", "iterative-refinement", "multi-gpu"),
        ("finite-element", "cfd", "multiphysics", "quantum"),
        "optional native C/C++ integration; preview API",
        "Preview candidate only. The cuDSS API is subject to change; versioned build, numerical-equivalence, stability, and performance evidence are required.",
    ),
    AccelerationLibrary(
        "cusparselt",
        "NVIDIA cuSPARSELt",
        "NVIDIA",
        "structured-sparse",
        (AcceleratorBackend.CUDA,),
        ("structured-sparse-matmul", "pruning", "compression", "batched-sparse-gemm"),
        ("machine-learning", "equivariant-ml", "materials", "surrogates"),
        "optional native C/C++ or qualified framework integration",
        _BOUNDARY,
    ),
    AccelerationLibrary(
        "amgx",
        "NVIDIA AmgX",
        "NVIDIA",
        "algebraic-multigrid",
        (AcceleratorBackend.CUDA,),
        ("linear-solver", "preconditioner", "algebraic-multigrid", "multi-gpu", "mpi"),
        ("finite-element", "cfd", "multiphysics", "implicit-solvers"),
        "optional C API with solver and MPI integration",
        _BOUNDARY,
    ),
    AccelerationLibrary(
        "cuquantum",
        "NVIDIA cuQuantum",
        "NVIDIA",
        "quantum-simulation",
        (AcceleratorBackend.CUDA,),
        ("state-vector", "tensor-network", "density-matrix", "quantum-dynamics"),
        ("quantum-computing", "quantum-dynamics", "tensor-networks"),
        "optional C or Python APIs",
        _BOUNDARY,
    ),
    AccelerationLibrary(
        "cupynumeric",
        "NVIDIA cuPyNumeric and Legate",
        "NVIDIA",
        "distributed-array",
        (AcceleratorBackend.CPU, AcceleratorBackend.CUDA, AcceleratorBackend.MPI),
        ("numpy-api", "linear-algebra", "fft", "stencil", "multi-node"),
        ("cfd", "finite-element", "uncertainty", "data", "scientific-python"),
        "optional Python/Legate runtime",
        _BOUNDARY,
    ),
    AccelerationLibrary(
        "cugraph",
        "RAPIDS cuGraph",
        "NVIDIA",
        "graph",
        (AcceleratorBackend.CUDA,),
        ("graph-analytics", "connectivity", "clustering", "centrality", "multi-gpu"),
        ("molecular", "materials", "percolation", "digital-twin", "networks"),
        "optional RAPIDS Python or C API integration",
        _BOUNDARY,
    ),
    AccelerationLibrary(
        "holoscan",
        "NVIDIA Holoscan SDK",
        "NVIDIA",
        "edge-streaming",
        (AcceleratorBackend.CPU, AcceleratorBackend.CUDA),
        ("sensor-pipeline", "streaming", "low-latency", "edge-inference", "operator-graph"),
        ("edge", "digital-twin", "control", "industrial-inspection", "sensor-processing"),
        "optional C++/Python edge SDK",
        _BOUNDARY,
    ),
'''
              if anchor not in text:
                  raise SystemExit('catalog insertion anchor is missing')
              path.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8', newline='\n')

          reference = Path('references/accelerated-computing.md')
          reference_text = reference.read_text(encoding='utf-8')
          marker = '## Acceleration Foundation V1.1 hardening'
          if marker not in reference_text:
              reference_text += '''

## Acceleration Foundation V1.1 hardening

The optional candidate catalog also records cuDSS, cuSPARSELt, AmgX, cuQuantum, cuPyNumeric/Legate, cuGraph and Holoscan. These entries improve planning coverage for sparse direct and multigrid solvers, structured sparsity, quantum simulation, distributed scientific Python, graph analytics and low-latency edge pipelines. They remain metadata only: no package is installed automatically, no solver build feature is inferred from host-library presence, and no speedup or scientific validity is claimed without versioned execution evidence.

V1.1 also separates physical devices from portability frameworks, enumerates qualified CUDA/HIP/SYCL/OpenCL devices when vendor tools expose them, avoids classifying every ARM64 host as an edge device, binds HIP devices explicitly, and bounds local CPU/MPI requests to the detected resource envelope. CPU fallback remains mandatory when fallback is requested.
'''
              reference.write_text(reference_text, encoding='utf-8', newline='\n')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          bullet = '- Hardened Acceleration Foundation V1.1 with explicit edge detection, HIP/SYCL/OpenCL device enumeration, local CPU/MPI oversubscription guards, declared-only CPU fallback, HIP device binding, and additional optional CUDA-X, graph, distributed-array, quantum and edge-streaming candidates.'
          if bullet not in changelog_text:
              changelog_text = changelog_text.replace('## Unreleased\n', '## Unreleased\n\n' + bullet + '\n', 1)
              changelog.write_text(changelog_text, encoding='utf-8', newline='\n')
          PY

      - name: Validate fix completely
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation/accelerators/catalog.py
          python -m ruff format tsao_computation/accelerators/catalog.py
          python -m pytest -q tests/test_acceleration_v11.py
          python scripts/sync_package_assets.py
          python scripts/build_manifest.py
          python scripts/verify_all.py --profile all
          python -m pytest -q
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py

      - name: Commit fix directly to main
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git commit -m 'Complete acceleration V1.1 catalog'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report success
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Acceleration V1.1 catalog fix passed targeted tests, complete deterministic gates and final pytest. Commit: ${{ steps.commit.outputs.sha }}. No branch or PR was created."

      - name: Report failure
        if: ${{ failure() }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Acceleration V1.1 catalog fix failed. No successful completion is being claimed. Inspect Actions run $GITHUB_RUN_ID; no branch or PR was created." || true
