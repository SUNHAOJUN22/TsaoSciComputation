name: One-time launch SciComputation clean-source repair v3

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  repair-and-publish:
    if: contains(github.event.head_commit.message || '', '[run-scicomputation-clean-repair-v3]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"
          cache: pip

      - name: Install qualification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Extract audited repair scripts
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/one-time-repair-clean-source.yml /tmp/scicomputation-controller.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/scicomputation-controller.yml').read_text(encoding='utf-8').splitlines()

          def extract(step_name: str, target: str) -> None:
              marker = f'- name: {step_name}'
              index = next(i for i, line in enumerate(source) if line.strip() == marker)
              run_index = next(i for i in range(index + 1, len(source)) if source[i].strip() == 'run: |')
              run_indent = len(source[run_index]) - len(source[run_index].lstrip())
              body: list[str] = []
              for line in source[run_index + 1:]:
                  indent = len(line) - len(line.lstrip())
                  if line.strip() and indent <= run_indent:
                      break
                  body.append(line[run_indent + 2:] if len(line) >= run_indent + 2 else '')
              if not body:
                  raise SystemExit(f'empty run script for {step_name!r}')
              Path(target).write_text('\n'.join(body) + '\n', encoding='utf-8')

          extract('Remove harness files and regenerate exact evidence', '/tmp/scicomputation-prepare.sh')
          extract('Run clean-source qualification', '/tmp/scicomputation-validate.sh')
          extract('Generate isolated six-hour harness bound to clean source', '/tmp/scicomputation-harness.sh')
          PY
          chmod +x /tmp/scicomputation-prepare.sh /tmp/scicomputation-validate.sh /tmp/scicomputation-harness.sh

      - name: Regenerate evidence and qualify clean source
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/scicomputation-prepare.sh
          bash /tmp/scicomputation-validate.sh
          rm -f .github/workflows/one-time-launch-clean-source-repair-v2.yml
          git diff --check

      - name: Publish exact clean source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refresh exact qualification evidence after merge"
          clean_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "clean_sha=$clean_sha" >> "$GITHUB_OUTPUT"

      - name: Publish isolated six-hour harness
        id: harness
        shell: bash
        env:
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
        run: |
          set -euo pipefail
          bash /tmp/scicomputation-harness.sh

      - name: Record launcher result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.source.outputs.clean_sha }}
          HARNESS_SHA: ${{ steps.harness.outputs.harness_sha }}
        run: |
          set -euo pipefail
          gh issue comment 162 --repo "$GITHUB_REPOSITORY" --body "SCICOMPUTATION_REPAIR_V3 status=${{ job.status }} clean_sha=${CLEAN_SHA:-UNPUBLISHED} harness_sha=${HARNESS_SHA:-UNPUBLISHED} next=/run-six-hour-active-v4 previous_active_ns=0"
