name: V10 visual polish handoff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v10-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Apply visual anchor and semantic-color polish
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/regenerate_readme_visuals_v10.py')
          text = path.read_text(encoding='utf-8')

          old_signature = '''def text_lines(x: float, y: float, value: str, css_class: str, limit: int, step: int) -> str:
'''
          new_signature = '''def text_lines(
    x: float,
    y: float,
    value: str,
    css_class: str,
    limit: int,
    step: int,
    *,
    anchor: str = "start",
) -> str:
'''
          old_return = '''    return f'<text x="{x:.1f}" y="{y:.1f}" class="{css_class}">{"".join(tspans)}</text>'
'''
          new_return = '''    return f'<text x="{x:.1f}" y="{y:.1f}" text-anchor="{anchor}" class="{css_class}">{"".join(tspans)}</text>'
'''
          old_common = '''    common = f'fill="none" stroke="{accent}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"'
'''
          new_common = '''    common = f'color="{accent}" fill="none" stroke="{accent}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"'
'''
          old_subtitle = '''    subtitle_lines = text_lines(
        subtitle_x, 150.0 if hero else 142.0, spec.subtitle, "subtitle", 82 if hero else 72, 22
    )
'''
          new_subtitle = '''    subtitle_lines = text_lines(
        subtitle_x,
        150.0 if hero else 142.0,
        spec.subtitle,
        "subtitle",
        82 if hero else 72,
        22,
        anchor="middle" if hero else "start",
    )
'''

          replacements = (
              (old_signature, new_signature),
              (old_return, new_return),
              (old_common, new_common),
              (old_subtitle, new_subtitle),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one patch target, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m pip install ruff
          python -m ruff format scripts/regenerate_readme_visuals_v10.py
          python scripts/regenerate_readme_visuals_v10.py
          python scripts/regenerate_readme_visuals_v10.py --check
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          rm -f .github/workflows/v10-visual-polish.yml
          printf 'issue=30\npolish=hero-anchor-current-color\n' > .v10-readme-visual-trigger
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish V10 hero alignment and semantic icon colors'
          git push origin HEAD:refs/heads/main

# indexed retry
