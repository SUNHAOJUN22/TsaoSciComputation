name: Diagnose main audit V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-main-audit-v4.yml'

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Extract failed log tail
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run view 30191821564 --repo "$GITHUB_REPOSITORY" --log-failed \
            > "$RUNNER_TEMP/main-audit-v4-failed.log" 2>&1 || true
          {
            echo 'Main audit V4 failure tail:'
            echo
            echo '```text'
            tail -n 140 "$RUNNER_TEMP/main-audit-v4-failed.log" | tail -c 28000
            echo '```'
          } > "$RUNNER_TEMP/main-audit-v4-comment.md"
          gh issue comment 24 --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/main-audit-v4-comment.md"
