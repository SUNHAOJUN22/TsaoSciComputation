name: Retry computation super-skill foundation once

on:
  push:
    branches: [main]
    paths: [.retry-super-skill-foundation]

permissions:
  contents: write
  issues: write

concurrency:
  group: retry-super-skill-foundation-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/super-skill-foundation-retry-coverage.json
  ISSUE_NUMBER: '53'
  BASELINE_SHA: 'f6a1d2bf98e50c019aaf863e96c4797805130c60'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Reapply measured foundation and repair typing
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "PASSED=false" >> "$GITHUB_ENV"
          echo reapply > /tmp/super-skill-foundation-retry-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick \
            548b3d5da2509a3e2156c7deaf7ef7e479a15372 \
            31c4ee5da28aae0481dfa9250408ca4962fc0ba6 \
            eb0f0a0e633931c5f379f9c0e900ed98b257e921 \
            f5d28e4d7e24efb3882cd4c2ffe854cb2814de41 \
            6f4d9c8a1cc3bb9668c8640fbe6854230c9541f2 \
            380088fcef3203d5ae8b31208c479749a6909e54 \
            480e9886e22e3b8d84613a5f8b5cf3e1fd1c5d2f
          python - <<'PY'
          from pathlib import Path
          path = Path('tsao_computation/orchestration/planner.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from typing import Any, Callable\n', 'from typing import Any, Callable, cast\n')
          old = '''    if hasattr(value, "to_dict"):\n        return value.to_dict()  # type: ignore[union-attr]\n    if is_dataclass(value):\n        return asdict(value)\n'''
          new = '''    to_dict = getattr(value, "to_dict", None)\n    if callable(to_dict):\n        return to_dict()\n    if is_dataclass(value) and not isinstance(value, type):\n        return asdict(cast(Any, value))\n'''
          if old not in text:
              raise SystemExit('expected _jsonable block not found')
          path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          rm -f .github/workflows/retry-super-skill-foundation-once.yml
          rm -f .retry-super-skill-foundation

      - name: Install normalize and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/super-skill-foundation-retry-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m pytest -q tests/test_super_skill_orchestration.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/run_tests.py --coverage | tee /tmp/super-skill-foundation-retry-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/super-skill-foundation-retry-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/super-skill-foundation-retry-benchmark.json
          python -m pytest -q
          python scripts/build_manifest.py --check
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Commit validated foundation directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git commit -m 'Validate scientific orchestration foundation'
          git push origin HEAD:refs/heads/main
          echo "PASSED=true" >> "$GITHUB_ENV"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Corrected scientific orchestration foundation passed 9 targeted tests, mypy, full tests and coverage, deterministic and benchmark gates, security scan, Manifest validation and main-only governance. Foundation commit: \`$(git rev-parse HEAD)\`. No branch or PR was created. Final documentation, machine audit and production certification remain open."

      - name: Fail closed and restore V11
        if: ${{ failure() && env.PASSED != 'true' }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/super-skill-foundation-retry-stage 2>/dev/null || echo unknown)"
          git fetch origin main
          git checkout -B main origin/main
          rm -rf tsao_computation/orchestration
          rm -f tests/test_super_skill_orchestration.py
          rm -f .github/workflows/retry-super-skill-foundation-once.yml
          rm -f .retry-super-skill-foundation
          git checkout "$BASELINE_SHA" -- tsao_computation/cli.py tsao_computation/workflows/engine.py tsao_computation/workflows/__init__.py
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Revert corrected super-skill foundation at $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Corrected super-skill foundation failed at stage: $stage. Actions run: $GITHUB_RUN_ID. Final tree restored to certified V11. No branch or PR was created." || true
          exit 1
