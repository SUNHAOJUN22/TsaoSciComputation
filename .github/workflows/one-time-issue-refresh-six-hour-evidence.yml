name: One-time issue-triggered six-hour evidence refresh

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: tsao-scicomputation-issue-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      github.event.issue.number == 161 &&
      github.event.comment.body == '/refresh-scicomputation-six-hour-evidence-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Report controller start
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          body="SCICOMPUTATION_SIX_HOUR_EVIDENCE_REFRESH: STARTED — run ${RUN_ID}"
          jq -n --arg body "$body" '{body:$body}' >/tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/161/comments" \
            -d @/tmp/comment.json
      - name: Check out exact acceptance branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/parallel-6h-acceptance-20260808
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Install exact qualification dependencies
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Regenerate governed evidence and qualify affected profiles
        shell: bash
        run: |
          set -euo pipefail
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/verify_all.py --profile package
      - name: Publish exact regenerated acceptance tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: bind Windows path-coverage repair to exact source evidence'
          git push origin HEAD:agent/parallel-6h-acceptance-20260808
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report evidence refresh result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_SHA: ${{ steps.publish.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          body="SCICOMPUTATION_SIX_HOUR_EVIDENCE_REFRESH: ${JOB_STATUS} — run ${RUN_ID}"
          if [ "$JOB_STATUS" = success ]; then
            body="SCICOMPUTATION_SIX_HOUR_EVIDENCE_REFRESH: PASS — run ${RUN_ID}; exact branch ${SOURCE_SHA}; core, quality and package profiles passed with regenerated source-bound evidence."
          fi
          jq -n --arg body "$body" '{body:$body}' >/tmp/comment.json
          curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/161/comments" \
            -d @/tmp/comment.json
