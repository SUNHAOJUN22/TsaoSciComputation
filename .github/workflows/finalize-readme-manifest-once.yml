name: Finalize README manifest once

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  ISSUE_NUMBER: '158'
  PRODUCT_BASE: '5ee6888a18f9a76fe55dcc3d807e1605e0e6b075'

concurrency:
  group: finalize-readme-manifest-20260806
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'issues' &&
       github.event.issue.number == 158 &&
       contains(github.event.issue.body, 'RUN_FINAL_MANIFEST_20260806'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staging scope
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/finalize-readme-manifest-once.yml
          test "$(git diff --name-only "$PRODUCT_BASE" HEAD)" = "$workflow"
          test "$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install governed validation tools
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Build final manifest and qualify
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/finalize-readme-manifest-once.yml
          python scripts/build_manifest.py
          python -m pytest tests/test_readme_visuals.py -q
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile benchmark

      - name: Publish final manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only "$PRODUCT_BASE")" = "manifest.json"
          python scripts/build_manifest.py --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refresh manifest for bilingual README delivery"
          git push origin HEAD:main
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record success
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Bilingual README delivery and final Manifest qualification passed at $PRODUCT_COMMIT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Final Manifest qualification failed; no final commit was published. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
