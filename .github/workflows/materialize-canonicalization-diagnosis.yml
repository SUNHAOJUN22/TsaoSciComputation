name: Materialize canonicalization diagnosis

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_MATERIALIZE_CANONICAL_FAILURE_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Capture the latest failed canonicalization run
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow canonicalize-generated-text.yml --limit 20 \
            --json databaseId,conclusion,createdAt \
            --jq '[.[] | select(.conclusion == "failure")] | sort_by(.createdAt) | last | .databaseId // empty')"
          test -n "$RUN_ID"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > /tmp/canonicalization-failure.log 2>&1
          {
            echo "canonicalization_run_id=$RUN_ID"
            echo "captured_by_run_id=$GITHUB_RUN_ID"
            echo
            tail -n 140 /tmp/canonicalization-failure.log | tr -d '\r' | tail -c 26000
          } > reports/CANONICALIZATION_FAILURE_DIAGNOSIS.txt

      - name: Remove workflow, synchronize Manifest and commit diagnosis
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/materialize-canonicalization-diagnosis.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize canonicalization failure diagnosis'
          git push origin HEAD:refs/heads/main
