name: V9 audit status diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v9-audit-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '30232837889'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: true

      - name: Persist concise gate diagnosis
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log > /tmp/v9-run.log
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          parsed = []
          for line in Path('/tmp/v9-run.log').read_text(encoding='utf-8', errors='replace').splitlines():
              start = line.find('{')
              if start < 0:
                  continue
              candidate = line[start:]
              try:
                  value = json.loads(candidate)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict):
                  parsed.append(value)

          summaries = [
              value
              for value in parsed
              if {'wall_median_seconds', 'wall_p90_seconds', 'wall_cv', 'cpu_median_seconds', 'peak_rss_max_kib'} <= value.keys()
          ]
          comparisons = [value for value in parsed if 'speedups' in value and 'status' in value]
          micros = [value for value in parsed if 'route_decision_median_ms' in value]
          if len(summaries) < 2 or not comparisons or len(micros) < 2:
              raise SystemExit(
                  f'incomplete diagnosis: summaries={len(summaries)} comparisons={len(comparisons)} micros={len(micros)}'
              )
          report = {
              'schema_version': '1.0',
              'run_id': 30232837889,
              'baseline_end_to_end_summary': summaries[0],
              'candidate_end_to_end_summary': summaries[1],
              'baseline_micro': micros[0],
              'candidate_micro': micros[1],
              'comparison_output': comparisons[-1],
              'source': 'GitHub Actions decoded log',
          }
          path = Path('reports/V9_LAST_GATE_DIAGNOSIS.json')
          path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V9_LAST_GATE_DIAGNOSIS.json
          git commit -m 'Record concise V9 gate diagnosis'
          git push origin HEAD:refs/heads/main
