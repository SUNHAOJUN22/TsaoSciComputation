name: Finalize main visual documentation

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: finalize-main-visuals
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 21 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_FINALIZE_MAIN_VISUALS_V2 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete verification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Prepare the intended final repository tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo prepare > /tmp/tsao-finalize-stage
          rm -f .github/workflows/finalize-main-visuals.yml
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest tests/test_readme_visuals.py -q

      - name: Run deterministic release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo verify-all > /tmp/tsao-finalize-stage
          python scripts/verify_all.py --profile all | tee /tmp/verify-all.log

      - name: Run benchmark telemetry and final test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          echo benchmark > /tmp/tsao-finalize-stage
          python scripts/verify_all.py --profile benchmark | tee /tmp/benchmark.log
          echo final-pytest > /tmp/tsao-finalize-stage
          python -m pytest -q | tee /tmp/pytest.log

      - name: Run dependency and repository boundary audits
        shell: bash
        run: |
          set -Eeuo pipefail
          echo audits > /tmp/tsao-finalize-stage
          python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/dependency-audit.json
          test "$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/dependency-audit.json').read_text(encoding='utf-8'))
          print(sum(len(item.get('vulns', [])) for item in data.get('dependencies', [])))
          PY
          )" -eq 0
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | sort -u)
          test "${#branches[@]}" -eq 1
          test "${branches[0]}" = main
          git diff --check

      - name: Rebuild and verify the final Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          echo final-manifest > /tmp/tsao-finalize-stage
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          python -m pytest tests/test_readme_visuals.py -q

      - name: Commit the verified final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/tsao-finalize-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No final synchronization changes were required.'
          else
            git commit -m 'Finalize visual README and verification evidence'
            git push origin HEAD:refs/heads/main
          fi
          echo success > /tmp/tsao-finalize-stage
          SUMMARY="$(tail -n 1 /tmp/pytest.log | tr -d '\r')"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Final main-only visual documentation verification passed. Deterministic release gates, benchmark telemetry, final pytest, dependency audit, visual-asset integrity, repository audit, reproducible packaging and single-main checks all succeeded. Final pytest: $SUMMARY. Commit: $(git rev-parse HEAD). Run ID: $GITHUB_RUN_ID. The one-shot workflow removed itself; no branch or PR was created."

      - name: Report failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          STAGE="$(cat /tmp/tsao-finalize-stage 2>/dev/null || echo unknown)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Final main-only visual documentation verification failed at stage: $STAGE. Run ID: $GITHUB_RUN_ID. No successful verification is being claimed; the failure must be corrected before completion." || true
