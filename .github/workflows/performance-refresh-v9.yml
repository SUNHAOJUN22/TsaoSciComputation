name: Performance refresh V9 baseline

on:
  push:
    branches: [main]
    paths: [.v9-performance-refresh-trigger]

permissions:
  contents: write

concurrency:
  group: performance-refresh-v9-main
  cancel-in-progress: true

jobs:
  baseline:
    if: contains(github.event.head_commit.message, '[run-v9-baseline]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BASELINE_SHA: 04ce646e51a603faf8cfad72ec15e218e09a0ebd
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned verification environment
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Normalize profiler and remove trigger
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/profile_performance_v9_refresh.py')
          text = path.read_text(encoding='utf-8')
          old = '''            subprocess.run(  # nosec B603
                [sys.executable, "-m", "cProfile", "-o", str(profile_path), "-c", code],
                cwd=root,
                env=env,
                check=True,
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
            )'''
          new = '''            workload_path = temporary_root / f"{name}.py"
            workload_path.write_text(code + "\\n", encoding="utf-8", newline="\\n")
            subprocess.run(  # nosec B603
                [sys.executable, "-m", "cProfile", "-o", str(profile_path), str(workload_path)],
                cwd=root,
                env=env,
                check=True,
                stdout=subprocess.DEVNULL,
                stderr=subprocess.DEVNULL,
            )'''
          if old not in text:
              raise SystemExit('cProfile patch anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm -f .v9-performance-refresh-trigger
          python -m ruff check --fix scripts/profile_performance_v9_refresh.py
          python -m ruff format scripts/profile_performance_v9_refresh.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/profile_performance_v9_refresh.py .v9-performance-refresh-trigger
          git commit -m 'Normalize current-main V9 performance profiler'
          git push origin HEAD:refs/heads/main
      - name: Create immutable baseline worktree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/tsao-v9-current-baseline
          git worktree add --detach /tmp/tsao-v9-current-baseline "$BASELINE_SHA"
      - name: Profile current V12 baseline before optimization
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/profile_performance_v9_refresh.py \
            --root /tmp/tsao-v9-current-baseline \
            --baseline-sha "$BASELINE_SHA" \
            --include-end-to-end \
            --repeats 3 \
            --output /tmp/PERFORMANCE_BASELINE_V9.json
      - name: Commit baseline evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cp /tmp/PERFORMANCE_BASELINE_V9.json reports/PERFORMANCE_BASELINE_V9.json
          cp /tmp/PERFORMANCE_BASELINE_V9.json reports/PERFORMANCE_PROFILE_V9.json
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('reports/PERFORMANCE_BASELINE_V9.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          summary={
              'schema_version':'2.0',
              'status':'PROFILED',
              'baseline_sha':data['baseline_sha'],
              'claim_boundary':data['claim_boundary'],
              'tree':data['repository']['tree'],
              'end_to_end':{name:payload['summary'] for name,payload in data['end_to_end'].items()},
              'hot_profile_totals':{name:payload['total_seconds'] for name,payload in data['profiles'].items()},
          }
          Path('reports/PERFORMANCE_PROFILE_SUMMARY_V9.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n'
          )
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git add reports/PERFORMANCE_BASELINE_V9.json reports/PERFORMANCE_PROFILE_V9.json \
            reports/PERFORMANCE_PROFILE_SUMMARY_V9.json manifest.json
          git commit -m 'Profile current V12 baseline before V9 optimization'
          git push origin HEAD:refs/heads/main
      - name: Remove baseline worktree
        if: always()
        run: git worktree remove --force /tmp/tsao-v9-current-baseline 2>/dev/null || true
