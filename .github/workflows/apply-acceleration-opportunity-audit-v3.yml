name: Apply acceleration audit V3 once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-acceleration-audit-v3-history
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  apply:
    if: >-
      github.event.comment.body == 'RUN_ACCELERATION_AUDIT_V3' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.issue.title == 'ACCELERATION_AUDIT_V3_PAYLOAD'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and verify owner-authorized patch from Git history
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            git show 8b689509240213a12e7b011a1ac78d483e42c160:.github/patches/acceleration-v3.part-00
            git show 23be4bf7dcb795c67ed2454395e50c29f0c34612:.github/patches/acceleration-v3.part-01
            git show 805163d528607f4acd005ea5c47def5e5fc10597:.github/patches/acceleration-v3.part-02
            git show 7d1b38cbd9f63e3c8c5808bf577634f7b7235683:.github/patches/acceleration-v3.part-03
            git show 660daef1051e4bf5672829aa7548d820b4441893:.github/patches/acceleration-v3.part-04
            git show 154ab039c8d46cea29e5fe11d07bf01bfa56cf22:.github/patches/acceleration-v3.part-05a
            git show 070d56f10902db8438350c182e55fb8bc7af6b63:.github/patches/acceleration-v3.part-05b
            git show d6eba869b48ceeec248230859a6a804b02dcad8d:.github/patches/acceleration-v3.part-05c
            git show 10941c7465b62011acf713202b2ae39b82e57e26:.github/patches/acceleration-v3.part-05d
            git show 1d128f0da2d6577bd64056e31c6ffb350eb24fba:.github/patches/acceleration-v3.part-05e
            git show db719f2f217f1dbb52d7c79bd69233a680735285:.github/patches/acceleration-v3.part-05f
            git show 88686ec38fa832ef84a80ce8d59289e9bad28b36:.github/patches/acceleration-v3.part-05g
            git show bfe35a92bf400da524d9fd29ba79267d412f94a1:.github/patches/acceleration-v3.part-06
          } | tr -d '\n\r' > /tmp/acceleration-v3.patch.gz.b64
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          encoded = Path('/tmp/acceleration-v3.patch.gz.b64').read_text(encoding='ascii')
          encoded_digest = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          expected_encoded_digest = '0af2f2755498b7a9588e5f3865fbb71a84f730889a70647d78db4b7ee8faa95b'
          if encoded_digest != expected_encoded_digest:
              raise SystemExit(f'encoded patch digest mismatch: {encoded_digest}')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          patch_digest = hashlib.sha256(patch).hexdigest()
          expected_patch_digest = '4b3a4895514c024c677af6334065927559a118230e50fbccc8f210ee60b07e77'
          if patch_digest != expected_patch_digest:
              raise SystemExit(f'patch digest mismatch: {patch_digest}')
          Path('/tmp/acceleration-v3.patch').write_bytes(patch)
          PY

      - name: Apply patch and remove temporary transport
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/apply-acceleration-opportunity-audit-v3.yml
          rm -rf .github/patches
          git apply --check /tmp/acceleration-v3.patch
          git apply /tmp/acceleration-v3.patch

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install validation toolchain
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonicalize source and generate evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/audit_acceleration_opportunities.py \
            --root . \
            --limit 40 \
            --json reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.json \
            --markdown reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.md
          python scripts/audit_acceleration_opportunities.py \
            --root . \
            --limit 40 \
            --json reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.json \
            --markdown reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.md
          python scripts/quality_check.py
          python scripts/build_manifest.py

      - name: Run full release verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all | tee /tmp/verify-all.log

      - name: Build and test native C ABI plus Python bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_native_core.py | tee /tmp/verify-native.log

      - name: Prepare deterministic final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/audit_acceleration_opportunities.py \
            --root . \
            --limit 40 \
            --json reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.json \
            --markdown reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.md
          python scripts/audit_acceleration_opportunities.py \
            --root . \
            --limit 40 \
            --json reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.json \
            --markdown reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.md
          python scripts/quality_check.py
          python scripts/build_manifest.py
          python -m pytest -q tests/test_acceleration_opportunity_audit.py
          python scripts/build_manifest.py --check
          git diff --check

      - name: Commit verified result directly to main
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add deterministic acceleration audit and evidence-bound CUDA-X planning'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close payload issue
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Applied directly to main as ${{ steps.commit.outputs.sha }} after full quality, core, package and native verification passed. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Acceleration audit V3 application failed. No product-code commit was pushed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
