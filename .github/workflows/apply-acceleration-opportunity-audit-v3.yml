name: Apply acceleration opportunity audit V3 once

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: apply-acceleration-opportunity-audit-v3
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  apply:
    if: >-
      github.event.issue.title == 'APPLY_ACCELERATION_OPPORTUNITY_AUDIT_V3' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true

      - name: Verify authorized base and decode patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "935b21dfb6ee751934760a7799ce18ccded8f04d"
          gh issue view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/patch-issue-body.txt
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          body = Path('/tmp/patch-issue-body.txt').read_text(encoding='utf-8')
          start = 'BEGIN_GZIP_BASE64_PATCH\n'
          end = '\nEND_GZIP_BASE64_PATCH'
          if start not in body or end not in body:
              raise SystemExit('patch markers are missing')
          encoded = body.split(start, 1)[1].split(end, 1)[0].strip()
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          expected = '4b3a4895514c024c677af6334065927559a118230e50fbccc8f210ee60b07e77'
          if digest != expected:
              raise SystemExit(f'patch digest mismatch: {digest}')
          Path('/tmp/acceleration-v3.patch').write_bytes(patch)
          PY

      - name: Apply owner-authorized patch
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/apply-acceleration-opportunity-audit-v3.yml
          git apply --check /tmp/acceleration-v3.patch
          git apply /tmp/acceleration-v3.patch

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install validation toolchain
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonical formatting and generated evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/audit_acceleration_opportunities.py \
            --root . \
            --limit 40 \
            --json reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.json \
            --markdown reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.md
          python scripts/audit_acceleration_opportunities.py \
            --root . \
            --limit 40 \
            --json reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.json \
            --markdown reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.md
          python scripts/quality_check.py
          python scripts/build_manifest.py

      - name: Run full release verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all | tee /tmp/verify-all.log

      - name: Build and test native C ABI plus Python bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_native_core.py | tee /tmp/verify-native.log

      - name: Final deterministic audit and clean-tree preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/audit_acceleration_opportunities.py \
            --root . \
            --limit 40 \
            --json reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.json \
            --markdown reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.md
          python scripts/audit_acceleration_opportunities.py \
            --root . \
            --limit 40 \
            --json reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.json \
            --markdown reports/ACCELERATION_OPPORTUNITY_AUDIT_V3.md
          python scripts/quality_check.py
          python scripts/build_manifest.py
          python -m pytest -q tests/test_acceleration_opportunity_audit.py
          python scripts/build_manifest.py --check
          git diff --check

      - name: Commit directly to main
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add deterministic acceleration audit and evidence-bound CUDA-X planning'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close authorization issue
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Applied directly to main as ${{ steps.commit.outputs.sha }} after full quality, core, package and native verification passed. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Acceleration opportunity audit V3 validation failed. No patch commit was pushed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
