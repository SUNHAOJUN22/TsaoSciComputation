name: Validate acceleration audit V3 once

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: validate-acceleration-audit-v3
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    if: >-
      github.event.comment.body == 'RUN_CURRENT_MAIN_VALIDATION' &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.issue.title == 'ACCELERATION_AUDIT_V3_PAYLOAD'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-time transport from candidate tree
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/apply-acceleration-opportunity-audit-v3.yml
          rm -rf .github/patches

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install validation toolchain
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonicalize source and refresh audit evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m tsao_computation audit-acceleration \
            --root . \
            --include-tests \
            --limit 50 \
            --min-score 40 \
            --output reports/ACCELERATION_OPPORTUNITIES_V2.json \
            > /tmp/acceleration-audit.json
          python scripts/quality_check.py
          python scripts/build_manifest.py

      - name: Run full release verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all | tee /tmp/verify-all.log

      - name: Build and test native C ABI plus Python bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_native_core.py | tee /tmp/verify-native.log

      - name: Prepare deterministic final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m tsao_computation audit-acceleration \
            --root . \
            --include-tests \
            --limit 50 \
            --min-score 40 \
            --output reports/ACCELERATION_OPPORTUNITIES_V2.json \
            > /tmp/acceleration-audit-final.json
          python scripts/quality_check.py
          python scripts/build_manifest.py
          python -m pytest -q tests/test_acceleration_opportunity_audit.py
          python scripts/build_manifest.py --check
          git diff --check

      - name: Commit verified result directly to main
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Qualify repository acceleration audit and native boundary'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close validation issue
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Current main acceleration audit qualified as ${{ steps.commit.outputs.sha }} after full quality, core, package and native verification passed. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Current main acceleration audit validation failed. No qualification commit was pushed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
