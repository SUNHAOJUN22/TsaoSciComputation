name: Filter Windows core failure

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  diagnose:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_FILTER_WINDOWS_CORE_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      SOURCE_RUN_ID: '30170210216'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Self-clean and synchronize Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/filter-windows-core-failure.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed filtered Windows core diagnosis'
          git push origin HEAD:refs/heads/main

      - name: Publish only failure-significant lines
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > /tmp/windows-core.log 2>&1
          python - <<'PY'
          from pathlib import Path

          patterns = (
              'failed', 'failure', 'error', 'critical coverage', 'policy',
              'manifest', 'not synchronized', 'traceback', 'assertion',
              'exit code', 'problems', 'passed:',
          )
          lines = Path('/tmp/windows-core.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()
          selected = [line for line in lines if any(pattern in line.lower() for pattern in patterns)]
          Path('/tmp/windows-core-filtered.log').write_text(
              '\n'.join(selected[-160:]) + '\n', encoding='utf-8'
          )
          PY
          {
            echo "Filtered Windows core diagnostics from run \`$SOURCE_RUN_ID\`:"
            echo
            echo '```text'
            cat /tmp/windows-core-filtered.log | tr -d '\r' | tail -c 18000
            echo '```'
          } > /tmp/windows-core-filtered.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/windows-core-filtered.md
