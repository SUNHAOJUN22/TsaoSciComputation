name: V11 release gate diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-gate-diagnose.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: '30238976984'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: true
      - name: Persist failed release-gate log tail
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/v11-gate.log
          python - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/v11-gate.log').read_text(encoding='utf-8', errors='replace').splitlines()
          Path('reports/V11_GATE_FAILURE.txt').write_text(
              '\n'.join(lines[-260:]) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/V11_GATE_FAILURE.txt
          git commit -m 'Record V11 release gate diagnosis'
          git push origin HEAD:refs/heads/main
