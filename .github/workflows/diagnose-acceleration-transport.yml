name: Diagnose acceleration transport

on:
  push:
    branches: [main]
    paths: [.diagnose-acceleration-transport-trigger]

permissions:
  contents: write

concurrency:
  group: diagnose-acceleration-transport-main
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Recover complete archive members without applying them
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/diagnose-acceleration-transport.yml \
            .diagnose-acceleration-transport-trigger
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import tarfile
          import zlib
          from datetime import datetime, timezone
          from pathlib import Path

          parts = sorted(Path('tools').glob('acceleration-foundation-v1.part-*.b85'))
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in parts)
          payload = base64.b85decode(encoded.encode('ascii'))
          decompressor = zlib.decompressobj(16 + zlib.MAX_WBITS)
          decompressed = decompressor.decompress(payload)
          try:
              decompressed += decompressor.flush()
          except zlib.error:
              pass

          records: list[dict[str, object]] = []
          error: str | None = None
          archive = tarfile.open(fileobj=io.BytesIO(decompressed), mode='r|')
          try:
              for member in archive:
                  if member.isdir():
                      continue
                  if not member.isfile() or member.issym() or member.islnk():
                      raise ValueError(f'forbidden archive member: {member.name}')
                  handle = archive.extractfile(member)
                  if handle is None:
                      raise ValueError(f'unreadable archive member: {member.name}')
                  data = handle.read()
                  if len(data) != member.size:
                      raise EOFError(
                          f'incomplete archive member {member.name}: {len(data)} of {member.size} bytes'
                      )
                  records.append(
                      {
                          'path': member.name,
                          'bytes': len(data),
                          'sha256': hashlib.sha256(data).hexdigest(),
                      }
                  )
          except (EOFError, OSError, tarfile.TarError, ValueError) as exc:
              error = f'{type(exc).__name__}: {exc}'
          finally:
              archive.close()

          names = [str(item['path']) for item in records]
          manifest_candidates = [name for name in names if name.endswith('PATCH_MANIFEST.json')]
          report = {
              'schema_version': '1.0',
              'status': 'COMPLETE' if decompressor.eof and error is None else 'TRUNCATED',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'part_count': len(parts),
              'part_bytes': {path.name: path.stat().st_size for path in parts},
              'encoded_characters': len(encoded),
              'decoded_bytes': len(payload),
              'gzip_eof': decompressor.eof,
              'gzip_unused_bytes': len(decompressor.unused_data),
              'decompressed_bytes': len(decompressed),
              'tar_end_markers_present': decompressed.endswith(b'\0' * 1024),
              'complete_member_count': len(records),
              'complete_members': records,
              'manifest_candidates': manifest_candidates,
              'first_incomplete_error': error,
          }
          output = Path('reports/ACCELERATION_TRANSPORT_DIAGNOSTIC.json')
          output.parent.mkdir(exist_ok=True)
          output.write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          python scripts/build_manifest.py
          git add -A
          git commit -m 'Record acceleration transport recovery diagnostic'
          git push origin HEAD:refs/heads/main
