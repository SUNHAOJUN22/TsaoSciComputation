name: Validate computation super-skill foundation once

on:
  push:
    branches: [main]
    paths: [.validate-super-skill-foundation]

permissions:
  contents: write
  issues: write

concurrency:
  group: validate-super-skill-foundation-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/super-skill-foundation-coverage.json
  ISSUE_NUMBER: '53'
  BASELINE_SHA: 'f6a1d2bf98e50c019aaf863e96c4797805130c60'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Initialize exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "PASSED=false" >> "$GITHUB_ENV"
          echo initialize > /tmp/super-skill-foundation-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/validate-super-skill-foundation-once.yml
          rm -f .validate-super-skill-foundation

      - name: Install and normalize
        shell: bash
        run: |
          set -Eeuo pipefail
          echo normalize > /tmp/super-skill-foundation-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run foundation and complete gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/super-skill-foundation-stage
          python -m pytest -q tests/test_super_skill_orchestration.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/run_tests.py --coverage | tee /tmp/super-skill-foundation-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/super-skill-foundation-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/super-skill-foundation-benchmark.json
          python -m pytest -q
          python scripts/build_manifest.py --check
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Commit validated foundation directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/super-skill-foundation-stage
          git add -A
          git commit -m 'Validate scientific orchestration foundation'
          git push origin HEAD:refs/heads/main
          echo "PASSED=true" >> "$GITHUB_ENV"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Scientific orchestration foundation passed targeted tests, full tests and coverage, mypy, deterministic and benchmark gates, security scan, Manifest validation and main-only governance. Foundation commit: \`$(git rev-parse HEAD)\`. No branch or PR was created. The final architecture/documentation/production certification remains open."

      - name: Fail closed and restore V11
        if: ${{ failure() && env.PASSED != 'true' }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/super-skill-foundation-stage 2>/dev/null || echo unknown)"
          git fetch origin main
          git checkout -B main origin/main
          rm -rf tsao_computation/orchestration
          rm -f tests/test_super_skill_orchestration.py
          rm -f .github/workflows/validate-super-skill-foundation-once.yml
          rm -f .validate-super-skill-foundation
          git checkout "$BASELINE_SHA" -- tsao_computation/cli.py tsao_computation/workflows/engine.py tsao_computation/workflows/__init__.py
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Revert unqualified super-skill foundation at $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Super-skill foundation validation failed at stage: $stage. Actions run: $GITHUB_RUN_ID. The final tree was restored to certified V11. No branch or PR was created." || true
          exit 1
