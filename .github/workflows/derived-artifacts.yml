name: Validate regenerated artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/derived-artifacts.yml
      - tsao_computation/**
      - scripts/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: derived-artifacts-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-derived-tree:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Regenerate canonical artifacts
        run: |
          python scripts/build_acceleration_audits.py
          python scripts/build_manifest.py
      - name: Run unchanged core and quality gates
        run: |
          python scripts/verify_all.py --profile core
          python scripts/verify_all.py --profile quality
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
      - name: Publish detached Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          allowed = {
              "evidence/quality-check.json",
              "evidence/security-scan.json",
              "manifest.json",
              "reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json",
              "reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json",
              "reports/ACCELERATION_OPPORTUNITIES_V2.json",
          }
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          def post(endpoint, payload):
              result = subprocess.run(
                  ["gh", "api", "--method", "POST", endpoint, "--input", "-"],
                  input=json.dumps(payload), text=True, capture_output=True, check=True,
              )
              return json.loads(result.stdout)
          base = git("rev-parse", "HEAD")
          if base != os.environ["GITHUB_SHA"]:
              raise SystemExit("checkout differs from the event commit")
          changed = git("diff", "--name-only").splitlines()
          if not set(changed) <= allowed:
              raise SystemExit("unexpected generated paths: " + repr(changed))
          repository = os.environ["GITHUB_REPOSITORY"]
          entries = []
          files = []
          for name in sorted(changed):
              path = Path(name)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit("unsafe generated artifact: " + name)
              raw = path.read_bytes()
              blob = post("repos/" + repository + "/git/blobs", {
                  "content": raw.decode("utf-8"), "encoding": "utf-8",
              })
              expected = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
              if blob["sha"] != expected:
                  raise SystemExit("uploaded blob identity mismatch")
              entries.append({"path": name, "mode": "100644", "type": "blob", "sha": expected})
              files.append({"path": name, "blob_sha": expected, "sha256": hashlib.sha256(raw).hexdigest()})
          base_tree = git("rev-parse", "HEAD^{tree}")
          tree = post("repos/" + repository + "/git/trees", {"base_tree": base_tree, "tree": entries})
          if changed:
              subprocess.run(["git", "add", "--", *changed], check=True)
          if tree["sha"] != git("write-tree"):
              raise SystemExit("published tree differs from validated working tree")
          receipt = {
              "schema_version": "tsao.detached-derived-tree/1",
              "repository": repository,
              "base_commit": base,
              "tree_sha": tree["sha"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "files": files,
              "ref_updated": False,
              "software_gates": ["core", "quality"],
              "scientific_approval": "NOT_EVALUATED",
          }
          Path("derived-tree.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
      - name: Upload validated regeneration receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: detached-derived-tree-${{ github.sha }}
          path: derived-tree.json
          if-no-files-found: error
          retention-days: 14
