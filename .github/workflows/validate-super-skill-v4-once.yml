name: Validate computation super-skill V4 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: validate-computation-super-skill-v4-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/super-skill-v4-coverage.json
  AUDIT_ISSUE: '53'
  CLEAN_BASELINE_SHA: '7f49dbb303ec2aaec61819b379ee69c8edc25d19'

jobs:
  validate:
    if: ${{ github.event.issue.title == 'ULTIMATE_COMPUTATION_SUPER_SKILL_VALIDATE_V4' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply reviewed patch and correct adapter indentation
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PUBLISHED=false" >> "$GITHUB_ENV"
          echo apply > /tmp/super-skill-v4-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick \
            f11b2c81f89996138cc36dc296cbf17410ddaccb \
            8ad637555cc17761354cd47d7840ce50707382df \
            c81031a74ee14a9dc88732c2c7a4381e5bb48b6f \
            ec622024009107c58ff9a2ead9bfaf9dc0f0b535
          python - <<'PY'
          from pathlib import Path
          script = Path('scripts/apply_super_skill_finalization_v2.py')
          text = script.read_text(encoding='utf-8')
          old = 'update(ROOT / "SKILL.md", skill_block, "## Core Operating Model")'
          new = 'update(ROOT / "SKILL.md", skill_block, "## Execution procedure")'
          if old not in text:
              raise SystemExit('SKILL anchor statement not found')
          script.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python scripts/apply_super_skill_finalization_v2.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tsao_computation/orchestration/planner.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '\nif slug.startswith("adapter:"):\n'
          generic_marker = (
              '\n    return InvocationPlan(\n'
              '        slug=spec.slug,\n'
              '        kind=spec.kind,\n'
              '        target=spec.target,\n'
              '        ready=False,\n'
              '        execute_allowed=False,\n'
              '        argv=(),\n'
              '        cwd=None,\n'
              '        environment={},\n'
              '        blockers=("runtime target, availability probe and explicit authorization are required",),\n'
          )
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('top-level adapter block not found')
          start += 1
          end = text.find(generic_marker, start)
          if end < 0:
              raise SystemExit('generic invocation block not found')
          block = text[start:end]
          indented = '\n'.join(('    ' + line) if line else line for line in block.splitlines())
          path.write_text(text[:start] + indented + text[end:], encoding='utf-8', newline='\n')
          PY
          rm -f scripts/apply_super_skill_finalization_v2.py
          rm -f .github/workflows/validate-super-skill-v4-once.yml

      - name: Normalize and run targeted gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo targeted > /tmp/super-skill-v4-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_super_skill_audit.py
          python -m pytest -q \
            tests/test_super_skill_orchestration.py \
            tests/test_super_skill_hardening.py \
            tests/test_super_skill_documentation.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run full deterministic gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/super-skill-v4-stage
          python scripts/run_tests.py --coverage | tee /tmp/super-skill-v4-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/super-skill-v4-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/super-skill-v4-benchmark.json
          python -m pytest -q
          python scripts/build_manifest.py --check
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Publish validated candidate directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo publish > /tmp/super-skill-v4-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Validate ultimate computation super-skill candidate'
          git push origin HEAD:refs/heads/main
          echo "PUBLISHED=true" >> "$GITHUB_ENV"
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Validated candidate published at \`$(git rev-parse HEAD)\`. Targeted orchestration tests, mypy, full tests and coverage, deterministic and benchmark gates, security, Manifest and main-only governance passed. Final dependency/package/evidence and production workflow certification remains in Issue #$AUDIT_ISSUE."

      - name: Fail closed to certified foundation
        if: ${{ failure() && env.PUBLISHED != 'true' }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/super-skill-v4-stage 2>/dev/null || echo unknown)"
          git fetch origin main
          git checkout -B main origin/main
          git read-tree --reset -u "$CLEAN_BASELINE_SHA"
          git clean -fd
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Restore certified orchestration foundation at $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Super-skill V4 validation failed at stage: $stage. Actions run: $GITHUB_RUN_ID. The tree was restored to certified foundation $CLEAN_BASELINE_SHA. No branch or PR was created." || true
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
            --comment "Fail-closed at stage: $stage. See audit Issue #$AUDIT_ISSUE." || true
          exit 1
