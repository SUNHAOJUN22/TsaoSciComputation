name: Apply acceleration opportunity audit V2 once

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: apply-acceleration-opportunity-audit-v2
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  apply:
    if: >-
      github.event.issue.title == 'APPLY_ACCELERATION_OPPORTUNITY_AUDIT_V2' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Record workflow start
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Acceleration opportunity audit V2 validation started. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Decode and apply owner-authorized patch
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body > /tmp/patch-issue-body.txt
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          body = Path('/tmp/patch-issue-body.txt').read_text(encoding='utf-8')
          start = 'BEGIN_GZIP_BASE64_PATCH\n'
          end = '\nEND_GZIP_BASE64_PATCH'
          if start not in body or end not in body:
              raise SystemExit('patch markers are missing')
          payload = body.split(start, 1)[1].split(end, 1)[0].strip()
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          Path('/tmp/acceleration-v2.patch').write_bytes(patch)
          PY
          git apply --check /tmp/acceleration-v2.patch
          git apply /tmp/acceleration-v2.patch
          rm -f .github/workflows/apply-acceleration-opportunity-audit-v2.yml

      - name: Install validation dependencies
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Run full release verification
        run: python scripts/verify_all.py --profile all

      - name: Build and test native C ABI plus Python bridge
        run: python scripts/verify_native_core.py

      - name: Commit directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add evidence-aware acceleration audit and ranking'
          git push origin HEAD:refs/heads/main

      - name: Close authorization issue
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Acceleration opportunity audit V2 was applied directly to main after quality, core, package and native verification passed. No branch or pull request was created.'

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Acceleration opportunity audit V2 validation failed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No patch commit was pushed."
