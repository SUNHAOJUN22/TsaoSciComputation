name: Final Windows core regression

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: final-windows-core-regression
  cancel-in-progress: false

jobs:
  windows:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_FINAL_WINDOWS_CORE_V1 -->')
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: python -m pip install -e '.[validation,quality]'
      - run: >-
          python -c "from pathlib import Path;
          Path('.github/workflows/windows-core-final-regression.yml').unlink()"
      - run: python scripts/build_manifest.py
      - run: python scripts/verify_all.py --profile core

  cleanup:
    if: ${{ always() }}
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'

      - name: Remove workflow and synchronize Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/windows-core-final-regression.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed final Windows core regression workflow'
          git push origin HEAD:refs/heads/main

      - name: Report result
        shell: bash
        run: |
          if test '${{ needs.windows.result }}' = success; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Final Windows core regression passed on Python 3.10 and 3.13. Full tests, coverage, scientific benchmarks, critical coverage policy, repository, Schema, registry, adapter, documentation, examples and Manifest gates succeeded. Workflow run: $GITHUB_RUN_ID. The workflow removed itself; no branch or PR was created."
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Final Windows core regression failed. Workflow run: $GITHUB_RUN_ID. The workflow removed itself; no completion is claimed."
            exit 1
          fi
