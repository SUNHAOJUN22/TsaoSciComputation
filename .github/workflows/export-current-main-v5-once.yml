name: Export current main for V5 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  export:
    if: >-
      github.event.issue.title == 'EXPORT_CURRENT_MAIN_V5_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: true
      - name: Build exact source archive
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=.github/workflows/export-current-main-v5-once.yml -czf "$RUNNER_TEMP/TsaoSciComputation-main-v5.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TsaoSciComputation-main-v5-${{ github.run_id }}
          path: ${{ runner.temp }}/TsaoSciComputation-main-v5.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Remove one-time workflow
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/export-current-main-v5-once.yml
          git commit -m 'Remove one-time V5 source export workflow [skip ci]'
          git push origin HEAD:refs/heads/main
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Current main source exported for V5 without creating a branch or pull request. run_id=$GITHUB_RUN_ID head=$(git rev-parse HEAD^)"
