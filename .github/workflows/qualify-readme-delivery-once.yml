name: Qualify README delivery once

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  ISSUE_NUMBER: '158'

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out staged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staging tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base=1348a057db4f20331fcbf137da1d2b33c4a944dc
          workflow=.github/workflows/qualify-readme-delivery-once.yml
          test "$(git diff --name-only "$base" HEAD)" = "$workflow"

      - name: Reassemble SHA-locked delivery bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --slurp > "$RUNNER_TEMP/comment-pages.json"
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          pages = json.loads((temp / 'comment-pages.json').read_text(encoding='utf-8'))
          texts = [item.get('body') or '' for page in pages for item in page]
          pattern = re.compile(
              r"README_DELIVERY_V2_PART_(\d{2})\n([A-Za-z0-9+/=\n]+?)\nEND_README_DELIVERY_V2_PART_\1",
              re.MULTILINE,
          )
          parts = {}
          for text in texts:
              for raw_index, payload in pattern.findall(text):
                  index = int(raw_index)
                  if index in parts:
                      raise SystemExit(f'duplicate bundle part: {index:02d}')
                  parts[index] = ''.join(payload.split())
          expected_indices = list(range(5))
          if sorted(parts) != expected_indices:
              raise SystemExit(f'bundle part set mismatch: {sorted(parts)}')
          expected = {
              0: '9cecf03570d04f2d691d807cad4d4f73b884fb90b4b05d87873637dd27808142',
              1: '819d4ae0531d932aeee9964761d74c1e24693cfe3a51e7ecddac9d236df887f8',
              2: '93147908f68e642c126b98c99f1253935f8247270821d27848394d2a71c94912',
              3: 'cdaf9d0825f972da9aa16c4f2d3b9ccd790a2a38bbcbb453230782ed6a280efe',
              4: '4064d4aec760e5088d56d7d3fa67767365fb278688f75bb17bb37ab9315e85a2',
          }
          for index, part in parts.items():
              if hashlib.sha256(part.encode('ascii')).hexdigest() != expected[index]:
                  raise SystemExit(f'bundle part SHA-256 mismatch: {index:02d}')
          encoded = ''.join(parts[index] for index in expected_indices)
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != '673b6a4152da5c5b030d3337d4d6e28e1090ebe6ca719281c06638a997e9c057':
              raise SystemExit('encoded bundle SHA-256 mismatch')
          archive = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(archive).hexdigest() != '9b644c89b515d61c399d1633c5dbe972101ab34ad39eb9d2e63572f9b58edc91':
              raise SystemExit('archive SHA-256 mismatch')
          (temp / 'readme-delivery.tar.gz').write_bytes(archive)
          PY
          cat > "$RUNNER_TEMP/expected-bundle-files.txt" <<'EOF'
          .readme-delivery-qualify.sh
          README.md
          README.zh-CN.md
          assets/visuals/DESIGN_SYSTEM.md
          assets/visuals/README.md
          assets/visuals/qualification-ladder.svg
          assets/visuals/reproducible-delivery-chain.svg
          assets/visuals/resource-admission-gate.svg
          assets/visuals/solver-evidence-state-machine.svg
          docs/readme-delivery-prompt.md
          tests/test_readme_visuals.py
          EOF
          tar -tzf "$RUNNER_TEMP/readme-delivery.tar.gz" | sort > "$RUNNER_TEMP/observed-bundle-files.txt"
          diff -u "$RUNNER_TEMP/expected-bundle-files.txt" "$RUNNER_TEMP/observed-bundle-files.txt"
          tar -xzf "$RUNNER_TEMP/readme-delivery.tar.gz"
          rm .github/workflows/qualify-readme-delivery-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install governed tools
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Qualify and publish
        shell: bash
        run: bash .readme-delivery-qualify.sh

      - name: Record success
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "README delivery qualification passed and published to main at $PRODUCT_COMMIT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."

      - name: Record failure
        if: failure()
        shell: bash
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "README delivery qualification failed; no product commit was published. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
