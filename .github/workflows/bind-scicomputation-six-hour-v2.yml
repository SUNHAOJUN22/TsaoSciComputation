name: Bind SciComputation six-hour gate v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  bind:
    if: github.event.issue.number == 162 && github.event.comment.body == '/bind-scicomputation-six-hour-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Bind prior validated gate to exact clean source
        shell: bash
        run: |
          set -euo pipefail
          git show 74b9b26a8882a2321ac5a241df75ca0d3ae13cc8:.github/workflows/one-time-scicomputation-six-hour-active.yml > /tmp/scicomputation-active.yml
          python - <<'PY'
          from pathlib import Path

          template = Path('/tmp/scicomputation-active.yml').read_text(encoding='utf-8')
          old_sha = 'a3ba2ac2a17a0cd4d18ea5870d9bcb57c748072a'
          new_sha = '272c6672a907f692c2d0928f24b15cc0a6582635'
          old_command = '/run-scicomputation-six-hour-active-v1'
          new_command = '/run-scicomputation-six-hour-active-v2'
          if template.count(old_sha) != 3:
              raise SystemExit(f'old source count drifted: {template.count(old_sha)}')
          if template.count(old_command) != 3:
              raise SystemExit(f'old command count drifted: {template.count(old_command)}')
          active = template.replace(old_sha, new_sha).replace(old_command, new_command)
          if old_sha in active or old_command in active:
              raise SystemExit('stale SciComputation binding remains')
          Path('.github/workflows/one-time-scicomputation-six-hour-active-v2.yml').write_text(active, encoding='utf-8')
          Path('.github/workflows/bind-scicomputation-six-hour-v2.yml').unlink()
          PY
          git diff --check

      - name: Publish bound gate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: bind SciComputation six-hour gate to clean source"
          git push origin HEAD:main
          echo "harness_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record binding result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_SHA: ${{ steps.publish.outputs.harness_sha }}
        run: |
          set -euo pipefail
          gh issue comment 162 --repo "$GITHUB_REPOSITORY" --body "SCICOMPUTATION_BIND_V2 status=${{ job.status }} harness_sha=${HARNESS_SHA:-UNPUBLISHED} source=272c6672a907f692c2d0928f24b15cc0a6582635 next=/run-scicomputation-six-hour-active-v2"
