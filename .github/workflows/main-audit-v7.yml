name: Main audit V7

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Audit tracking issue number
        required: false
        default: '27'
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-audit-v7.yml'
      - 'scripts/sync_readme_visual_atlas_v7.py'
      - 'tests/test_sync_readme_visual_atlas_v7.py'
      - '.v7-audit-trigger'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: main-audit-v7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-v7-audit]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue || '27' }}
      TSAO_COVERAGE_JSON: /tmp/tsao-main-audit-v7-coverage.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete verification environment
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Normalize V7 sources with repository tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix \
            scripts/sync_readme_visual_atlas_v7.py \
            tests/test_sync_readme_visual_atlas_v7.py
          python -m ruff format \
            scripts/sync_readme_visual_atlas_v7.py \
            tests/test_sync_readme_visual_atlas_v7.py

      - name: Synchronize V7 atlas and repository Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .v7-audit-trigger
          python scripts/sync_readme_visual_atlas_v7.py
          python scripts/sync_readme_visual_atlas_v7.py --check
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git diff --check
          if test -n "$(git status --porcelain)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Synchronize V7 scientific atlas and Manifest'
            git push origin HEAD:refs/heads/main
          fi

      - name: Run deterministic release gates pass 1
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all | tee /tmp/main-audit-v7-all-1.log
          python scripts/verify_all.py --profile benchmark | tee /tmp/main-audit-v7-benchmark.log
          python -m pytest -q | tee /tmp/main-audit-v7-pytest.log
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git diff --check

      - name: Run dependency security and branch-policy audits
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/main-audit-v7-dependency.json
          python scripts/security_scan.py > /tmp/main-audit-v7-security.json
          git ls-remote --heads origin > /tmp/main-audit-v7-remote-heads.txt
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          dependency = json.loads(
              Path('/tmp/main-audit-v7-dependency.json').read_text(encoding='utf-8')
          )
          if isinstance(dependency, list):
              vulnerabilities = sum(
                  len(item.get('vulns', []))
                  for item in dependency
                  if isinstance(item, dict)
              )
          else:
              vulnerabilities = sum(
                  len(item.get('vulns', []))
                  for item in dependency.get('dependencies', [])
                  if isinstance(item, dict)
              )
          if vulnerabilities:
              raise SystemExit(f'dependency vulnerabilities found: {vulnerabilities}')

          security = json.loads(
              Path('/tmp/main-audit-v7-security.json').read_text(encoding='utf-8')
          )
          if security.get('findings', []):
              raise SystemExit(f"repository security findings: {security['findings']}")

          heads = [
              line.split()[1]
              for line in Path('/tmp/main-audit-v7-remote-heads.txt')
              .read_text(encoding='utf-8')
              .splitlines()
              if line.strip()
          ]
          if heads != ['refs/heads/main']:
              raise SystemExit(f'remote branch policy violated: {heads}')
          PY

      - name: Refresh V7 machine evidence and bilingual verification blocks
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/update_main_audit_evidence.py \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$ISSUE_NUMBER" \
            --test-log /tmp/main-audit-v7-pytest.log \
            --coverage-json "$TSAO_COVERAGE_JSON" \
            --dependency-json /tmp/main-audit-v7-dependency.json \
            --security-json /tmp/main-audit-v7-security.json \
            --remote-heads /tmp/main-audit-v7-remote-heads.txt \
            --parent-commit "$(git rev-parse HEAD)" \
            --audit-generation ultimate-main-audit-v7 \
            --audit-label V7 \
            --visual-count 42 \
            --visual-atlas-version 7 \
            --report-path reports/ULTIMATE_MAIN_AUDIT_V7.md \
            --visual-families 'Molecular states and environments; surfaces defects and migration; CFD closures and multiphase transport; reactor scale-up and thermal risk; dynamic control and state estimation; HPC failure classification and bounded recovery.'
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git diff --check

      - name: Run deterministic release gates pass 2 on exact documented tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all | tee /tmp/main-audit-v7-all-2.log
          python -m pytest -q | tee /tmp/main-audit-v7-pytest-2.log
          python scripts/sync_readme_visual_atlas_v7.py --check
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check

      - name: Commit every verified V7 artifact
        id: final_commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize ultimate main audit V7 evidence'
            git push origin HEAD:refs/heads/main
          fi
          if test -n "$(git status --porcelain)"; then
            git status --short
            echo 'verified working tree was not fully committed' >&2
            exit 1
          fi
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical cross-platform CI
        id: canonical_ci
        shell: bash
        run: |
          set -Eeuo pipefail
          final_sha='${{ steps.final_commit.outputs.final_sha }}'
          gh workflow run ci.yml --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(
              gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 40 \
                --json databaseId,headSha \
              | python -c 'import json,sys; rows=json.load(sys.stdin); sha=sys.argv[1]; print(next((str(r["databaseId"]) for r in rows if r["headSha"]==sha), ""))' \
                  "$final_sha"
            )"
            if test -n "$run_id"; then
              break
            fi
            echo "CI indexing attempt $attempt/30"
            sleep 5
          done
          if test -z "$run_id"; then
            echo "unable to locate canonical CI for $final_sha" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Canonical CI dispatched for V7 final commit \`$final_sha\`. Run ID: \`$run_id\`."
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Report V7 success and close audit issue
        shell: bash
        run: |
          set -Eeuo pipefail
          final_sha='${{ steps.final_commit.outputs.final_sha }}'
          run_id='${{ steps.canonical_ci.outputs.run_id }}'
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Ultimate main audit V7 passed. Final commit: \`$final_sha\`. Canonical CI Run ID: \`$run_id\`. All Ubuntu/Windows/macOS × Python 3.10/3.13 core jobs plus quality, package and benchmark succeeded. The repository has 42 self-contained scientific SVGs, no new branch or PR, and only remote branch \`main\`."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report V7 failure
        if: ${{ failure() }}
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Ultimate main audit V7 failed in workflow run \`$GITHUB_RUN_ID\`. No completion is claimed; inspect the failing step before retrying."
