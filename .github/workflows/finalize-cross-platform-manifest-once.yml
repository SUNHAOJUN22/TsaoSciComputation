name: Finalize cross-platform manifest once

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  ISSUE_NUMBER: '159'
  PRODUCT_BASE: '22e63b8eb96a23fc66b2c676586afb3ca0abff1b'

concurrency:
  group: finalize-cross-platform-manifest-20260807
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.issue.number == 159 &&
      contains(github.event.issue.body, 'RUN_FINAL_MANIFEST_20260807')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staging scope
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/finalize-cross-platform-manifest-once.yml
          test "$(git diff --name-only "$PRODUCT_BASE" HEAD)" = "$workflow"
          test "$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install governed validation tools
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Build final Manifest and qualify
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/finalize-cross-platform-manifest-once.yml
          python scripts/build_manifest.py
          python -m pytest tests/test_execution_evidence_hardening.py -q
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile benchmark

      - name: Publish final Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only "$PRODUCT_BASE")" = "manifest.json"
          python scripts/build_manifest.py --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refresh manifest for cross-platform path hardening"
          git push origin HEAD:main
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record success
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Cross-platform path hardening and final Manifest qualification passed at $PRODUCT_COMMIT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Final Manifest qualification failed; no final commit was published. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
