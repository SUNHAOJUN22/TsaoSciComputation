name: Finalize computation super-skill from issue once

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: finalize-computation-super-skill-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/super-skill-final-coverage.json
  AUDIT_ISSUE: '53'
  TRIGGER_TITLE: ULTIMATE_COMPUTATION_SUPER_SKILL_FINALIZE_V1

jobs:
  finalize:
    if: ${{ github.event.issue.title == 'ULTIMATE_COMPUTATION_SUPER_SKILL_FINALIZE_V1' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply deterministic final candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=false" >> "$GITHUB_ENV"
          echo apply > /tmp/super-skill-final-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/apply_super_skill_finalization.py
          rm -f scripts/apply_super_skill_finalization.py
          rm -f .github/workflows/finalize-super-skill-from-issue-once.yml

      - name: Install normalize and run targeted gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo targeted > /tmp/super-skill-final-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_super_skill_audit.py
          python -m pytest -q tests/test_super_skill_orchestration.py tests/test_super_skill_hardening.py tests/test_super_skill_documentation.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run all deterministic benchmark security and package gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/super-skill-final-stage
          python scripts/run_tests.py --coverage | tee /tmp/super-skill-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/super-skill-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/super-skill-benchmark.json
          python scripts/verify_native_core.py > /tmp/super-skill-native.json
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/super-skill-dependencies.json
          rm -rf /tmp/super-skill-build /tmp/super-skill-venv
          python -m build --outdir /tmp/super-skill-build
          python -m venv /tmp/super-skill-venv
          /tmp/super-skill-venv/bin/python -m pip install --no-deps /tmp/super-skill-build/*.whl
          /tmp/super-skill-venv/bin/python -c 'import tsao_computation; print(tsao_computation.__version__)'
          python -m pytest -q | tee /tmp/super-skill-final-pytest.log
          git ls-remote --heads origin | sort > /tmp/super-skill-heads.txt
          test "$(awk '{print $2}' /tmp/super-skill-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Synchronize final evidence and exact tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/super-skill-final-stage
          python scripts/build_super_skill_audit.py \
            --test-log /tmp/super-skill-final-pytest.log \
            --coverage-json /tmp/super-skill-final-coverage.json \
            --dependency-json /tmp/super-skill-dependencies.json \
            --security-json evidence/security-scan.json
          python scripts/update_main_audit_evidence.py \
            --root . \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$AUDIT_ISSUE" \
            --test-log /tmp/super-skill-final-pytest.log \
            --coverage-json /tmp/super-skill-final-coverage.json \
            --dependency-json /tmp/super-skill-dependencies.json \
            --security-json evidence/security-scan.json \
            --remote-heads /tmp/super-skill-heads.txt \
            --parent-commit "$ORIGINAL_SHA" \
            --audit-generation ultimate-computation-super-skill-v1 \
            --audit-label ultimate-computation-super-skill \
            --visual-count 42 \
            --visual-atlas-version 13 \
            --report-path reports/ULTIMATE_CODE_QUALITY_FINALIZATION.md \
            --visual-families 'Electronic structure and molecular simulation; materials and interfaces; continuum and process engineering; evidence governance and HPC.'
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text())
          assert audit['status'] == 'VALIDATED'
          assert audit['architecture']['methods'] == 23
          assert len(audit['architecture']['invocation_kinds']) == 9
          assert audit['architecture']['trusted_local_callables'] == 7
          assert audit['architecture']['acceleration_strategies'] == 13
          assert audit['architecture']['orchestration_stages'] == 9
          assert audit['quality']['tests_failed'] == 0
          assert audit['quality']['repository_security_findings'] == 0
          assert audit['quality']['dependency_vulnerabilities'] == 0
          PY
          python scripts/build_manifest.py --check
          mapfile -t workflow_files < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflow_files[*]}" = "${expected[*]}"

      - name: Commit exact final tree to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/super-skill-final-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Build ultimate scientific computation orchestration skill'
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=true" >> "$GITHUB_ENV"

      - name: Require exact-final production workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production-ci > /tmp/super-skill-final-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$FINAL_SHA"
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
          : > /tmp/super-skill-production-runs.txt
          wait_for_workflow() {
            local workflow="$1"
            local line status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main --event workflow_dispatch --limit 20 --json headSha,status,conclusion,url --jq ".[] | select(.headSha == \"$FINAL_SHA\") | [.status,.conclusion,.url] | @tsv" | head -n 1)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  echo "$workflow: $conclusion ($url)"
                  [[ "$conclusion" == success ]]
                  printf '%s: %s\n' "$workflow" "$url" >> /tmp/super-skill-production-runs.txt
                  return
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for_workflow ci.yml
          wait_for_workflow codeql.yml
          wait_for_workflow scorecard.yml

      - name: Close successful audits
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(cat /tmp/super-skill-production-runs.txt)"
          metrics="$(python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('reports/ULTIMATE_COMPUTATION_SUPER_SKILL_AUDIT.json').read_text())
          a = audit['architecture']; q = audit['quality']
          print(f"methods={a['methods']}; invocation-kinds={len(a['invocation_kinds'])}; trusted-callables={a['trusted_local_callables']}; adapters={a['adapters']}; workflows={a['workflows']}; acceleration-strategies={a['acceleration_strategies']}; stages={a['orchestration_stages']}; tests={q['tests_passed']}; statement-coverage={q['statement_coverage_percent']:.2f}%; branch-coverage={q['branch_coverage_percent']:.2f}%")
          PY
          )"
          gh issue close "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Ultimate scientific computation orchestration Skill passed on commit \`$FINAL_SHA\`. $metrics. All deterministic, benchmark, security, dependency, reproducible source/Wheel, Manifest and main-only gates passed. Production workflows:\n$runs\nNo branch or pull request was created. External solvers, APIs, containers, schedulers, GPU kernels and other Skills remain explicitly authorized plan/handoff targets rather than fabricated executions."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Finalization completed at \`$FINAL_SHA\`. Authoritative evidence is recorded in Issue #$AUDIT_ISSUE."

      - name: Fail closed and remove temporary automation
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/super-skill-final-stage 2>/dev/null || echo unknown)"
          git fetch origin main
          git checkout -B main origin/main
          if [[ "$FINAL_PUSHED" == true ]]; then
            git revert --no-commit "$FINAL_SHA" || true
          fi
          rm -f .github/workflows/finalize-super-skill-from-issue-once.yml
          rm -f scripts/apply_super_skill_finalization.py
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Remove unqualified super-skill finalization at $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Ultimate super-skill finalization failed at stage: $stage. Actions run: $GITHUB_RUN_ID. The unqualified candidate was not retained and temporary automation was removed where possible. No branch or PR was created." || true
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason not_planned --comment "Fail-closed at stage: $stage. See audit Issue #$AUDIT_ISSUE." || true
          exit 1
