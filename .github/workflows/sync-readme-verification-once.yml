name: Sync README verification once

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: sync-readme-verification-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    if: >-
      github.event.issue.title == 'SYNC_README_VERIFICATION_V3' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Record workflow start
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "README verification sync V3 started. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Synchronize README verification evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          en_latest = "\n".join((
              "<!-- CURRENT_MAIN_VERIFICATION:END -->",
              "",
              "### Latest main-only README and native verification",
              "",
              "The current documentation and native-interoperability layer was revalidated on `2026-08-05` before direct publication to `main`.",
              "",
              "| Latest gate | Result |",
              "|---|---:|",
              "| Tests | 781 passed, 0 failed |",
              "| Total coverage | 95.61% (required: 95.00%) |",
              "| Ruff / Mypy / Bandit / repository security scan | PASS |",
              "| Controlled mutation probes / scientific benchmarks | 64/64 killed / 8/8 passed |",
              "| Reproducible source archives / Wheel isolated install | PASS / PASS |",
              "| C++20 C ABI build / CTest / Python bridge | PASS / 1 of 1 / PASS |",
              "| Remote branches | `main` only |",
              "",
              "## Performance evidence",
          ))
          zh_latest = "\n".join((
              "<!-- CURRENT_MAIN_VERIFICATION:END -->",
              "",
              "### 最新 `main` README 与原生层验证",
              "",
              "当前文档和原生互操作层已于 `2026-08-05` 在直接发布到 `main` 前重新完成验证。",
              "",
              "| 最新门禁 | 结果 |",
              "|---|---:|",
              "| 自动测试 | 781 通过，0 失败 |",
              "| 总覆盖率 | 95.61%（门槛：95.00%） |",
              "| Ruff / Mypy / Bandit / 仓库安全扫描 | PASS |",
              "| 受控变异探针 / 科学参考基准 | 64/64 被识别 / 8/8 通过 |",
              "| 可重复源码包 / Wheel 隔离安装 | PASS / PASS |",
              "| C++20 C ABI 构建 / CTest / Python 桥 | PASS / 1/1 / PASS |",
              "| 远程分支 | 仅 `main` |",
              "",
              "## 性能证据",
          ))

          replace_once("README.md", "### Current `main` verification", "### Canonical cross-platform qualification")
          replace_once(
              "README.md",
              "Validated on `2026-08-02T19:04:13.872746+00:00` by deterministic finalization run `30762511647`.",
              "The immutable Ubuntu/Windows × Python 3.10/3.13 qualification baseline was validated on `2026-08-02T19:04:13.872746+00:00` by deterministic finalization run `30762511647`.",
          )
          replace_once("README.md", "| Current-main item | Result |", "| Canonical qualification item | Result |")
          replace_once(
              "README.md",
              "The final final-exact-tree-v3 commit is accepted only after canonical Ubuntu/Windows × Python 3.10/3.13 CI is recorded in [Issue #49](../../issues/49). Machine-readable evidence: [`reports/CURRENT_MAIN_VERIFICATION.json`](reports/CURRENT_MAIN_VERIFICATION.json).",
              "This baseline remains the canonical cross-platform evidence recorded in [Issue #49](../../issues/49). Machine-readable evidence: [`reports/CURRENT_MAIN_VERIFICATION.json`](reports/CURRENT_MAIN_VERIFICATION.json).",
          )
          replace_once("README.md", "<!-- CURRENT_MAIN_VERIFICATION:END -->\n\n## Performance evidence", en_latest)

          replace_once("README.zh-CN.md", "### 当前 `main` 验证状态", "### 规范化跨平台资格基线")
          replace_once(
              "README.zh-CN.md",
              "已于 `2026-08-02T19:04:13.872746+00:00` 由确定性终验运行 `30762511647` 完成验证。",
              "不可变的 Ubuntu/Windows × Python 3.10/3.13 跨平台资格基线已于 `2026-08-02T19:04:13.872746+00:00` 由确定性终验运行 `30762511647` 完成验证。",
          )
          replace_once("README.zh-CN.md", "| 当前主线项目 | 结果 |", "| 规范化资格项目 | 结果 |")
          replace_once(
              "README.zh-CN.md",
              "final-exact-tree-v3 最终提交只有在 [Issue #49](../../issues/49) 记录 Ubuntu/Windows × Python 3.10/3.13 正式 CI 成功后才被接受。机器可读证据：[`reports/CURRENT_MAIN_VERIFICATION.json`](reports/CURRENT_MAIN_VERIFICATION.json)。",
              "该基线继续作为 [Issue #49](../../issues/49) 记录的规范化跨平台证据。机器可读证据：[`reports/CURRENT_MAIN_VERIFICATION.json`](reports/CURRENT_MAIN_VERIFICATION.json)。",
          )
          replace_once("README.zh-CN.md", "<!-- CURRENT_MAIN_VERIFICATION:END -->\n\n## 性能证据", zh_latest)
          PY
          rm -f .github/workflows/sync-readme-verification-once.yml

      - name: Install validation dependencies
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Run full release verification
        run: python scripts/verify_all.py --profile all

      - name: Build and test native C ABI plus Python bridge
        run: python scripts/verify_native_core.py

      - name: Commit directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize current main verification evidence'
          git push origin HEAD:refs/heads/main

      - name: Close authorization issue
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'README verification evidence was synchronized after full repository and native verification passed. No branch or pull request was created.'

      - name: Record failure diagnostics
        if: failure()
        shell: bash
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "README verification sync V3 failed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No README evidence commit was pushed."