name: Adversarial computation super-skill phase A once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: adversarial-super-skill-phase-a-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/adversarial-phase-a-coverage.json
  AUDIT_ISSUE: '61'
  CLEAN_BASELINE_SHA: '0ccd9f73c466d02bbfeee3021b1dd6217bb4e21d'

jobs:
  validate:
    if: ${{ github.event.issue.title == 'ADVERSARIAL_COMPUTATION_SUPER_SKILL_PHASE_A_V1' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Apply adversarial phase A candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PUBLISHED=false" >> "$GITHUB_ENV"
          echo apply > /tmp/adversarial-phase-a-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/apply_adversarial_super_skill_phase_a.py
          rm -f scripts/apply_adversarial_super_skill_phase_a.py
          rm -f .github/workflows/adversarial-super-skill-phase-a-once.yml

      - name: Normalize and run targeted adversarial gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo targeted > /tmp/adversarial-phase-a-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m pytest -q \
            tests/test_adversarial_super_skill_phase_a.py \
            tests/test_super_skill_orchestration.py \
            tests/test_super_skill_hardening.py \
            tests/test_adapter_fail_closed.py \
            tests/test_acceleration_batch.py \
            tests/test_validation_fail_closed.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run complete deterministic and benchmark gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/adversarial-phase-a-stage
          python scripts/run_tests.py --coverage | tee /tmp/adversarial-phase-a-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/adversarial-phase-a-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/adversarial-phase-a-benchmark.json
          python -m pytest -q
          python scripts/build_manifest.py --check
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Publish validated phase A directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo publish > /tmp/adversarial-phase-a-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Harden computation orchestration and execution authorization'
          git push origin HEAD:refs/heads/main
          echo "PUBLISHED=true" >> "$GITHUB_ENV"
          FINAL_SHA="$(git rev-parse HEAD)"
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Adversarial phase A passed at \`$FINAL_SHA\`: silent method fallback, unknown Skill handoff, ambiguous route readiness, false-string authorization, mutable contracts/registries, permissive completion parsing and external process execution bypass were addressed. Targeted tests, mypy, full tests/coverage, deterministic and benchmark profiles, security, Manifest and main-only governance passed. No branch or PR was created. Acceleration/evidence/platform phase remains open."
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Validated phase A published at \`$FINAL_SHA\`."

      - name: Fail closed to pre-audit main
        if: ${{ failure() && env.PUBLISHED != 'true' }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/adversarial-phase-a-stage 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          git read-tree --reset -u "$CLEAN_BASELINE_SHA"
          git clean -fd
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Restore pre-audit computation skill at $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Adversarial phase A failed closed at stage: $stage. Actions run: $GITHUB_RUN_ID. The tree was restored to $CLEAN_BASELINE_SHA. No branch or PR was created." || true
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
            --comment "Fail-closed at stage: $stage. See Issue #$AUDIT_ISSUE." || true
          exit 1
