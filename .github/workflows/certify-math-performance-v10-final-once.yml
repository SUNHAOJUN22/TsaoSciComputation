name: Definitive mathematical performance certification V10 once

on:
  push:
    branches: [main]
    paths: [.certify-math-performance-v10-final]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: certify-math-performance-v10-final-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/math-v10-final-coverage.json
  ISSUE_NUMBER: '48'
  BASELINE_SHA: f405ed6ea9e1aa964ddc8aee24c955cd7526bb44

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Initialize isolated baseline and candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=false" >> "$GITHUB_ENV"
          echo initialize > /tmp/math-v10-final-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/certify-math-performance-v10-final-once.yml
          rm -f .certify-math-performance-v10-final
          rm -f reports/MATH_PERFORMANCE_AUDIT_V10_FAILURE.json
          rm -rf /tmp/math-v10-final-baseline
          git worktree add --detach /tmp/math-v10-final-baseline "$BASELINE_SHA"

      - name: Install validation environment
        run: |
          echo install > /tmp/math-v10-final-stage
          python -m pip install -e '.[validation,quality,security]'

      - name: Normalize exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo normalize > /tmp/math-v10-final-stage
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/regenerate_readme_visuals_v13.py
          python scripts/sync_package_assets.py
          python scripts/build_adapter_docs.py
          python scripts/build_workflow_docs.py
          python scripts/build_examples.py
          python scripts/build_manifest.py

      - name: Run isolated same-host A/B measurement
        shell: bash
        run: |
          set -Eeuo pipefail
          echo benchmark > /tmp/math-v10-final-stage
          python scripts/run_math_performance_v10.py \
            --source-root /tmp/math-v10-final-baseline \
            --output /tmp/math-v10-final-baseline.json >/dev/null
          python scripts/run_math_performance_v10.py \
            --source-root "$GITHUB_WORKSPACE" \
            --output /tmp/math-v10-final-candidate.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path('/tmp/math-v10-final-baseline.json').read_text(encoding='utf-8'))
          candidate = json.loads(Path('/tmp/math-v10-final-candidate.json').read_text(encoding='utf-8'))
          speedups = {
              'parser': candidate['parser_20mib_throughput_mib_s'] / baseline['parser_20mib_throughput_mib_s'],
              'acceleration_plan': baseline['acceleration_plan_seconds'] / candidate['acceleration_plan_seconds'],
              'convergence_time': baseline['convergence_250k_seconds'] / candidate['convergence_250k_seconds'],
              'uncertainty': baseline['uncertainty_seconds'] / candidate['uncertainty_seconds'],
              'scientific_benchmarks': baseline['scientific_benchmarks_seconds'] / candidate['scientific_benchmarks_seconds'],
          }
          memory_ratio = candidate['convergence_250k_peak_bytes'] / baseline['convergence_250k_peak_bytes']
          acceptance = {
              'source_roots_are_isolated': baseline['source_root'] != candidate['source_root'],
              'parser_retained_no_material_regression': speedups['parser'] >= 0.90,
              'acceleration_plan_speedup_at_least_5_percent': speedups['acceleration_plan'] >= 1.05,
              'convergence_speedup_at_least_10_percent': speedups['convergence_time'] >= 1.10,
              'convergence_peak_memory_below_1_percent': memory_ratio <= 0.01,
              'uncertainty_speedup_at_least_10_percent': speedups['uncertainty'] >= 1.10,
              'scientific_benchmark_no_material_regression': speedups['scientific_benchmarks'] >= 0.85,
              'all_scientific_benchmarks_pass': candidate['scientific_benchmarks_passed'] == 8,
              'extreme_uncertainty_is_finite': candidate['extreme_uncertainty_finite'] is True,
              'compensated_balance_preserves_small_residual': candidate['compensated_balance_residual'] == -1.0,
          }
          report = {
              'schema_version': '1.0',
              'baseline_sha': 'f405ed6ea9e1aa964ddc8aee24c955cd7526bb44',
              'baseline': baseline,
              'candidate': candidate,
              'speedups': speedups,
              'convergence_peak_memory_ratio': memory_ratio,
              'acceptance': acceptance,
              'status': 'PASS' if all(acceptance.values()) else 'FAIL',
              'rejected_candidates': [
                  {
                      'candidate': 'compiled-regex parser failure-cue prefilter',
                      'measured_parser_ratio': 0.29591813485507673,
                      'decision': 'REJECTED_AND_REVERTED',
                  }
              ],
              'claim_boundary': (
                  'Same-host repository-local Python mathematical kernels and acceleration '
                  'planning only; no external solver, GPU kernel or production-HPC speedup is claimed.'
              ),
          }
          Path('/tmp/math-v10-final-comparison.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          print(json.dumps(report, sort_keys=True))
          if report['status'] != 'PASS':
              raise SystemExit('definitive mathematical performance acceptance failed')
          PY

      - name: Run complete tests, coverage, security and package gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo full-gates > /tmp/math-v10-final-stage
          python -m pytest -q \
            tests/test_math_performance_v10.py \
            tests/test_performance_optimizations.py \
            tests/test_validation_fail_closed.py \
            tests/test_scientific_benchmarks.py \
            tests/test_acceleration_foundation.py \
            tests/test_acceleration_v11.py \
            tests/test_acceleration_coverage.py
          python scripts/run_tests.py --coverage | tee /tmp/math-v10-final-pytest.log
          python scripts/verify_all.py --profile all --timing-json /tmp/math-v10-final-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/math-v10-final-benchmark.json
          python scripts/verify_native_core.py > /tmp/math-v10-final-native.json
          python scripts/security_scan.py
          python -m pip_audit --local --skip-editable --progress-spinner=off \
            --format=json --output /tmp/math-v10-final-dependencies.json
          rm -rf /tmp/math-v10-final-build
          python -m build --outdir /tmp/math-v10-final-build
          python -m pytest -q
          git ls-remote --heads origin | sort > /tmp/math-v10-final-heads.txt
          test "$(awk '{print $2}' /tmp/math-v10-final-heads.txt | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Synchronize README and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo evidence > /tmp/math-v10-final-stage
          python scripts/update_main_audit_evidence.py \
            --root . \
            --run-id "$GITHUB_RUN_ID" \
            --issue "$ISSUE_NUMBER" \
            --test-log /tmp/math-v10-final-pytest.log \
            --coverage-json /tmp/math-v10-final-coverage.json \
            --dependency-json /tmp/math-v10-final-dependencies.json \
            --security-json evidence/security-scan.json \
            --remote-heads /tmp/math-v10-final-heads.txt \
            --parent-commit "$ORIGINAL_SHA" \
            --audit-generation math-performance-audit-v10 \
            --audit-label V10-math-performance \
            --visual-count 42 \
            --visual-atlas-version 13 \
            --report-path reports/ULTIMATE_CODE_QUALITY_FINALIZATION.md \
            --visual-families 'Electronic structure and molecular simulation; materials and interfaces; continuum and process engineering; evidence governance and HPC.'
          python - <<'PY'
          import json
          import re
          import subprocess
          import textwrap
          from pathlib import Path

          report = json.loads(Path('/tmp/math-v10-final-comparison.json').read_text(encoding='utf-8'))
          report.update(
              {
                  'audit_generation': 'math-performance-audit-v10',
                  'issue': 48,
                  'candidate_source_sha': subprocess.check_output(
                      ['git', 'rev-parse', 'HEAD'], text=True
                  ).strip(),
                  'changes': [
                      'Stable independent-uncertainty propagation with math.hypot.',
                      'O(1)-memory streaming convergence with overflow-safe thresholds.',
                      'Compensated conservation residuals with math.fsum.',
                      'Fail-closed finite scientific benchmark error arithmetic.',
                      'Bounded acceleration-library recommendation cache.',
                      'Source-root-isolated reproducible mathematical performance harness.',
                  ],
              }
          )
          Path('reports/MATH_PERFORMANCE_AUDIT_V10.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, allow_nan=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          speedups = report['speedups']
          memory = report['convergence_peak_memory_ratio']
          english = textwrap.dedent(f'''\
          <!-- MATH_PERFORMANCE_V10:START -->
          ### Mathematical correctness and performance V10

          The current main line uses stable uncertainty propagation, O(1)-memory convergence checks, compensated conservation residuals, finite benchmark-error arithmetic and cached acceleration-library recommendations. A proposed compiled-regex parser prefilter was rejected and reverted after measuring a `0.30×` parser ratio.

          Isolated same-host results versus the previously certified main: repeated acceleration planning **{speedups['acceleration_plan']:.2f}×**, convergence evaluation **{speedups['convergence_time']:.2f}×**, uncertainty propagation **{speedups['uncertainty']:.2f}×**, and convergence peak traced memory **{memory:.3%}** of baseline. All eight scientific reference benchmarks and the complete deterministic gate passed. These figures cover repository-local Python kernels and orchestration only; they do not claim external-solver, GPU-kernel or production-HPC speedup.

          Machine evidence: [`reports/MATH_PERFORMANCE_AUDIT_V10.json`](reports/MATH_PERFORMANCE_AUDIT_V10.json).
          <!-- MATH_PERFORMANCE_V10:END -->''').strip()
          chinese = textwrap.dedent(f'''\
          <!-- MATH_PERFORMANCE_V10:START -->
          ### 数理正确性与性能 V10

          当前主线采用稳定不确定度合成、O(1) 内存收敛判定、补偿式守恒残差、有限数基准误差计算和加速库推荐缓存。候选“编译正则解析预筛选”实测解析比值仅为 `0.30×`，因此已拒绝并回退。

          相对于此前已认证主线的隔离同机结果：重复加速规划 **{speedups['acceleration_plan']:.2f}×**、收敛判定 **{speedups['convergence_time']:.2f}×**、不确定度合成 **{speedups['uncertainty']:.2f}×**，收敛判定峰值跟踪内存为基线的 **{memory:.3%}**。8 项科学参考基准和完整确定性门禁全部通过。上述数据仅针对仓库内 Python 数理内核与编排逻辑，不代表外部求解器、GPU 内核或生产 HPC 加速。

          机器证据：[`reports/MATH_PERFORMANCE_AUDIT_V10.json`](reports/MATH_PERFORMANCE_AUDIT_V10.json)。
          <!-- MATH_PERFORMANCE_V10:END -->''').strip()

          def update(filename: str, block: str) -> None:
              target = Path(filename)
              text = target.read_text(encoding='utf-8')
              pattern = re.compile(
                  r'<!-- MATH_PERFORMANCE_V10:START -->.*?<!-- MATH_PERFORMANCE_V10:END -->',
                  re.DOTALL,
              )
              text = pattern.sub(block, text, count=1) if pattern.search(text) else text.rstrip() + '\n\n' + block + '\n'
              target.write_text(text, encoding='utf-8', newline='\n')

          update('README.md', english)
          update('README.zh-CN.md', chinese)
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check

      - name: Validate exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          echo final-tree > /tmp/math-v10-final-stage
          python scripts/sync_version_metadata.py --check
          python scripts/regenerate_readme_visuals_v13.py --check
          python scripts/validate_schemas.py
          python scripts/validate_adapter_metadata.py
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest -q
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name '*.yml' -printf '%f\n' | sort)
          expected=(ci.yml codeql.yml dependency-audit.yml release.yml scorecard.yml)
          test "${workflows[*]}" = "${expected[*]}"
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Commit certified result directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          echo commit > /tmp/math-v10-final-stage
          git add -A
          git commit -m 'Improve mathematical stability and performance'
          git push origin HEAD:refs/heads/main
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          echo "FINAL_PUSHED=true" >> "$GITHUB_ENV"

      - name: Require production CI, CodeQL and Scorecard
        shell: bash
        run: |
          set -Eeuo pipefail
          echo production-ci > /tmp/math-v10-final-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$FINAL_SHA"
          gh workflow run ci.yml --ref main
          gh workflow run codeql.yml --ref main
          gh workflow run scorecard.yml --ref main
          wait_for_workflow() {
            local workflow="$1"
            local line status conclusion url
            for _ in $(seq 1 180); do
              line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch main --event workflow_dispatch --limit 10 \
                --json headSha,status,conclusion,url \
                --jq ".[] | select(.headSha == \"$FINAL_SHA\") | [.status,.conclusion,.url] | @tsv" \
                | head -n 1)"
              if [[ -n "$line" ]]; then
                IFS=$'\t' read -r status conclusion url <<< "$line"
                if [[ "$status" == completed ]]; then
                  echo "$workflow: $conclusion ($url)"
                  [[ "$conclusion" == success ]]
                  return
                fi
              fi
              sleep 10
            done
            return 1
          }
          wait_for_workflow ci.yml
          wait_for_workflow codeql.yml
          wait_for_workflow scorecard.yml

      - name: Close successful audit
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment "Definitive mathematical/performance audit V10 passed on commit $FINAL_SHA. Source-isolated A/B measurements, numerical stability, complete tests, coverage, security, dependencies, package, Manifest, CI, CodeQL and OpenSSF Scorecard all passed. The regressive parser candidate was rejected. No branch or pull request was created."

      - name: Fail closed and clean temporary automation
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/math-v10-final-stage 2>/dev/null || echo unknown)"
          if [[ "$FINAL_PUSHED" != true ]]; then
            git reset --hard "$ORIGINAL_SHA"
            rm -f .github/workflows/certify-math-performance-v10-final-once.yml
            rm -f .certify-math-performance-v10-final
            mkdir -p reports
            python - "$stage" "$GITHUB_RUN_ID" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          stage, run_id = sys.argv[1], int(sys.argv[2])
          Path('reports/MATH_PERFORMANCE_AUDIT_V10_FAILURE.json').write_text(
              json.dumps(
                  {
                      'schema_version': '1.0',
                      'status': 'FAILED',
                      'stage': stage,
                      'run_id': run_id,
                      'branch': 'main',
                      'temporary_branch_created': False,
                      'created_at_utc': datetime.now(timezone.utc).isoformat(),
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
            python scripts/build_manifest.py || true
            git add -A
            git commit -m "Record definitive math performance failure at $stage" || true
            git push origin HEAD:refs/heads/main || true
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Definitive math/performance certification did not complete at stage: $stage. Actions run: $GITHUB_RUN_ID. No branch or PR was created; temporary automation was removed when possible." || true
          exit 1
