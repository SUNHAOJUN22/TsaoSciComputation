name: Finalize cross-platform explicit path once

on:
  schedule:
    - cron: '*/5 * * * *'
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  ISSUE_NUMBER: '159'
  PRODUCT_BASE: '697ddd126ea7aaaf2562bbf10e3384f98bd6d98f'

concurrency:
  group: finalize-cross-platform-explicit-path-20260807
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.event_name == 'schedule' ||
      (github.event.issue.number == 159 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == 'RUN_CROSS_PLATFORM_PATH_20260807')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out staged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staged code scope
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/expected-staging.txt" <<'EOF'
          .github/workflows/qualify-cross-platform-path-once.yml
          tests/test_execution_evidence_hardening.py
          tsao_computation/execution/runner.py
          EOF
          git diff --name-only "$PRODUCT_BASE" HEAD | sort > "$RUNNER_TEMP/observed-staging.txt"
          diff -u "$RUNNER_TEMP/expected-staging.txt" "$RUNNER_TEMP/observed-staging.txt"
          test "$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install governed validation tools
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Rebuild Manifest and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/qualify-cross-platform-path-once.yml
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_manifest.py
          git diff --check

      - name: Run complete software qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python scripts/verify_all.py --profile benchmark

      - name: Verify exact product tree and publish
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/expected-product.txt" <<'EOF'
          manifest.json
          tests/test_execution_evidence_hardening.py
          tsao_computation/execution/runner.py
          EOF
          git add -A
          git diff --cached --check
          git diff --cached --name-only "$PRODUCT_BASE" | sort > "$RUNNER_TEMP/observed-product.txt"
          diff -u "$RUNNER_TEMP/expected-product.txt" "$RUNNER_TEMP/observed-product.txt"
          python scripts/build_manifest.py --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Harden cross-platform explicit executable paths"
          git push origin HEAD:main
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record success
        if: success()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Cross-platform explicit-path qualification passed and published to main at $PRODUCT_COMMIT. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "Completed without branch, pull request or force push. External solver qualification remains EXTERNAL_HOLD."

      - name: Record failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Cross-platform explicit-path qualification failed; product code remains staged and no final Manifest commit was published. Inspect: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
