name: Audit solver-bound V6 staging once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    if: >-
      github.event.issue.title == 'AUDIT_SOLVER_BOUND_V6_STAGING_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Audit historical Base64 staging objects
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY' > /tmp/audit.json
          import base64
          import hashlib
          import json
          import subprocess

          specs = (
              ('part-00.b64', 'ca588cfddff721bba46ca245bfbb649df7dea369', 4096, '83e4be6bf31c2331fbeb5f5d1122eaa1ec3228cc4715d2d4585624506b9717ab'),
              ('part-01.b64', '5c9ed6d0d4ae28f864d6a8f1b09996fef4e1fa1c', 4096, '6366fddac254f50d631cc2e384f97041854d3af9f9817255f691054e9d8e4154'),
              ('group-02.b64', '8313f72c1582a9af3731747d1edf517daca61671', 8192, 'ca03a84a9a01bf89a3b5096aac9fcc509fe60512ac6ff2b75e24e80239c53d1b'),
              ('group-03.b64', 'a151e4f5edcd493e53fd8b1b59fbf043003ded51', 8192, '0d1a370fa61933b4d169497bb52970df10a0312c3ee0648a7f31069b4ee717f1'),
              ('group-04.b64', '2e1e9dcfdc982554af14957adf347b26fd94ff1c', 5045, 'b856ac346bf09a3dd425363071387c7173bab380c8709556cf4ae50e2d346954'),
          )
          rows = []
          for name, commit, expected_size, expected_sha in specs:
              path = f'.github/payloads/solver-bound-plan-v6-staging/{name}'
              encoded = subprocess.check_output(('git', 'show', f'{commit}:{path}')).replace(b'\n', b'').replace(b'\r', b'')
              try:
                  decoded = base64.b64decode(encoded, validate=True)
                  error = None
              except Exception as exc:
                  decoded = b''
                  error = f'{type(exc).__name__}: {exc}'
              observed_sha = hashlib.sha256(decoded).hexdigest() if error is None else None
              rows.append({
                  'name': name,
                  'encoded_bytes': len(encoded),
                  'decoded_bytes': len(decoded),
                  'expected_bytes': expected_size,
                  'observed_sha256': observed_sha,
                  'expected_sha256': expected_sha,
                  'match': error is None and len(decoded) == expected_size and observed_sha == expected_sha,
                  'decode_error': error,
              })
          print(json.dumps({'groups': rows}, indent=2, sort_keys=True))
          PY
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/audit.json
      - name: Remove audit workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-solver-bound-v6-staging-once.yml
          git commit -m 'Remove one-time V6 staging audit workflow [skip ci]'
          git push origin HEAD:refs/heads/main
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed
