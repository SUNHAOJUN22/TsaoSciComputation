name: Prepare reviewed approval evidence
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-approval-evidence.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Materialize reviewed patch in the isolated worktree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          base = '1b8e948ac3e0d7ca1e02e8f283b11d4aefbfcd3d'
          if subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() != base:
              raise SystemExit('Unexpected preparation parent')
          parts = []
          for sha in ('4e226018bbdea848df82d13cf1438f29b2fcbcea', '99068edabf759b124ead79141778f87cb89d6d75'):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  parts.append(base64.b64decode(json.load(response)['content']))
          patch = b''.join(parts).replace(b'\n diff --git a/README.zh-CN.md', b'\ndiff --git a/README.zh-CN.md')
          if hashlib.sha256(patch).hexdigest() != '84f5eedb76f38ac09cd78db0fb4bb615f5cc9d8609698346da507b898b31854b':
              raise SystemExit('Reviewed patch checksum mismatch')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'approval-reviewed.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/prepare-approval-evidence.yml'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
      - name: Install repository qualification tools
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Format reviewed files and rebuild canonical evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format tsao_computation/validation/acceptance.py tsao_computation/validation/approval_attestation.py tests/test_approval_attestation_boundaries.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          git add -A
      - name: Complete release qualification, native bridge and performance regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_all.py --profile all
          python scripts/verify_all.py --profile benchmark
          python scripts/verify_native_core.py
          python -m pytest -q tests/test_performance_v9.py tests/test_performance_optimizations.py
          python scripts/run_large_parser_regression.py
          python scripts/build_manifest.py --check
          git diff --check
      - name: Export only qualified Git blobs, never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          allowed = {
              'README.md', 'README.zh-CN.md', 'README_FINAL_DEBUG.md',
              'tests/test_approval_attestation_boundaries.py',
              'tsao_computation/validation/acceptance.py',
              'tsao_computation/validation/approval_attestation.py',
              'manifest.json', 'reports/ACCELERATION_OPPORTUNITIES_FULL_TREE_V4.json',
              'reports/ACCELERATION_OPPORTUNITIES_PRODUCTION_V4.json',
              'reports/ACCELERATION_OPPORTUNITIES_V2.json',
              '.github/workflows/prepare-approval-evidence.yml',
          }
          git('add', '-A')
          changed = set(git('diff', 'HEAD', '--name-only').splitlines())
          if changed - allowed:
              raise SystemExit('Unreviewed path changes: ' + repr(sorted(changed - allowed)))
          entries = []
          for name in sorted(changed):
              path = pathlib.Path(name)
              if not path.exists():
                  if name != '.github/workflows/prepare-approval-evidence.yml':
                      raise SystemExit('Unexpected deletion: ' + name)
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              data = path.read_bytes()
              payload = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=payload, method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              if blob['sha'] != git('hash-object', name):
                  raise SystemExit('Uploaded blob mismatch: ' + name)
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          result = {'status': 'QUALIFIED_BLOBS_ONLY', 'preparation_commit': os.environ['GITHUB_SHA'],
              'candidate_tree': git('write-tree'), 'entries': entries,
              'boundary': 'No branch updated. Final exact-commit CI is still required.'}
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'approval-candidate-blobs.json'
          target.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
      - name: Upload qualification manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-approval-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/approval-candidate-blobs.json
          if-no-files-found: error
