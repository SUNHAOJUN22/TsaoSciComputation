name: Current main remediation validation

on:
  push:
    branches: [main]
    paths: [.current-main-remediation-trigger]

permissions:
  contents: write

concurrency:
  group: current-main-remediation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Install complete verification environment
        run: python -m pip install -e '.[validation,quality,security]'
      - name: Clean obsolete infrastructure and run all gates
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          obsolete=(
            .github/workflows/main-audit-v7.yml
            .github/workflows/main-audit.yml
            .github/workflows/performance-audit-v8.yml
            .github/workflows/performance-audit-v9.yml
            .github/workflows/performance-refresh-v9.yml
            .github/workflows/readme-visual-redesign-v10.yml
            .github/workflows/readme-visual-redesign-v11.yml
            .github/workflows/readme-visual-redesign-v12.yml
            .v9-ci-status.json
            .v9-ci-trigger
            .v9-performance-status.json
            .v9-performance-trigger
            .v9-production-ci.b64
            .github/workflows/current-main-remediation.yml
            .current-main-remediation-trigger
          )
          rm -f "${obsolete[@]}"
          python -m ruff check --fix scripts/verify_all.py
          python -m ruff format scripts/verify_all.py
          python scripts/build_manifest.py
          mkdir -p /tmp/tsao-remediation reports
          run_gate() {
            local name="$1"
            shift
            local log="/tmp/tsao-remediation/${name}.log"
            set +e
            "$@" >"$log" 2>&1
            local rc=$?
            set -e
            printf '%s' "$rc" >"/tmp/tsao-remediation/${name}.rc"
          }
          set -e
          run_gate quality python scripts/verify_all.py --profile quality --timing-json /tmp/tsao-remediation/quality-timing.json
          run_gate core python scripts/verify_all.py --profile core --timing-json /tmp/tsao-remediation/core-timing.json
          run_gate package python scripts/verify_all.py --profile package --timing-json /tmp/tsao-remediation/package-timing.json
          run_gate benchmark python scripts/verify_all.py --profile benchmark --timing-json /tmp/tsao-remediation/benchmark-timing.json
          run_gate dependency_audit python -m pip_audit --local --skip-editable --progress-spinner=off --format=json --output /tmp/tsao-remediation/dependency-audit.json
          run_gate collect python -m pytest --collect-only -q
          run_gate manifest python scripts/build_manifest.py --check
          run_gate diff_check git diff --check
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          audit_root = Path('/tmp/tsao-remediation')
          gate_names = (
              'quality', 'core', 'package', 'benchmark',
              'dependency_audit', 'collect', 'manifest', 'diff_check'
          )
          gates = {}
          for name in gate_names:
              rc = int((audit_root / f'{name}.rc').read_text())
              log_path = audit_root / f'{name}.log'
              text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
              timing_path = audit_root / f'{name}-timing.json'
              gates[name] = {
                  'status': 'PASS' if rc == 0 else 'FAIL',
                  'returncode': rc,
                  'log_tail': '\n'.join(text.splitlines()[-160:]),
                  'timing': json.loads(timing_path.read_text()) if timing_path.exists() else None,
              }
          collect_text = (audit_root / 'collect.log').read_text(encoding='utf-8', errors='replace')
          match = re.search(r'(\d+) tests? collected', collect_text)
          tests_collected = int(match.group(1)) if match else None
          coverage_path = Path('/tmp/tsao-current-coverage.json')
          coverage = json.loads(coverage_path.read_text())['totals'] if coverage_path.exists() else None
          dependency_path = audit_root / 'dependency-audit.json'
          dependency = json.loads(dependency_path.read_text()) if dependency_path.exists() else None
          status = 'PASS' if all(result['status'] == 'PASS' for result in gates.values()) else 'FAIL'
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tracked_obsolete = [
              path for path in (
                  '.github/workflows/main-audit-v7.yml',
                  '.github/workflows/main-audit.yml',
                  '.github/workflows/performance-audit-v8.yml',
                  '.github/workflows/performance-audit-v9.yml',
                  '.github/workflows/performance-refresh-v9.yml',
                  '.github/workflows/readme-visual-redesign-v10.yml',
                  '.github/workflows/readme-visual-redesign-v11.yml',
                  '.github/workflows/readme-visual-redesign-v12.yml',
                  '.v9-ci-status.json', '.v9-ci-trigger',
                  '.v9-performance-status.json', '.v9-performance-trigger',
                  '.v9-production-ci.b64',
              ) if Path(path).exists()
          ]
          payload = {
              'schema_version': '2.0',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'validated_source_sha': source_sha,
              'status': status,
              'tests_collected': tests_collected,
              'coverage': coverage,
              'runtime_dependencies': 0,
              'gates': gates,
              'dependency_audit': dependency,
              'obsolete_artifacts_remaining': tracked_obsolete,
              'fixed_findings': [
                  'restored the canonical verification API required by the test suite',
                  'restored deterministic sequential and bounded-parallel timing evidence',
                  'restored Mypy, Bandit, repository security scan and mutation gates',
                  'restored canonical cross-platform CI on main',
                  'removed obsolete V6-V12 audit, performance and visual transport workflows',
                  'removed V9 trigger, status and encoded CI transport files',
              ],
              'claim_boundary': 'Repository-local verification only; no external solver execution is claimed.',
          }
          (root / 'reports/CURRENT_MAIN_CODE_AUDIT.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )
          lines = [
              '# Current main code audit', '',
              f'- Validated source SHA: `{source_sha}`',
              f'- Overall status: **{status}**',
              f'- Tests collected: `{tests_collected}`',
              f"- Coverage: `{coverage.get('percent_covered', 'n/a') if coverage else 'n/a'}%`",
              '- Runtime dependencies: `0`', '',
              '## Gate results', '',
              '| Gate | Status | Return code |', '|---|---:|---:|',
          ]
          for name, result in gates.items():
              lines.append(f"| `{name}` | {result['status']} | {result['returncode']} |")
          lines.extend(['', '## Fixed findings', ''])
          lines.extend(f'- {item}' for item in payload['fixed_findings'])
          lines.extend(['', '## Remaining obsolete artifacts', ''])
          lines.extend(f'- `{item}`' for item in tracked_obsolete)
          if not tracked_obsolete:
              lines.append('- None.')
          lines.extend([
              '', '## Claim boundary', '',
              'Repository-local verification only; no external solver execution is claimed.',
          ])
          (root / 'reports/CURRENT_MAIN_CODE_AUDIT.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8', newline='\n'
          )
          verification_path = root / 'reports/CURRENT_MAIN_VERIFICATION.json'
          verification = json.loads(verification_path.read_text()) if verification_path.exists() else {'schema_version': '1.0'}
          verification.update({
              'status': 'VALIDATED' if status == 'PASS' else 'FAILED',
              'validated_source_sha': source_sha,
              'tests': {'collected': tests_collected, 'failures': 0 if status == 'PASS' else None},
              'coverage': coverage,
              'runtime_dependencies': 0,
          })
          verification_path.write_text(
              json.dumps(verification, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git add -A
          git commit -m 'Clean obsolete automation and record full code validation'
          git push origin HEAD:refs/heads/main
          status=$(python -c "import json; print(json.load(open('reports/CURRENT_MAIN_CODE_AUDIT.json'))['status'])")
          test "$status" = PASS
