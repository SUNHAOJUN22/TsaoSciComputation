name: Qualify solver capability V5 once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: qualify-solver-capability-v5-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_SOLVER_CAPABILITY_V5_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Apply fixed-path, digest-bound V5 files
        run: |
          set -Eeuo pipefail
          python .github/payloads/solver-capability-v5/apply.py
          rm .github/workflows/qualify-solver-capability-v5-once.yml
          rm -f .github/workflows/validate-solver-capability-v5-candidate-once.yml
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - name: Canonicalize code and evidence
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
      - name: Run complete qualification
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python -m pytest -q tests/test_solver_capability_v5.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
          git diff --check
          test ! -e .github/payloads/solver-capability-v5
          test ! -e .github/workflows/qualify-solver-capability-v5-once.yml
          test ! -e .github/workflows/validate-solver-capability-v5-candidate-once.yml
          git diff -- .github/workflows/ci.yml --exit-code
      - name: Publish directly to main
        id: publish
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add solver capability evidence V5'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Close qualification issue
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Solver Capability Evidence V5 was published directly to main as ${{ steps.publish.outputs.sha }} after fixed-path payload integrity, lint, typing, quality, security, tests, coverage, package, native and evidence gates passed. Evidence remains scientifically unqualified until a live solver workflow is validated. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Remove temporary transport after failure
        if: failure()
        run: |
          set +e
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .github/payloads/solver-capability-v5
          git rm -f --ignore-unmatch .github/workflows/qualify-solver-capability-v5-once.yml
          git rm -f --ignore-unmatch .github/workflows/validate-solver-capability-v5-candidate-once.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove failed solver capability V5 transport [skip ci]'
            git push origin HEAD:refs/heads/main
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Solver Capability Evidence V5 qualification failed; no product commit was published. Temporary transport was removed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
