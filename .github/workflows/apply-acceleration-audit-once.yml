name: Apply acceleration audit patch once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-acceleration-audit-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  apply:
    if: >-
      github.event.issue.title == 'APPLY_ACCELERATION_AUDIT_PATCH' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Decode and apply owner-authorized patch
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          body = os.environ['ISSUE_BODY']
          start = 'BEGIN_GZIP_BASE64_PATCH\n'
          end = '\nEND_GZIP_BASE64_PATCH'
          if start not in body or end not in body:
              raise SystemExit('patch markers are missing')
          payload = body.split(start, 1)[1].split(end, 1)[0].strip()
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          Path('/tmp/acceleration.patch').write_bytes(patch)
          PY
          git apply --check /tmp/acceleration.patch
          git apply /tmp/acceleration.patch
          rm -f .github/workflows/apply-acceleration-audit-once.yml

      - name: Install validation dependencies
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Run quality gates and refresh generated evidence
        run: python scripts/verify_all.py --profile quality

      - name: Run core scientific and repository gates
        run: python scripts/verify_all.py --profile core

      - name: Build and test native C ABI plus Python bridge
        run: python scripts/verify_native_core.py

      - name: Commit directly to main
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add native CUDA runtime discovery and Python bridge'
          git push origin HEAD:refs/heads/main

      - name: Close authorization issue
        shell: bash
        run: |
          set -Eeuo pipefail
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Acceleration audit patch applied to main after quality, core, and native verification passed.'
