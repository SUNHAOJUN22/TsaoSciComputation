name: Canonicalize generated text

on:
  issues:
    types: [edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: canonicalize-generated-text
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'SUNHAOJUN22/TsaoSciComputation' &&
      github.event.issue.number == 22 &&
      github.event.issue.user.login == 'SUNHAOJUN22' &&
      contains(github.event.issue.body, '<!-- TSAO_CANONICAL_TEXT_WRITES_V1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      final_sha: ${{ steps.commit.outputs.final_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - run: python -m pip install -e '.[validation,quality,security]'

      - name: Remove workflow and canonicalize production text writes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/canonicalize-generated-text.yml
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          roots = (Path('scripts'), Path('tsao_computation'))
          changed: list[str] = []
          whitespace = b' \t\r\n'
          for path in sorted(candidate for root in roots for candidate in root.rglob('*.py')):
              source = path.read_bytes()
              tree = ast.parse(source.decode('utf-8'), filename=str(path))
              offsets: list[int] = []
              cursor = 0
              for line in source.splitlines(keepends=True):
                  offsets.append(cursor)
                  cursor += len(line)
              insertions: list[tuple[int, bytes]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  if not isinstance(node.func, ast.Attribute) or node.func.attr != 'write_text':
                      continue
                  if any(keyword.arg == 'newline' for keyword in node.keywords):
                      continue
                  if node.end_lineno is None or node.end_col_offset is None:
                      raise RuntimeError(f'missing AST end position: {path}')
                  end = offsets[node.end_lineno - 1] + node.end_col_offset
                  if source[end - 1:end] != b')':
                      raise RuntimeError(f'unexpected write_text call ending: {path}:{node.lineno}')
                  previous = end - 2
                  while previous >= 0 and source[previous:previous + 1] in whitespace:
                      previous -= 1
                  if previous < 0:
                      raise RuntimeError(f'empty write_text call: {path}:{node.lineno}')
                  payload = (
                      b' newline="\\n"'
                      if source[previous:previous + 1] == b','
                      else b', newline="\\n"'
                  )
                  insertions.append((previous + 1, payload))
              if not insertions:
                  continue
              for position, payload in sorted(insertions, key=lambda item: item[0], reverse=True):
                  source = source[:position] + payload + source[position:]
              ast.parse(source.decode('utf-8'), filename=str(path))
              path.write_bytes(source)
              changed.append(path.as_posix())
          if not changed:
              raise SystemExit('no production write_text calls required canonicalization')
          print('\n'.join(changed))
          PY
          cat > tests/test_canonical_text_writes.py <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          ROOTS = (Path("scripts"), Path("tsao_computation"))


          def test_production_text_writes_are_explicitly_lf_canonical() -> None:
              calls = 0
              for path in sorted(candidate for root in ROOTS for candidate in root.rglob("*.py")):
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call):
                          continue
                      if not isinstance(node.func, ast.Attribute) or node.func.attr != "write_text":
                          continue
                      calls += 1
                      newline = next(
                          (keyword.value for keyword in node.keywords if keyword.arg == "newline"),
                          None,
                      )
                      assert isinstance(newline, ast.Constant), (
                          f"missing newline policy: {path}:{node.lineno}"
                      )
                      assert newline.value == "\n", (
                          f"non-LF write policy: {path}:{node.lineno}"
                      )
              assert calls >= 20
          PY
          python -m ruff check --fix scripts tsao_computation tests/test_canonical_text_writes.py
          python -m ruff format scripts tsao_computation tests/test_canonical_text_writes.py
          python scripts/build_manifest.py
          python scripts/sync_version_metadata.py --check
          python scripts/validate_repository.py
          python scripts/build_manifest.py --check
          python -m pytest tests/test_canonical_text_writes.py tests/test_release_governance.py -q
          git diff --check

      - name: Run complete deterministic gates on the canonical tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all | tee /tmp/canonical-all.log
          python scripts/verify_all.py --profile benchmark | tee /tmp/canonical-benchmark.log
          python -m pytest -q | tee /tmp/canonical-pytest.log
          python scripts/build_manifest.py --check
          git diff --check

      - name: Materialize a real failure without committing transformed source
        if: ${{ failure() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -s /tmp/canonical-all.log; then
            tail -n 180 /tmp/canonical-all.log | tr -d '\r' | tail -c 30000 \
              > /tmp/canonical-diagnosis.txt
          else
            {
              echo 'Canonicalization preparation failed before deterministic-all logging.'
              git status --short
            } > /tmp/canonical-diagnosis.txt
          fi
          git reset --hard HEAD
          rm -f .github/workflows/canonicalize-generated-text.yml
          rm -f .github/workflows/materialize-exact-canonical-job.yml
          rm -f .github/workflows/materialize-real-canonical-failure.yml
          {
            echo "canonicalization_run_id=$GITHUB_RUN_ID"
            echo
            cat /tmp/canonical-diagnosis.txt
          } > reports/CANONICALIZATION_FAILURE_DIAGNOSIS.txt
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          python scripts/validate_repository.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize deterministic canonicalization failure'
          git push origin HEAD:refs/heads/main

      - name: Commit canonical generated text policy
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Canonicalize generated text across operating systems'
          git push origin HEAD:refs/heads/main
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.final_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: python -m pip install -e '.[validation,quality]'
      - run: python scripts/build_manifest.py --check
      - run: python scripts/verify_all.py --profile core
      - run: python scripts/build_manifest.py --check

  report:
    if: ${{ always() && needs.prepare.result != 'skipped' }}
    needs: [prepare, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Report result
        shell: bash
        run: |
          if test '${{ needs.prepare.result }}' = success && test '${{ needs.windows.result }}' = success; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Canonical generated-text regression passed. Every production Path.write_text call now pins LF; an AST governance test prevents future regressions. Complete deterministic gates, benchmark and pytest passed on the prepared tree. The same Ubuntu-generated Manifest remained unchanged before and after the complete Windows core profile on Python 3.10 and 3.13. Prepared commit: ${{ needs.prepare.outputs.final_sha }}. Workflow run: $GITHUB_RUN_ID. The one-shot workflow removed itself; no branch or PR was created."
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "Canonical generated-text regression failed. Prepare: ${{ needs.prepare.result }}; Windows: ${{ needs.windows.result }}. Workflow run: $GITHUB_RUN_ID. The transformed source was discarded; a diagnosis report was committed instead. No completion is claimed."
            exit 1
          fi
