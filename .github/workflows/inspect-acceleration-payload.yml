name: Inspect acceleration foundation payload

on:
  push:
    branches: [main]
    paths: [.inspect-acceleration-payload-trigger]

permissions:
  contents: write

concurrency:
  group: inspect-acceleration-payload-main
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Decode and inspect payload without applying it
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/inspect-acceleration-payload.yml \
            .inspect-acceleration-payload-trigger
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import io
          import json
          import tarfile
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path, PurePosixPath

          root = Path('.').resolve()
          parts = sorted((root / 'tools').glob('acceleration-foundation-v1.part-*.b85'))
          if len(parts) != 4:
              raise SystemExit(f'expected 4 transport parts, found {len(parts)}')
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          raw = base64.b85decode(encoded.encode('ascii'))
          payload_sha = hashlib.sha256(raw).hexdigest()

          archive_type = 'raw'
          members: list[dict[str, object]] = []
          manifest_payload: object | None = None

          def safe_name(name: str) -> str:
              normalized = PurePosixPath(name)
              if normalized.is_absolute() or '..' in normalized.parts or '\\' in name:
                  raise ValueError(f'unsafe archive member: {name}')
              return normalized.as_posix()

          def add_member(name: str, data: bytes, kind: str) -> None:
              nonlocal manifest_payload
              clean = safe_name(name)
              record = {
                  'path': clean,
                  'kind': kind,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
              members.append(record)
              if clean.endswith(('patch_manifest.json', 'manifest.json')) and len(data) < 1_000_000:
                  try:
                      manifest_payload = json.loads(data.decode('utf-8'))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      pass

          if zipfile.is_zipfile(io.BytesIO(raw)):
              archive_type = 'zip'
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  for info in archive.infolist():
                      if info.is_dir():
                          continue
                      add_member(info.filename, archive.read(info), 'file')
          else:
              candidate = raw
              if raw[:2] == b'\x1f\x8b':
                  archive_type = 'gzip'
                  candidate = gzip.decompress(raw)
              try:
                  with tarfile.open(fileobj=io.BytesIO(candidate), mode='r:*') as archive:
                      archive_type = 'tar' if archive_type == 'raw' else f'{archive_type}+tar'
                      for info in archive.getmembers():
                          if not info.isfile():
                              continue
                          extracted = archive.extractfile(info)
                          if extracted is None:
                              continue
                          add_member(info.name, extracted.read(), 'file')
              except tarfile.TarError:
                  add_member('payload.bin', raw, 'raw')

          members.sort(key=lambda item: str(item['path']))
          report = {
              'schema_version': '1.0',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'INSPECTED_NOT_APPLIED',
              'source_commit': '281f9b289c027ec8f19a4ff4467cdf0f24dc4ff1',
              'transport_parts': [path.relative_to(root).as_posix() for path in parts],
              'encoded_characters': len(encoded),
              'decoded_bytes': len(raw),
              'decoded_sha256': payload_sha,
              'archive_type': archive_type,
              'member_count': len(members),
              'members': members,
              'embedded_manifest': manifest_payload,
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/ACCELERATION_FOUNDATION_PAYLOAD_INSPECTION.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git add -A
          git commit -m 'Inspect acceleration foundation payload'
          git push origin HEAD:refs/heads/main
