name: Qualify acceleration V4 retry once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: qualify-acceleration-v4-retry-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_ACCELERATION_V4_RETRY_20260805' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out current main with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify corrected chunk and reconstruct payload
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = [
              'f5c73721a4434dc02792a144a91c135f4cdfec665598c54660e429e89edc53ec',
              '72961a7624a3986d99da8f112058953002d77453158c387d086436a188b79de5',
              'fc6e4c0dc9731ffa08c7b0e2e378a3a7dc2b0448dc6fc533193ac8a19ece7a05',
              '3fffb8576e7e14946f0fb8bcf0b202752527e09350a3f572727e155b7e395062',
              '539cef12869f325a75e91b1c2721565713fbabab2e5e6dabebd98a2fa91af77f',
              'c00eb7679dbccb2963fe53bfe10a0423b0a8d0d25a5abfe01e3c19ed866d0137',
              '439d29a838a250308798305b7a22541208bf6c2a5afe9cb3e3a98c17191b749e',
              '7ffbb03d3bcaa5643393e9479d471db579a7488f0bcb61dd0ff099e1c0fb3277',
          ]
          chunks = []
          for index, digest in enumerate(expected):
              path = Path(f'.github/payloads/acceleration-v4-retry/big-01-{index:02d}')
              data = path.read_bytes().replace(b'\n', b'').replace(b'\r', b'')
              observed = hashlib.sha256(data).hexdigest()
              if observed != digest:
                  raise SystemExit(f'corrected chunk {index:02d} digest mismatch: {observed}')
              chunks.append(data)
          repaired = b''.join(chunks)
          repaired_digest = hashlib.sha256(repaired).hexdigest()
          if repaired_digest != '7d586deac7d6398404acc2bfeb216ff64dabd87b6e47f068cee01146f40bdafd':
              raise SystemExit(f'repaired big-01 digest mismatch: {repaired_digest}')
          Path('/tmp/v4-big-01').write_bytes(repaired)
          PY
          {
            git show c4554b4bef87f22e8d32f0f85cb6132812891d0f:.github/payloads/acceleration-v4/big-00
            cat /tmp/v4-big-01
            git show da0ee6fb4841be4623d87fa8bcb95db6fca764e8:.github/payloads/acceleration-v4/big-02
            git show 304c88244584e7a5311d1e7530f42e9f2a02bd72:.github/payloads/acceleration-v4/big-03
            git show 3f5e6317e7513c505744354adcf95978963c0e94:.github/payloads/acceleration-v4/big-04
            git show 6113290e4dd3753ed593c91d7c8a21d2d7df95b4:.github/payloads/acceleration-v4/big-05
            git show 43bf6465a49a10a1dc4b130dab748eac22bc59e9:.github/payloads/acceleration-v4/big-06
            git show 5eefb0df20d42548274605a9a624b07f70d60748:.github/payloads/acceleration-v4/big-07
          } | tr -d '\n\r' > /tmp/acceleration-v4.tar.gz.b64
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          encoded = Path('/tmp/acceleration-v4.tar.gz.b64').read_bytes()
          observed = hashlib.sha256(encoded).hexdigest()
          expected = '5cb37164c7b932d8dc149d5bd0f36f22fe87e794995946b60411e416f08dd043'
          if observed != expected:
              raise SystemExit(f'encoded payload digest mismatch: {observed}')
          archive = base64.b64decode(encoded, validate=True)
          observed_archive = hashlib.sha256(archive).hexdigest()
          expected_archive = 'd7e3fd0c054ed99ff6bb6b0d3ffeb04007044ac81b6cf4a81034b86467f5a84f'
          if observed_archive != expected_archive:
              raise SystemExit(f'archive digest mismatch: {observed_archive}')
          Path('/tmp/acceleration-v4.tar.gz').write_bytes(archive)
          PY

      - name: Apply delta and remove transport
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -xzf /tmp/acceleration-v4.tar.gz -C .
          rm -rf .github/payloads/acceleration-v4-retry
          rm .github/workflows/qualify-acceleration-v4-retry-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install validation toolchain
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonicalize generated evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run complete release qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all | tee /tmp/verify-all.log

      - name: Verify native C ABI and Python bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_native_core.py | tee /tmp/verify-native.log

      - name: Smoke-test workload profiling
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/profile_workloads.py --quick --output "$RUNNER_TEMP/acceleration-v4-profile.json"

      - name: Prepare exact final tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build_acceleration_audits.py
          python scripts/quality_check.py
          python scripts/security_scan.py
          python scripts/build_manifest.py
          python scripts/build_acceleration_audits.py --check
          python scripts/build_manifest.py --check
          python -m pytest -q tests/test_acceleration_qualification_v4.py tests/test_acceleration_batch.py
          python -m ruff check tsao_computation scripts tests _bootstrap.py
          python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          git diff --check

      - name: Publish directly to main
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add acceleration qualification V4 and resource-aware execution'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Close qualification issue
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Acceleration Qualification V4 was published directly to main as ${{ steps.publish.outputs.sha }} after complete integrity, quality, security, tests, coverage, package, native and profiling gates passed. No branch or pull request was created. run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Clean transport after failure
        if: failure()
        shell: bash
        run: |
          set +e
          git fetch origin main
          git checkout -B cleanup origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .github/payloads/acceleration-v4-retry
          rm -f .github/workflows/qualify-acceleration-v4-retry-once.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove failed acceleration V4 retry transport [skip ci]'
            git push origin HEAD:refs/heads/main
          fi
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "Acceleration Qualification V4 retry failed; no product commit was published. Retry transport was removed. Inspect run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
