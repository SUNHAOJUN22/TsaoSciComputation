name: Validate current remediation

on:
  push:
    branches: [main]
    paths: [.validate-current-remediation-trigger]

permissions:
  contents: write

concurrency:
  group: validate-current-remediation-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[validation,quality,security]'
      - name: Run focused gates and self-clean
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/validate-current-remediation.yml \
            .validate-current-remediation-trigger
          rm -f reports/CURRENT_REMEDIATION_DIAGNOSTIC.json
          python scripts/build_manifest.py
          mkdir -p /tmp/current-remediation
          run_gate() {
            name="$1"; shift
            set +e
            "$@" >"/tmp/current-remediation/${name}.log" 2>&1
            code=$?
            set -e
            printf '%s' "$code" >"/tmp/current-remediation/${name}.rc"
          }
          set -e
          run_gate skill python scripts/validate_skill_spec.py
          run_gate ruff_lint python -m ruff check tsao_computation scripts tests _bootstrap.py
          run_gate ruff_format python -m ruff format --check tsao_computation scripts tests _bootstrap.py
          run_gate mypy python -m mypy --python-version 3.13 tsao_computation scripts
          run_gate targeted_tests python -m pytest -q \
            tests/test_install_skill.py \
            tests/test_skill_spec_and_workflow_security.py \
            tests/test_documentation_completeness.py \
            tests/test_release_governance.py
          run_gate manifest python scripts/build_manifest.py --check
          run_gate diff_check git diff --check
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('/tmp/current-remediation')
          names=('skill','ruff_lint','ruff_format','mypy','targeted_tests','manifest','diff_check')
          gates={}
          for name in names:
              rc=int((root/f'{name}.rc').read_text())
              log=(root/f'{name}.log').read_text(encoding='utf-8',errors='replace')
              gates[name]={'status':'PASS' if rc==0 else 'FAIL','returncode':rc,'log_tail':'\n'.join(log.splitlines()[-180:])}
          status='PASS' if all(item['returncode']==0 for item in gates.values()) else 'BLOCKED'
          payload={'schema_version':'1.0','generated_at':datetime.now(timezone.utc).isoformat(),'status':status,'gates':gates}
          Path('reports').mkdir(exist_ok=True)
          Path('reports/CURRENT_REMEDIATION_DIAGNOSTIC.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n',encoding='utf-8',newline='\n')
          PY
          python scripts/build_manifest.py
          git add -A
          status=$(python -c "import json;print(json.load(open('reports/CURRENT_REMEDIATION_DIAGNOSTIC.json'))['status'])")
          git commit -m "Record focused remediation validation: $status"
          git push origin HEAD:refs/heads/main
          test "$status" = PASS
