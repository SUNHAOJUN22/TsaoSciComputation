name: Generator-correct adversarial Phase A once

on:
  push:
    branches: [main]
    paths:
      - .trigger-adversarial-phase-a-generator

permissions:
  contents: write
  issues: write

concurrency:
  group: generator-correct-adversarial-phase-a-main
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  TSAO_COVERAGE_JSON: /tmp/adversarial-phase-a-generator-coverage.json
  AUDIT_ISSUE: '61'
  CLEAN_BASELINE_SHA: '3a4656e2a84a8a984f80c2118c334ab2b6187cd5'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Generate the complete Phase A candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "ORIGINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PUBLISHED=false" >> "$GITHUB_ENV"
          echo apply > /tmp/adversarial-phase-a-generator-stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick 484ec16dd90120cfd3ab913c52f2660fa5900af3
          git cherry-pick fc6f5b2e131afd9d3077aab46ac327480b7c73c5
          git cherry-pick ddf4718fc7e074fb1a4ac07111e52faaf252cc56
          git cherry-pick d758e34f729ed09caf9dc7bb370d40c9f7f7985f
          git cherry-pick 735081968ef99f30d29fcdee97ce47bea122a8d1
          git cherry-pick f69eac20b3713deb878ce38b31b7e70edcda6e60
          python scripts/prepare_adversarial_phase_a_generator.py
          python scripts/apply_adversarial_super_skill_phase_a.py
          python scripts/fix_adversarial_phase_a_typing.py
          python scripts/finalize_adversarial_phase_a_signatures.py
          python scripts/fix_adversarial_phase_a_compatibility.py
          python scripts/fix_adversarial_phase_a_runtime_edges.py
          python scripts/fix_adversarial_phase_a_semantics.py
          rm -f scripts/prepare_adversarial_phase_a_generator.py
          rm -f scripts/apply_adversarial_super_skill_phase_a.py
          rm -f scripts/fix_adversarial_phase_a_typing.py
          rm -f scripts/finalize_adversarial_phase_a_signatures.py
          rm -f scripts/fix_adversarial_phase_a_compatibility.py
          rm -f scripts/fix_adversarial_phase_a_runtime_edges.py
          rm -f scripts/fix_adversarial_phase_a_semantics.py
          rm -f .github/workflows/adversarial-phase-a-generator-once.yml
          rm -f .trigger-adversarial-phase-a-generator

      - name: Normalize and run targeted gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo targeted > /tmp/adversarial-phase-a-generator-stage
          python -m pip install -e '.[validation,quality,security]'
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python -m pytest -q tests/test_adversarial_super_skill_phase_a.py tests/test_adversarial_phase_a_coverage.py tests/test_super_skill_orchestration.py tests/test_super_skill_hardening.py tests/test_adapter_fail_closed.py tests/test_acceleration_batch.py tests/test_validation_fail_closed.py tests/test_core.py tests/test_extended.py tests/test_fail_closed_coverage_regressions.py tests/test_performance_optimizations.py
          python -m mypy --python-version 3.13 tsao_computation scripts
          python scripts/security_scan.py
          python scripts/build_manifest.py

      - name: Run complete deterministic and benchmark gates
        shell: bash
        run: |
          set -Eeuo pipefail
          echo complete-gates > /tmp/adversarial-phase-a-generator-stage
          python scripts/run_tests.py --coverage | tee /tmp/adversarial-phase-a-generator-tests.log
          python scripts/verify_all.py --profile all --timing-json /tmp/adversarial-phase-a-generator-all.json
          python scripts/verify_all.py --profile benchmark --timing-json /tmp/adversarial-phase-a-generator-benchmark.json
          python -m pytest -q
          python scripts/build_manifest.py --check
          test "$(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##' | paste -sd ' ' -)" = main

      - name: Publish validated Phase A
        shell: bash
        run: |
          set -Eeuo pipefail
          echo publish > /tmp/adversarial-phase-a-generator-stage
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$ORIGINAL_SHA"
          git add -A
          git commit -m 'Harden computation orchestration and execution authorization'
          git push origin HEAD:refs/heads/main
          echo "PUBLISHED=true" >> "$GITHUB_ENV"
          FINAL_SHA="$(git rev-parse HEAD)"
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Adversarial Phase A passed at \`$FINAL_SHA\`: external execution is hash-authorized and default-deny; unknown methods, unknown Skills and ambiguous routes fail closed; external templates remain not-ready until a dedicated executor is bound; authorization is exact boolean; contracts and registries are immutable snapshots; completion and convergence remain independent; parser rejects intermediate completion messages; safe_run remains public but explicit. Boundary coverage, mypy, complete tests and coverage, deterministic and benchmark profiles, security, reproducible packaging, Manifest and main-only gates passed. No branch or PR was created."

      - name: Fail closed
        if: ${{ failure() && env.PUBLISHED != 'true' }}
        shell: bash
        run: |
          set +e
          stage="$(cat /tmp/adversarial-phase-a-generator-stage 2>/dev/null || echo unknown)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          git read-tree --reset -u "$CLEAN_BASELINE_SHA"
          git clean -fd
          python scripts/security_scan.py || true
          python scripts/build_manifest.py || true
          git add -A
          git commit -m "Restore clean computation skill at $stage" || true
          git push origin HEAD:refs/heads/main || true
          gh issue comment "$AUDIT_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Generator-correct adversarial Phase A failed closed at stage: $stage. Actions run: $GITHUB_RUN_ID. The tree was restored to $CLEAN_BASELINE_SHA. No branch or PR was created." || true
          exit 1
