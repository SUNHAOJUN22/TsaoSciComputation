name: Qualify resource broker GPU binding hardening once

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: qualify-resource-broker-gpu-binding-hardening-once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: >-
      github.event.issue.title == 'QUALIFY_RESOURCE_BROKER_GPU_BINDING_HARDENING_20260806' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Mark qualification start
        shell: bash
        run: >-
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY"
          --body "Resource-broker hardening qualification started:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Check out current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable sources and readable payload
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object tsao_computation/execution/resources.py)" = cbe9e0ee0f6713752e746c22b310ce4c79b90b63
          test "$(git hash-object tests/test_acceleration_batch.py)" = 7efb82968ecb6ff56e64af1213945ce98febd46d
          test "$(git hash-object scripts/verify_all.py)" = fb745c2fda306e152918b296cf86878f9f462d30
          test "$(git hash-object README.md)" = e1493380b796b561df8dd47f10c0b02e950bd310
          test "$(git hash-object README.zh-CN.md)" = 618d2f1e5f3013d83bfa7c80f1d4109f6bfaf227
          test "$(git hash-object CHANGELOG.md)" = 1503003a2a5a11fabb23857916f662dda9fa536c
          sha256sum -c <<'EOF'
          78b8bd4dc7f89179299f67fd5976850af6f4779baae76b7aa23f1d57631c1c28  .github/qualification-payload/resource-broker/resource_binding_replacement.txt
          580a75cd540c629b626925e0c7b190b1a6876220ddec66c03c626aebf0cd6784  .github/qualification-payload/resource-broker/test_acceleration_batch_append.txt
          75474398a26870093644ba45a424aa8e143b464aa8206c02fb51af04ff8747f6  .github/qualification-payload/resource-broker/build_resource_broker_evidence.py
          49c0c1bfa1e97b87bee2a511cbd1771ac3f037cbb9e97af5c8216dd71a56c48d  .github/qualification-payload/resource-broker/resource-broker-gpu-binding-evidence.schema.json
          28755a938fa3f53cd412c4e52c2f5b90d192e8036f20b74b81e4d411b0321997  .github/qualification-payload/resource-broker/test_resource_broker_evidence.py
          0999b64a53a4faa29b61f4010fc6ecb362085f94e36e0399bbd5b11153bd4902  .github/qualification-payload/resource-broker/apply.py
          EOF
          python .github/qualification-payload/resource-broker/apply.py
          test ! -e .github/qualification-payload/resource-broker
          test ! -e .github/workflows/qualify-resource-broker-gpu-binding-hardening-once.yml

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip

      - name: Install complete validation toolchain
        run: python -m pip install -e '.[validation,quality,security]'

      - name: Canonicalize code, evidence and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m ruff check --fix tsao_computation scripts tests _bootstrap.py
          python -m ruff format tsao_computation scripts tests _bootstrap.py
          python scripts/build_resource_broker_evidence.py
          python scripts/build_acceleration_audits.py
          python scripts/build_manifest.py
          git diff --check

      - name: Run focused broker and evidence regressions
        run: >-
          python -m pytest -q
          tests/test_acceleration_batch.py
          tests/test_resource_broker_evidence.py

      - name: Run complete deterministic release qualification
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/verify_all.py --profile all
          python scripts/verify_native_core.py
          python scripts/build_resource_broker_evidence.py --check
          python scripts/build_manifest.py --check
          git diff --check
          test ! -e .github/qualification-payload/resource-broker
          test ! -e .github/workflows/qualify-resource-broker-gpu-binding-hardening-once.yml

      - name: Publish by non-forced fast-forward
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          base_sha=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden GPU resource binding admission'
          final_sha=$(git rev-parse HEAD)
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base_sha"
          git push origin HEAD:refs/heads/main
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch and await permanent CI for exact final SHA
        id: permanent_ci
        shell: bash
        env:
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -Eeuo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=""
          for attempt in $(seq 1 90); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --limit 20 \
              --json databaseId,headSha,status,conclusion,event,createdAt)
            run_id=$(RUNS="$runs" FINAL_SHA="$FINAL_SHA" python - <<'PY'
          import json
          import os
          runs = json.loads(os.environ["RUNS"])
          sha = os.environ["FINAL_SHA"]
          matches = [
              item for item in runs
              if item.get("headSha") == sha and item.get("event") == "workflow_dispatch"
          ]
          print(matches[0]["databaseId"] if matches else "")
          PY
            )
            if test -n "$run_id"; then
              status=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
              if test "$status" = completed; then
                conclusion=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
                test "$conclusion" = success
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "permanent CI did not complete for $FINAL_SHA" >&2
          exit 1

      - name: Close qualification issue with immutable evidence
        shell: bash
        env:
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
          CI_RUN_ID: ${{ steps.permanent_ci.outputs.run_id }}
        run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" \
            --reason completed \
            --comment "GPU resource-binding admission was hardened and published directly to main as $FINAL_SHA after focused regressions, full deterministic release qualification, native C ABI verification, reproducible package gates and exact-SHA permanent CI passed. Permanent CI run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID. No branch, pull request, forced update, solver execution, GPU execution or scientific-speedup claim was used."

      - name: Report qualification failure
        if: failure()
        shell: bash
        run: >-
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY"
          --body "Resource-broker hardening qualification failed:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
