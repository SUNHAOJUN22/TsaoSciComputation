name: One-time exact source export

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  export:
    if: ${{ github.event.issue.title == 'TSAO_EXACT_SOURCE_EXPORT_20260805' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Build exact source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.').resolve()
          output = Path('/tmp/TsaoSciComputation-main-exact.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  archive.write(path, path.relative_to(root).as_posix())
          print(output)
          PY
          sha256sum /tmp/TsaoSciComputation-main-exact.zip > /tmp/TsaoSciComputation-main-exact.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TsaoSciComputation-main-exact-${{ github.run_id }}
          path: |
            /tmp/TsaoSciComputation-main-exact.zip
            /tmp/TsaoSciComputation-main-exact.zip.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Report artifact id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_id=''
          for _ in $(seq 1 30); do
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "TsaoSciComputation-main-exact-'"$GITHUB_RUN_ID"'") | .id' | head -n 1)"
            test -n "$artifact_id" && break
            sleep 2
          done
          test -n "$artifact_id"
          gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "SOURCE_EXPORT_READY run_id=$GITHUB_RUN_ID artifact_id=$artifact_id head_sha=$(git rev-parse HEAD)"
