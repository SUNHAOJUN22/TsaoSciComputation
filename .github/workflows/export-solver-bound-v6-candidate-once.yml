name: Export solver-bound V6 candidate once

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  export:
    if: >-
      github.event.issue.title == 'EXPORT_SOLVER_BOUND_V6_CANDIDATE_20260806' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct verified candidate archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import subprocess
          from pathlib import Path

          specs = (
              ('ca588cfddff721bba46ca245bfbb649df7dea369', '.github/payloads/solver-bound-plan-v6-staging/part-00.b64', 4096, '83e4be6bf31c2331fbeb5f5d1122eaa1ec3228cc4715d2d4585624506b9717ab'),
              ('5c9ed6d0d4ae28f864d6a8f1b09996fef4e1fa1c', '.github/payloads/solver-bound-plan-v6-staging/part-01.b64', 4096, '6366fddac254f50d631cc2e384f97041854d3af9f9817255f691054e9d8e4154'),
              ('daa84751e9bc558db209952aeae1b00cf3ee914c', '.github/payloads/solver-bound-plan-v6-repair/g2-00.b64', 4096, 'fddeadc44a1fe4e8c60c514955d529ae59d929e3b32b40c3f46d8fc3b9109235'),
              ('6a10a5d7619f84dae781488f9ce38f412e7e9323', '.github/payloads/solver-bound-plan-v6-repair/g2-01.b64', 4096, 'ae8867604d3e5ed705452c0f8d3f8057c83bd26a8602a126f57e1ca9c54112a8'),
              ('231f983f93ea86da2e57b951684c9db47dab9d47', '.github/payloads/solver-bound-plan-v6-repair/g3-00.b64', 4096, 'c58f98bdec3e5139b68ba95fb044e330d9846bcb66202bd3ee81c5b03d969ca3'),
              ('66a3bacee011d9c136595dea963868591485f42e', '.github/payloads/solver-bound-plan-v6-repair/g3-01.b64', 4096, 'd2830ed46f40011bef22cba1121c4b3dde877f59cd114b08bfa859a1ba66ccc2'),
              ('8b7483ef9b1b27568930655feba293998d67859d', '.github/payloads/solver-bound-plan-v6-repair/g4-00.b64', 4096, 'd34944c53ed86f36cc5461789b31f93757d31557d522b6b23c4e52762434463b'),
              ('74ab5715ef635521af3c9021eaecbe20f0e57b7c', '.github/payloads/solver-bound-plan-v6-repair/g4-01.b64', 949, '6329a8eb71f151ead55e2c974122ab1c829821b9dc2b00f61b1bf2295c4e6f66'),
          )
          chunks = []
          for commit, path, size, expected in specs:
              encoded = subprocess.check_output(('git', 'show', f'{commit}:{path}')).replace(b'\n', b'').replace(b'\r', b'')
              data = base64.b64decode(encoded, validate=True)
              if len(data) != size or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit(f'chunk identity mismatch: {path}')
              chunks.append(data)
          archive = b''.join(chunks)
          if len(archive) != 29621 or hashlib.sha256(archive).hexdigest() != '2a77313de59d58c5b57cfbb7a24958c02f94de4ddd9902f56475d7308f41fcd5':
              raise SystemExit('candidate archive identity mismatch')
          Path('/tmp/solver-bound-v6-candidate.tar.gz').write_bytes(archive)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: solver-bound-v6-candidate-${{ github.run_id }}
          path: /tmp/solver-bound-v6-candidate.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/export-solver-bound-v6-candidate-once.yml
          git commit -m 'Remove one-time V6 candidate export workflow [skip ci]'
          git push origin HEAD:refs/heads/main
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Verified V6 candidate archive exported; sha256=2a77313de59d58c5b57cfbb7a24958c02f94de4ddd9902f56475d7308f41fcd5 run=$GITHUB_RUN_ID"
