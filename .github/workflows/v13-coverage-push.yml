name: V13 coverage push diagnosis

on:
  push:
    paths:
      - .v13-coverage-trigger

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
          cache: pip
      - name: Run exact candidate coverage diagnosis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_v13_coverage_diagnosis.sh
