<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Machine-learned potential active-learning loop</title>
  <desc id="desc">A governed active-learning cycle connecting configuration diversity, reference calculations, model training, uncertainty, molecular dynamics and validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b25"/>
      <stop offset="1" stop-color="#1d2148"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="58" y="72" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">ML potential → active learning → validated dynamics</text>
  <text x="58" y="108" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">Prediction speed never replaces reference quality, uncertainty or out-of-domain checks.</text>

  <circle cx="600" cy="345" r="202" fill="none" stroke="url(#ring)" stroke-width="12" opacity="0.9"/>
  <g filter="url(#shadow)">
    <rect x="485" y="267" width="230" height="156" rx="28" fill="#111f38" stroke="#c4b5fd" stroke-width="3"/>
    <text x="600" y="310" text-anchor="middle" fill="#ddd6fe" font-size="23" font-family="Arial, sans-serif" font-weight="700">Model committee</text>
    <text x="600" y="345" text-anchor="middle" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">energy · force · stress</text>
    <text x="600" y="374" text-anchor="middle" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">calibration + uncertainty</text>
    <text x="600" y="403" text-anchor="middle" fill="#a7f3d0" font-size="15" font-family="Arial, sans-serif" font-weight="700">accept / query / reject</text>
  </g>

  <g transform="translate(76 170)" filter="url(#shadow)">
    <rect width="250" height="128" rx="20" fill="#0e3341" stroke="#22d3ee" stroke-width="2"/>
    <text x="22" y="38" fill="#67e8f9" font-size="20" font-family="Arial, sans-serif" font-weight="700">Configuration space</text>
    <text x="22" y="70" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">phases · defects · strain</text>
    <text x="22" y="96" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">temperature · chemistry</text>
  </g>
  <path d="M326 230 C395 205 430 214 472 262" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(874 170)" filter="url(#shadow)">
    <rect width="250" height="128" rx="20" fill="#2e2046" stroke="#a78bfa" stroke-width="2"/>
    <text x="22" y="38" fill="#c4b5fd" font-size="20" font-family="Arial, sans-serif" font-weight="700">Reference labels</text>
    <text x="22" y="70" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">DFT method + settings</text>
    <text x="22" y="96" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">convergence + provenance</text>
  </g>
  <path d="M728 262 C770 214 805 205 874 230" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(874 410)" filter="url(#shadow)">
    <rect width="250" height="128" rx="20" fill="#12372f" stroke="#34d399" stroke-width="2"/>
    <text x="22" y="38" fill="#6ee7b7" font-size="20" font-family="Arial, sans-serif" font-weight="700">Production dynamics</text>
    <text x="22" y="70" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">MD / sampling / transport</text>
    <text x="22" y="96" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">domain alarms remain active</text>
  </g>
  <path d="M874 475 C805 500 770 491 728 430" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(76 410)" filter="url(#shadow)">
    <rect width="250" height="128" rx="20" fill="#3c2a17" stroke="#f59e0b" stroke-width="2"/>
    <text x="22" y="38" fill="#fde68a" font-size="20" font-family="Arial, sans-serif" font-weight="700">Validation suite</text>
    <text x="22" y="70" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">holdout · invariants · transfer</text>
    <text x="22" y="96" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">error by chemistry and phase</text>
  </g>
  <path d="M472 430 C430 491 395 500 326 475" fill="none" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(438 516)">
    <rect width="324" height="54" rx="16" fill="#3f1721" stroke="#fb7185"/>
    <text x="162" y="34" text-anchor="middle" fill="#fecdd3" font-size="16" font-family="Arial, sans-serif" font-weight="700">High disagreement → new reference query</text>
  </g>
</svg>
