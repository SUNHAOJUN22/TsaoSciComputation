<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" data-design-system="uiux-pro-max-scientific-swiss-v2" data-family="reaction" data-layout="loop">
  <title id="title">Machine learned potential active learning</title>
  <desc id="desc">Reference labels, committee uncertainty, exploration and validation form a bounded active-learning loop.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity="0.18"/></pattern></defs>
  <style>
    .eyebrow { fill: #22C55E; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 32px; font-weight: 700; }
    .subtitle { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 15px; font-weight: 400; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 650; }
    .detail { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; font-weight: 400; }
    .mono { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .gate { fill: #CBD5E1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 650; letter-spacing: 0.5px; }
    .footer { fill: #94A3B8; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 14px; font-weight: 400; }
    .card { fill: #111827; stroke: #334155; stroke-width: 2; }
    .raised { fill: #172033; stroke: #334155; stroke-width: 2; }
    .link { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="680" rx="24" fill="#0B1220"/>
  <rect width="1200" height="680" rx="24" fill="url(#grid)"/>
  <rect x="32" y="28" width="1136" height="624" rx="20" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="56" y="62" class="eyebrow">REACTION · LOOP</text>
  <text x="56" y="108" class="heading">ML potentials and active learning</text>
  <text x="56.0" y="140.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">Model uncertainty controls data acquisition and the permitted simulation domain.</tspan></text>
  <rect x="950" y="48" width="194" height="32" rx="16" fill="#172033" stroke="#334155"/>
  <text x="1047" y="69" text-anchor="middle" class="mono">EVIDENCE-BOUND</text>
  <circle cx="600" cy="344" r="92" class="raised"/><circle cx="600" cy="344" r="72" fill="#0B1220" stroke="#22C55E" stroke-width="3"/><text x="600" y="338" text-anchor="middle" class="mono">EVIDENCE</text><text x="600" y="362" text-anchor="middle" class="mono">FEEDBACK LOOP</text><polygon points="600,202 870,310 766,454 434,454 330,310" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linejoin="round"/><circle cx="600" cy="202" r="76" class="card"/><circle cx="600" cy="164" r="15" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="600" y="169" text-anchor="middle" class="mono">01</text><text x="600.0" y="204.0" text-anchor="middle" class="stage"><tspan x="600.0" dy="0">Labels</tspan></text><text x="600.0" y="240.0" text-anchor="middle" class="detail"><tspan x="600.0" dy="0">reference method</tspan><tspan x="600.0" dy="21">diversity</tspan></text><circle cx="870" cy="310" r="76" class="card"/><circle cx="870" cy="272" r="15" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="870" y="277" text-anchor="middle" class="mono">02</text><text x="870.0" y="312.0" text-anchor="middle" class="stage"><tspan x="870.0" dy="0">Train</tspan></text><text x="870.0" y="348.0" text-anchor="middle" class="detail"><tspan x="870.0" dy="0">split loss</tspan><tspan x="870.0" dy="21">regularize</tspan></text><circle cx="766" cy="454" r="76" class="card"/><circle cx="766" cy="416" r="15" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="766" y="421" text-anchor="middle" class="mono">03</text><text x="766.0" y="456.0" text-anchor="middle" class="stage"><tspan x="766.0" dy="0">Committee</tspan></text><text x="766.0" y="492.0" text-anchor="middle" class="detail"><tspan x="766.0" dy="0">disagreement alarm</tspan></text><circle cx="434" cy="454" r="76" class="card"/><circle cx="434" cy="416" r="15" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="434" y="421" text-anchor="middle" class="mono">04</text><text x="434.0" y="456.0" text-anchor="middle" class="stage"><tspan x="434.0" dy="0">Explore</tspan></text><text x="434.0" y="492.0" text-anchor="middle" class="detail"><tspan x="434.0" dy="0">sample query</tspan><tspan x="434.0" dy="21">enrich</tspan></text><circle cx="330" cy="310" r="76" class="card"/><circle cx="330" cy="272" r="15" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="330" y="277" text-anchor="middle" class="mono">05</text><text x="330.0" y="312.0" text-anchor="middle" class="stage"><tspan x="330.0" dy="0">Accept</tspan></text><text x="330.0" y="348.0" text-anchor="middle" class="detail"><tspan x="330.0" dy="0">forces dynamics</tspan><tspan x="330.0" dy="21">domain</tspan></text>
  <rect x="48" y="516" width="1104" height="72" rx="16" class="raised"/><circle cx="58" cy="552" r="9" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="74" y="557" class="gate">NUMERICAL</text><circle cx="232" cy="552" r="9" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="248" y="557" class="gate">CONVERGENCE</text><circle cx="406" cy="552" r="9" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="422" y="557" class="gate">PHYSICAL</text><circle cx="580" cy="552" r="9" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="596" y="557" class="gate">UNCERTAINTY</text><circle cx="754" cy="552" r="9" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="770" y="557" class="gate">APPLICABILITY</text><circle cx="928" cy="552" r="9" fill="#0B1220" stroke="#22C55E" stroke-width="2"/><text x="944" y="557" class="gate">REVIEW</text>
  <text x="56.0" y="624.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">Low test error alone cannot authorize extrapolative dynamics.</tspan></text>
</svg>
