<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Polymer morphology to industrial process workflow</title><desc id="d">A polymer chain, lamellar morphology, continuum field and process plant connected by scale-aware handoffs.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07141e"/><stop offset="1" stop-color="#24152b"/></linearGradient><linearGradient id="p" x2="1"><stop stop-color="#31d7c5"/><stop offset="0.5" stop-color="#778cff"/><stop offset="1" stop-color="#ff7fb6"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8798bf"/></marker></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="57" text-anchor="middle" fill="#f7f7ff" font-size="31" font-weight="700">Polymer Structure → Morphology → Field → Process</text><text x="600" y="87" text-anchor="middle" fill="#aab0ca" font-size="16">Multiscale transfer with explicit state variables and model boundaries</text><g stroke="#8798bf" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M272 305H382"/><path d="M552 305H662"/><path d="M832 305H942"/></g><g text-anchor="middle"><g transform="translate(175 305)"><rect x="-95" y="-105" width="190" height="210" rx="24" fill="#0c2530" stroke="#35d7c5" stroke-width="2"/><path d="M-65 35C-38-70-10 82 18-35S55 48 70-58" fill="none" stroke="#78f2df" stroke-width="7" stroke-linecap="round"/><g fill="#d9fff8"><circle cx="-65" cy="35" r="7"/><circle cx="-38" cy="-20" r="7"/><circle cx="-10" cy="40" r="7"/><circle cx="18" cy="-35" r="7"/><circle cx="48" cy="15" r="7"/><circle cx="70" cy="-58" r="7"/></g><text y="142" fill="#eafffb" font-size="20" font-weight="700">CHAIN &amp; SEQUENCE</text><text y="168" fill="#98bcb5" font-size="14">chemistry · topology · tacticity</text></g><g transform="translate(467 305)"><rect x="-95" y="-105" width="190" height="210" rx="24" fill="#101f38" stroke="#678fff" stroke-width="2"/><g fill="#83a4ff" opacity="0.9"><rect x="-65" y="-58" width="130" height="12" rx="6"/><rect x="-58" y="-28" width="116" height="12" rx="6"/><rect x="-72" y="2" width="144" height="12" rx="6"/><rect x="-53" y="32" width="106" height="12" rx="6"/></g><path d="M-68 62C-35 42-10 82 18 56S53 78 70 60" fill="none" stroke="#c2d0ff" stroke-width="4"/><text y="142" fill="#edf2ff" font-size="20" font-weight="700">MORPHOLOGY</text><text y="168" fill="#9dadca" font-size="14">lamellae · phases · interfaces</text></g><g transform="translate(747 305)"><rect x="-95" y="-105" width="190" height="210" rx="24" fill="#191b38" stroke="#9b80ff" stroke-width="2"/><g fill="none" stroke="#bca8ff"><path d="M-70 60C-45 20-20 15 0-10S40-40 70-62" stroke-width="5"/><path d="M-70 20C-35 35-20 5 0 10S37 35 70 18" stroke-width="3"/><path d="M-70-35C-40-58-20-28 0-42S40-20 70-38" stroke-width="3"/></g><g fill="#e5ddff"><circle cx="-48" cy="27" r="6"/><circle cx="0" cy="-10" r="6"/><circle cx="43" cy="-43" r="6"/></g><text y="142" fill="#f4efff" font-size="20" font-weight="700">CONTINUUM FIELD</text><text y="168" fill="#afa6c3" font-size="14">thermal · mechanical · electrical</text></g><g transform="translate(1027 305)"><rect x="-95" y="-105" width="190" height="210" rx="24" fill="#29182e" stroke="#f079b5" stroke-width="2"/><path d="M-67 65V8H-44V-32H-20V-8H7V-58H31V-20H63V65Z" fill="none" stroke="#ffafd3" stroke-width="5"/><path d="M-75 65H76" stroke="#ffafd3" stroke-width="5"/><circle cx="-20" cy="-8" r="7" fill="#ffd6e8"/><circle cx="31" cy="-20" r="7" fill="#ffd6e8"/><text y="142" fill="#fff0f7" font-size="20" font-weight="700">PROCESS SYSTEM</text><text y="168" fill="#c8a4b5" font-size="14">reactor · extrusion · operation</text></g></g><rect x="180" y="520" width="840" height="56" rx="16" fill="#0d1a2a" stroke="url(#p)"/><text x="600" y="545" text-anchor="middle" fill="#f1f3ff" font-size="16" font-wei