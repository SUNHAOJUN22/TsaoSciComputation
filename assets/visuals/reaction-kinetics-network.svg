<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Reaction pathways and kinetic-network validation</title>
  <desc id="desc">A reaction-engineering diagram linking stationary points, transition states, rate estimates, network reduction, reactor balances and evidence gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1728"/>
      <stop offset="1" stop-color="#2b173e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="58" y="72" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">Reaction pathway → kinetic network → reactor evidence</text>
  <text x="58" y="108" fill="#a5b4fc" font-size="18" font-family="Arial, sans-serif">No rate constant is promoted without stationary-point, barrier and applicability evidence.</text>

  <g transform="translate(70 170)" filter="url(#shadow)">
    <circle cx="90" cy="90" r="64" fill="#12324a" stroke="#22d3ee" stroke-width="3"/>
    <text x="90" y="83" text-anchor="middle" fill="#67e8f9" font-size="20" font-family="Arial, sans-serif" font-weight="700">Reactant</text>
    <text x="90" y="111" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">minimum + modes</text>
  </g>
  <path d="M225 260 C290 145 355 145 420 260" fill="none" stroke="#f59e0b" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(390 140)" filter="url(#shadow)">
    <rect width="210" height="150" rx="22" fill="#3a2446" stroke="#f59e0b" stroke-width="3"/>
    <text x="105" y="42" text-anchor="middle" fill="#fcd34d" font-size="20" font-family="Arial, sans-serif" font-weight="700">Transition state</text>
    <text x="105" y="78" text-anchor="middle" fill="#f8fafc" font-size="15" font-family="Arial, sans-serif">one imaginary mode</text>
    <text x="105" y="105" text-anchor="middle" fill="#f8fafc" font-size="15" font-family="Arial, sans-serif">IRC connectivity</text>
    <text x="105" y="132" text-anchor="middle" fill="#f8fafc" font-size="15" font-family="Arial, sans-serif">barrier convergence</text>
  </g>
  <path d="M610 260 C675 145 740 145 805 260" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrow)"/>
  <g transform="translate(790 170)" filter="url(#shadow)">
    <circle cx="90" cy="90" r="64" fill="#12372f" stroke="#34d399" stroke-width="3"/>
    <text x="90" y="83" text-anchor="middle" fill="#6ee7b7" font-size="20" font-family="Arial, sans-serif" font-weight="700">Product</text>
    <text x="90" y="111" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">minimum + balance</text>
  </g>
  <path d="M950 260 H1070" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(1060 190)" filter="url(#shadow)">
    <rect width="100" height="140" rx="18" fill="#1f2a44" stroke="#a78bfa" stroke-width="2"/>
    <text x="50" y="43" text-anchor="middle" fill="#c4b5fd" font-size="16" font-family="Arial, sans-serif" font-weight="700">k(T,p)</text>
    <text x="50" y="75" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">TST</text>
    <text x="50" y="99" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">tunnel</text>
    <text x="50" y="123" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">falloff</text>
  </g>

  <g transform="translate(70 390)">
    <rect width="1060" height="160" rx="24" fill="#0f2139" stroke="#475569" stroke-width="2"/>
    <text x="28" y="38" fill="#f8fafc" font-size="21" font-family="Arial, sans-serif" font-weight="700">Network and reactor acceptance</text>
    <g transform="translate(30 62)">
      <rect width="180" height="68" rx="14" fill="#172554" stroke="#60a5fa"/>
      <text x="90" y="29" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="Arial, sans-serif" font-weight="700">Microkinetic graph</text>
      <text x="90" y="51" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">species + elementary steps</text>
    </g>
    <path d="M220 96 H272" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(285 62)">
      <rect width="180" height="68" rx="14" fill="#312e81" stroke="#a78bfa"/>
      <text x="90" y="29" text-anchor="middle" fill="#ddd6fe" font-size="15" font-family="Arial, sans-serif" font-weight="700">Sensitivity</text>
      <text x="90" y="51" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">rate control + reduction</text>
    </g>
    <path d="M475 96 H527" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(540 62)">
      <rect width="180" height="68" rx="14" fill="#3f2b18" stroke="#f59e0b"/>
      <text x="90" y="29" text-anchor="middle" fill="#fde68a" font-size="15" font-family="Arial, sans-serif" font-weight="700">Reactor balance</text>
      <text x="90" y="51" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">mass + energy closure</text>
    </g>
    <path d="M730 96 H782" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(795 62)">
      <rect width="230" height="68" rx="14" fill="#12372f" stroke="#34d399"/>
      <text x="115" y="29" text-anchor="middle" fill="#a7f3d0" font-size="15" font-family="Arial, sans-serif" font-weight="700">Accept with domain limits</text>
      <text x="115" y="51" text-anchor="middle" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">or reject incomplete evidence</text>
    </g>
  </g>
</svg>
