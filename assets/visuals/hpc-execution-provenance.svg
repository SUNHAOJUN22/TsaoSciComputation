<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HPC execution and provenance boundary</title>
  <desc id="desc">A secure execution diagram separating contract validation, environment preflight, scheduler submission, isolated execution, artifact hashing and evidence review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081424"/>
      <stop offset="1" stop-color="#22204a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="58" y="72" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">Bounded execution → immutable provenance → reviewed evidence</text>
  <text x="58" y="108" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">The orchestrator records and validates execution; it does not impersonate an HPC platform.</text>

  <g transform="translate(55 165)" filter="url(#shadow)">
    <rect width="190" height="150" rx="20" fill="#10273e" stroke="#22d3ee" stroke-width="2"/>
    <text x="95" y="38" text-anchor="middle" fill="#67e8f9" font-size="19" font-family="Arial, sans-serif" font-weight="700">Contract</text>
    <text x="22" y="72" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">argv only</text>
    <text x="22" y="98" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">path confinement</text>
    <text x="22" y="124" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">resource bounds</text>
  </g>
  <path d="M255 240 H305" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(317 165)" filter="url(#shadow)">
    <rect width="190" height="150" rx="20" fill="#162345" stroke="#a78bfa" stroke-width="2"/>
    <text x="95" y="38" text-anchor="middle" fill="#c4b5fd" font-size="19" font-family="Arial, sans-serif" font-weight="700">Preflight</text>
    <text x="22" y="72" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">binary + module</text>
    <text x="22" y="98" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">license boundary</text>
    <text x="22" y="124" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">version snapshot</text>
  </g>
  <path d="M517 240 H567" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(579 165)" filter="url(#shadow)">
    <rect width="190" height="150" rx="20" fill="#3b2a17" stroke="#f59e0b" stroke-width="2"/>
    <text x="95" y="38" text-anchor="middle" fill="#fde68a" font-size="19" font-family="Arial, sans-serif" font-weight="700">Scheduler</text>
    <text x="22" y="72" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">queue + allocation</text>
    <text x="22" y="98" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">timeout + cancel</text>
    <text x="22" y="124" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">job identity</text>
  </g>
  <path d="M779 240 H829" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(841 165)" filter="url(#shadow)">
    <rect width="190" height="150" rx="20" fill="#12372f" stroke="#34d399" stroke-width="2"/>
    <text x="95" y="38" text-anchor="middle" fill="#6ee7b7" font-size="19" font-family="Arial, sans-serif" font-weight="700">Execution</text>
    <text x="22" y="72" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">isolated workdir</text>
    <text x="22" y="98" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">stdout + stderr</text>
    <text x="22" y="124" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">exit + convergence</text>
  </g>
  <path d="M1041 240 H1091" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1095 180)" filter="url(#shadow)">
    <rect width="70" height="120" rx="18" fill="#3f1721" stroke="#fb7185" stroke-width="2"/>
    <text x="35" y="38" text-anchor="middle" fill="#fecdd3" font-size="13" font-family="Arial, sans-serif" font-weight="700">FAIL</text>
    <text x="35" y="64" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="Arial, sans-serif">closed</text>
    <text x="35" y="91" text-anchor="middle" fill="#a7f3d0" font-size="13" font-family="Arial, sans-serif" font-weight="700">PASS</text>
  </g>

  <g transform="translate(70 385)">
    <rect width="1060" height="155" rx="24" fill="#101d33" stroke="#475569" stroke-width="2"/>
    <text x="28" y="38" fill="#f8fafc" font-size="21" font-family="Arial, sans-serif" font-weight="700">Provenance ledger</text>
    <g transform="translate(28 60)">
      <rect width="180" height="64" rx="14" fill="#172554" stroke="#60a5fa"/>
      <text x="90" y="27" text-anchor="middle" fill="#bfdbfe" font-size="14" font-family="Arial, sans-serif" font-weight="700">Inputs + environment</text>
      <text x="90" y="48" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">units · versions · seeds</text>
    </g>
    <path d="M218 92 H258" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(270 60)">
      <rect width="180" height="64" rx="14" fill="#312e81" stroke="#a78bfa"/>
      <text x="90" y="27" text-anchor="middle" fill="#ddd6fe" font-size="14" font-family="Arial, sans-serif" font-weight="700">Raw artifacts</text>
      <text x="90" y="48" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">logs · trajectories · fields</text>
    </g>
    <path d="M460 92 H500" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(512 60)">
      <rect width="180" height="64" rx="14" fill="#3f2a17" stroke="#f59e0b"/>
      <text x="90" y="27" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Arial, sans-serif" font-weight="700">Hashes + manifest</text>
      <text x="90" y="48" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">SHA-256 · lineage</text>
    </g>
    <path d="M702 92 H742" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(754 60)">
      <rect width="270" height="64" rx="14" fill="#12372f" stroke="#34d399"/>
      <text x="135" y="27" text-anchor="middle" fill="#a7f3d0" font-size="14" font-family="Arial, sans-serif" font-weight="700">Validation + human review</text>
      <text x="135" y="48" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">evidence decides acceptance</text>
    </g>
  </g>
</svg>
