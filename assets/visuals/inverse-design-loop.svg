<text x="530" y="405" text-anchor="middle" fill="#cffafe" font-size="17">constraints • priors • diversity</text>
<rect x="760" y="130" width="380" height="335" rx="28" fill="#1c2e3b" stroke="#34d399"/><text x="950" y="176" text-anchor="middle" fill="#ecfdf5" font-size="25" font-weight="700">Simulation &amp; Pareto evidence</text>
<line x1="805" y1="405" x2="1095" y2="405" stroke="#64748b"/><line x1="805" y1="405" x2="805" y2="220" stroke="#64748b"/>
