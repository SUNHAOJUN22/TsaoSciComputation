<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Inverse design and multi-objective optimization loop</title>
<desc id="desc">A governed inverse-design cycle connecting target properties, constrained candidate generation, multi-fidelity simulation, Pareto filtering, uncertainty, validation, and human decision gates.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10142d"/><stop offset="1" stop-color="#0d4a3f"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#93c5fd"/></marker></defs>
<rect width="1200" height="620" rx="30" fill="url(#bg)"/>
<text x="58" y="62" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Inverse Design — Search Without Skipping Evidence</text>
<text x="58" y="96" fill="#a7f3d0" font-family="Arial" font-size="18">targets → candidates → multi-fidelity simulation → Pareto set → validation → authorized choice</text>
<g font-family="Arial">
<circle cx="205" cy="295" r="118" fill="#1e3a8a" stroke="#93c5fd" stroke-width="3"/><text x="205" y="270" text-anchor="middle" fill="#eff6ff" font-size="25" font-weight="700">Target space</text><text x="205" y="310" text-anchor="middle" fill="#dbeafe" font-size="17">performance</text><text x="205" y="338" text-anchor="middle" fill="#dbeafe" font-size="17">cost • safety • process</text>
<rect x="390" y="155" width="280" height="280" rx="30" fill="#13364b" stroke="#22d3ee"/><text x="530" y="200" text-anchor="middle" fill="#ecfeff" font-size="25" font-weight="700">Candidate engine</text>
