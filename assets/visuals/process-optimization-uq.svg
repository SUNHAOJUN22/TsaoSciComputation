<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" data-design-system="uiux-pro-max-scientific-swiss-v2" data-family="process" data-layout="workflow">
  <title id="title">Process optimization and uncertainty workflow</title>
  <desc id="desc">Flowsheet construction, calibration, uncertainty, constrained optimization and human authorization are separated.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity="0.18"/></pattern></defs>
  <style>
    .eyebrow { fill: #F59E0B; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 32px; font-weight: 700; }
    .subtitle { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 15px; font-weight: 400; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 650; }
    .detail { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; font-weight: 400; }
    .mono { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .gate { fill: #CBD5E1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 650; letter-spacing: 0.5px; }
    .footer { fill: #94A3B8; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 14px; font-weight: 400; }
    .card { fill: #111827; stroke: #334155; stroke-width: 2; }
    .raised { fill: #172033; stroke: #334155; stroke-width: 2; }
    .link { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="680" rx="24" fill="#0B1220"/>
  <rect width="1200" height="680" rx="24" fill="url(#grid)"/>
  <rect x="32" y="28" width="1136" height="624" rx="20" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="56" y="62" class="eyebrow">PROCESS · WORKFLOW</text>
  <text x="56" y="108" class="heading">Process optimization with UQ</text>
  <text x="56.0" y="140.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">A numerical optimum must survive feasibility, uncertainty and safety review.</tspan></text>
  <rect x="950" y="48" width="194" height="32" rx="16" fill="#172033" stroke="#334155"/>
  <text x="1047" y="69" text-anchor="middle" class="mono">EVIDENCE-BOUND</text>
  <path d="M90 350H1110" class="link"/><path d="M112 350V332" class="link"/><circle cx="112" cy="350" r="11" fill="#0B1220" stroke="#F59E0B" stroke-width="3"/><rect x="20" y="190" width="184" height="142" rx="16" class="card"/><rect x="20" y="190" width="6" height="142" rx="3" fill="#F59E0B"/><text x="40" y="220" class="mono">01</text><text x="40.0" y="252.0" text-anchor="start" class="stage"><tspan x="40.0" dy="0">Flowsheet</tspan></text><text x="40.0" y="288.0" text-anchor="start" class="detail"><tspan x="40.0" dy="0">units properties</tspan><tspan x="40.0" dy="21">recycle</tspan></text><path d="M330 350V354" class="link"/><circle cx="330" cy="350" r="11" fill="#0B1220" stroke="#F59E0B" stroke-width="3"/><rect x="238" y="354" width="184" height="142" rx="16" class="card"/><rect x="238" y="354" width="6" height="142" rx="3" fill="#F59E0B"/><text x="258" y="384" class="mono">02</text><text x="258.0" y="416.0" text-anchor="start" class="stage"><tspan x="258.0" dy="0">Calibrate</tspan></text><text x="258.0" y="452.0" text-anchor="start" class="detail"><tspan x="258.0" dy="0">data discrepancy</tspan></text><path d="M548 350V332" class="link"/><circle cx="548" cy="350" r="11" fill="#0B1220" stroke="#F59E0B" stroke-width="3"/><rect x="456" y="190" width="184" height="142" rx="16" class="card"/><rect x="456" y="190" width="6" height="142" rx="3" fill="#F59E0B"/><text x="476" y="220" class="mono">03</text><text x="476.0" y="252.0" text-anchor="start" class="stage"><tspan x="476.0" dy="0">Uncertainty</tspan></text><text x="476.0" y="288.0" text-anchor="start" class="detail"><tspan x="476.0" dy="0">inputs propagation</tspan></text><path d="M766 350V354" class="link"/><circle cx="766" cy="350" r="11" fill="#0B1220" stroke="#F59E0B" stroke-width="3"/><rect x="674" y="354" width="184" height="142" rx="16" class="card"/><rect x="674" y="354" width="6" height="142" rx="3" fill="#F59E0B"/><text x="694" y="384" class="mono">04</text><text x="694.0" y="416.0" text-anchor="start" class="stage"><tspan x="694.0" dy="0">Optimize</tspan></text><text x="694.0" y="452.0" text-anchor="start" class="detail"><tspan x="694.0" dy="0">constraints Pareto</tspan></text><path d="M984 350V332" class="link"/><circle cx="984" cy="350" r="11" fill="#0B1220" stroke="#F59E0B" stroke-width="3"/><rect x="892" y="190" width="184" height="142" rx="16" class="card"/><rect x="892" y="190" width="6" height="142" rx="3" fill="#F59E0B"/><text x="912" y="220" class="mono">05</text><text x="912.0" y="252.0" text-anchor="start" class="stage"><tspan x="912.0" dy="0">Authorize</tspan></text><text x="912.0" y="288.0" text-anchor="start" class="detail"><tspan x="912.0" dy="0">safety applicability</tspan></text>
  <rect x="48" y="516" width="1104" height="72" rx="16" class="raised"/><circle cx="58" cy="552" r="9" fill="#0B1220" stroke="#F59E0B" stroke-width="2"/><text x="74" y="557" class="gate">NUMERICAL</text><circle cx="232" cy="552" r="9" fill="#0B1220" stroke="#F59E0B" stroke-width="2"/><text x="248" y="557" class="gate">CONVERGENCE</text><circle cx="406" cy="552" r="9" fill="#0B1220" stroke="#F59E0B" stroke-width="2"/><text x="422" y="557" class="gate">PHYSICAL</text><circle cx="580" cy="552" r="9" fill="#0B1220" stroke="#F59E0B" stroke-width="2"/><text x="596" y="557" class="gate">UNCERTAINTY</text><circle cx="754" cy="552" r="9" fill="#0B1220" stroke="#F59E0B" stroke-width="2"/><text x="770" y="557" class="gate">APPLICABILITY</text><circle cx="928" cy="552" r="9" fill="#0B1220" stroke="#F59E0B" stroke-width="2"/><text x="944" y="557" class="gate">REVIEW</text>
  <text x="56.0" y="620.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">Optimization output remains a candidate until qualified engineering review.</tspan></text>
</svg>
