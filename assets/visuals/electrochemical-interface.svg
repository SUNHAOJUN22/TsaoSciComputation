<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Electrochemical interface and transport workflow</title>
<desc id="desc">A scientific workflow connecting electrode structure, electrolyte species, interfacial charge transfer, transport, observables, uncertainty, and acceptance gates.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#123d50"/></linearGradient>
  <linearGradient id="elec" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8da2b8"/><stop offset="1" stop-color="#40556c"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="620" rx="30" fill="url(#bg)"/>
<text x="60" y="64" fill="#f8fafc" font-size="34" font-family="Arial" font-weight="700">Electrochemical Interface — Evidence Before Acceptance</text>
<text x="60" y="98" fill="#bae6fd" font-size="18" font-family="Arial">structure → double layer → charge transfer → transport → observable → reviewed decision</text>
<g filter="url(#shadow)">
  <rect x="55" y="135" width="235" height="350" rx="22" fill="url(#elec)" stroke="#cbd5e1"/>
  <text x="82" y="180" fill="#fff" font-size="25" font-family="Arial" font-weight="700">Electrode</text>
  <path d="M82 220 H260 M82 270 H260 M82 320 H260 M82 370 H260" stroke="#dbeafe" stroke-width="7" opacity=".75"/>
  <circle cx="105" cy="220" r="9" fill="#fbbf24"/><circle cx="185" cy="270" r="9" fill="#fbbf24"/><circle cx="238" cy="370" r="9" fill="#fbbf24"/>
  <text x="82" y="430" fill="#e2e8f0" font-size="17" font-family="Arial">surface state</text><text x="82" y="456" fill="#e2e8f0" font-size="17" font-family="Arial">potential • defects</text>
</g>
<g>
  <rect x="330" y="135" width="280" height="350" rx="22" fill="#0f2d3e" stroke="#38bdf8"/>
  <text x="355" y="180" fill="#e0f2fe" font-size="25" font-family="Arial" font-weight="700">Interface</text>
  <path d="M370 225 C430 180 505 265 565 215" fill="none" stroke="#f472b6" stroke-width="5"/>
  <circle cx="385" cy="260" r="18" fill="#60a5fa"/><circle cx="455" cy="315" r="16" fill="#f97316"/><circle cx="540" cy="270" r="18" fill="#60a5fa"/>
  <circle cx="415" cy="380" r="15" fill="#a78bfa"/><circle cx="520" cy="390" r="15" fill="#a78bfa"/>
  <path d="M405 248 C430 225 455 220 480 250" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="355" y="430" fill="#bae6fd" font-size="17" font-family="Arial">double layer • solvation</text><text x="355" y="456" fill="#bae6fd" font-size="17" font-family="Arial">electron / ion transfer</text>
</g>
<g>
  <rect x="650" y="135" width="495" height="350" rx="22" fill="#0b2234" stroke="#22d3ee"/>
  <text x="680" y="180" fill="#ecfeff" font-size="25" font-family="Arial" font-weight="700">Transport &amp; measurable evidence</text>
  <path d="M700 245 C780 165 850 350 930 245 S1080 270 1100 225" fill="none" stroke="#34d399" stroke-width="6"/>
  <path d="M700 330 C770 370 850 280 920 330 S1040 380 1100 315" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <line x1="700" y1="405" x2="1100" y2="405" stroke="#64748b" stroke-width="2"/>
  <text x="700" y="440" fill="#cffafe" font-size="17" font-family="Arial">current • impedance • concentration • heat</text>
  <text x="700" y="468" fill="#fef3c7" font-size="17" font-family="Arial">conservation • uncertainty • applicability</text>
</g>
<g font-family="Arial" font-size="17" text-anchor="middle">
  <rect x="120" y="525" width="210" height="56" rx="18" fill="#164e63" stroke="#67e8f9"/><text x="225" y="559" fill="#ecfeff">Converged?</text>
  <rect x="385" y="525" width="210" height="56" rx="18" fill="#4c1d5f" stroke="#f0abfc"/><text x="490" y="559" fill="#fae8ff">Physically valid?</text>
  <rect x="650" y="525" width="210" height="56" rx="18" fill="#713f12" stroke="#fcd34d"/><text x="755" y="559" fill="#fef3c7">Uncertainty bounded?</text>
  <rect x="915" y="525" width="210" height="56" rx="18" fill="#14532d" stroke="#86efac"/><text x="1020" y="559" fill="#f0fdf4">Expert acceptance</text>
</g>
</svg>