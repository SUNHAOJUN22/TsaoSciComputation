<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Scientific evidence validation loop</title><desc id="d">A circular validation system from contract to execution, parsing, convergence, physical validation, uncertainty, applicability and acceptance.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#17152f"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="0.36" stop-color="#4ea5ff"/><stop offset="0.7" stop-color="#a77cff"/><stop offset="1" stop-color="#ff7fb7"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="55" text-anchor="middle" fill="#f6f7ff" font-size="31" font-weight="700">Evidence-Bound Scientific Acceptance Loop</text><text x="600" y="85" text-anchor="middle" fill="#9eacc6" font-size="16">Execution success is only the beginning of validation.</text><circle cx="600" cy="335" r="194" fill="#0b172a" stroke="url(#ring)" stroke-width="5" filter="url(#glow)"/><circle cx="600" cy="335" r="124" fill="#101a31" stroke="#506487" stroke-dasharray="5 8"/><text x="600" y="320" text-anchor="middle" fill="#f6f8ff" font-size="26" font-weight="800">SCIENTIFIC</text><text x="600" y="353" text-anchor="middle" fill="#f6f8ff" font-size="26" font-weight="800">ACCEPTANCE</text><text x="600" y="384" text-anchor="middle" fill="#9fb0ce" font-size="14">claim + evidence + boundary</text><g text-anchor="middle" font-size="16" font-weight="700"><g transform="translate(600 118)"><circle r="49" fill="#0d2930" stroke="#2dd4bf" stroke-width="2"/><text y="5" fill="#dffefa">CONTRACT</text></g><g transform="translate(790 195)"><circle r="49" fill="#10243a" stroke="#43b8f5" stroke-width="2"/><text y="5" fill="#e3f6ff">PREFLIGHT</text></g><g transform="translate(850 386)"><circle r="49" fill="#14203c" stroke="#628fff" stroke-width="2"/><text y="5" fill="#ebf0ff">EXECUTE</text></g><g transform="translate(725 545)"><circle r="49" fill="#1a1b3a" stroke="#8b7dff" stroke-width="2"/><text y="5" fill="#f0edff">PARSE</text></g><g transform="translate(475 545)"><circle r="49" fill="#211938" stroke="#b27cff" stroke-width="2"/><text y="5" fill="#f7edff">CONVERGE</text></g><g transform="translate(350 386)"><circle r="49" fill="#281833" stroke="#d779d3" stroke-width="2"/><text y="5" fill="#fff0fb">PHYSICS</text></g><g transform="translate(410 195)"><circle r="49" fill="#2c182e" stroke="#f07ab8" stroke-width="2"/><text y="-5" fill="#fff0f8">UNCERTAINTY</text><text y="15" fill="#fff0f8">&amp; DOMAIN</text></g></g><g fill="none" stroke="#8193ba" stroke-width="2"><path d="M646 130C704 144 744 163 765 177"/><path d="M827 238C849 282 857 325 854 342"/><path d="M823 429C796 474 764 507 746 522"/><path d="M677 555C617 573 556 573 523 555"/><path d="M432 522C398 491 372 454 360 431"/><path d="M345 342C341 292 354 244 378 211"/><path d="M452 163C501 136 548 124 554 124"/></g><rect x="253" y="102" width="694" height="492" rx="30" fill="none" stroke="#7f91b1" stroke-opacity="0.18"/><text x="600" y="604" text-anchor="middle" fill="#9faec8" font-size="13">Any missing gate returns the result to an earlier state; no silent promotion is allowed.</text></g></svg>