<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Scientific engine ecosystem</title><desc id="d">A central orchestration registry connects quantum chemistry, molecular simulation, continuum physics, reaction engineering, process simulation and AI potentials.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#17142d"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#5d8cff"/><stop offset="1" stop-color="#c17df5"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="650" rx="26" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="55" text-anchor="middle" fill="#f6f7ff" font-size="31" font-weight="700">One Orchestration Layer, Many Scientific Engines</text><text x="600" y="85" text-anchor="middle" fill="#9fadc7" font-size="16">Adapters declare capabilities and limits; they do not impersonate external solvers.</text><g stroke="#7186aa" stroke-width="2" stroke-opacity="0.72"><path d="M600 320L250 175"/><path d="M600 320L180 330"/><path d="M600 320L290 500"/><path d="M600 320L910 500"/><path d="M600 320L1020 330"/><path d="M600 320L950 175"/></g><g transform="translate(600 320)"><circle r="135" fill="#0d182e" stroke="url(#c)" stroke-width="5" filter="url(#g)"/><circle r="94" fill="none" stroke="#6f83a7" stroke-dasharray="5 9"/><text y="-16" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">27 ADAPTERS</text><text y="18" text-anchor="middle" fill="#e7edff" font-size="18" font-weight="700">164 CAPABILITIES</text><text y="49" text-anchor="middle" fill="#aab7cf" font-size="15">20 governed workflows</text></g><g text-anchor="middle"><g transform="translate(250 175)"><rect x="-125" y="-62" width="250" height="124" rx="18" fill="#0c2530" stroke="#2dd4bf" stroke-width="2"/><text y="-16" fill="#e6fffb" font-size="20" font-weight="700">Quantum Chemistry</text><text y="14" fill="#9ebdb8" font-size="14">Gaussian · ORCA · PySCF</text><text y="38" fill="#9ebdb8" font-size="14">QE · CP2K · GPAW · VASP</text></g><g transform="translate(180 330)"><rect x="-125" y="-62" width="250" height="124" rx="18" fill="#10213a" stroke="#4da7ff" stroke-width="2"/><text y="-16" fill="#eaf5ff" font-size="20" font-weight="700">Molecular Simulation</text><text y="14" fill="#9caec7" font-size="14">LAMMPS · GROMACS · OpenMM</text><text y="38" fill="#9caec7" font-size="14">PLUMED · DeepMD · MACE</text></g><g transform="translate(290 500)"><rect x="-125" y="-62" width="250" height="124" rx="18" fill="#171d39" stroke="#7c8eff" stroke-width="2"/><text y="-16" fill="#eef0ff" font-size="20" font-weight="700">Continuum Physics</text><text y="14" fill="#a6acc7" font-size="14">OpenFOAM · SU2 · Elmer</text><text y="38" fill="#a6acc7" font-size="14">MOOSE · DOLFINx · Kratos</text></g><g transform="translate(910 500)"><rect x="-125" y="-62" width="250" height="124" rx="18" fill="#211938" stroke="#aa7fff" stroke-width="2"/><text y="-16" fill="#f6efff" font-size="20" font-weight="700">Reaction Engineering</text><text y="14" fill="#b3a7c5" font-size="14">Cantera · RMG</text><text y="38" fill="#b3a7c5" font-size="14">kinetics · transport · reactors</text></g><g transform="translate(1020 330)"><rect x="-125" y="-62" width="250" height="124" rx="18" fill="#281832" stroke="#d776d0" stroke-width="2"/><text y="-16" fill="#fff0fb" font-size="20" font-weight="700">Process Simulation</text><text y="14" fill="#c3a7bd" font-size="14">Aspen · DWSIM · IDAES</text><text y="38" fill="#c3a7bd" font-size="14">OpenModelica · optimization</text></g><g transform="translate(950 175)"><rect x="-125" y="-62" width="250" height="124" rx="18" fill="#2c182c" stroke="#f079b6" stroke-width="2"/><text y="-16" fill="#fff0f7" font-size="20" font-weight="700">AI &amp; Data Bridges</text><text y="14" fill="#c8a7b8" font-size="14">surrogates · active learning</text><text y="38" fill="#c8a7b8" font-size="14">provenance · uncertainty</text></g></g><text x="600" y="625" text-anchor="middle" fill="#98a8c2" font-size="13">Availability requires declared executables and modules; live solver execution is never inferred from metadata.</text></g></svg>