<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Scientific agent orchestration</title><desc id="desc">An AI scientific agent coordinating contracts, registries, solvers, validators, evidence and human review.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071523"/><stop offset="1" stop-color="#151432"/></linearGradient><linearGradient id="core" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset="0.52" stop-color="#6385ff"/><stop offset="1" stop-color="#c084fc"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7997c9"/></marker></defs>
<rect width="1200" height="680" rx="26" fill="url(#bg)"/><g fill="none" stroke="#7997c9" stroke-width="2" stroke-opacity="0.65" marker-end="url(#a)"><path d="M350 180C460 180 465 260 515 290"/><path d="M350 340H490"/><path d="M350 500C460 500 465 420 515 390"/><path d="M850 180C740 180 735 260 685 290"/><path d="M850 340H710"/><path d="M850 500C740 500 735 420 685 390"/></g>
<g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f5f7ff" font-size="32" font-weight="700">AI Scientific Agent · Governed Orchestration</text><text x="600" y="91" text-anchor="middle" fill="#9cb0cf" font-size="16">Planning is separated from execution; claims are separated from evidence.</text>
<g transform="translate(600 340)"><circle r="125" fill="#0e1931" stroke="url(#core)" stroke-width="5" filter="url(#g)"/><circle r="88" fill="none" stroke="#7186ba" stroke-dasharray="5 9"/><path d="M-37-20L0-52L42-19L28 34L-20 49L-50 12Z" fill="url(#core)" opacity="0.8"/><text y="2" text-anchor="middle" fill="#fff" font-size="23" font-weight="800">AGENT</text><text y="31" text-anchor="middle" fill="#e8edff" font-size="14">route · gate · record</text></g>
<g fill="#0c1a2d" stroke-width="2"><rect x="95" y="120" width="255" height="120" rx="18" stroke="#38d8c2"/><rect x="95" y="280" width="255" height="120" rx="18" stroke="#50a7ff"/><rect x="95" y="440" width="255" height="120" rx="18" stroke="#8b8cff"/><rect x="850" y="120" width="255" height="120" rx="18" stroke="#ae7fff"/><rect x="850" y="280" width="255" height="120" rx="18" stroke="#e879c8"/><rect x="850" y="440" width="255" height="120" rx="18" stroke="#ff9f6e"/></g>
<g text-anchor="middle"><text x="223" y="163" fill="#dffef9" font-size="20" font-weight="700">Calculation Contract</text><text x="223" y="192" fill="#9bb8bf" font-size="14">question · scope · acceptance</text><text x="223" y="215" fill="#9bb8bf" font-size="14">risk · evidence · approval</text><text x="223" y="323" fill="#e5f4ff" font-size="20" font-weight="700">Capability Registry</text><text x="223" y="352" fill="#9eb1cb" font-size="14">164 capabilities · 20 workflows</text><text x="223" y="375" fill="#9eb1cb" font-size="14">method and scale routing</text><text x="223" y="483" fill="#efecff" font-size="20" font-weight="700">Environment Preflight</text><text x="223" y="512" fill="#aaa8c9" font-size="14">executables · modules · licenses</text><text x="223" y="535" fill="#aaa8c9" font-size="14">paths · resources · policy</text>
<text x="978" y="163" fill="#f2eaff" font-size="20" font-weight="700">Solver Adapters</text><text x="978" y="192" fill="#b4a7ca" font-size="14">27 conservative interfaces</text><text x="978" y="215" fill="#b4a7ca" font-size="14">no bundled external engines</text><text x="978" y="323" fill="#ffecf8" font-size="20" font-weight="700">Validation Chain</text><text x="978" y="352" fill="#c3a7bd" font-size="14">parse · converge · physics</text><text x="978" y="375" fill="#c3a7bd" font-size="14">uncertainty · applicability</text><text x="978" y="483" fill="#fff0e8" font-size="20" font-weight="700">Evidence &amp; Review</text><text x="978" y="512" fill="#ccb0a2" font-size="14">provenance · artifacts · ledger</text><text x="978" y="535" fill="#ccb0a2" font-size="14">human approval for high risk</text></g>
<rect x="270" y="615" width="660" height="38" rx="19" fill="#0d2034" stroke="#54739c"/><text x="600" y="640" text-anchor="middle" fill="#c9d8ee" font-size="15">Fail closed: missing evidence or invalid state transitions stop acceptance.</text></g></svg>