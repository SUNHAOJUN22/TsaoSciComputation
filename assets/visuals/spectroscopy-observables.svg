<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Spectroscopy observables and assignment workflow</title>
<desc id="desc">A governed scientific pipeline from electronic and molecular states through simulated spectra, instrument response, peak assignment, uncertainty, and evidence-based acceptance.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120b2f"/><stop offset="1" stop-color="#153e52"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#a5f3fc"/></marker></defs>
<rect width="1200" height="620" rx="30" fill="url(#bg)"/>
<text x="58" y="62" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="700">Spectroscopy — From State Model to Observable Evidence</text>
<text x="58" y="96" fill="#c4b5fd" font-family="Arial" font-size="18">states → transition rules → simulated spectrum → instrument response → assignment → confidence</text>
<g font-family="Arial">
<rect x="55" y="140" width="235" height="330" rx="22" fill="#21164a" stroke="#a78bfa"/><text x="82" y="180" fill="#ede9fe" font-size="24" font-weight="700">State model</text>
<line x1="95" y1="235" x2="250" y2="235" stroke="#38bdf8" stroke-width="5"/><line x1="95" y1="295" x2="250" y2="295" stroke="#f472b6" stroke-width="5"/><line x1="95" y1="365" x2="250" y2="365" stroke="#fbbf24" stroke-width="5"/>
<path d="M170 350V250" stroke="#e0f2fe" stroke-width="4" marker-end="url(#a)"/><text x="82" y="425" fill="#ddd6fe" font-size="17">orbitals • vibrations</text><text x="82" y="450" fill="#ddd6fe" font-size="17">selection rules • populations</text>
<rect x="330" y="140" width="355" height="330" rx="22" fill="#092d42" stroke="#22d3ee"/><text x="360" y="180" fill="#ecfeff" font-size="24" font-weight="700">Simulated and measured spectra</text>
<path d="M370 390 L400 385 L420 220 L438 388 L485 382 L515 300 L540 385 L585 380 L610 245 L630 382 L655 378" fill="none" stroke="#67e8f9" stroke-width="5"/>
<path d="M370 410 C420 390 460 430 510 405 S600 385 655 420" fill="none" stroke="#fb7185" stroke-width="4" opacity=".9"/>
<text x="360" y="435" fill="#bae6fd" font-size="17">broadening • baseline • resolution</text>
<rect x="725" y="140" width="420" height="330" rx="22" fill="#14253b" stroke="#34d399"/><text x="755" y="180" fill="#ecfdf5" font-size="24" font-weight="700">Assignment and validation</text>
<circle cx="805" cy="250" r="28" fill="#22c55e"/><text x="805" y="257" text-anchor="middle" fill="#052e16" font-size="18" font-weight="700">✓</text><text x="850" y="257" fill="#d1fae5" font-size="18">peak correspondence</text>
<circle cx="805" cy="320" r="28" fill="#f59e0b"/><text x="805" y="327" text-anchor="middle" fill="#451a03" font-size="18" font-weight="700">±</text><text x="850" y="327" fill="#fef3c7" font-size="18">uncertainty envelope</text>
<circle cx="805" cy="390" r="28" fill="#38bdf8"/><text x="805" y="397" text-anchor="middle" fill="#082f49" font-size="18" font-weight="700">D</text><text x="850" y="397" fill="#e0f2fe" font-size="18">domain applicability</text>
</g>
<g font-family="Arial" font-size="17" text-anchor="middle"><rect x="90" y="515" width="220" height="60" rx="18" fill="#312e81" stroke="#c4b5fd"/><text x="200" y="551" fill="#f5f3ff">Transition verified</text><rect x="365" y="515" width="220" height="60" rx="18" fill="#155e75" stroke="#67e8f9"/><text x="475" y="551" fill="#ecfeff">Instrument modeled</text><rect x="640" y="515" width="220" height="60" rx="18" fill="#854d0e" stroke="#fde68a"/><text x="750" y="551" fill="#fffbeb">Assignment bounded</text><rect x="915" y="515" width="220" height="60" rx="18" fill="#14532d" stroke="#86efac"/><text x="1025" y="551" fill="#f0fdf4">Evidence accepted</text></g>
</svg>