<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Enhanced sampling and free-energy reconstruction</title>
  <desc id="desc">A governed workflow from collective-variable design through biased ensembles, overlap checks, free-energy reconstruction, uncertainty and acceptance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#16264a"/>
    </linearGradient>
    <linearGradient id="barrier" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">Enhanced sampling → evidence-bound free energy</text>
  <text x="60" y="108" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">Bias accelerates exploration; overlap, convergence and uncertainty decide acceptance.</text>

  <g transform="translate(58 150)" filter="url(#shadow)">
    <rect width="250" height="140" rx="20" fill="#10233f" stroke="#22d3ee" stroke-width="2"/>
    <text x="24" y="38" fill="#67e8f9" font-size="20" font-family="Arial, sans-serif" font-weight="700">1 · Collective variables</text>
    <text x="24" y="73" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">Mechanistic coordinate</text>
    <text x="24" y="99" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">Boundary &amp; periodicity</text>
    <text x="24" y="125" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">Degeneracy checks</text>
  </g>
  <path d="M318 220 H370" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(382 150)" filter="url(#shadow)">
    <rect width="250" height="140" rx="20" fill="#10233f" stroke="#a78bfa" stroke-width="2"/>
    <text x="24" y="38" fill="#c4b5fd" font-size="20" font-family="Arial, sans-serif" font-weight="700">2 · Biased ensembles</text>
    <text x="24" y="73" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">Umbrella / metadynamics</text>
    <text x="24" y="99" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">Replica diagnostics</text>
    <text x="24" y="125" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">Independent seeds</text>
  </g>
  <path d="M642 220 H694" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(706 150)" filter="url(#shadow)">
    <rect width="250" height="140" rx="20" fill="#10233f" stroke="#fb7185" stroke-width="2"/>
    <text x="24" y="38" fill="#fda4af" font-size="20" font-family="Arial, sans-serif" font-weight="700">3 · Reconstruction</text>
    <text x="24" y="73" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">WHAM / MBAR estimate</text>
    <text x="24" y="99" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">Window overlap</text>
    <text x="24" y="125" fill="#e2e8f0" font-size="16" font-family="Arial, sans-serif">Bootstrap interval</text>
  </g>
  <path d="M966 220 H1018" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1030 150)" filter="url(#shadow)">
    <rect width="112" height="140" rx="20" fill="#12372f" stroke="#34d399" stroke-width="2"/>
    <text x="56" y="48" text-anchor="middle" fill="#6ee7b7" font-size="17" font-family="Arial, sans-serif" font-weight="700">ACCEPT</text>
    <text x="56" y="78" text-anchor="middle" fill="#d1fae5" font-size="13" font-family="Arial, sans-serif">or</text>
    <text x="56" y="106" text-anchor="middle" fill="#fda4af" font-size="17" font-family="Arial, sans-serif" font-weight="700">REJECT</text>
  </g>

  <g transform="translate(70 350)">
    <path d="M0 150 C95 150 105 40 210 40 C300 40 325 175 430 175 C535 175 540 70 640 70 C760 70 770 155 900 155 C980 155 1015 115 1060 95" fill="none" stroke="url(#barrier)" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="190" x2="1060" y2="190" stroke="#475569" stroke-width="2"/>
    <circle cx="70" cy="145" r="12" fill="#22d3ee"/>
    <circle cx="430" cy="175" r="12" fill="#a78bfa"/>
    <circle cx="900" cy="155" r="12" fill="#fb7185"/>
    <text x="0" y="232" fill="#94a3b8" font-size="15" font-family="Arial, sans-serif">collective variable ξ</text>
    <text x="870" y="36" fill="#f8fafc" font-size="18" font-family="Arial, sans-serif" font-weight="700">ΔG(ξ) ± uncertainty</text>
  </g>
</svg>
