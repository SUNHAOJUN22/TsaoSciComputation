<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" data-design-system="uiux-pro-max-scientific-swiss-v2" data-family="governance" data-layout="bento">
  <title id="title">Scientific data and model governance</title>
  <desc id="desc">Ingestion, transformations, versioning, access control and release gates preserve scientific lineage.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity="0.18"/></pattern></defs>
  <style>
    .eyebrow { fill: #14B8A6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 32px; font-weight: 700; }
    .subtitle { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 15px; font-weight: 400; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 650; }
    .detail { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; font-weight: 400; }
    .mono { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .gate { fill: #CBD5E1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 650; letter-spacing: 0.5px; }
    .footer { fill: #94A3B8; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 14px; font-weight: 400; }
    .card { fill: #111827; stroke: #334155; stroke-width: 2; }
    .raised { fill: #172033; stroke: #334155; stroke-width: 2; }
    .link { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="680" rx="24" fill="#0B1220"/>
  <rect width="1200" height="680" rx="24" fill="url(#grid)"/>
  <rect x="32" y="28" width="1136" height="624" rx="20" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="56" y="62" class="eyebrow">GOVERNANCE · BENTO</text>
  <text x="56" y="108" class="heading">Data and model governance</text>
  <text x="56.0" y="140.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">Every transformation and model release remains traceable and reviewable.</tspan></text>
  <rect x="950" y="48" width="194" height="32" rx="16" fill="#172033" stroke="#334155"/>
  <text x="1047" y="69" text-anchor="middle" class="mono">EVIDENCE-BOUND</text>
  <rect x="48" y="190" width="310" height="126" rx="16" class="card"/><rect x="48" y="190" width="6" height="126" rx="3" fill="#14B8A6"/><text x="70" y="221" class="mono">01</text><text x="118.0" y="222.0" text-anchor="start" class="stage"><tspan x="118.0" dy="0">Ingest</tspan></text><text x="70.0" y="266.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">source consent checksum</tspan></text><rect x="382" y="190" width="310" height="126" rx="16" class="card"/><rect x="382" y="190" width="6" height="126" rx="3" fill="#14B8A6"/><text x="404" y="221" class="mono">02</text><text x="452.0" y="222.0" text-anchor="start" class="stage"><tspan x="452.0" dy="0">Transform</tspan></text><text x="404.0" y="266.0" text-anchor="start" class="detail"><tspan x="404.0" dy="0">schema units lineage</tspan></text><rect x="48" y="340" width="310" height="126" rx="16" class="card"/><rect x="48" y="340" width="6" height="126" rx="3" fill="#14B8A6"/><text x="70" y="371" class="mono">03</text><text x="118.0" y="372.0" text-anchor="start" class="stage"><tspan x="118.0" dy="0">Version</tspan></text><text x="70.0" y="416.0" text-anchor="start" class="detail"><tspan x="70.0" dy="0">data model code</tspan></text><rect x="382" y="340" width="310" height="126" rx="16" class="card"/><rect x="382" y="340" width="6" height="126" rx="3" fill="#14B8A6"/><text x="404" y="371" class="mono">04</text><text x="452.0" y="372.0" text-anchor="start" class="stage"><tspan x="452.0" dy="0">Control</tspan></text><text x="404.0" y="416.0" text-anchor="start" class="detail"><tspan x="404.0" dy="0">access policy audit</tspan></text><rect x="716" y="190" width="436" height="276" rx="18" class="raised"/><rect x="716" y="190" width="436" height="6" rx="3" fill="#14B8A6"/><text x="746" y="232" class="mono">05 · DECISION GATE</text><text x="746.0" y="278.0" text-anchor="start" class="stage"><tspan x="746.0" dy="0">Release</tspan></text><text x="746.0" y="326.0" text-anchor="start" class="detail"><tspan x="746.0" dy="0">evidence approval rollback</tspan></text><circle cx="1032" cy="366" r="54" fill="#0B1220" stroke="#14B8A6" stroke-width="3"/><path d="M1008 366L1024 382L1057 345" fill="none" stroke="#14B8A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="934" y="442" text-anchor="middle" class="mono">TRACE · VERIFY · AUTHORIZE</text>
  <rect x="48" y="516" width="1104" height="72" rx="16" class="raised"/><circle cx="58" cy="552" r="9" fill="#0B1220" stroke="#14B8A6" stroke-width="2"/><text x="74" y="557" class="gate">NUMERICAL</text><circle cx="232" cy="552" r="9" fill="#0B1220" stroke="#14B8A6" stroke-width="2"/><text x="248" y="557" class="gate">CONVERGENCE</text><circle cx="406" cy="552" r="9" fill="#0B1220" stroke="#14B8A6" stroke-width="2"/><text x="422" y="557" class="gate">PHYSICAL</text><circle cx="580" cy="552" r="9" fill="#0B1220" stroke="#14B8A6" stroke-width="2"/><text x="596" y="557" class="gate">UNCERTAINTY</text><circle cx="754" cy="552" r="9" fill="#0B1220" stroke="#14B8A6" stroke-width="2"/><text x="770" y="557" class="gate">APPLICABILITY</text><circle cx="928" cy="552" r="9" fill="#0B1220" stroke="#14B8A6" stroke-width="2"/><text x="944" y="557" class="gate">REVIEW</text>
  <text x="56.0" y="620.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">Untraceable data or model changes block release regardless of predictive score.</tspan></text>
</svg>
