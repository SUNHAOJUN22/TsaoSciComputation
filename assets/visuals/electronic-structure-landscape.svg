<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Electronic structure and density functional theory landscape</title><desc id="d">A scientific illustration connecting molecular geometry, electron density, energy landscape, convergence and validated electronic observables.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071520"/><stop offset="1" stop-color="#1d1031"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#31d8ff"/><stop offset=".55" stop-color="#728cff"/><stop offset="1" stop-color="#d372ff"/></linearGradient><radialGradient id="orb"><stop stop-color="#bdf6ff" stop-opacity=".95"/><stop offset=".45" stop-color="#55cfff" stop-opacity=".55"/><stop offset="1" stop-color="#295dff" stop-opacity="0"/></radialGradient><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#83a6d8"/></marker></defs><rect width="1200" height="620" rx="28" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="58" text-anchor="middle" fill="#f6f7ff" font-size="31" font-weight="700">Electronic Structure &amp; DFT</text><text x="600" y="88" text-anchor="middle" fill="#9fb0cb" font-size="16">Geometry → density → self-consistency → energy landscape → validated observables</text><g fill="none" stroke="#7898c8" stroke-width="3" marker-end="url(#m)"><path d="M275 302H390"/><path d="M565 302H680"/><path d="M855 302H970"/></g><g transform="translate(170 300)"><circle r="100" fill="#0b2431" stroke="#32d7ff" stroke-width="3"/><circle cx="-34" cy="10" r="16" fill="#f7fdff"/><circle cx="38" cy="-25" r="13" fill="#81dfff"/><circle cx="44" cy="47" r="11" fill="#af98ff"/><path d="M-20 3L27-17M-21 21L32 42M43-12L44 34" stroke="#7ca6c8" stroke-width="5"/><ellipse cx="2" cy="6" rx="76" ry="38" fill="none" stroke="#4de2ff" stroke-opacity=".55" transform="rotate(-18)"/><text y="137" text-anchor="middle" fill="#eafdff" font-size="21" font-weight="700">GEOMETRY</text><text y="163" text-anchor="middle" fill="#91aebe" font-size="14">atoms · symmetry · boundary</text></g><g transform="translate(480 300)"><circle r="100" fill="#10213a" stroke="#6a9bff" stroke-width="3"/><ellipse cx="-24" cy="0" rx="76" ry="49" fill="url(#orb)"/><ellipse cx="33" cy="-4" rx="72" ry="45" fill="url(#orb)" transform="rotate(90)"/><circle r="12" fill="#ffffff"/><path d="M-68 58C-40 38-24 70 1 48C28 25 40 57 71 31" fill="none" stroke="#a9c7ff" stroke-width="4"/><text y="137" text-anchor="middle" fill="#edf4ff" font-size="21" font-weight="700">ELECTRON DENSITY</text><text y="163" text-anchor="middle" fill="#9baccc" font-size="14">orbitals · charge · spin</text></g><g transform="translate(770 300)"><circle r="100" fill="#181d3b" stroke="#9c83ff" stroke-width="3"/><path d="M-67 46C-44-34-20-50 0 14C18 70 42 4 69-44" fill="none" stroke="url(#g)" stroke-width="6"/><path d="M-67-55V58H72M-57 34H67M-57 4H67M-57-26H67" fill="none" stroke="#69708e" stroke-width="2"/><circle cx="1" cy="14" r="9" fill="#f2eaff"/><text y="137" text-anchor="middle" fill="#f5efff" font-size="21" font-weight="700">SCF &amp; ENERGY</text><text y="163" text-anchor="middle" fill="#aca6c8" font-size="14">residual · minimum · forces</text></g><g transform="translate(1060 300)"><circle r="100" fill="#281832" stroke="#db78dc" stroke-width="3"/><path d="M-61 46L-33 7L-5 24L21-32L55-53" fill="none" stroke="#f0a5ea" stroke-width="5"/><g fill="#ffc1f0"><circle cx="-33" cy="7" r="8"/><circle cx="-5" cy="24" r="8"/><circle cx="21" cy="-32" r="8"/></g><path d="M-66-7H65M-66 19H65M-66 45H65" stroke="#745b82" stroke-width="2"/><text y="137" text-anchor="middle" fill="#fff1fc" font-size="21" font-weight="700">OBSERVABLES</text><text y="163" text-anchor="middle" fill="#c7a5bf" font-size="14">gap · spectra · response</text></g><rect x="220" y="518" width="760" height="60" rx="17" fill="#0b1c2c" stroke="url(#g)"/><text x="600" y="543" text-anchor="middle" fill="#f0f4ff" font-size="16" font-weight="700">Acceptance requires basis, functional, convergence, finite-size and applicability evidence.</text><text x="600" y="565" text-anchor="middle" fill="#9aacc8" font-size="13">A computed energy is not automatically a transferable scientific conclusion.</text></g></svg>