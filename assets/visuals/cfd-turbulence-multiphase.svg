<path d="M264.8 305H284.8" class="line"/><path d="M481.6 305H501.6" class="line"/><path d="M698.4 305H718.4" class="line"/><path d="M915.2 305H935.2" class="line"/>
<rect x="68" y="455" width="1064" height="125" rx="18" fill="#0b1d34" stroke="#334155"/>
<text x="96" y="505" class="label">Evidence boundary</text>
<text x="96" y="542" class="sub">A converged residual history does not replace mesh, regime and balance validation.</text>
