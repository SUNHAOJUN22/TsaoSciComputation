<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Scientific capability landscape</title><desc id="d">A layered map of methods, workflows, validation and governance across scientific computing domains.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#1b142d"/></linearGradient><linearGradient id="bar" x2="1"><stop stop-color="#2dd4bf"/><stop offset="0.48" stop-color="#648cff"/><stop offset="1" stop-color="#ef7fba"/></linearGradient></defs><rect width="1200" height="650" rx="26" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="55" text-anchor="middle" fill="#f6f7ff" font-size="31" font-weight="700">Capability Landscape</text><text x="600" y="85" text-anchor="middle" fill="#9fadc6" font-size="16">164 differentiated capabilities organized through 20 validation-aware workflows</text><g transform="translate(90 125)"><rect width="1020" height="82" rx="18" fill="#0c2930" stroke="#2dd4bf"/><text x="34" y="34" fill="#e8fffb" font-size="20" font-weight="700">METHODS &amp; SCALES</text><text x="34" y="60" fill="#9dbcb8" font-size="14">electronic structure · atomistic simulation · mesoscopic models · continuum physics · process systems</text><g fill="#52decc"><circle cx="760" cy="41" r="8"/><circle cx="804" cy="41" r="8"/><circle cx="848" cy="41" r="8"/><circle cx="892" cy="41" r="8"/><circle cx="936" cy="41" r="8"/></g></g><g transform="translate(130 230)"><rect width="940" height="82" rx="18" fill="#10233a" stroke="#4ba8f4"/><text x="34" y="34" fill="#eaf6ff" font-size="20" font-weight="700">WORKFLOW CONTRACTS</text><text x="34" y="60" fill="#9caec7" font-size="14">inputs · outputs · validators · required evidence · failure modes · approval boundaries</text><path d="M720 25H890M720 41H850M720 57H910" stroke="#69b8f0" stroke-width="6" stroke-linecap="round"/></g><g transform="translate(170 335)"><rect width="860" height="82" rx="18" fill="#191d3a" stroke="#8a82ff"/><text x="34" y="34" fill="#f1efff" font-size="20" font-weight="700">VALIDATION &amp; UNCERTAINTY</text><text x="34" y="60" fill="#aaa7c4" font-size="14">schema · convergence · physical invariants · benchmarks · applicability · confidence C0–C5</text><g fill="none" stroke="#aaa1ff" stroke-width="3"><circle cx="720" cy="41" r="20"/><path d="M710 41L718 49L734 31"/><circle cx="785" cy="41" r="20"/><path d="M775 41L783 49L799 31"/></g></g><g transform="translate(210 440)"><rect width="780" height="82" rx="18" fill="#281832" stroke="#d678cf"/><text x="34" y="34" fill="#fff0fb" font-size="20" font-weight="700">PROVENANCE &amp; GOVERNANCE</text><text x="34" y="60" fill="#c1a6ba" font-size="14">artifact lineage · hashes · manifests · SBOMs · risk policy · qualified human review</text><path d="M650 25L710 41L650 57L590 41Z" fill="none" stroke="#e69bdc" stroke-width="3"/></g><rect x="285" y="555" width="630" height="52" rx="18" fill="#0e192c" stroke="url(#bar)" stroke-width="2"/><text x="600" y="578" text-anchor="middle" fill="#f1f3ff" font-size="16" font-weight="700">A capability is more than a label: it is a bounded, testable contract.</text><text x="600" y="598" text-anchor="middle" fill="#9daac2" font-size="13">Differentiation is enforced across inputs, outputs, validators and evidence.</text></g></svg>