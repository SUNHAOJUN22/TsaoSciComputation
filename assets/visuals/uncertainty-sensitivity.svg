<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Uncertainty quantification and sensitivity analysis</title>
  <desc id="desc">A scientific uncertainty workflow connecting parameter distributions, ensemble propagation, sensitivity ranking, predictive intervals and reviewed decision thresholds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071627"/>
      <stop offset="1" stop-color="#2a1738"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="58" y="72" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">Uncertainty → sensitivity → decision boundary</text>
  <text x="58" y="108" fill="#c4b5fd" font-size="18" font-family="Arial, sans-serif">Point predictions do not cross engineering gates without propagated uncertainty.</text>

  <g transform="translate(55 160)" filter="url(#shadow)">
    <rect width="250" height="170" rx="22" fill="#10283d" stroke="#22d3ee" stroke-width="2"/>
    <text x="24" y="40" fill="#67e8f9" font-size="20" font-family="Arial, sans-serif" font-weight="700">1 · Input uncertainty</text>
    <path d="M28 122 C55 122 62 60 100 60 C138 60 145 122 172 122" fill="none" stroke="#22d3ee" stroke-width="4"/>
    <path d="M86 122 C111 122 118 82 148 82 C178 82 185 122 210 122" fill="none" stroke="#a78bfa" stroke-width="4"/>
    <text x="24" y="151" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">parameters · data · model form</text>
  </g>
  <path d="M315 245 H370" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(382 160)" filter="url(#shadow)">
    <rect width="250" height="170" rx="22" fill="#242046" stroke="#a78bfa" stroke-width="2"/>
    <text x="24" y="40" fill="#c4b5fd" font-size="20" font-family="Arial, sans-serif" font-weight="700">2 · Propagation</text>
    <circle cx="55" cy="87" r="8" fill="#22d3ee"/>
    <circle cx="90" cy="69" r="8" fill="#a78bfa"/>
    <circle cx="128" cy="102" r="8" fill="#34d399"/>
    <circle cx="164" cy="76" r="8" fill="#fb7185"/>
    <circle cx="201" cy="111" r="8" fill="#f59e0b"/>
    <path d="M40 130 C90 105 150 140 216 112" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <text x="24" y="151" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">ensemble · surrogate · Monte Carlo</text>
  </g>
  <path d="M642 245 H697" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(709 160)" filter="url(#shadow)">
    <rect width="250" height="170" rx="22" fill="#3b2918" stroke="#f59e0b" stroke-width="2"/>
    <text x="24" y="40" fill="#fde68a" font-size="20" font-family="Arial, sans-serif" font-weight="700">3 · Sensitivity</text>
    <rect x="24" y="65" width="170" height="16" rx="8" fill="#22d3ee"/>
    <rect x="24" y="91" width="128" height="16" rx="8" fill="#a78bfa"/>
    <rect x="24" y="117" width="76" height="16" rx="8" fill="#34d399"/>
    <text x="205" y="78" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">S1</text>
    <text x="163" y="104" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">S2</text>
    <text x="111" y="130" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">S3</text>
    <text x="24" y="154" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">global ranking + interactions</text>
  </g>
  <path d="M969 245 H1024" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1036 160)" filter="url(#shadow)">
    <rect width="110" height="170" rx="22" fill="#12372f" stroke="#34d399" stroke-width="2"/>
    <text x="55" y="48" text-anchor="middle" fill="#a7f3d0" font-size="17" font-family="Arial, sans-serif" font-weight="700">DECIDE</text>
    <text x="55" y="82" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">feasible?</text>
    <text x="55" y="108" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">robust?</text>
    <text x="55" y="134" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">reviewed?</text>
  </g>

  <g transform="translate(70 390)">
    <rect width="1060" height="150" rx="24" fill="#101e34" stroke="#475569" stroke-width="2"/>
    <path d="M35 112 C150 42 245 85 340 64 C430 44 535 112 630 82 C735 48 810 60 1018 28 L1018 125 L35 125 Z" fill="url(#band)"/>
    <path d="M35 102 C150 61 245 74 340 70 C430 66 535 94 630 82 C735 66 810 69 1018 48" fill="none" stroke="#f8fafc" stroke-width="4"/>
    <line x1="35" y1="125" x2="1018" y2="125" stroke="#475569" stroke-width="2"/>
    <line x1="790" y1="20" x2="790" y2="130" stroke="#fb7185" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="805" y="42" fill="#fecdd3" font-size="15" font-family="Arial, sans-serif" font-weight="700">engineering limit</text>
    <text x="35" y="30" fill="#f8fafc" font-size="19" font-family="Arial, sans-serif" font-weight="700">Prediction interval, not a single curve</text>
  </g>
</svg>
