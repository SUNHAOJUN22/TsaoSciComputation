<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">C0 to C5 scientific confidence ladder</title><desc id="d">A stepped confidence model where stronger claims require progressively stronger evidence and explicit human approval at engineering decision level.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07141f"/><stop offset="1" stop-color="#1b152d"/></linearGradient><linearGradient id="st" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#26364e"/><stop offset="0.35" stop-color="#287d91"/><stop offset="0.7" stop-color="#6b63c8"/><stop offset="1" stop-color="#c56ba8"/></linearGradient></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="58" text-anchor="middle" fill="#f6f7ff" font-size="31" font-weight="700">Scientific Confidence Is Earned, Not Assumed</text><text x="600" y="88" text-anchor="middle" fill="#9fadc6" font-size="16">C0–C5 separates execution evidence from engineering authority.</text><path d="M95 500H245V435H395V370H545V305H695V240H845V175H1085V535H95Z" fill="url(#st)" opacity="0.82"/><g fill="none" stroke="#d7e0f3" stroke-opacity="0.5"><path d="M95 500H245V435H395V370H545V305H695V240H845V175H1085" stroke-width="3"/></g><g font-weight="800" font-size="27" fill="#fff"><text x="170" y="478">C0</text><text x="320" y="413">C1</text><text x="470" y="348">C2</text><text x="620" y="283">C3</text><text x="770" y="218">C4</text><text x="965" y="153">C5</text></g><g font-size="15" text-anchor="middle"><text x="170" y="540" fill="#c6d2e5">declared only</text><text x="320" y="475" fill="#d2e8ee">environment ready</text><text x="470" y="410" fill="#d5ecf2">executed &amp; parsed</text><text x="620" y="345" fill="#e3e4ff">converged &amp; checked</text><text x="770" y="280" fill="#eee5ff">validated in domain</text><text x="965" y="215" fill="#ffe7f6">explicit decision authority</text></g><g font-size="13" text-anchor="middle" fill="#9daac2"><text x="170" y="567">metadata</text><text x="320" y="502">preflight evidence</text><text x="470" y="437">run artifacts</text><text x="620" y="372">numerics + physics</text><text x="770" y="307">benchmark + uncertainty</text><text x="965" y="242">qualified human approval</text></g><rect x="742" y="410" width="338" height="112" rx="18" fill="#10192c" stroke="#d67ab9" stroke-width="2"/><text x="911" y="443" text-anchor="middle" fill="#ffeaf7" font-size="18" font-weight="700">High-risk boundary</text><text x="911" y="472" text-anchor="middle" fill="#c9aec0" font-size="14">reactor · control · safety · commercial</text><text x="911" y="496" text-anchor="middle" fill="#c9aec0" font-size="14">No automated promotion to C5.</text><text x="600" y="594" text-anchor="middle" fill="#98a7c1" font-size="13">A stronger visual or a successful exit code never substitutes for stronger evidence.</text></g></svg>