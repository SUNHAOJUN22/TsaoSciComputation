xt x="1014.0" y="290.0" text-anchor="start" class="stage"><tspan x="1014.0" dy="0">Scale</tspan></text><text x="1014.0" y="334.0" text-anchor="start" class="detail"><tspan x="1014.0" dy="0">geometry transfer fit</tspan></text><rect x="358" y="458" width="484" height="48" rx="14" class="raised"/><text x="382" y="488" class="mono">05 · MARGIN</text><text x="818.0" y="487.0" text-anchor="end" class="detail"><tspan x="818.0" dy="0">scenario protection review</tspan></text>
