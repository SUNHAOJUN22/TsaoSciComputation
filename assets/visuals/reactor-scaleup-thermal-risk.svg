<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" data-design-system="uiux-pro-max-scientific-swiss-v2" data-family="process" data-layout="risk">
  <title id="title">Reactor scale up and thermal risk workflow</title>
