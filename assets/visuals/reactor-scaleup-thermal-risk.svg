<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Reactor scale-up and thermal-risk evidence workflow</title>
<desc id="desc">Ideal-reactor baselines, residence-time behavior, heat removal, runaway screening, parameter fitting and scale-up applicability.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071426"/>
    <stop offset="0.55" stop-color="#10233f"/>
    <stop offset="1" stop-color="#071426"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ef4444"/>
    <stop offset="1" stop-color="#fb923c"/>
  </linearGradient>
  <style>
    .title{font:700 34px ui-sans-serif,system-ui;fill:#f8fafc}
    .sub{font:500 17px ui-sans-serif,system-ui;fill:#cbd5e1}
    .label{font:700 17px ui-sans-serif,system-ui;fill:#f8fafc}
    .small{font:500 13px ui-sans-serif,system-ui;fill:#cbd5e1}
    .box{fill:#0f2745;stroke:#3b82f6;stroke-width:1.5}
    .line{fill:none;stroke:url(#accent);stroke-width:4;stroke-linecap:round}
  </style>
</defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="624" rx="24" fill="none" stroke="#1e3a5f"/>
<text x="68" y="92" class="title">Reactor engineering: balances → heat removal → scale-up</text>
<text x="68" y="126" class="sub">Kinetics, transport and protection assumptions are qualified independently.</text>
<rect x="68.0" y="215" width="196.8" height="180" rx="18" class="box"/><text x="86.0" y="258" class="label">Baselines</text><text x="86.0" y="292" class="small">batch · CSTR · PFR</text><circle cx="166.4" cy="342" r="23" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.96"/><rect x="284.8" y="215" width="196.8" height="180" rx="18" class="box"/><text x="302.8" y="258" class="label">Residence time</text><text x="302.8" y="292" class="small">RTD · mixing · bypass</text><circle cx="383.2" cy="342" r="25" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.88"/><rect x="501.6" y="215" width="196.8" height="180" rx="18" class="box"/><text x="519.6" y="258" class="label">Thermal risk</text><text x="519.6" y="292" class="small">heat release · removal</text><circle cx="600.0" cy="342" r="27" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.80"/><rect x="718.4" y="215" width="196.8" height="180" rx="18" class="box"/><text x="736.4" y="258" class="label">Scale-up</text><text x="736.4" y="292" class="small">transport · geometry · fit</text><circle cx="816.8" cy="342" r="29" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.72"/><rect x="935.2" y="215" width="196.8" height="180" rx="18" class="box"/><text x="953.2" y="258" class="label">Accept</text><text x="953.2" y="292" class="small">scenario · margin · review</text><circle cx="1033.6" cy="342" r="31" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.64"/>
<path d="M264.8 305H284.8" class="line"/><path d="M481.6 305H501.6" class="line"/><path d="M698.4 305H718.4" class="line"/><path d="M915.2 305H935.2" class="line"/>
<rect x="68" y="455" width="1064" height="125" rx="18" fill="#0b1d34" stroke="#334155"/>
<text x="96" y="505" class="label">Evidence boundary</text>
<text x="96" y="542" class="sub">A fitted conversion curve cannot authorize scale-up or dismiss runaway risk.</text>
