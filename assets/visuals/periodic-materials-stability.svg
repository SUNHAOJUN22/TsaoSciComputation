    .mono { fill: #CBD5E1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .gate { fill: #CBD5E1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .footer { fill: #94A3B8; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .line { fill: none; stroke: #94A3B8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
