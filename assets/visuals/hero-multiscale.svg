<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" data-design-system="uiux-pro-max-scientific-swiss-v2" data-family="architecture" data-layout="hero">
  <title id="title">TsaoSciComputation multiscale evidence architecture</title>
  <desc id="desc">A structured scientific workflow from electronic structure through industrial process decisions with explicit evidence gates.</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#334155" stroke-width="1" opacity="0.18"/></pattern></defs>
  <style>
    .eyebrow { fill: #06B6D4; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 32px; font-weight: 700; }
    .subtitle { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 15px; font-weight: 400; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 650; }
    .detail { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; font-weight: 400; }
    .mono { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 700; }
    .gate { fill: #CBD5E1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 650; letter-spacing: 0.5px; }
    .footer { fill: #94A3B8; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 14px; font-weight: 400; }
    .card { fill: #111827; stroke: #334155; stroke-width: 2; }
    .raised { fill: #172033; stroke: #334155; stroke-width: 2; }
    .link { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="680" rx="24" fill="#0B1220"/>
  <rect width="1200" height="680" rx="24" fill="url(#grid)"/>
  <rect x="32" y="28" width="1136" height="624" rx="20" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="56" y="62" class="eyebrow">ARCHITECTURE · HERO</text>
  <text x="56" y="108" class="heading">From electrons to industrial decisions</text>
  <text x="56.0" y="140.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">One orchestration layer connects scales without confusing numerical completion with</tspan><tspan x="56.0" dy="21">scientific acceptance.</tspan></text>
  <rect x="950" y="48" width="194" height="32" rx="16" fill="#172033" stroke="#334155"/>
  <text x="1047" y="69" text-anchor="middle" class="mono">EVIDENCE-BOUND</text>
  <rect x="48" y="192" width="204" height="282" rx="18" class="card"/><rect x="48" y="192" width="204" height="5" rx="2" fill="#06B6D4"/><text x="66" y="232" class="mono">01</text><text x="66.0" y="274.0" text-anchor="start" class="stage"><tspan x="66.0" dy="0">Electron</tspan></text><text x="66.0" y="322.0" text-anchor="start" class="detail"><tspan x="66.0" dy="0">density charge</tspan><tspan x="66.0" dy="21">wavefunction</tspan></text><circle cx="150.0" cy="430.0" r="22" fill="none" stroke="#06B6D4" stroke-width="3"/><circle cx="150.0" cy="430.0" r="6" fill="#06B6D4"/><path d="M254 335H269" class="link"/><rect x="273" y="192" width="204" height="282" rx="18" class="card"/><rect x="273" y="192" width="204" height="5" rx="2" fill="#06B6D4"/><text x="291" y="232" class="mono">02</text><text x="291.0" y="274.0" text-anchor="start" class="stage"><tspan x="291.0" dy="0">Atom</tspan></text><text x="291.0" y="322.0" text-anchor="start" class="detail"><tspan x="291.0" dy="0">structure force</tspan><tspan x="291.0" dy="21">spectrum</tspan></text><path d="M347.0 446.0L375.0 406.0L403.0 446.0" fill="none" stroke="#06B6D4" stroke-width="3"/><circle cx="347.0" cy="446.0" r="5" fill="#06B6D4"/><circle cx="375.0" cy="406.0" r="5" fill="#06B6D4"/><circle cx="403.0" cy="446.0" r="5" fill="#06B6D4"/><path d="M479 335H494" class="link"/><rect x="498" y="192" width="204" height="282" rx="18" class="card"/><rect x="498" y="192" width="204" height="5" rx="2" fill="#06B6D4"/><text x="516" y="232" class="mono">03</text><text x="516.0" y="274.0" text-anchor="start" class="stage"><tspan x="516.0" dy="0">Molecule</tspan></text><text x="516.0" y="322.0" text-anchor="start" class="detail"><tspan x="516.0" dy="0">ensemble reaction free</tspan><tspan x="516.0" dy="21">energy</tspan></text><rect x="570.0" y="434.0" width="12" height="24" rx="3" fill="#06B6D4"/><rect x="594.0" y="414.0" width="12" height="44" rx="3" fill="#06B6D4"/><rect x="618.0" y="400.0" width="12" height="58" rx="3" fill="#06B6D4"/><path d="M704 335H719" class="link"/><rect x="723" y="192" width="204" height="282" rx="18" class="card"/><rect x="723" y="192" width="204" height="5" rx="2" fill="#06B6D4"/><text x="741" y="232" class="mono">04</text><text x="741.0" y="274.0" text-anchor="start" class="stage"><tspan x="741.0" dy="0">Material</tspan></text><text x="741.0" y="322.0" text-anchor="start" class="detail"><tspan x="741.0" dy="0">morphology interface</tspan><tspan x="741.0" dy="21">fields</tspan></text><path d="M825.0 398.0L857.0 430.0L825.0 462.0L793.0 430.0Z" fill="none" stroke="#06B6D4" stroke-width="3"/><path d="M811.0 430.0H839.0" stroke="#06B6D4" stroke-width="3"/><path d="M929 335H944" class="link"/><rect x="948" y="192" width="204" height="282" rx="18" class="card"/><rect x="948" y="192" width="204" height="5" rx="2" fill="#06B6D4"/><text x="966" y="232" class="mono">05</text><text x="966.0" y="274.0" text-anchor="start" class="stage"><tspan x="966.0" dy="0">Process</tspan></text><text x="966.0" y="322.0" text-anchor="start" class="detail"><tspan x="966.0" dy="0">reactor plant reviewed</tspan><tspan x="966.0" dy="21">decision</tspan></text><path d="M1020.0 406.0H1080.0V454.0H1020.0Z" fill="none" stroke="#06B6D4" stroke-width="3"/><path d="M1036.0 430.0L1047.0 441.0L1066.0 418.0" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="48" y="516" width="1104" height="72" rx="16" class="raised"/><circle cx="58" cy="552" r="9" fill="#0B1220" stroke="#06B6D4" stroke-width="2"/><text x="74" y="557" class="gate">NUMERICAL</text><circle cx="232" cy="552" r="9" fill="#0B1220" stroke="#06B6D4" stroke-width="2"/><text x="248" y="557" class="gate">CONVERGENCE</text><circle cx="406" cy="552" r="9" fill="#0B1220" stroke="#06B6D4" stroke-width="2"/><text x="422" y="557" class="gate">PHYSICAL</text><circle cx="580" cy="552" r="9" fill="#0B1220" stroke="#06B6D4" stroke-width="2"/><text x="596" y="557" class="gate">UNCERTAINTY</text><circle cx="754" cy="552" r="9" fill="#0B1220" stroke="#06B6D4" stroke-width="2"/><text x="770" y="557" class="gate">APPLICABILITY</text><circle cx="928" cy="552" r="9" fill="#0B1220" stroke="#06B6D4" stroke-width="2"/><text x="944" y="557" class="gate">REVIEW</text>
  <text x="56.0" y="620.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">Every scale handoff preserves units, provenance, uncertainty, applicability and review authority.</tspan></text>
</svg>
