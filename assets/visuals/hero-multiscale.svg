  <g transform="translate(300 510)"><rect width="840" height="72" rx="18" fill="#0b1428" stroke="#5e78a8" stroke-opacity="0.7"/><text x="420" y="30" text-anchor="middle" fill="#f2f5ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">CONTRACT → PREFLIGHT → EXECUTION → VALIDATION → UNCERTAINTY → ACCEPTANCE</text><text x="420" y="54" text-anchor="middle" fill="#8fa3c4" font-family="Inter,Segoe UI,sans-serif" font-size="14">Every handoff is provenance-aware, fail-closed and bounded by applicability</text></g>
