    <g transform="translate(435 294)"><circle r="70" fill="#14213c" stroke="#6ea8ff" stroke-width="2"/><circle cx="-18" cy="-8" r="22" fill="#6ea8ff" opacity="0.9"/><circle cx="20" cy="10" r="25" fill="#b48cff" opacity="0.85"/><circle cx="2" cy="-28" r="17" fill="#d9c6ff" opacity="0.9"/><text y="105" fill="#edf0ff" font-size="20" font-weight="700">ATOM</text><text y="130" fill="#9da9ca" font-size="14">structure · force · spectrum</text></g>
    <g transform="translate(720 336)"><circle r="82" fill="#191d40" stroke="#9b8cff" stroke-width="2"/><path d="M-50 20L-18-30L22-12L49 31L3 49Z" fill="none" stroke="#c2b8ff" stroke-width="5" stroke-linejoin="round"/><g fill="#f4f1ff"><circle cx="-50" cy="20" r="9"/><circle cx="-18" cy="-30" r="9"/><circle cx="22" cy="-12" r="9"/><circle cx="49" cy="31" r="9"/><circle cx="3" cy="49" r="9"/></g><text y="120" fill="#f1efff" font-size="20" font-weight="700">MOLECULE</text><text y="145" fill="#aaa6d3" font-size="14">MD · reaction · free energy</text></g>
    <g transform="translate(1010 294)"><circle r="70" fill="#241a3d" stroke="#da7fd9" stroke-width="2"/><g fill="none" stroke="#f0a6e8" stroke-width="3"><path d="M-45-25C-15-55 4-8 30-34S64-10 42 14S4 26-17 52"/><path d="M-48 22C-20-3 2 36 29 9S58 35 43 49"/></g><text y="105" fill="#fff0fb" font-size="20" font-weight="700">MATERIAL</text><text y="130" fill="#c8a2c1" font-size="14">polymer · interface · continuum</text></g>
