<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc" data-design-system="uiux-pro-max-scientific-swiss-v3" data-layout="hero" data-family="architecture">
  <title id="title">TsaoSciComputation multiscale evidence architecture</title>
  <desc id="desc">A structured scientific workflow from electronic structure through industrial process decisions with explicit evidence gates.</desc>
  <style>
    .eyebrow { fill: #06B6D4; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 38px; font-weight: 700; }
    .subtitle { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 18px; font-weight: 400; }
    .card { fill: #111827; stroke: #334155; stroke-width: 2; }
    .raised { fill: #172033; stroke: #334155; stroke-width: 2; }
    .index { fill: #F8FAFC; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 700; }
    .stage { fill: #F8FAFC; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 21px; font-weight: 650; }
    .detail { fill: #CBD5E1; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .mono { fill: #CBD5E1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .gate { fill: #CBD5E1; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 650; }
    .footer { fill: #94A3B8; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; font-size: 16px; font-weight: 400; }
    .line { fill: none; stroke: #94A3B8; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="620" rx="24" fill="#0B1220"/>
  <rect x="24" y="24" width="1152" height="572" rx="20" fill="none" stroke="#334155" stroke-width="2"/>
  <text x="56" y="58" class="eyebrow">ARCHITECTURE · HERO</text>
  <text x="56" y="108" class="heading">From electrons to industrial decisions</text>
  <text x="56.0" y="142.0" text-anchor="start" class="subtitle"><tspan x="56.0" dy="0">One orchestration layer connects scales without confusing numerical completion with</tspan></text>
