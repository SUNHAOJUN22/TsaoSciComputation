<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">TsaoSciComputation multiscale scientific computing architecture</title>
  <desc id="desc">A dark scientific visualization connecting electron, atom, molecule, material and process scales through an evidence-bound orchestration layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1730"/><stop offset="1" stop-color="#111936"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49d7ff"/><stop offset="0.5" stop-color="#8b7bff"/><stop offset="1" stop-color="#ff7ec7"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#b9f4ff" stop-opacity="0.9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8ba3c7" stroke-opacity="0.08"/></pattern>
  </defs>
  <rect width="1440" height="620" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="620" rx="28" fill="url(#grid)"/>
  <circle cx="170" cy="120" r="150" fill="url(#orb)" opacity="0.35"/>
  <circle cx="1260" cy="500" r="210" fill="url(#orb)" opacity="0.2"/>
  <text x="720" y="78" text-anchor="middle" fill="#f6f8ff" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700">TsaoSciComputation</text>
  <text x="720" y="116" text-anchor="middle" fill="#a9bbd7" font-family="Inter,Segoe UI,sans-serif" font-size="19">Evidence-bound orchestration from electrons to industrial processes</text>
  <path d="M145 324 C340 225 480 425 675 314 S1015 218 1295 322" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" opacity="0.95"/>
