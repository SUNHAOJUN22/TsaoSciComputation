" class="card"/><rect x="720" y="190" width="208" height="5" rx="2" fill="#06B6D4"/><text x="740" y="232" class="index">04</text><text x="740.0" y="278.0" text-anchor="start" class="stage"><tspan x="740.0" dy="0">Material</tspan></text><text x="740.0" y="326.0" text-anchor="start" class="detail"><tspan x="740.0" dy="0">morphology · interface</tspan><tspan x="740.0" dy="22">· fields</tspan></text><path d="M824.0 358.0L856.0 390.0L824.0 422.0L792.0 390.0Z" fill="none" stroke="#06B6D4" stroke-width="3"/><path d="M810.0 390.0H838.0" stroke="#06B6D4" stroke-width="3"/><rect x="944" y="190" width="208" height="240" rx="18" class="card"/><rect x="944" y="190" width="208" height="5" rx="2" fill="#06B6D4"/><text x="964" y="232" class="index">05</text><text x="964.0" y="278.0" text-anchor="start" class="stage"><tspan x="964.0" dy="0">Process</tspan></text><text x="964.0" y="326.0" text-anchor="start" class="detail"><tspan x="964.0" dy="0">reactor · plant ·</tspan><tspan x="964.0" dy="22">reviewed decision</tspan></text><path d="M1018.0 366.0H1078.0V414.0H1018.0Z" fill="none" stroke="#06B6D4" stroke-width="3"/><path d="M1034.0 390.0L1045.0 401.0L1064.0 378.0" fill="none" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="60.0" cy="542.0" r="9" fill="none" stroke="#06B6D4" stroke-width="2"/><text x="78.0" y="548.0" class="gate">NUMERICAL</text><circle cx="244.0" cy="542.0" r="9" fill="none" stroke="#06B6D4" stroke-width="2"/><text x="262.0" y="548.0" class="gate">CONVERGENCE</text><circle cx="428.0" cy="542.0" r="9" fill="none" stroke="#06B6D4" stroke-width="2"/><text x="446.0" y="548.0" class="gate">PHYSICAL</text><circle cx="612.0" cy="542.0" r="9" fill="none" stroke="#06B6D4" stroke-width="2"/><text x="630.0" y="548.0" class="gate">UNCERTAINTY</text><circle cx="796.0" cy="542.0" r="9" fill="none" stroke="#06B6D4" stroke-width="2"/><text x="814.0" y="548.0" class="gate">APPLICABILITY</text><circle cx="980.0" cy="542.0" r="9" fill="none" stroke="#06B6D4" stroke-width="2"/><text x="998.0" y="548.0" class="gate">REVIEW</text>
  <text x="56.0" y="590.0" text-anchor="start" class="footer"><tspan x="56.0" dy="0">Every scale handoff preserves units, provenance, uncertainty, applicability and review authority.</tspan></text>
