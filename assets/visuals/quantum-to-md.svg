<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Quantum chemistry to molecular dynamics workflow</title><desc id="d">Electronic structure calculations inform force fields and molecular dynamics, followed by ensemble validation and uncertainty checks.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#17142d"/></linearGradient><linearGradient id="s" x2="1"><stop stop-color="#38d9ff"/><stop offset="1" stop-color="#b27cff"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7697c4"/></marker></defs><rect width="1200" height="620" rx="26" fill="url(#b)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="58" text-anchor="middle" fill="#f5f7ff" font-size="31" font-weight="700">Quantum Chemistry → Molecular Dynamics</text><text x="600" y="88" text-anchor="middle" fill="#9caec8" font-size="16">A traceable handoff across models, parameters and validation domains</text><g fill="none" stroke="#7697c4" stroke-width="3" marker-end="url(#m)"><path d="M265 310H410"/><path d="M535 310H680"/><path d="M805 310H950"/></g><g text-anchor="middle"><g transform="translate(170 310)"><circle r="93" fill="#0b2234" stroke="#43d8ff" stroke-width="3"/><ellipse rx="58" ry="24" fill="none" stroke="#75ebff" transform="rotate(28)"/><ellipse rx="58" ry="24" fill="none" stroke="#75ebff" transform="rotate(-28)"/><circle r="10" fill="#f4fdff"/><circle cx="49" cy="24" r="7" fill="#43d8ff"/><text y="130" fill="#e8fbff" font-size="21" font-weight="700">ELECTRONIC STRUCTURE</text><text y="157" fill="#91afc2" font-size="14">energy · density · forces</text></g><g transform="translate(475 310)"><circle r="93" fill="#10203a" stroke="#6b9cff" stroke-width="3"/><path d="M-54 25L-21-43L32-27L56 33L0 55Z" fill="none" stroke="#9bbcff" stroke-width="5"/><g fill="#dce9ff"><circle cx="-54" cy="25" r="9"/><circle cx="-21" cy="-43" r="9"/><circle cx="32" cy="-27" r="9"/><circle cx="56" cy="33" r="9"/><circle cy="55" r="9"/></g><text y="130" fill="#eef4ff" font-size="21" font-weight="700">PARAMETERIZATION</text><text y="157" fill="#9aaeca" font-size="14">mapping · fit · transfer limits</text></g><g transform="translate(745 310)"><circle r="93" fill="#181c3a" stroke="#9b83ff" stroke-width="3"/><g fill="#c5b8ff"><circle cx="-50" cy="-36" r="10"/><circle cx="-12" cy="-8" r="10"/><circle cx="31" cy="-27" r="10"/><circle cx="51" cy="17" r="10"/><circle cx="9" cy="43" r="10"/><circle cx="-42" cy="35" r="10"/></g><g stroke="#8f7dea" stroke-width="3"><path d="M-50-36L-12-8L31-27L51 17L9 43L-42 35L-12-8"/></g><text y="130" fill="#f3efff" font-size="21" font-weight="700">MOLECULAR DYNAMICS</text><text y="157" fill="#aaa5c6" font-size="14">ensemble · sampling · transport</text></g><g transform="translate(1030 310)"><circle r="93" fill="#261934" stroke="#dc7fda" stroke-width="3"/><path d="M-52 34L-22 2L2 17L51-42" fill="none" stroke="#f0a5e8" stroke-width="5"/><path d="M-52-15H52M-52 10H52M-52 35H52" stroke="#7c6286" stroke-width="2"/><circle cx="-22" cy="2" r="8" fill="#ffb9ee"/><circle cx="2" cy="17" r="8" fill="#ffb9ee"/><text y="130" fill="#fff0fb" font-size="21" font-weight="700">VALIDATED OBSERVABLE</text><text y="157" fill="#c6a4be" font-size="14">benchmark · uncertainty · domain</text></g></g><rect x="230" y="515" width="740" height="58" rx="16" fill="#0c1b2c" stroke="url(#s)"/><text x="600" y="540" text-anchor="middle" fill="#edf3ff" font-size="16" font-weight="700">No handoff is accepted without provenance, units, convergence and applicability.</text><text x="600" y="562" text-anchor="middle" fill="#98abc7" font-size="13">completed ≠ parsed ≠ converged ≠ validated ≠ accepted</text></g></svg>