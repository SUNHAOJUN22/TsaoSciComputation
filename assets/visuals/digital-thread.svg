<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Reproducible scientific digital thread</title><desc id="d">A scientific calculation moves through contract, inputs, environment, execution, artifacts, validation, provenance and release evidence.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131e"/><stop offset="1" stop-color="#17152d"/></linearGradient><linearGradient id="l" x2="1"><stop stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#638cff"/><stop offset="1" stop-color="#f17eb7"/></linearGradient></defs><rect width="1200" height="620" rx="26" fill="url(#bg)"/><g font-family="Inter,Segoe UI,sans-serif"><text x="600" y="58" text-anchor="middle" fill="#f6f7ff" font-size="31" font-weight="700">Reproducible Scientific Digital Thread</text><text x="600" y="88" text-anchor="middle" fill="#9facbf" font-size="16">From a human question to release evidence without losing context.</text><path d="M100 323H1100" stroke="url(#l)" stroke-width="8" stroke-linecap="round"/><g text-anchor="middle"><g transform="translate(120 323)"><circle r="46" fill="#0c2930" stroke="#2dd4bf" stroke-width="3"/><text y="6" fill="#e7fffb" font-size="16" font-weight="800">01</text><text y="82" fill="#e7fffb" font-size="17" font-weight="700">Question</text><text y="106" fill="#94b9b5" font-size="13">scope &amp; intent</text></g><g transform="translate(255 323)"><circle r="46" fill="#0d2636" stroke="#38c8de" stroke-width="3"/><text y="6" fill="#e8fcff" font-size="16" font-weight="800">02</text><text y="82" fill="#e8fcff" font-size="17" font-weight="700">Contract</text><text y="106" fill="#96b4c1" font-size="13">inputs &amp; gates</text></g><g transform="translate(390 323)"><circle r="46" fill="#10233b" stroke="#4ba9f5" stroke-width="3"/><text y="6" fill="#eaf6ff" font-size="16" font-weight="800">03</text><text y="82" fill="#eaf6ff" font-size="17" font-weight="700">Preflight</text><text y="106" fill="#9aaec7" font-size="13">environment proof</text></g><g transform="translate(525 323)"><circle r="46" fill="#151f3c" stroke="#6d91ff" stroke-width="3"/><text y="6" fill="#edf1ff" font-size="16" font-weight="800">04</text><text y="82" fill="#edf1ff" font-size="17" font-weight="700">Execution</text><text y="106" fill="#a1acc7" font-size="13">bounded run</text></g><g transform="translate(660 323)"><circle r="46" fill="#1b1b3a" stroke="#917fff" stroke-width="3"/><text y="6" fill="#f3efff" font-size="16" font-weight="800">05</text><text y="82" fill="#f3efff" font-size="17" font-weight="700">Artifacts</text><text y="106" fill="#aaa5c3" font-size="13">raw + parsed</text></g><g transform="translate(795 323)"><circle r="46" fill="#221936" stroke="#b77cf3" stroke-width="3"/><text y="6" fill="#f8eeff" font-size="16" font-weight="800">06</text><text y="82" fill="#f8eeff" font-size="17" font-weight="700">Validation</text><text y="106" fill="#b4a4c0" font-size="13">numerics + physics</text></g><g transform="translate(930 323)"><circle r="46" fill="#291831" stroke="#d678d0" stroke-width="3"/><text y="6" fill="#fff0fb" font-size="16" font-weight="800">07</text><text y="82" fill="#fff0fb" font-size="17" font-weight="700">Provenance</text><text y="106" fill="#c1a5ba" font-size="13">hash + lineage</text></g><g transform="translate(1080 323)"><circle r="46" fill="#30182d" stroke="#f17eb7" stroke-width="3"/><text y="6" fill="#fff0f7" font-size="16" font-weight="800">08</text><text y="82" fill="#fff0f7" font-size="17" font-weight="700">Release</text><text y="106" fill="#caa8b8" font-size="13">SBOM + attest</text></g></g><g fill="#0d192b" stroke="#587098"><rect x="175" y="140" width="850" height="88" rx="18"/><rect x="175" y="462" width="850" height="88" rx="18"/></g><text x="600" y="174" text-anchor="middle" fill="#edf2ff" font-size="17" font-weight="700">Machine-readable state: units · methods · versions · paths · seeds · tolerances</text><text x="600" y="202" text-anchor="middle" fill="#9fadc4" font-size="14">The digital thread preserves what ran, where it ran, what it produced and what was rejected.</text><text x="600" y="496" text-anchor="middle" fill="#edf2ff" font-size="17" font-weight="700">Supply-chain evidence: Manifest · checksums · SPDX · CycloneDX · provenance</text><text x="600" y="524" text-anchor="middle" fill="#9fadc4" font-size="14">Reproducibility is tested as a property of artifacts, not asserted as a slogan.</text></g></svg>