<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Conformer solvation and excited-state evidence workflow</title>
<desc id="desc">Conformer coverage, solvent and standard-state choices, excited-state screening, thermal corrections and observable acceptance.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071426"/>
    <stop offset="0.55" stop-color="#10233f"/>
    <stop offset="1" stop-color="#071426"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <style>
    .title{font:700 34px ui-sans-serif,system-ui;fill:#f8fafc}
    .sub{font:500 17px ui-sans-serif,system-ui;fill:#cbd5e1}
    .label{font:700 17px ui-sans-serif,system-ui;fill:#f8fafc}
    .small{font:500 13px ui-sans-serif,system-ui;fill:#cbd5e1}
    .box{fill:#0f2745;stroke:#3b82f6;stroke-width:1.5}
    .line{fill:none;stroke:url(#accent);stroke-width:4;stroke-linecap:round}
  </style>
</defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="624" rx="24" fill="none" stroke="#1e3a5f"/>
<text x="68" y="92" class="title">Molecular states: conformers → environment → observables</text>
<text x="68" y="126" class="sub">State populations and environments remain explicit parts of the scientific claim.</text>
