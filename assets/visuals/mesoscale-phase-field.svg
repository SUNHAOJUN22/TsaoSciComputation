<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Mesoscale and phase-field morphology workflow</title>
  <desc id="desc">A multiscale morphology workflow from coarse-grained interactions and order parameters through phase-field evolution, structure metrics and continuum handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071725"/>
      <stop offset="1" stop-color="#173b3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1"/>
    </marker>
    <clipPath id="fieldClip"><rect x="0" y="0" width="320" height="230" rx="22"/></clipPath>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="58" y="72" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">Coarse-graining → morphology evolution → continuum handoff</text>
  <text x="58" y="108" fill="#99f6e4" font-size="18" font-family="Arial, sans-serif">Scale transfer preserves definitions, units, conservation and uncertainty.</text>

  <g transform="translate(60 155)" filter="url(#shadow)">
    <rect width="250" height="170" rx="22" fill="#0f2d3d" stroke="#22d3ee" stroke-width="2"/>
    <text x="24" y="40" fill="#67e8f9" font-size="20" font-family="Arial, sans-serif" font-weight="700">1 · Coarse-grained model</text>
    <circle cx="55" cy="82" r="15" fill="#22d3ee"/>
    <circle cx="103" cy="102" r="15" fill="#a78bfa"/>
    <circle cx="151" cy="77" r="15" fill="#34d399"/>
    <circle cx="199" cy="106" r="15" fill="#fb7185"/>
    <path d="M70 86 L88 98 M118 96 L136 83 M166 82 L184 101" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <text x="24" y="146" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">effective interactions + mapping</text>
  </g>
  <path d="M320 240 H382" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(394 155)" filter="url(#shadow)">
    <rect width="320" height="230" rx="22" fill="#102a2c" stroke="#34d399" stroke-width="2"/>
    <g clip-path="url(#fieldClip)">
      <path d="M-20 35 C65 5 90 95 170 60 C250 25 270 100 360 66 L360 -20 L-20 -20 Z" fill="#22d3ee" opacity="0.7"/>
      <path d="M-30 155 C45 105 100 210 175 150 C250 90 295 180 355 128 L355 250 L-30 250 Z" fill="#a78bfa" opacity="0.72"/>
      <path d="M20 80 C70 45 120 125 170 96 C230 62 270 120 322 92" fill="none" stroke="#f8fafc" stroke-width="3" opacity="0.85"/>
      <circle cx="78" cy="172" r="35" fill="#34d399" opacity="0.65"/>
      <circle cx="246" cy="42" r="28" fill="#fb7185" opacity="0.62"/>
    </g>
    <text x="20" y="206" fill="#f8fafc" font-size="20" font-family="Arial, sans-serif" font-weight="700">2 · Phase-field / DPD evolution</text>
    <text x="20" y="226" fill="#cbd5e1" font-size="14" font-family="Arial, sans-serif">order parameter · mobility · interfacial energy</text>
  </g>
  <path d="M724 270 H786" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(798 155)" filter="url(#shadow)">
    <rect width="340" height="230" rx="22" fill="#17243b" stroke="#a78bfa" stroke-width="2"/>
    <text x="24" y="40" fill="#c4b5fd" font-size="20" font-family="Arial, sans-serif" font-weight="700">3 · Morphology evidence</text>
    <g transform="translate(25 66)">
      <rect width="132" height="52" rx="12" fill="#1e293b" stroke="#60a5fa"/>
      <text x="66" y="22" text-anchor="middle" fill="#bfdbfe" font-size="14" font-family="Arial, sans-serif" font-weight="700">Domain size</text>
      <text x="66" y="42" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">S(q), ξ, distribution</text>
    </g>
    <g transform="translate(178 66)">
      <rect width="132" height="52" rx="12" fill="#1e293b" stroke="#34d399"/>
      <text x="66" y="22" text-anchor="middle" fill="#a7f3d0" font-size="14" font-family="Arial, sans-serif" font-weight="700">Connectivity</text>
      <text x="66" y="42" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">percolation + topology</text>
    </g>
    <g transform="translate(25 134)">
      <rect width="132" height="52" rx="12" fill="#1e293b" stroke="#f59e0b"/>
      <text x="66" y="22" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Arial, sans-serif" font-weight="700">Anisotropy</text>
      <text x="66" y="42" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">orientation tensor</text>
    </g>
    <g transform="translate(178 134)">
      <rect width="132" height="52" rx="12" fill="#1e293b" stroke="#fb7185"/>
      <text x="66" y="22" text-anchor="middle" fill="#fecdd3" font-size="14" font-family="Arial, sans-serif" font-weight="700">Uncertainty</text>
      <text x="66" y="42" text-anchor="middle" fill="#e2e8f0" font-size="12" font-family="Arial, sans-serif">seed + parameter spread</text>
    </g>
  </g>

  <g transform="translate(160 445)">
    <rect width="880" height="100" rx="22" fill="#101f34" stroke="#64748b" stroke-width="2"/>
    <text x="30" y="39" fill="#f8fafc" font-size="20" font-family="Arial, sans-serif" font-weight="700">Validated handoff</text>
    <text x="30" y="72" fill="#cbd5e1" font-size="16" font-family="Arial, sans-serif">effective tensor fields → FEM / CFD / transport / process models</text>
    <path d="M590 50 H710" stroke="#34d399" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="730" y="24" width="120" height="52" rx="14" fill="#12372f" stroke="#34d399"/>
    <text x="790" y="56" text-anchor="middle" fill="#a7f3d0" font-size="15" font-family="Arial, sans-serif" font-weight="700">ACCEPT</text>
  </g>
</svg>
